odule 8: the API can be trusted. Run from the api/ folder:  fastapi dev main.py\"\"\"\nimport json\nimport os\nfrom typing import Literal\n\nimport mysql.connector\nfrom fastapi import Depends, FastAPI, HTTPException, Query, Response\nfrom fastapi.middleware.cors import CORSMiddleware\n\nfrom db import connect, execute, fetch_all\nfrom db_errors import raise_for_db_error\nfrom errors import add_error_handlers\nfrom github import router as github_router\nfrom models import AppointmentIn, MessageIn, MessageOut, MessagePatch, ProjectPatch\nfrom resume import build_resume\nfrom security import require_owner\n\napp = FastAPI(title=\"Future Portfolio API\", version=\"2.0\")\nadd_error_handlers(app)  # one error format, for every kind of error\napp.include_router(github_router)\n\n# ---------- CORS: exactly the origins listed in .env, never \"*\" ----------\nALLOWED_ORIGINS = [\n    origin.strip()\n    for origin in os.getenv(\"CORS_ORIGINS\", \"http://127.0.0.1:5500\").split(\",\")\n]\napp.add_middleware(\n    CORSMiddleware,\n    allow_origins=ALLOWED_ORIGINS,\n    allow_methods=[\"GET\", \"POST\", \"PATCH\", \"DELETE\"],\n    allow_headers=[\"Content-Type\", \"X-API-Key\"],\n    expose_headers=[\"X-Total-Count\", \"Location\"],  # without this, headers.get(\"X-Total-Count\") is null\n)\n\n\n# ---------- Cache-Control: the spec's caching rule ----------\n@app.middleware(\"http\")\nasync def cache_headers(request, call_next):\n    response = await call_next(request)\n    if request.method == \"GET\" and response.status_code == 200:\n        if request.url.path.startswith(\"/api/messages\"):\n            response.headers[\"Cache-Control\"] = \"no-store\"\n        elif request.url.path.startswith(\"/api/\"):\n            response.headers[\"Cache-Control\"] = \"public, max-age=300\"\n    return response\n\n\n# One check, five endpoints (the contact form POST stays public by design)\nOWNER = [Depends(require_owner)]\n\nCategory = Literal[\"Company\", \"Industry\", \"Community\"]\n\n\n# ---------- practice endpoints (delete /api/echo before you commit) ----------\n@app.get(\"/api/hello\", tags=[\"Practice\"])\ndef hello():\n    return {\"message\": \"Hello from the Future Portfolio API\"}\n\n\n@app.get(\"/api/echo/{item_id}\", tags=[\"Practice\"])\ndef echo(item_id: int, q: str | None = None, limit: int = 10):\n    return {\"item_id\": item_id, \"q\": q, \"limit\": limit}\n\n\n# ---------- the one helper every list uses (slide 12) ----------\ndef list_from_view(response, view, where, params, order, page, limit, write=False):\n    where_sql = f\" WHERE {' AND '.join(where)}\" if where else \"\"\n    with connect(write=write) as conn:  # write=True only for the owner-only message view\n        total = fetch_all(\n            conn,\n            f\"SELECT COUNT(*) AS total FROM {view}{where_sql}\",\n            params,\n        )[0][\"total\"]\n        rows = fetch_all(\n            conn,\n            f\"SELECT * FROM {view}{where_sql} \"\n            f\"ORDER BY {order} LIMIT %s OFFSET %s\",\n            [*params, limit, (page - 1) * limit],\n        )\n    response.headers[\"X-Total-Count\"] = str(total)\n    return rows\n\n\n# ---------- awards ----------\n@app.get(\"/api/awards\", tags=[\"Awards\"])\ndef list_awards(\n    response: Response,\n    category: Category | None = None,\n    year_from: int | None = Query(None, ge=1980, le=2100),\n    year_to: int | None = Query(None, ge=1980, le=2100),\n    sort: Literal[\"year\", \"-year\"] = \"-year\",\n    page: int = Query(1, ge=1),\n    limit: int = Query(50, ge=1, le=50),\n):\n    \"\"\"Awards, filtered, sorted and paged.\"\"\"\n    where, params = [], []\n    if category is not None:\n        where.append(\"category = %s\")\n        params.append(category)\n    if year_from is not None:\n        where.append(\"year >= %s\")\n        params.append(year_from)\n    if year_to is not None:\n        where.append(\"year \u003c= %s\")\n        params.append(year_to)\n    order = {\"year\": \"year, id\", \"-year\": \"year DESC, id\"}[sort]\n    return list_from_view(response, \"v_api_awards\", where, params, order, page, limit)\n\n\n@app.get(\"/api/awards/{award_id}\", tags=[\"Awards\"])\ndef get_award(award_id: int):\n    \"\"\"One award by its id.\"\"\"\n    with connect() as conn:\n        rows = fetch_all(conn, \"SELECT * FROM v_api_awards WHERE id = %s\", (award_id,))\n    if not rows:\n        raise HTTPException(status_code=404, detail=f\"No award with id {award_id}.\")\n    return rows[0]\n\n\n# ---------- education ----------\n@app.get(\"/api/education\", tags=[\"Education\"])\ndef list_education(\n    response: Response,\n    page: int = Query(1, ge=1),\n    limit: int = Query(50, ge=1, le=50),\n):\n    \"\"\"All education entries, newest first.\"\"\"\n    return list_from_view(response, \"v_api_education\", [], [], \"start_year DESC, id\", page, limit)\n\n\n@app.get(\"/api/education/{education_id}\", tags=[\"Education\"])\ndef get_education(education_id: int):\n    \"\"\"One education entry.\"\"\"\n    with connect() as conn:\n        rows = fetch_all(conn, \"SELECT * FROM v_api_education WHERE id = %s\", (education_id,))\n    if not rows:\n        raise HTTPException(status_code=404, detail=f\"No education entry with id {education_id}.\")\n    return rows[0]\n\n\n# ---------- single objects ----------\n@app.get(\"/api/profile\", tags=[\"Resume\"])\ndef get_profile():\n    \"\"\"The public profile (no email).\"\"\"\n    with connect() as conn:\n        return fetch_all(conn, \"SELECT * FROM v_api_profile\")[0]\n\n\n@app.get(\"/api/summary\", tags=[\"Resume\"])\ndef get_summary():\n    \"\"\"Headline numbers.\"\"\"\n    with connect() as conn:\n        return fetch_all(conn, \"SELECT * FROM v_api_summary\")[0]\n\n\n@app.get(\"/api/resume\", tags=[\"Resume\"])\ndef get_resume():\n    \"\"\"The whole resume.json document, built from the views on every request.\"\"\"\n    with connect() as conn:\n        return build_resume(conn)\n\n\n# ---------- experience, projects, skills ----------\n@app.get(\"/api/experience\", tags=[\"Experience\"])\ndef list_experience(\n    response: Response,\n    company: str | None = None,\n    page: int = Query(1, ge=1),\n    limit: int = Query(50, ge=1, le=50),\n):\n    \"\"\"Roles, newest first. ?company=CloudHarbor Software gives 4.\"\"\"\n    where, params = [], []\n    if company is not None:\n        where.append(\"company = %s\")\n        params.append(company)\n    return list_from_view(response, \"v_api_experience\", where, params, \"start_date DESC, id\", page, limit)\n\n\n@app.get(\"/api/projects\", tags=[\"Projects\"])\ndef list_projects(\n    response: Response,\n    skill: str | None = None,\n    company: str | None = None,\n    page: int = Query(1, ge=1),\n    limit: int = Query(50, ge=1, le=50),\n):\n    \"\"\"Projects. ?skill=Platform migration gives 8 rows.\"\"\"\n    where, params = [], []\n    if skill is not None:\n        where.append(\"JSON_CONTAINS(skills, JSON_QUOTE(%s))\")\n        params.append(skill)\n    if company is not None:\n        where.append(\"company = %s\")\n        params.append(company)\n    rows = list_from_view(response, \"v_api_projects\", where, params, \"project_id, role\", page, limit)\n    for row in rows:\n        row[\"skills\"] = json.loads(row[\"skills\"])  # without this, skills is a string: a contract break\n    return rows\n\n\n@app.get(\"/api/skills\", tags=[\"Skills\"])\ndef list_skills(\n    response: Response,\n    evidenced: bool | None = None,\n    category: str | None = None,\n    page: int = Query(1, ge=1),\n    limit: int = Query(50, ge=1, le=50),\n):\n    \"\"\"Skills. evidenced=true means used in at least one project; false gives 2 (skills 2 and 17).\"\"\"\n    where, params = [], []\n    if evidenced is not None:\n        where.append(\"project_count > 0\" if evidenced else \"project_count = 0\")\n    if category is not None:\n        where.append(\"category = %s\")\n        params.append(category)\n    return list_from_view(response, \"v_api_skills\", where, params, \"category, skill\", page, limit)\n\n\n# =====================================================================\n# Module 7: writing data\n# =====================================================================\n\n# ---------- messages: POST is public, the rest become owner-only in Module 8 ----------\n@app.post(\"/api/messages\", status_code=201, tags=[\"Messages\"])\ndef create_message(body: MessageIn, response: Response):\n    \"\"\"Send a message from the contact form.\"\"\"\n    with connect(write=True) as conn:\n        _, new_id = execute(\n            conn,\n            \"INSERT INTO contact_messages (name, email, message) VALUES (%s, %s, %s)\",\n            (body.name, body.email, body.message),\n        )\n        conn.commit()  # autocommit is OFF in the Python connector: no commit, no row\n        sent_at = fetch_all(\n            conn, \"SELECT sent_at FROM v_owner_messages WHERE id = %s\", (new_id,)\n        )[0][\"sent_at\"]\n    response.headers[\"Location\"] = f\"/api/messages/{new_id}\"\n    return {\"id\": new_id, \"sent_at\": sent_at}  # never echo the visitor's email back\n\n\n@app.get(\"/api/messages\", response_model=list[MessageOut], tags=[\"Messages\"], dependencies=OWNER)\ndef list_messages(\n    response: Response,\n    page: int = Query(1, ge=1),\n    limit: int = Query(50, ge=1, le=50),\n):\n    \"\"\"Owner only: newest first.\"\"\"\n    return list_from_view(response, \"v_owner_messages\", [], [], \"sent_at DESC, id DESC\", page, limit, write=True)\n\n\n@app.patch(\"/api/messages/{message_id}\", response_model=MessageOut, tags=[\"Messages\"], dependencies=OWNER)\ndef mark_message(message_id: int, body: MessagePatch):\n    \"\"\"Mark a message read or unread.\"\"\"\n    with connect(write=True) as conn:\n        execute(\n            conn,\n            \"UPDATE contact_messages SET is_read = %s WHERE message_id = %s\",\n            (body.is_read, message_id),\n        )\n        conn.commit()\n        # Look it up instead of trusting rowcount: UPDATE counts rows CHANGED, not rows FOUND.\n        rows = fetch_all(conn, \"SELECT * FROM v_owner_messages WHERE id = %s\", (message_id,))\n    if not rows:\n        raise HTTPException(status_code=404, detail=f\"No message with id {message_id}.\")\n    return rows[0]\n\n\n@app.delete(\"/api/messages/{message_id}\", status_code=204, tags=[\"Messages\"], dependencies=OWNER)\ndef delete_message(message_id: int):\n    \"\"\"Delete a message.\"\"\"\n    with connect(write=True) as conn:\n        deleted, _ = execute(conn, \"DELETE FROM contact_messages WHERE message_id = %s\", (message_id,))\n        conn.commit()\n    if deleted == 0:\n        raise HTTPException(status_code=404, detail=f\"No message with id {message_id}.\")\n    return Response(status_code=204)\n\n\n# ---------- PATCH a project: only the fields that were sent ----------\n@app.patch(\"/api/projects/{project_id}\", tags=[\"Projects\"], dependencies=OWNER)\ndef update_project(project_id: int, body: ProjectPatch):\n    \"\"\"Change a project's name and/or description.\"\"\"\n    changes = body.model_dump(exclude_unset=True)\n    if not changes:\n        raise HTTPException(status_code=422, detail=\"Send at least one field to change.\")\n    # Column names come only from the model's own two fields (extra=\"forbid\"): structure from code.\n    set_sql = \", \".join(f\"{column} = %s\" for column in changes)\n    with connect(write=True) as conn:\n        if not fetch_all(conn, \"SELECT project_id FROM projects WHERE project_id = %s\", (project_id,)):\n            raise HTTPException(status_code=404, detail=f\"No project with id {project_id}.\")\n        try:\n            execute(conn, f\"UPDATE projects SET {set_sql} WHERE project_id = %s\", [*changes.values(), project_id])\n            conn.commit()\n        except mysql.connector.Error as error:\n            conn.rollback()\n            raise_for_db_error(error)\n        return fetch_all(\n            conn,\n            \"SELECT project_id, project_name, description FROM projects WHERE project_id = %s\",\n            (project_id,),\n        )[0]\n\n\n# ---------- one request, one transaction ----------\n@app.post(\"/api/appointments\", status_code=201, tags=[\"Appointments\"], dependencies=OWNER)\ndef create_appointment(body: AppointmentIn):\n    \"\"\"A board appointment: company, period, role, project and skills, all or nothing.\"\"\"\n    with connect(write=True) as conn:\n        try:\n            conn.start_transaction()\n            _, company_id = execute(conn, \"INSERT INTO companies (company_name) VALUES (%s)\", (body.company_name,))\n            _, employment_id = execute(\n                conn,\n                \"INSERT INTO employment (company_id, start_date, end_date) VALUES (%s, %s, %s)\",\n                (company_id, body.start_date, body.end_date),\n            )\n            _, role_id = execute(\n                conn,\n                \"INSERT INTO roles (employment_id, role_title, role_start, role_end) VALUES (%s, %s, %s, %s)\",\n                (employment_id, body.role_title, body.start_date, body.end_date),\n            )\n            _, project_id = execute(conn, \"INSERT INTO projects (project_name) VALUES (%s)\", (body.project_name,))\n            execute(conn, \"INSERT INTO role_projects (role_id, project_id) VALUES (%s, %s)\", (role_id, project_id))\n            for skill_id in body.skill_ids:\n                execute(conn, \"INSERT INTO project_skills (project_id, skill_id) VALUES (%s, %s)\", (project_id, skill_id))\n            if body.headline is not None:\n                execute(conn, \"UPDATE people SET headline = %s WHERE person_id = 1\", (body.headline,))\n            conn.commit()  # once, at the end\n        except mysql.connector.Error as error:\n            conn.rollback()  # every time: MySQL does not undo the earlier statements by itself\n            raise_for_db_error(error)\n    return {\n        \"company_id\": company_id,\n        \"employment_id\": employment_id,\n        \"role_id\": role_id,\n        \"project_id\": project_id,\n    }\n","contact.html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>Contact (Module 9 demo page)\u003c/title>\n  \u003cstyle>\n    body { font: 16px/1.5 system-ui, sans-serif; max-width: 34rem; margin: 1.5rem auto; padding: 0 1rem; }\n    label { display: block; margin-top: .8rem; font-weight: 600; }\n    input, textarea { width: 100%; padding: .4rem; font: inherit; box-sizing: border-box; }\n    [aria-invalid=\"true\"] { border: 2px solid #b3261e; }\n    .error { display: none; color: #b3261e; font-size: .85rem; }\n    .error.show { display: block; }\n    fieldset { border: 0; padding: 0; margin: 0; }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003ch1>Send a message\u003c/h1>\n  \u003cform id=\"contact-form\" novalidate>\n    \u003cfieldset>\n      \u003clabel for=\"name\">Name\u003c/label>\n      \u003cinput id=\"name\" name=\"name\" autocomplete=\"name\" maxlength=\"100\">\n      \u003cspan class=\"error\" id=\"name-error\">Please enter your name.\u003c/span>\n\n      \u003clabel for=\"email\">Email\u003c/label>\n      \u003cinput id=\"email\" name=\"email\" type=\"email\" autocomplete=\"email\" maxlength=\"254\">\n      \u003cspan class=\"error\" id=\"email-error\">Please enter a valid email address.\u003c/span>\n\n      \u003clabel for=\"message\">Message\u003c/label>\n      \u003ctextarea id=\"message\" name=\"message\" rows=\"5\" maxlength=\"2000\">\u003c/textarea>\n      \u003cspan class=\"error\" id=\"message-error\">Please write a message.\u003c/span>\n\n      \u003cp>\u003cbutton id=\"send\" type=\"submit\">Send\u003c/button>\u003c/p>\n    \u003c/fieldset>\n    \u003cp id=\"form-status\" role=\"status\" aria-live=\"polite\">\u003c/p>\n  \u003c/form>\n  \u003cp>\u003ca href=\"resume.html\">Back to the resume\u003c/a>\u003c/p>\n\n  \u003cscript src=\"js/config.js\" defer>\u003c/script>\n  \u003cscript src=\"js/api.js\" defer>\u003c/script>\n  \u003cscript src=\"js/contact.js\" defer>\u003c/script>\n\u003c/body>\n\u003c/html>\n","exercise2.py":"\"\"\"Exercise 2: The Awards, in Python. Run with:  python exercise2.py   (not in the REPL)\"\"\"\nawards = [\n    {\"id\": 1, \"award\": \"Chairman's Award for Platform Renewal\", \"awarded_by\": \"Lumina Software\", \"year\": 2026, \"category\": \"Company\"},\n    {\"id\": 2, \"award\": \"Technology Leader of the Year\", \"awarded_by\": \"South India CIO Forum\", \"year\": 2024, \"category\": \"Industry\"},\n    {\"id\": 3, \"award\": \"Engineering Excellence Award\", \"awarded_by\": \"Aster Data Platforms\", \"year\": 2020, \"category\": \"Company\"},\n    {\"id\": 4, \"award\": \"Women in Technology Leadership Award\", \"awarded_by\": \"Tech Leaders Council\", \"year\": 2019, \"category\": \"Industry\"},\n    {\"id\": 5, \"award\": \"Platform Pioneer Award\", \"awarded_by\": \"CloudHarbor Software\", \"year\": 2009, \"category\": \"Company\"},\n]\n\n# 1. Loop and print each award:  2026 — Chairman's Award for Platform Renewal (Company)\nfor award in awards:\n    print(f\"{award['year']} — {award['award']} ({award['category']})\")\n\n\n# 2. Write count_by_category(awards, category) and call it for Company.\ndef count_by_category(awards, category):\n    return len([a for a in awards if a[\"category\"] == category])\n\n\nprint(\"Company awards:\", count_by_category(awards, \"Company\"))\n\n# 3. Print the awards sorted newest first.\nfor award in sorted(awards, key=lambda a: a[\"year\"], reverse=True):\n    print(award[\"year\"], award[\"award\"])\n\n# 4. A list comprehension of only the Industry awards' names.\nprint([a[\"award\"] for a in awards if a[\"category\"] == \"Industry\"])\n\n# Fast finishers: count all three categories in one dictionary with a loop.\ncounts = {}\nfor award in awards:\n    counts[award[\"category\"]] = counts.get(award[\"category\"], 0) + 1\nprint(counts)\n","js/api.js":"// js/api.js (version 2): every fetch on the site goes through here.\n// getResponse() and getJSON() keep working, so every Module 3 caller (weather, posts) is unaffected.\n\nasync function request(url, { method = \"GET\", body, timeoutMs = 8000 } = {}) {\n  const options = { method, signal: AbortSignal.timeout(timeoutMs) };\n  if (body !== undefined) {\n    options.headers = { \"Content-Type\": \"application/json\" }; // what REST Client sent in Module 7\n    options.body = JSON.stringify(body);\n  }\n  let response;\n  try {\n    response = await fetch(url, options); // a JSON POST makes the browser send OPTIONS first (preflight)\n  } catch (cause) {\n    const error = new Error(\"No response\");\n    error.reason = cause.name === \"TimeoutError\" ? \"timeout\" : \"network\";\n    throw error;\n  }\n  if (!response.ok) {\n    const error = new Error(`HTTP ${response.status}`);\n    error.reason = \"http\";\n    error.status = response.status;\n    try {\n      const data = await response.json();\n      if (data.error) { // Module 8's one error format\n        error.code = data.error.code;\n        error.serverMessage = data.error.message;\n        error.fields = data.error.fields || {};\n      }\n    } catch {\n      // not our format (a hotel Wi-Fi page, a crash): the status is enough. Never crash while handling an error.\n    }\n    throw error;\n  }\n  if (response.status === 204) return response; // no body to check\n  const type = response.headers.get(\"Content-Type\") || \"\";\n  if (!type.includes(\"application/json\")) {\n    const error = new Error(`Expected JSON, got ${type}`);\n    error.reason = \"format\";\n    throw error;\n  }\n  return response;\n}\n\nconst getResponse = (url, timeoutMs) => request(url, { timeoutMs });\nconst getJSON = async (url, timeoutMs) => (await getResponse(url, timeoutMs)).json();\nconst postJSON = async (url, body) => (await request(url, { method: \"POST\", body })).json();\n\nfunction messageFor(error) {\n  if (error.reason === \"timeout\") return \"This is taking too long. Please try again.\";\n  if (error.reason === \"network\") return \"We can't reach the service right now.\";\n  if (error.status === 404) return \"We couldn't find that.\";\n  if (error.status === 409) return \"That conflicts with something that already exists.\"; // new in Module 9\n  if (error.status === 422) return \"Please check the highlighted fields.\"; // new in Module 9\n  if (error.status === 429 || error.status === 403) return \"Too many requests. Please wait a minute.\";\n  if (error.status >= 500) return \"The service is having problems. Please try later.\";\n  return \"Something went wrong.\";\n}\n","js/config.js":"// js/config.js: where does the data come from? (Module 9)\n// Load this FIRST on every data page:  \u003cscript src=\"js/config.js\" defer>\u003c/script>\n// \"defer\" runs scripts in order after the page is parsed, so these values exist when resume.js runs.\nconst API_BASE = \"http://127.0.0.1:8000\"; // deploy the API later? Change this ONE line.\nconst GITHUB_USER = \"your-github-username\"; // used by the snapshot-mode GitHub card\n\n// Live Server serves the page from 127.0.0.1 (or localhost). Anywhere else (GitHub Pages) is public.\nconst IS_LOCAL = [\"127.0.0.1\", \"localhost\"].includes(window.location.hostname);\n\n// ?source=snapshot lets you test the public behaviour without deploying.\nconst REQUESTED = new URLSearchParams(window.location.search).get(\"source\");\n\n// Local -> try the API. Any other host (or ?source=snapshot) -> straight to the snapshot.\n// On a visitor's computer 127.0.0.1 is THEIR machine: a request there can only fail, slowly.\nconst SOURCE = REQUESTED === \"snapshot\" || !IS_LOCAL ? \"snapshot\" : \"api\";\n","js/contact.js":"// js/contact.js: the contact form, connected to POST /api/messages (Module 9).\nconst contactForm = document.querySelector(\"#contact-form\");\nconst sendButton = document.querySelector(\"#send\");\nconst formStatus = document.querySelector(\"#form-status\");\nconst fieldNames = [\"name\", \"email\", \"message\"];\n\n// Course 2's page-side checks (for the visitor's speed). The server ALWAYS checks again.\nfunction validateForm(name, email, message) {\n  clearFieldErrors();\n  const bad = [];\n  if (!name) bad.push(\"name\");\n  if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)) bad.push(\"email\");\n  if (!message) bad.push(\"message\");\n  showFieldErrors(Object.fromEntries(bad.map((f) => [f, \"invalid\"])));\n  return bad.length === 0;\n}\n\nfunction clearFieldErrors() {\n  for (const name of fieldNames) {\n    document.querySelector(`#${name}`)?.removeAttribute(\"aria-invalid\");\n    document.querySelector(`#${name}-error`)?.classList.remove(\"show\");\n  }\n}\n\n// The server says WHICH fields; the page says HOW (its own Course 2 sentence, not Pydantic's English).\nfunction showFieldErrors(fields) {\n  for (const name of Object.keys(fields)) {\n    const input = document.querySelector(`#${name}`);\n    const message = document.querySelector(`#${name}-error`);\n    if (!input || !message) continue;\n    input.setAttribute(\"aria-invalid\", \"true\");\n    message.classList.add(\"show\");\n  }\n  const first = contactForm.querySelector(\"[aria-invalid='true']\");\n  if (first) first.focus();\n}\n\nif (SOURCE === \"snapshot\") {\n  // Wrap the controls in a \u003cfieldset>: disabling a fieldset disables every control inside it.\n  contactForm.querySelector(\"fieldset\").disabled = true;\n  formStatus.textContent = \"The contact form works on the live version, running on the owner's computer.\";\n}\n\ncontactForm.addEventListener(\"submit\", async (event) => {\n  event.preventDefault();\n  const name = contactForm.elements.name.value.trim();\n  const email = contactForm.elements.email.value.trim();\n  const message = contactForm.elements.message.value.trim();\n  if (!validateForm(name, email, message)) return;\n  sendButton.disabled = true; // Module 7's double-click problem, solved where it starts\n  formStatus.textContent = \"Sending…\";\n  try {\n    const sent = await postJSON(`${API_BASE}/api/messages`, { name, email, message });\n    contactForm.reset(); // reset ONLY on success: a failed send keeps every word\n    formStatus.textContent = `Thank you! Your message was received (reference #${sent.id}).`;\n  } catch (error) {\n    if (error.fields) showFieldErrors(error.fields);\n    formStatus.textContent = messageFor(error);\n  } finally {\n    sendButton.disabled = false; // runs on success AND failure, so the button always comes back\n  }\n});\n","js/github.js":"// js/github.js: the GitHub card, through the proxy when the API is live (Module 9).\nconst GITHUB_MAX_AGE = 15 * 60 * 1000; // the page's own cache: 15 minutes, per browser\n\nfunction cacheRead(key) {\n  try { return JSON.parse(localStorage.getItem(key)); } catch { return null; }\n}\nfunction cacheWrite(key, data) {\n  try { localStorage.setItem(key, JSON.stringify({ at: Date.now(), data })); } catch { /* storage full or blocked */ }\n}\nconst isFresh = (saved, maxAge) => saved && Date.now() - saved.at \u003c maxAge;\n\n// An adapter: two shapes in (our proxy, GitHub's own), one shape out. Like fetchAwards.\nfunction toCard(data) {\n  return {\n    name: data.name || data.login,\n    login: data.login,\n    repos: data.public_repos,\n    url: data.url || data.html_url,\n    recent: data.repos || [],\n  };\n}\n\nfunction renderGitHubCard(card) {\n  const box = document.querySelector(\"#github-card\");\n  if (!box) return;\n  const links = card.recent.map((repo) => {\n    const item = el(\"li\");\n    const link = el(\"a\", repo.name); // repository names come from GitHub: render with el(), always\n    link.href = repo.html_url;\n    item.append(link);\n    return item;\n  });\n  const list = el(\"ul\");\n  list.append(...links);\n  box.replaceChildren(el(\"strong\", card.name), el(\"span\", ` (${card.repos} public repositories)`), list);\n}\n\nasync function loadGitHubActivity() {\n  const saved = cacheRead(\"github-card\");\n  if (isFresh(saved, GITHUB_MAX_AGE)) return renderGitHubCard(saved.data);\n  // Live: the proxy first (token on the server), then GitHub directly. The card survives a stopped API.\n  const sources = SOURCE === \"api\"\n    ? [`${API_BASE}/api/github`, `https://api.github.com/users/${GITHUB_USER}`]\n    : [`https://api.github.com/users/${GITHUB_USER}`];\n  for (const url of sources) {\n    try {\n      const card = toCard(await getJSON(url, 5000));\n      cacheWrite(\"github-card\", card);\n      return renderGitHubCard(card);\n    } catch (error) {\n      console.warn(`${url} failed`, error);\n    }\n  }\n  if (saved) return renderGitHubCard(saved.data); // stale beats nothing\n  setStatus(\"github-status\", \"GitHub activity isn't available right now.\");\n}\n\ndocument.addEventListener(\"DOMContentLoaded\", loadGitHubActivity);\n","js/resume.js":"// js/resume.js: one page, one set of render functions, two data sources (Module 9).\nconst AWARDS_LIMIT = 5;\nlet awardsPage = 1;\nconst state = { resume: null, live: false };\n\nfunction setStatus(id, text) {\n  const node = document.querySelector(\"#\" + id);\n  if (node) node.textContent = text;\n}\n\n// Create an element whose content is TEXT, never markup (the XSS fix).\nfunction el(tag, text, className) {\n  const node = document.createElement(tag);\n  if (text !== undefined && text !== null) node.textContent = text;\n  if (className) node.className = className;\n  return node;\n}\n\n/* ---------- where the data comes from ---------- */\nasync function loadResumeData() {\n  if (SOURCE === \"api\") {\n    try {\n      // 3 seconds, not 8: locally the API answers in milliseconds. Slow means stopped.\n      return { resume: await getJSON(`${API_BASE}/api/resume`, 3000), live: true };\n    } catch (error) {\n      console.warn(\"API unavailable; using the snapshot.\", error); // inner catch: API down -> fall back\n    }\n  }\n  return { resume: await getJSON(\"data/resume.json\"), live: false };\n}\n\nfunction renderSource({ resume, live }) {\n  // T00:00:00 (Module 2's trick): no UTC midnight, no off-by-one day.\n  const generated = new Date(resume.generated_at + \"T00:00:00\").toLocaleDateString(\"en-IN\", {\n    day: \"numeric\", month: \"short\", year: \"numeric\",\n  });\n  setStatus(\"data-source\", live ? \"Live from the Future Portfolio API\" : `Published snapshot, updated ${generated}`);\n}\n\n/* ---------- renderers: every value from data goes through textContent ---------- */\nfunction renderProfile(profile) {\n  setStatus(\"profile-name\", profile.full_name);\n  setStatus(\"profile-headline\", profile.headline);\n}\n\nfunction renderExperience(roles) {\n  const list = document.querySelector(\"#experience\");\n  list.replaceChildren(...roles.map((role) => {\n    const item = el(\"li\");\n    item.append(el(\"strong\", role.role), el(\"span\", ` at ${role.company} (${role.start_date} to ${role.end_date || \"now\"})`));\n    return item;\n  }));\n}\n\nfunction renderProjects(projects) {\n  const list = document.querySelector(\"#projects\");\n  list.replaceChildren(...projects.map((project) => {\n    const item = el(\"li\");\n    item.append(el(\"strong\", project.project), el(\"span\", ` (${project.role}, ${project.company})`)); // a template literal inside el() is safe\n    const tags = el(\"ul\", null, \"tags\");\n    tags.append(...project.skills.map((skill) => el(\"li\", skill, \"tag\")));\n    item.append(tags);\n    return item;\n  }));\n}\n\nfunction renderAwards(awards) {\n  const list = document.querySelector(\"#awards\");\n  list.replaceChildren(...awards.map((award) => {\n    const item = el(\"li\");\n    item.append(el(\"strong\", award.award), el(\"span\", ` (${award.year}, ${award.category})`));\n    return item;\n  }));\n}\n\n/* ---------- one function, two sources: { items, total } either way ---------- */\nasync function fetchAwards({ category, page, limit }) {\n  if (state.live) {\n    const params = new URLSearchParams({ page, limit });\n    if (category) params.set(\"category\", category);\n    const response = await getResponse(`${API_BASE}/api/awards?${params}`);\n    return {\n      items: await response.json(),\n      total: Number(response.headers.get(\"X-Total-Count\")), // readable only because Module 8 exposed it\n    };\n  }\n  const matching = state.resume.awards.filter((award) => !category || award.category === category);\n  return { items: matching.slice((page - 1) * limit, page * limit), total: matching.length };\n}\n\nasync function loadAwards() {\n  const category = new URLSearchParams(window.location.search).get(\"category\");\n  setStatus(\"awards-status\", \"Loading awards…\");\n  try {\n    const { items, total } = await fetchAwards({ category, page: awardsPage, limit: AWARDS_LIMIT });\n    const pages = Math.max(1, Math.ceil(total / AWARDS_LIMIT));\n    renderAwards(items);\n    setStatus(\"awards-pager\", `Page ${awardsPage} of ${pages} (${total} awards)`);\n    const prev = document.querySelector(\"#awards-prev\"), next = document.querySelector(\"#awards-next\");\n    if (prev) prev.disabled = awardsPage \u003c= 1;\n    if (next) next.disabled = awardsPage >= pages;\n    setStatus(\"awards-status\", total === 0 ? \"No awards in this category yet.\" : \"\");\n  } catch (error) {\n    setStatus(\"awards-status\", error.code === \"invalid_input\" ? \"That isn't one of the award categories.\" : messageFor(error));\n  }\n}\n\nasync function loadResume() {\n  setStatus(\"resume-status\", \"Loading the resume…\");\n  try {\n    Object.assign(state, await loadResumeData()); // outer catch: even the snapshot failed -> show it\n    renderSource(state);\n    renderProfile(state.resume.profile);\n    renderExperience(state.resume.experience);\n    renderProjects(state.resume.projects);\n    await loadAwards();\n    setStatus(\"resume-status\", \"\");\n  } catch (error) {\n    setStatus(\"resume-status\", messageFor(error));\n  }\n}\n\ndocument.addEventListener(\"DOMContentLoaded\", () => {\n  document.querySelector(\"#awards-prev\")?.addEventListener(\"click\", () => { awardsPage -= 1; loadAwards(); });\n  document.querySelector(\"#awards-next\")?.addEventListener(\"click\", () => { awardsPage += 1; loadAwards(); });\n  loadResume();\n});\n","requirements.txt":"# Module 5: mysql-connector-python, python-dotenv\n# Module 6: fastapi[standard]   (FastAPI + Uvicorn + the `fastapi` command + httpx + email-validator)\n# Run `pip freeze > requirements.txt` after installing to pin exact versions, then commit this file.\nmysql-connector-python\npython-dotenv\nfastapi[standard]\n","resume.html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>Resume (Module 9 demo page)\u003c/title>\n  \u003cstyle>\n    body { font: 16px/1.5 system-ui, sans-serif; max-width: 46rem; margin: 1.5rem auto; padding: 0 1rem; }\n    .source { color: #555; font-size: .9rem; }\n    .tags { display: flex; flex-wrap: wrap; gap: .3rem; list-style: none; padding: 0; }\n    .tag { background: #e8f1ee; border-radius: 1rem; padding: 0 .6rem; font-size: .8rem; }\n    [role=\"status\"] { min-height: 1.4em; color: #8a4b00; }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003ch1 id=\"profile-name\">Loading…\u003c/h1>\n  \u003cp id=\"profile-headline\">\u003c/p>\n  \u003cp class=\"source\" id=\"data-source\" aria-live=\"polite\">\u003c/p>\n  \u003cp id=\"resume-status\" role=\"status\">\u003c/p>\n\n  \u003ch2>Experience\u003c/h2>\u003cul id=\"experience\">\u003c/ul>\n  \u003ch2>Projects\u003c/h2>\u003cul id=\"projects\">\u003c/ul>\n\n  \u003ch2>Awards\u003c/h2>\n  \u003cp id=\"awards-status\" role=\"status\">\u003c/p>\n  \u003cul id=\"awards\">\u003c/ul>\n  \u003cp>\u003cbutton id=\"awards-prev\">Previous\u003c/button> \u003cspan id=\"awards-pager\">\u003c/span> \u003cbutton id=\"awards-next\">Next\u003c/button>\u003c/p>\n\n  \u003ch2>GitHub\u003c/h2>\n  \u003cdiv id=\"github-card\">\u003c/div>\u003cp id=\"github-status\" role=\"status\">\u003c/p>\n\n  \u003cp>\u003ca href=\"contact.html\">Contact\u003c/a>\u003c/p>\n\n  \u003c!-- order matters: config first, then api, then the page scripts (defer keeps this order) -->\n  \u003cscript src=\"js/config.js\" defer>\u003c/script>\n  \u003cscript src=\"js/api.js\" defer>\u003c/script>\n  \u003cscript src=\"js/resume.js\" defer>\u003c/script>\n  \u003cscript src=\"js/github.js\" defer>\u003c/script>\n\u003c/body>\n\u003c/html>\n","scripts/db.py":"\"\"\"Shared database helpers. Every script imports from this file (Module 5, slide 14).\"\"\"\nimport os\nfrom datetime import date, datetime\nfrom decimal import Decimal\n\nimport mysql.connector\nfrom dotenv import load_dotenv\n\nload_dotenv()  # reads .env into the environment\n\n\ndef connect():\n    \"\"\"Open a connection as the read-only user from Course 4 Module 9.\"\"\"\n    return mysql.connector.connect(\n        host=os.getenv(\"DB_HOST\", \"localhost\"),\n        port=int(os.getenv(\"DB_PORT\", \"3306\")),\n        user=os.getenv(\"DB_USER\"),\n        password=os.getenv(\"DB_PASSWORD\"),\n        database=os.getenv(\"DB_NAME\", \"future_portfolio_db\"),\n    )\n\n\ndef fetch_all(conn, sql, params=()):\n    \"\"\"Run a SELECT and return a list of dictionaries (one per row).\"\"\"\n    with conn.cursor(dictionary=True) as cursor:\n        cursor.execute(sql, params)\n        return cursor.fetchall()\n\n\ndef to_json_value(value):\n    \"\"\"Tell json.dumps how to write the two types JSON cannot hold (slide 12).\"\"\"\n    if isinstance(value, (date, datetime)):\n        return value.isoformat()  # \"2021-06-01\"\n    if isinstance(value, Decimal):\n        return float(value)  # 40.0\n    raise TypeError(type(value).__name__)\n","scripts/db_to_json.py":"\"\"\"One command regenerates data/resume.json from the database (Module 5 lab).\n\n    python scripts/db_to_json.py\n\nModule 6 imports build_resume() from this file, which is why main() only runs\nwhen the file is run directly (see the last two lines).\n\"\"\"\nimport json\nfrom datetime import date\nfrom pathlib import Path\n\nfrom db import connect, fetch_all, to_json_value\n\nOUTPUT = Path(__file__).resolve().parent.parent / \"data\" / \"resume.json\"\n\n\ndef build_resume(conn):\n    \"\"\"Return one dictionary with exactly the shape of the contract (version 2).\"\"\"\n    projects = fetch_all(conn, \"SELECT * FROM v_api_projects ORDER BY project_id\")\n    for project in projects:\n        project[\"skills\"] = json.loads(project[\"skills\"])  # JSON text -> a real list\n    return {\n        \"generated_at\": date.today().isoformat(),\n        \"profile\": fetch_all(conn, \"SELECT * FROM v_api_profile\")[0],\n        \"summary\": fetch_all(conn, \"SELECT * FROM v_api_summary\")[0],\n        \"experience\": fetch_all(conn, \"SELECT * FROM v_api_experience ORDER BY start_date DESC\"),\n        \"projects\": projects,\n        # The slide shortens these two ORDER BY clauses. These are the full versions:\n        \"skills\": fetch_all(conn, \"SELECT * FROM v_api_skills ORDER BY category, skill\"),\n        \"education\": fetch_all(conn, \"SELECT * FROM v_api_education ORDER BY start_year DESC\"),\n        \"awards\": fetch_all(conn, \"SELECT * FROM v_api_awards ORDER BY year DESC, id\"),\n    }\n\n\ndef main():\n    with connect() as conn:\n        resume = build_resume(conn)\n    OUTPUT.parent.mkdir(exist_ok=True)\n    with open(OUTPUT, \"w\", encoding=\"utf-8\") as file:\n        json.dump(resume, file, indent=2, ensure_ascii=False, default=to_json_value)\n    for key in (\"experience\", \"projects\", \"skills\", \"education\", \"awards\"):\n        print(f\"{key:\u003c12} {len(resume[key])}\")\n    print(f\"Wrote {OUTPUT}\")\n\n\nif __name__ == \"__main__\":\n    main()\n","scripts/query_awards.py":"\"\"\"Exercise 3: print the awards in one category, newest first.\n\n    python scripts/query_awards.py              (Industry by default)\n    python scripts/query_awards.py Company\n    python scripts/query_awards.py \"x' OR '1'='1\"   (the attack: must print 0 awards)\n\"\"\"\nimport sys\n\nfrom db import connect, fetch_all\n\ncategory = sys.argv[1] if len(sys.argv) > 1 else \"Industry\"\n\nwith connect() as conn:\n    rows = fetch_all(\n        conn,\n        \"SELECT * FROM v_api_awards WHERE category = %s ORDER BY year DESC, id\",\n        (category,),  # the comma makes this a tuple\n    )\n\nfor row in rows:\n    print(f\"{row['year']}  {row['award']}  ({row['category']})\")\nprint(f\"{len(rows)} awards\")\n","sql/11_api_views.sql":"-- 11_api_views.sql  (Course 5, Module 5) -- run as root, after the Course 4 rebuild.\n--\n-- NOTE FROM THE PLAYGROUND AUTHOR: the Module 5 slides use these views but defer the exact SQL to the course's\n-- MD files. This is a faithful reconstruction of the contract (column names are the JSON keys). If your Course 4\n-- table or column names differ, change the FROM/JOIN parts, never the AS aliases: the aliases ARE the contract.\nUSE future_portfolio_db;\n\nCREATE OR REPLACE VIEW v_api_profile AS\nSELECT full_name, headline, location, summary\nFROM people WHERE person_id = 1;                       -- 4 keys, no email\n\nCREATE OR REPLACE VIEW v_api_summary AS\nSELECT\n  (SELECT COUNT(DISTINCT e.company_id) FROM employment e JOIN roles r ON r.employment_id = e.employment_id) AS companies,\n  (SELECT COUNT(*) FROM roles)    AS roles,\n  (SELECT COUNT(*) FROM projects) AS projects,\n  (SELECT COUNT(*) FROM skills)   AS skills,\n  (SELECT COUNT(*) FROM awards)   AS awards,\n  (SELECT CAST(YEAR(COALESCE(MAX(end_date), CURDATE())) - YEAR(MIN(start_date)) AS DECIMAL(6,1)) FROM employment) AS career_years;\n\nCREATE OR REPLACE VIEW v_api_experience AS\nSELECT r.role_id AS id, c.company_name AS company, r.role_title AS role,\n       r.role_start AS start_date, r.role_end AS end_date, r.team_size AS team_size\nFROM roles r\nJOIN employment e ON e.employment_id = r.employment_id\nJOIN companies  c ON c.company_id    = e.company_id;\n\nCREATE OR REPLACE VIEW v_api_projects AS\nSELECT p.project_id AS project_id, p.project_name AS project, r.role_title AS role, c.company_name AS company,\n       (SELECT JSON_ARRAYAGG(s.skill_name)\n          FROM project_skills ps JOIN skills s ON s.skill_id = ps.skill_id\n         WHERE ps.project_id = p.project_id) AS skills       -- JSON text: Python must json.loads() it\nFROM projects p\nJOIN role_projects rp ON rp.project_id = p.project_id\nJOIN roles r          ON r.role_id     = rp.role_id\nJOIN employment e     ON e.employment_id = r.employment_id\nJOIN companies c      ON c.company_id  = e.company_id;\n\nCREATE OR REPLACE VIEW v_api_skills AS\nSELECT s.skill_id AS id, s.skill_name AS skill, s.category AS category,\n       (SELECT COUNT(DISTINCT ps.project_id) FROM project_skills ps WHERE ps.skill_id = s.skill_id) AS project_count\nFROM skills s;\n\nCREATE OR REPLACE VIEW v_api_education AS\nSELECT education_id AS id, qualification, institution, type, start_year, end_year FROM education;\n\nCREATE OR REPLACE VIEW v_api_awards AS\nSELECT award_id AS id, award_name AS award, awarding_body AS awarded_by,\n       award_year AS year, award_category AS category\nFROM awards;\n\n-- The read-only API user sees ONLY these views (Course 4 Module 9). Replace the passphrase first.\n-- CREATE USER IF NOT EXISTS 'portfolio_web'@'localhost' IDENTIFIED BY 'CHANGE-ME-your-own-passphrase';\nGRANT SELECT ON future_portfolio_db.v_api_profile    TO 'portfolio_web'@'localhost';\nGRANT SELECT ON future_portfolio_db.v_api_summary    TO 'portfolio_web'@'localhost';\nGRANT SELECT ON future_portfolio_db.v_api_experience TO 'portfolio_web'@'localhost';\nGRANT SELECT ON future_portfolio_db.v_api_projects   TO 'portfolio_web'@'localhost';\nGRANT SELECT ON future_portfolio_db.v_api_skills     TO 'portfolio_web'@'localhost';\nGRANT SELECT ON future_portfolio_db.v_api_education  TO 'portfolio_web'@'localhost';\nGRANT SELECT ON future_portfolio_db.v_api_awards     TO 'portfolio_web'@'localhost';\n","sql/12_contact_messages.sql":"-- 12_contact_messages.sql  (Course 5, Module 7) -- run as root, after 11_api_views.sql.\nUSE future_portfolio_db;\n\nCREATE TABLE IF NOT EXISTS contact_messages (\n  message_id INT AUTO_INCREMENT PRIMARY KEY,\n  name       VARCHAR(100)  NOT NULL,\n  email      VARCHAR(254)  NOT NULL,                 -- 254 is the longest valid email address\n  message    VARCHAR(2000) NOT NULL,\n  sent_at    DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,   -- the server decides\n  is_read    BOOLEAN  NOT NULL DEFAULT FALSE                -- the server decides\n);\n\n-- Owner-only view. NEVER granted to portfolio_web: visitors' emails stay out of /api/resume.\nCREATE OR REPLACE VIEW v_owner_messages AS\nSELECT message_id AS id, name, email, message, sent_at, is_read\nFROM contact_messages;\n\n-- A user that can write, and nothing more (least privilege). Replace the passphrase before running.\nCREATE USER IF NOT EXISTS 'portfolio_writer'@'localhost' IDENTIFIED BY 'CHANGE-ME-another-passphrase';\n\nGRANT SELECT, INSERT, UPDATE, DELETE ON future_portfolio_db.contact_messages TO 'portfolio_writer'@'localhost';\nGRANT SELECT                         ON future_portfolio_db.v_owner_messages TO 'portfolio_writer'@'localhost';\nGRANT SELECT, INSERT, UPDATE         ON future_portfolio_db.projects         TO 'portfolio_writer'@'localhost';\nGRANT SELECT, INSERT                 ON future_portfolio_db.companies        TO 'portfolio_writer'@'localhost';\nGRANT SELECT, INSERT                 ON future_portfolio_db.employment       TO 'portfolio_writer'@'localhost';\nGRANT SELECT, INSERT                 ON future_portfolio_db.roles            TO 'portfolio_writer'@'localhost';\nGRANT SELECT, INSERT                 ON future_portfolio_db.role_projects    TO 'portfolio_writer'@' CT COUNT(*) FROM roles) AS roles, (SELECT COUNT(*) FROM projects) AS projects, (SELECT COUNT(*) FROM skills) AS skills,\n  (SELECT COUNT(*) FROM awards) AS awards,\n  (SELECT CAST(strftime('%Y', MAX(COALESCE(end_date,'2026-11-25'))) AS INTEGER) - CAST(strftime('%Y', MIN(start_date)) AS INTEGER) FROM employment) AS career_years;\nCREATE VIEW v_api_experience AS SELECT r.role_id AS id, c.company_name AS company, r.role_title AS role, r.role_start AS start_date, r.role_end AS end_date, r.team_size AS team_size\n  FROM roles r JOIN employment e ON e.employment_id = r.employment_id JOIN companies c ON c.company_id = e.company_id;\nCREATE VIEW v_api_projects AS SELECT p.project_id AS project_id, p.project_name AS project, r.role_title AS role, c.company_name AS company,\n  (SELECT json_group_array(skill_name) FROM (SELECT s.skill_name FROM project_skills ps JOIN skills s ON s.skill_id = ps.skill_id WHERE ps.project_id = p.project_id ORDER BY s.skill_id)) AS skills\n  FROM projects p JOIN role_projects rp ON rp.project_id = p.project_id JOIN roles r ON r.role_id = rp.role_id\n  JOIN employment e ON e.employment_id = r.employment_id JOIN companies c ON c.company_id = e.company_id;\nCREATE VIEW v_api_skills AS SELECT s.skill_id AS id, s.skill_name AS skill, s.category AS category,\n  (SELECT COUNT(DISTINCT ps.project_id) FROM project_skills ps WHERE ps.skill_id = s.skill_id) AS project_count FROM skills s;\nCREATE VIEW v_api_education AS SELECT education_id AS id, qualification, institution, type, start_year, end_year FROM education;\nCREATE VIEW v_career_summary AS SELECT * FROM v_api_summary;\nCREATE VIEW v_api_awards AS SELECT award_id AS id, award_name AS award, awarding_body AS awarded_by, award_year AS year, award_category AS category FROM awards;\n\"\"\"\n\n\ndef _json_quote(s): return json.dumps(s)\ndef _json_contains(target, cand):\n    try: return 1 if json.loads(cand) in json.loads(target) else 0\n    except Exception: return 0\n\n\ndef reset(seed=None):\n    \"\" LABS.parse = () => ({ title: 'JSON.parse and JSON.stringify', intro: 'Run it, then change things. The last lines show what happens when the “JSON” is really an HTML page.', code: `const text = '{"role": "CTO", "team_size": 1800}';

console.log(typeof role.team_size);

console.log(JSON.stringify(role));          // object → text

// Single quotes are not valid JSON:
try { JSON.parse("{'role': 'CTO'}"); }
catch (e) { console.log(e.name + ": " + e.message); }

// response.json() = JSON.parse on the response body
const response = await fetch("https://httpbin.org/get?course=apis");

  solution: `// js/resume.js
function formatMonth(iso) {
  if (!iso) return "Present";
  const [year, month] = iso.split("-");
  return ${MONTHS}[Number(month) - 1] + " " + year;
}

function renderExperience(list) {
  const sorted = [...list].sort((a, b) => b.start_date.localeCompare(a.start_date));
  document.querySelector("#experience").innerHTML =
    "<h2>Experience</h2><ul>" + sorted.map(r =>
      \`<li>\${r.role}, \${r.company} (\${formatMonth(r.start_date)} – \${formatMonth(r.end_date)})\${r.team_size !== null ? " · team of " + r.team_size : ""}</li>\`
    ).join("") + "</ul>";
}

function renderProfile(profile) {
  document.querySelector("#profile").innerHTML =
    \`<h1>\${profile.full_name}</h1><p>\${profile.headline}</p><p>\${profile.location}</p>\`;
}

function renderAwards(awards) {
  const newestFirst = [...awards].sort((a, b) => b.year - a.year);
  document.querySelector("#awards").innerHTML =
    "<h2>Awards</h2><ul>" + newestFirst.map(a =>
      \`<li>\${a.award} (\${a.awarded_by}, \${a.year})</li>\`).join("") + "</ul>";
}

async function loadResume() {
  try {
    const response = await fetch("data/resume.json");
    if (!response.ok) throw new Error(\`HTTP \${response.status}\`);
    const resume = await response.json();
    renderProfile(resume.profile);
    renderExperience(resume.experience);
    renderAwards(resume.awards);
  } catch (error) {
    document.querySelector("#experience").textContent =
      "The resume could not be loaded.";
    console.error(error);
  }
}
document.addEventListener("DOMContentLoaded", loadResume);`,

}
function renderWeather(data, savedAt, message) {
  const box = document.querySelector("#weather .body");
  box.textContent = "";                                     // textContent only: never innerHTML
  const c = data.current, u = data.current_units;
  [ c.temperature_2m + " " + u.temperature_2m,
    CONDITIONS[c.weather_code] || "Conditions unavailable",
    "Humidity " + c.relative_humidity_2m + " " + u.relative_humidity_2m,
    "Wind " + c.wind_speed_10m + " " + u.wind_speed_10m
  ].forEach(text => { const p = document.createElement("p"); p.textContent = text; box.append(p); });
  const when = savedAt ? "Updated " + new Date(savedAt).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" }) : "";
  setWeatherStatus([when, message].filter(Boolean).join(". "));
}

async function loadWeather() {
  const saved = cacheRead(WEATHER_KEY);
  if (isFresh(saved, WEATHER_MAX_AGE)) {
    console.log("state: fresh cache (no request sent)");
    return renderWeather(saved.data, saved.savedAt);
  }
  setWeatherStatus("Loading the weather…");
  console.log("state: loading");
  try {
    const data = await getJSON(WEATHER_URL, TIMEOUT);
    cacheWrite(WEATHER_KEY, data);
    console.log("state: fetched and saved");
    renderWeather(data, Date.now());
  } catch (error) {
    console.error(error);
    if (saved) {
      console.log("state: stale cache shown with the error message");
      return renderWeather(saved.data, saved.savedAt, messageFor(error));
    }
    try {
      const sample = await getJSON("fixtures/weather-bengaluru.json");
      console.log("state: sample data");
      renderWeather(sample, null, "Showing sample data.");
    } catch {
      console.log("state: error");
      setWeatherStatus(messageFor(error));
    }
  }
}
loadWeather();`;

/* ===== Module 5 · Python for API Builders ===== */
const SF = n => STARTER[n];
const ENV_PASS = 'DB_HOST=localhost\nDB_PORT=3306\nDB_USER=portfolio_web\nDB_PASSWORD=practice-pass\nDB_NAME=future_portfolio_db\n';
const pyOk = (cond, label) => ({ pass: !!cond, label });
const dbFiles = (extra) => [{ name: '.env', code: ENV_PASS }, { name: 'scripts/db.py', code: SF('scripts/db.py') }].concat(extra || []);
const RESUME_CHECKS = async ({ out, read }) => {
  const txt = await read('data/resume.json'); if (!txt) return [pyOk(false, 'data/resume.json was not written yet')];
  let d; try { d = JSON.parse(txt); } catch (e) { return [pyOk(false, 'resume.json is not valid JSON')]; }
  const n = k => Array.isArray(d[k]) ? d[k].length : -1;
  return [pyOk(n('experience') === 17 && n('projects') === 18 && n('skills') === 17 && n('education') === 4 && n('awards') === 19, 'Counts: experience 17, projects 18, skills 17, education 4, awards 19'),
    pyOk(d.profile && !Array.isArray(d.profile) && d.summary && !Array.isArray(d.summary), 'profile and summary are objects (the [0] step), not lists'),
    pyOk(d.projects && d.projects[0] && Array.isArray(d.projects[0].skills), 'Each project has a real skills array (the json.loads step)'),
    pyOk(d.summary && d.summary.career_years === 40, 'career_years is 40.0 (Decimal became a number)'),
    pyOk(/"start_date": "\d{4}-\d{2}-\d{2}"/.test(txt), 'Dates are ISO strings like "2021-06-01"'),
    pyOk(/"team_size": null/.test(txt), 'Missing team sizes are null'),
    pyOk(txt.indexOf('@') < 0, 'No @ anywhere: no email leaked'),
    pyOk(/Wrote /.test(out), 'The script printed its "Wrote …" line')];
};

  files: [{ name: 'main.py', code: 'import json\nfrom datetime import date\nfrom decimal import Decimal\n\nrow = {"id": 3, "start_date": date(2021, 6, 1), "career_years": Decimal("40.0000")}\n\n# TODO: write to_json_value(value) here (dates -> isoformat, Decimal -> float, anything else -> raise TypeError)\n\nprint(json.dumps(row, indent=2))   # TypeError until you add default=\n', solution: 'import json\nfrom datetime import date, datetime\nfrom decimal import Decimal\n\nrow = {"id": 3, "start_date": date(2021, 6, 1), "career_years": Decimal("40.0000")}\n\n\ndef to_json_value(value):\n    if isinstance(value, (date, datetime)):\n        return value.isoformat()\n    if isinstance(value, Decimal):\n        return float(value)\n    raise TypeError(type(value).__name__)\n\n\nprint(json.dumps(row, indent=2, default=to_json_value))\n' }],
  checks: async ({ out }) => [pyOk(/"start_date": "2021-06-01"/.test(out), 'Date became "2021-06-01"'), pyOk(/"career_years": 40\.0\b/.test(out), 'Decimal became the number 40.0')] });

PYLABS.chai = () => ({ title: 'Real example: Chai Corner menu.json', intro: 'The same script shape, for a tea stall. A list of dictionaries with a price (`Decimal`) and a date, written to a file. Fill the TODOs and make the checks pass.', main: 'chai.py', dbReset: false,
  files: [{ name: 'chai.py', code: 'import json\nfrom datetime import date\nfrom decimal import Decimal\nfrom pathlib import Path\n\nmenu = [\n    {"id": 1, "name": "Masala Chai", "category": "Tea", "price": Decimal("15.00"), "added": date(2024, 6, 1)},\n    {"id": 2, "name": "Filter Coffee", "category": "Coffee", "price": Decimal("25.00"), "added": date(2024, 6, 1)},\n    {"id": 3, "name": "Samosa", "category": "Snack", "price": Decimal("12.50"), "added": date(2025, 1, 15)},\n]\n\n\ndef to_json_value(value):\n    pass  # TODO 1: dates -> ISO text, Decimal -> float, anything else -> raise TypeError\n\n\ndef cheaper_than(items, limit):\n    pass  # TODO 2: names of the items whose price is below limit (a list comprehension)\n\n\nPath("out").mkdir(exist_ok=True)\nwith open("out/menu.json", "w", encoding="utf-8") as file:\n    json.dump(menu, file, indent=2, ensure_ascii=False, default=to_json_value)\nprint("cheap:", cheaper_than(menu, Decimal("20")))\nprint("Wrote out/menu.json")\n', solution: 'import json\nfrom datetime import date\nfrom decimal import Decimal\nfrom pathlib import Path\n\nmenu = [\n    {"id": 1, "name": "Masala Chai", "category": "Tea", "price": Decimal("15.00"), "added": date(2024, 6, 1)},\n    {"id": 2, "name": "Filter Coffee", "category": "Coffee", "price": Decimal("25.00"), "added": date(2024, 6, 1)},\n    {"id": 3, "name": "Samosa", "category": "Snack", "price": Decimal("12.50"), "added": date(2025, 1, 15)},\n]\n\n\ndef to_json_value(value):\n    if isinstance(value, date):\n        return value.isoformat()\n    if isinstance(value, Decimal):\n        return float(value)\n    raise TypeError(type(value).__name__)\n\n\ndef cheaper_than(items, limit):\n    return [item["name"] for item in items if item["price"] < limit]\n\n\nPath("out").mkdir(exist_ok=True)\nwith open("out/menu.json", "w", encoding="utf-8") as file:\n    json.dump(menu, file, indent=2, ensure_ascii=False, default=to_json_value)\nprint("cheap:", cheaper_than(menu, Decimal("20")))\nprint("Wrote out/menu.json")\n' }],
  checks: async ({ out, read }) => { const t = await read('out/menu.json'); return [pyOk(/cheap: \['Masala Chai', 'Samosa'\]/.test(out), 'cheaper_than returns Masala Chai and Samosa'), pyOk(t && /"price": 12\.5/.test(t) && /"added": "2025-01-15"/.test(t), 'menu.json has plain numbers and ISO dates')]; } });

L({ id: 'm5-2', mod: 5, n: '5.2', title: 'Setup: venv, pip and what Git must never see', lead: 'A private set of packages per project, and two lines in .gitignore.', src: 'M5 · slides 4–5', blocks: [
  ['p', 'On your own laptop (this part cannot run in a browser, so it is a checklist):'],
  ['code', 'python --version            # 3.12+   (Windows: py)\npython -m venv .venv        # create\n.venv\\Scripts\\activate      # Windows cmd\n.venv\\Scripts\\Activate.ps1  # Windows PowerShell\nsource .venv/bin/activate   # macOS / Linux\n(.venv) $ pip install mysql-connector-python python-dotenv\n(.venv) $ pip freeze > requirements.txt'],
  ['grid', [['Virtual environment', 'A private set of packages for **this** project. Like `node_modules` for one repo.'], ['pip', 'Python’s package installer. Like `npm`.'], ['VS Code', '“Python: Select Interpreter” → the one in `.venv`. New terminals then activate it for you.']]],
  ['h2', 'What goes into Git, and what never does'],
  ['table', ['Commit', 'Never commit'], [['`requirements.txt` (exact versions): `pip install -r requirements.txt` rebuilds the environment anywhere', '`.venv/` (rebuilt from `requirements.txt`)'], ['`.env.example` (variable names, **no password**)', '`.env` (your real passphrase)']]],
  ['p', 'Add `.venv/` and `.env` to `.gitignore` **now**, before anything else, then run `git status` to confirm neither appears. This is Course 4 Module 9’s rule (“no real password in a committed file”), now with a mechanism.'],
  ['w', 'checklist', { id: 'm5-setup', title: 'Setup checklist (saved in this browser)', items: ['`python --version` shows 3.12 or newer', '`.venv` created and **activated** (the prompt starts with `(.venv)`)', '`pip install mysql-connector-python python-dotenv` finished', '`pip freeze > requirements.txt` written', '`.gitignore` contains `.venv/` and `.env`', '`git status` does **not** list `.env` or `.venv/`'] }],
  ['note', 'info', 'Windows PowerShell says “running scripts is disabled”?', 'Use Command Prompt, or run `Set-ExecutionPolicy -Scope CurrentUser RemoteSigned` if lab policy allows, or let VS Code activate the environment for you. If PyPI is blocked in the lab, use the facilitator’s `wheels/` folder.'],
  ['details', 'Real-world example: why every team does this', 'A teammate clones your repo and runs `pip install -r requirements.txt`. Their laptop now has the exact same packages as yours. Without `requirements.txt` the answer to “it works on my machine” is a lost afternoon. Without `.gitignore`, one `git push` can publish your database password to the whole internet; bots scan GitHub for exactly that, within minutes.']
] });
L({ id: 'm5-3', mod: 5, n: '5.3', title: 'Python beside JavaScript', lead: 'You already know the ideas. Only the spelling changes.', src: 'M5 · slides 6–7', blocks: [
  ['table', ['Idea', 'JavaScript', 'Python'], [['Variable', '`const team = 1800;`', '`team = 1800`'], ['Template literal', '`` `Team of ${team}` ``', '`f"Team of {team}"`'], ['True / false / nothing', '`true, false, null`', '`True, False, None`'], ['Equality', '`===`', '`==` (no type conversion)'], ['And / or / not', '`&&  ||  !`', '`and  or  not`'], ['Comment', '`// note`', '`# note`'], ['Print', '`console.log(x)`', '`print(x)`'], ['Blocks', '`{ … }`', 'colon + indentation']]],
  ['p', 'The Python **REPL** (type `python`, prompt `>>>`) is your DevTools Console. `exit()` leaves it. In the next lesson the **Predict, then run** table is your REPL.'],
  ['note', 'warn', 'Three things that surprise JavaScript developers', '`True`, `False`, `None` have capital letters. `==` never converts types, so `1800 == "1800"` is `False`. And `//` is integer division, not a comment.'],
  ['h2', 'Indentation is the syntax'],
  ['code', 'team_size = 1800\nif team_size >= 1000:\n    print(f"Large team: {team_size:,}")\nelif team_size >= 100:\n    print("Medium team")\nelse:\n    print("Small team")\n# Large team: 1,800'],
  ['grid', [['Colon + 4 spaces', 'The block is whatever is indented under the colon. No braces.'], ['IndentationError', 'Mixed tabs and spaces, or one line out of step. VS Code inserts 4 spaces in `.py` files.'], ['snake_case', '`team_size`: the same style as the database and the contract.']]],
  ['py', 'indent']
] });

L({ id: 'm5-8', mod: 5, n: '5.8', title: 'Connect, query, and %s', lead: 'Four lines to talk to MySQL, and one comma that matters.', src: 'M5 · slides 14–15', blocks: [

  ['h2', '%s, not ?'],

/* ===== Module 6 · Your First API with FastAPI ===== */
const M6 = SF('api/stages/module06_main.py');
const faFiles = (extra) => [{ name: '.env', code: ENV_PASS }, { name: 'db.py', code: SF('api/db.py') }, { name: 'resume.py', code: SF('api/resume.py') }].concat(extra || []);
const SEND = 'from main import app\n\n\ndef send(method, url, **kw):\n    """Send one pretend request to your app and print what came back."""\n    r = app.call(method, url, **kw)\n    total = r.headers.get("x-total-count")\n    print(f"{method} {url}")\n    print(f"   status {r.status_code}" + (f"   X-Total-Count: {total}" if total else ""))\n    print("   " + r.text[:260])\n\n\n';
const tryIt = (lines) => ({ name: 'try_it.py', code: SEND + lines.join('\n') + '\n' });
const cut = (src, from, to, repl) => { const i = src.indexOf(from), j = src.indexOf(to, i); return i < 0 || j < 0 ? src : src.slice(0, i) + repl + src.slice(j); };
const has = (out, re) => re.test(out);

tegory=Sweets")', 'send("GET", "/api/menu/3")', 'send("GET", "/api/menu/99")'])],

L({ id: 'm6-4', mod: 6, n: '6.4', title: 'Path parameters, query parameters, type hints', lead: 'The declaration is the check.', src: 'M6 · slides 7–9', blocks: [
  ['code', '@app.get("/api/echo/{item_id}")\ndef echo(item_id: int,\n         q: str | None = None,\n         limit: int = 10):\n    return {"item_id": item_id, "q": q, "limit": limit}\n\n/api/echo/5               → {"item_id": 5, "q": null, "limit": 10}\n/api/echo/5?q=lumina&limit=3 → {"item_id": 5, "q": "lumina", "limit": 3}'],
  ['grid', [['{item_id} in the path', 'A **path parameter**: part of the URL itself.'], ['Every other parameter', 'A **query parameter**: after the `?`.'], ['"5" → 5', 'URLs carry text. FastAPI converts it to the declared type **before your function runs**.']]],
  ['h2', 'Type hints are rules'],

  ['p', 'In plain Python, type hints are notes. **FastAPI reads them and enforces them on every request.** In Course 2 every check on a URL value was an `if` you wrote yourself.'],

L({ id: 'm6-7', mod: 6, n: '6.7', title: 'One helper for every list', lead: 'Filter, count, sort, page: the same four steps for every collection.', src: 'M6 · slides 12–14', blocks: [
  ['code', 'def list_from_view(response, view, where, params,\n                   order, page, limit):\n    where_sql = f" WHERE {\' AND \'.join(where)}" if where else ""\n    with connect() as conn:\n        total = fetch_all(conn,\n            f"SELECT COUNT(*) AS total FROM {view}{where_sql}",\n            params)[0]["total"]\n        rows = fetch_all(conn,\n            f"SELECT * FROM {view}{where_sql} "\n            f"ORDER BY {order} LIMIT %s OFFSET %s",\n            [*params, limit, (page - 1) * limit])\n    response.headers["X-Total-Count"] = str(total)\n    return rows'],
  ['grid', [['Same four steps', 'Filter, count, sort, page: for awards, experience, projects, skills, education.'], ['OFFSET', 'page 2, limit 5 → skip 5, return the next 5.'], ['COUNT(*) with the same WHERE', '`X-Total-Count` is the total **for the filter**, not the table.']]],
  ['h2', 'Filters become WHERE'],
  ['py', 'awardlist'],
  ['p', 'The slide uses semicolons to fit. The starter has one statement per line, which is the style to type.'],
  ['h2', 'Why these f-strings are safe'],
  ['grid', [['From the code (f-string OK)', 'The view name: a literal the programmer typed. Each WHERE piece: a fixed string with `%s`. `ORDER BY`: looked up in a **fixed dictionary**; `sort` can only be `year` or `-year`, and FastAPI refused anything else.'], ['From the request (always %s)', '`category`, `year_from`, `year_to`. `limit` and the offset. `skill`, `company`, every id. **Never in SQL text. Ever.**']]],
  ['note', 'warn', 'Module 5’s rule, precisely', 'No **value from the request** goes into SQL text. Test: could a user make `order` contain anything other than the two strings in the dictionary? No: `Literal` stops it first, and a third value would raise a `KeyError` before that.'],
  ['quiz', [{ q: 'The awards endpoint builds SQL with an f-string. Why is that safe here?', o: ['f-strings escape quotes automatically', 'Only fixed text from the code goes in; every request value is a `%s` parameter', 'It is not safe; it is just short'], a: 1, why: 'The f-string joins pieces the programmer typed. The user’s values travel separately as parameters.' }, { q: '`?category=Industry&page=2&limit=5`: what is `X-Total-Count`, and how many items are in the body?', o: ['19 and 5', '7 and 2', '7 and 5'], a: 1, why: 'The total is for the filter: 7 Industry awards. Page 2 of 5 per page holds the remaining 2.' }]]
] });

/* ===== Module 7 · Writing Data ===== */
const M7 = SF('api/stages/module07_main.py');
const ENV_W = ENV_PASS + 'DB_WRITE_USER=portfolio_writer\nDB_WRITE_PASSWORD=writer-pass\n';
const wFiles = (extra, withApp) => [{ name: '.env', code: ENV_W }, { name: 'db.py', code: SF('api/db.py') }].concat(withApp === false ? [] : [{ name: 'resume.py', code: SF('api/resume.py') }, { name: 'models.py', code: SF('api/models.py') }, { name: 'db_errors.py', code: SF('api/db_errors.py') }]).concat(extra || []);
const SEND7 = SEND.replace('from main import app\n', 'from main import app\n').replace('def send(method, url, **kw):', 'def send(method, url, body=None, **kw):').replace('r = app.call(method, url, **kw)', 'r = app.call(method, url, json_body=body, **kw)').replace('    print(f"{method} {url}")', '    print(f"{method} {url}" + (f"  {body}" if body is not None else ""))').replace('    print(f"   status {r.status_code}" + (f"   X-Total-Count: {total}" if total else ""))', '    loc = r.headers.get("location")\n    print(f"   status {r.status_code}" + (f"   X-Total-Count: {total}" if total else "") + (f"   Location: {loc}" if loc else ""))');
const tryIt7 = lines => ({ name: 'try_it.py', code: SEND7 + lines.join('\n') + '\n' });
const APPT = '{"company_name": "Kestrel Ridge Analytics", "role_title": "Non-Executive Director", "start_date": "2026-06-01", "end_date": "2029-05-31", "project_name": "Acquisition technology due diligence", "skill_ids": [17], "headline": "Former CTO | Non-Executive Director"}';

PYLABS.commit = () => ({ autoReset: true, title: 'Commit or it did not happen', intro: 'Part A inserts a message and closes the connection **without** `commit()`. Part B is yours: add the commit and watch the difference. Look at the **new id** in part B: AUTO_INCREMENT never gives a number back, even after the rollback in part A.', main: 'main.py', dbReset: true,
  files: wFiles([{ name: 'main.py', code: 'from db import connect, execute, fetch_all\n\nINSERT = "INSERT INTO contact_messages (name, email, message) VALUES (%s, %s, %s)"\nROW = ("Test", "test@example.com", "Hello")\n\n\ndef how_many():\n    with connect(write=True) as conn:\n        return fetch_all(conn, "SELECT COUNT(*) AS n FROM v_owner_messages")[0]["n"]\n\n\n# Part A: no commit\nconn = connect(write=True)\nprint("part A inserted:", execute(conn, INSERT, ROW))      # (rows affected, new id)\nconn.close()                                               # closing without commit = rollback\nprint("part A rows in the table afterwards:", how_many())\n\n# Part B: your turn. Same insert, but make it stick.\nconn = connect(write=True)\nprint("part B inserted:", execute(conn, INSERT, ROW))\n# TODO: one line here\nconn.close()\nprint("part B rows in the table afterwards:", how_many())\n', solution: 'from db import connect, execute, fetch_all\n\nINSERT = "INSERT INTO contact_messages (name, email, message) VALUES (%s, %s, %s)"\nROW = ("Test", "test@example.com", "Hello")\n\n\ndef how_many():\n    with connect(write=True) as conn:\n        return fetch_all(conn, "SELECT COUNT(*) AS n FROM v_owner_messages")[0]["n"]\n\n\n# Part A: no commit\nconn = connect(write=True)\nprint("part A inserted:", execute(conn, INSERT, ROW))\nconn.close()\nprint("part A rows in the table afterwards:", how_many())\n\n# Part B\nconn = connect(write=True)\nprint("part B inserted:", execute(conn, INSERT, ROW))\nconn.commit()\nconn.close()\nprint("part B rows in the table afterwards:", how_many())\n' }], false),
  checks: async ({ out }) => [pyOk(/part A inserted: \(1, 1\)/.test(out), 'Part A: the INSERT “worked” (1 row, id 1)'), pyOk(/part A rows in the table afterwards: 0/.test(out), 'Part A: but the table is empty (no commit)'), pyOk(/part B inserted: \(1, 2\)/.test(out), 'Part B: the new id is 2, not 1 (numbers are never given back)'), pyOk(/part B rows in the table afterwards: 1/.test(out), 'Part B: the row is really there')] });

  files: [{ name: 'models.py', code: 'from pydantic import BaseModel, ConfigDict, EmailStr, Field\n\n\nclass MessageIn(BaseModel):\n    """What the contact form sends."""\n    # TODO 1: model_config = ConfigDict(str_strip_whitespace=True)\n    name: str                      # TODO 2: at least 1 and at most 100 characters (Field)\n    email: str                     # TODO 3: use EmailStr\n    message: str                   # TODO 2: at least 1 and at most 2000 characters\n', solution: SF('api/models.py').split('class MessageOut')[0].replace('from datetime import date, datetime\n\n', '').trimEnd ? SF('api/models.py').split('class MessageOut')[0].replace('from datetime import date, datetime\n\n', '') : '' },
    { name: 'try_it.py', code: 'from pydantic import ValidationError\nfrom models import MessageIn\n\nCASES = {\n    "W01 good": {"name": "Ravi Kumar", "email": "ravi@example.com", "message": "Hello"},\n    "W02 no email": {"name": "Ravi Kumar", "message": "Hello"},\n    "W03 ravi-at-example": {"name": "Ravi Kumar", "email": "ravi-at-example", "message": "Hello"},\n    "W04 three spaces": {"name": "Ravi Kumar", "email": "ravi@example.com", "message": "   "},\n    "extra key is_read": {"name": "Ravi", "email": "r@example.com", "message": "Hi", "is_read": True},\n}\nfor label, body in CASES.items():\n    try:\n        m = MessageIn(**body)\n        print(label, "-> OK", m.model_dump())\n    except ValidationError as error:\n        for e in error.errors():\n            print(label, "-> 422  loc:", list(e["loc"]), " ", e["msg"][:60])\n' }],

PYLABS.dberrors = () => ({ autoReset: true, title: 'db_errors.py: when the database says no', intro: 'Four real database failures, each triggered on purpose as `portfolio_writer`. Fill in the table so each MySQL error number becomes the right HTTP status.', main: 'try_it.py', dbReset: true, needs: ['fastapi'],
  files: wFiles([{ name: 'db_errors.py', code: 'from fastapi import HTTPException\n\n# MySQL error number -> (HTTP status, message for the client)\nKNOWN = {\n    # TODO: 1062 duplicate entry      -> 409\n    # TODO: 1048 cannot be null       -> 422\n    # TODO: 1452 foreign key fails    -> 422\n    # TODO: 3819 check violated       -> 422\n}\n\n\ndef raise_for_db_error(error):\n    status, message = KNOWN.get(error.errno, (500, "The server could not complete that."))\n    if status == 500:\n        raise error\n    raise HTTPException(status_code=status, detail=message)\n', solution: SF('api/db_errors.py') }, { name: 'try_it.py', code: 'import mysql.connector\nfrom db import connect, execute\nfrom db_errors import raise_for_db_error\nfrom fastapi import HTTPException\n\nTESTS = [\n    ("duplicate company", "INSERT INTO companies (company_name) VALUES (%s)", ("CloudHarbor Software",)),\n    ("missing project name", "INSERT INTO projects (project_name) VALUES (%s)", (None,)),\n    ("skill that does not exist", "INSERT INTO project_skills (project_id, skill_id) VALUES (%s, %s)", (1, 99)),\n    ("end before start", "INSERT INTO employment (company_id, start_date, end_date) VALUES (%s, %s, %s)", (1, "2026-06-01", "2026-05-31")),\n]\nfor label, sql, params in TESTS:\n    with connect(write=True) as conn:\n        try:\n            execute(conn, sql, params)\n            conn.commit()\n            print(label, "-> it worked?!")\n        except mysql.connector.Error as error:\n            conn.rollback()\n            try:\n                raise_for_db_error(error)\n            except HTTPException as http:\n                print(f"{label}: MySQL {error.errno} -> HTTP {http.status_code}: {http.detail}")\n            except mysql.connector.Error:\n                print(f"{label}: MySQL {error.errno} -> 500 (the server\'s problem)")\n' }], false),
  checks: async ({ out }) => [pyOk(/duplicate company: MySQL 1062 -> HTTP 409/.test(out), '1062 → 409'), pyOk(/missing project name: MySQL 1048 -> HTTP 422/.test(out), '1048 → 422'), pyOk(/does not exist: MySQL 1452 -> HTTP 422/.test(out), '1452 → 422'), pyOk(/end before start: MySQL 3819 -> HTTP 422/.test(out), '3819 → 422')] });

L({ id: 'm7-3', mod: 7, n: '7.3', title: 'Commit or it did not happen', lead: 'The Python connector has autocommit OFF. Closing without commit rolls back.', src: 'M7 · slide 6', blocks: [
  ['code', 'def execute(conn, sql, params=()):\n    """(rows affected, new id)"""\n    with conn.cursor() as cursor:\n        cursor.execute(sql, params)\n        return cursor.rowcount, cursor.lastrowid\n\n>>> conn = connect(write=True)\n>>> execute(conn, "INSERT INTO contact_messages (name, email, message) VALUES (%s, %s, %s)", ("Test", "test@example.com", "Hello"))\n(1, 1)\n>>> conn.close()        # Workbench: empty!\n# again, with conn.commit() before close → row 2'],
  ['grid', [['Workbench', 'Autocommit **on**: every statement saves itself (Course 4 TX01).'], ['The Python connector', 'Autocommit **off**: always inside a transaction. Close without `commit()` = **rollback**.'], ['Course rule', 'Every write endpoint ends its changes with **exactly one** `conn.commit()`.']]],
  ['py', 'commit'],
  ['p', '`lastrowid` is the id MySQL just assigned. The second row is **id 2** because `AUTO_INCREMENT` never gives a number back, even after a rollback.'],
  ['quiz', [{ q: 'An insert returns 201 but Workbench shows nothing. What is missing?', o: ['The view', '`conn.commit()`: the connector’s autocommit is off', 'A restart of MySQL'], a: 1, why: 'Without commit, closing the connection undoes the insert. The API said 201 because the INSERT itself did not fail.' }]]
] });

LABS.source = () => ({ title: 'Which source? (config.js)', build: 8, intro: 'Write `chooseSource(hostname, search)`. **Local** (`127.0.0.1` or `localhost`) tries the API. Anywhere else, or with `?source=snapshot`, it goes straight to the snapshot. Predict the five answers first.', code: 'function chooseSource(hostname, search) {\n  // TODO: IS_LOCAL = the hostname is "127.0.0.1" or "localhost"\n  // TODO: REQUESTED = the "source" value in the query string (new URLSearchParams(search).get("source"))\n  // TODO: "snapshot" when REQUESTED is "snapshot" OR we are not local; otherwise "api"\n  return "api";\n}\n\nconst cases = [\n  ["127.0.0.1", ""],\n  ["localhost", ""],\n  ["127.0.0.1", "?source=snapshot"],\n  ["ananya.github.io", ""],\n  ["ananya.github.io", "?source=api"],\n];\nfor (const [hostname, search] of cases) {\n  console.log(hostname.padEnd(18), (search || "(none)").padEnd(18), "→", chooseSource(hostname, search));\n}', solution: 'function chooseSource(hostname, search) {\n  const IS_LOCAL = ["127.0.0.1", "localhost"].includes(hostname);\n  const REQUESTED = new URLSearchParams(search).get("source");\n  return REQUESTED === "snapshot" || !IS_LOCAL ? "snapshot" : "api";\n}\n\nconst cases = [\n  ["127.0.0.1", ""],\n  ["localhost", ""],\n  ["127.0.0.1", "?source=snapshot"],\n  ["ananya.github.io", ""],\n  ["ananya.github.io", "?source=api"],\n];\nfor (const [hostname, search] of cases) {\n  console.log(hostname.padEnd(18), (search || "(none)").padEnd(18), "→", chooseSource(hostname, search));\n}',
  checks: async ({ con }) => { const rows = con.innerText.split('\n'); const g = (host, q) => { const r = rows.find(x => x.startsWith(host + ' ') && x.includes(q)); return r && r.split('→')[1].trim(); }; return [{ pass: g('127.0.0.1', '(none)') === 'api', label: '127.0.0.1 → api' }, { pass: g('localhost', '(none)') === 'api', label: 'localhost → api' }, { pass: g('127.0.0.1', '?source=snapshot') === 'snapshot', label: '?source=snapshot forces the snapshot' }, { pass: g('ananya.github.io', '(none)') === 'snapshot', label: 'A public host never tries 127.0.0.1' }, { pass: g('ananya.github.io', '?source=api') === 'snapshot', label: '?source=api cannot override a public host' }]; } });

    pg.append(h('div', { class: 'nav2' }, prev ? h('a', { class: 'btn', href: '#' + prev.id }, '← ' + prev.title) : h('span'), h('button', { class: 'btn' + (done[p.id] ? '' : ' primary'), onclick: () => { done[p.id] = true; store.set('done', done); drawSide(p.id); if (next) location.hash = next.id; } }, done[p.id] ? 'Done ✓' + (next ? ' · Next →' : '') : 'Mark done' + (next ? ' and continue →' : ' ✓'))));
