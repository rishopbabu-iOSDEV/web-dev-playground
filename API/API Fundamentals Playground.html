<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>API Playground</title>
<style>/* Layout idea: fixed top bar, left lesson sidebar, one wide reading column with embedded mini-Postman panels. */
:root{
  --bg:#f5f6f4; --panel:#ffffff; --panel2:#eef1ef; --ink:#1d2b2a; --muted:#5d6e6b; --line:#d9dfdc;
  --accent:#1f6f78; --accent-ink:#ffffff; --accent-soft:#dff0f1;
  --ok:#2f7d4f; --ok-soft:#e1f2e8; --warn:#a8641a; --warn-soft:#fbeedb; --bad:#b53a3a; --bad-soft:#f9e2e2; --info:#2f5fa8; --info-soft:#e0e9f8;
  --m-get:#2f7d4f; --m-post:#b7791f; --m-put:#2f5fa8; --m-patch:#7a4fa8; --m-delete:#b53a3a; --m-other:#5d6e6b;
  --code-bg:#f0f3f1; --k-key:#1f5f9a; --k-str:#2f7d4f; --k-num:#b7501f; --k-bool:#7a4fa8; --k-null:#8a8f8d;
  --font:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --radius:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121817; --panel:#1a2221; --panel2:#222c2b; --ink:#e3ebe9; --muted:#9aaba7; --line:#2d3a38;
  --accent:#4fb3bd; --accent-ink:#0b1514; --accent-soft:#1c3638;
  --ok:#5fc08a; --ok-soft:#1b3326; --warn:#e0a257; --warn-soft:#3a2d18; --bad:#e57b7b; --bad-soft:#3b2121; --info:#7aa6e8; --info-soft:#1d2a40;
  --m-get:#5fc08a; --m-post:#e0a257; --m-put:#7aa6e8; --m-patch:#b898e3; --m-delete:#e57b7b; --m-other:#9aaba7;
  --code-bg:#151c1b; --k-key:#7ab4e8; --k-str:#7fcf9f; --k-num:#e8a070; --k-bool:#b898e3; --k-null:#8a9a96; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121817; --panel:#1a2221; --panel2:#222c2b; --ink:#e3ebe9; --muted:#9aaba7; --line:#2d3a38;
  --accent:#4fb3bd; --accent-ink:#0b1514; --accent-soft:#1c3638;
  --ok:#5fc08a; --ok-soft:#1b3326; --warn:#e0a257; --warn-soft:#3a2d18; --bad:#e57b7b; --bad-soft:#3b2121; --info:#7aa6e8; --info-soft:#1d2a40;
  --m-get:#5fc08a; --m-post:#e0a257; --m-put:#7aa6e8; --m-patch:#b898e3; --m-delete:#e57b7b; --m-other:#9aaba7;
  --code-bg:#151c1b; --k-key:#7ab4e8; --k-str:#7fcf9f; --k-num:#e8a070; --k-bool:#b898e3; --k-null:#8a9a96; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
code,pre,.mono{font-family:var(--mono);font-size:.88em}
code{background:var(--code-bg);padding:.1em .35em;border-radius:4px}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;overflow:auto;margin:10px 0;line-height:1.5}
pre code{background:none;padding:0}
/* shell */
#top{height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
#top .brand{font-weight:700;letter-spacing:.2px;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
#top .brand small{color:var(--muted);font-weight:500}
#top .sp{flex:1}
.progress{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.bar{width:120px;height:6px;background:var(--panel2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;font-size:13.5px}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:2px 8px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:none;color:var(--accent)}
.shell{display:flex;height:calc(100% - 52px)}
#side{width:272px;flex:none;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:10px 8px 40px}
#side h4{margin:16px 8px 4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
#side a{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:14px}
#side a:hover{background:var(--panel2)}
#side a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
#side a .n{width:30px;flex:none;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
#side a .d{margin-left:auto;color:var(--ok);font-size:12px}
#main{flex:1;overflow:auto;scroll-behavior:smooth}
.page{max-width:980px;margin:0 auto;padding:26px 24px 80px}
.page h1{font-size:28px;line-height:1.2;margin:4px 0 6px;text-wrap:balance}
.page h2{font-size:20px;margin:30px 0 8px;text-wrap:balance}
.page h3{font-size:16px;margin:20px 0 6px}
.page p,.page li{max-width:74ch}
.tag{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:1px 10px;margin-right:6px}
.lead{font-size:17px;color:var(--muted);max-width:68ch;margin:0 0 6px}
.menu-btn{display:none}
/* callouts */
.note{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--radius) var(--radius) 0;padding:10px 14px;margin:14px 0;max-width:80ch}
.note b.t{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.7px;margin-bottom:2px}
.note.warn{border-color:var(--warn);background:var(--warn-soft)} .note.bad{border-color:var(--bad);background:var(--bad-soft)}
.note.ok{border-color:var(--ok);background:var(--ok-soft)} .note.info{border-color:var(--info);background:var(--info-soft)}
.note p{margin:4px 0}
table.t{border-collapse:collapse;margin:12px 0;font-size:14px;width:100%;max-width:100%}
.tw{overflow-x:auto;margin:12px 0}
table.t th,table.t td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
table.t th{background:var(--panel2);font-weight:600}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin:12px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.card h4{margin:0 0 4px;font-size:15px}
.card p{margin:4px 0;font-size:14px}
.nav2{display:flex;justify-content:space-between;gap:10px;margin-top:40px;border-top:1px solid var(--line);padding-top:16px}
/* method + status chips */
.mth{font:700 12px var(--mono);letter-spacing:.3px}
.m-GET{color:var(--m-get)}.m-POST{color:var(--m-post)}.m-PUT{color:var(--m-put)}.m-PATCH{color:var(--m-patch)}.m-DELETE{color:var(--m-delete)}.m-HEAD,.m-OPTIONS{color:var(--m-other)}
.st{display:inline-block;font:700 13px var(--mono);padding:2px 9px;border-radius:5px}
.st2{background:var(--ok-soft);color:var(--ok)}.st3{background:var(--info-soft);color:var(--info)}.st4{background:var(--warn-soft);color:var(--warn)}.st5{background:var(--bad-soft);color:var(--bad)}.st0{background:var(--bad-soft);color:var(--bad)}
/* workbench */
.wb{border:1px solid var(--line);background:var(--panel);border-radius:10px;margin:14px 0;overflow:hidden}
.wb .cap{padding:8px 12px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.wb .chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:1px 10px;font-size:12.5px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.wb .reqbar{display:flex;gap:6px;padding:10px 12px;flex-wrap:wrap}
.wb select.meth{font:700 13px var(--mono);border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:5px 6px}
.wb input.url{flex:1;min-width:200px;font:13.5px var(--mono);border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--panel)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 10px;overflow-x:auto}
.tabs button{border:0;background:none;padding:7px 12px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-color:var(--accent);font-weight:600}
.tabc{padding:10px 12px}
.kv{display:grid;grid-template-columns:22px 1fr 1.4fr 24px;gap:4px;align-items:center;font-size:13px}
.kv input[type=text]{width:100%;border:1px solid var(--line);border-radius:5px;padding:3px 7px;background:var(--panel);font:13px var(--mono)}
.kv .x{border:0;background:none;color:var(--muted)}
.kv .auto{opacity:.55}
textarea.ed{width:100%;min-height:120px;font:13px/1.5 var(--mono);border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--panel);resize:vertical;tab-size:2;white-space:pre}
.resp{border-top:1px solid var(--line)}
.resp .sum{display:flex;gap:12px;align-items:center;padding:8px 12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.resp .why{padding:0 12px 8px;font-size:13.5px}
.resp .body{padding:10px 12px;max-height:440px;overflow:auto}
.resp .body pre{margin:0;white-space:pre-wrap;word-break:break-word}
.resp iframe{width:100%;height:260px;border:1px solid var(--line);border-radius:6px;background:#fff}
.hdr-table td:first-child{font-family:var(--mono);color:var(--k-key);white-space:nowrap}
.hdr-table td:last-child{font-family:var(--mono);word-break:break-all}
.hdr-table tr.hid td{opacity:.5;text-decoration:line-through}
.k-key{color:var(--k-key)}.k-str{color:var(--k-str)}.k-num{color:var(--k-num)}.k-bool{color:var(--k-bool)}.k-null{color:var(--k-null);font-style:italic}
.empty{color:var(--muted);padding:14px;text-align:center;font-size:14px}
.err{padding:12px 14px;margin:0;background:var(--bad-soft);color:var(--ink);border-radius:6px}
.err b{color:var(--bad)}
.wbfull{display:grid;grid-template-columns:230px 1fr;gap:0}
.wbside{border-right:1px solid var(--line);max-height:640px;overflow:auto;padding:8px;font-size:13px}
.wbside h5{margin:10px 4px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
.wbside button{display:flex;gap:6px;width:100%;text-align:left;border:0;background:none;padding:3px 6px;border-radius:5px;font-size:12.5px}
.wbside button:hover{background:var(--panel2)}
.wbside button span.u{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* env popover */
.pop{position:fixed;top:56px;right:12px;width:340px;max-height:80vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:12px 14px;z-index:30;display:none}
.pop.open{display:block}
.pop label{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--muted);margin:8px 0}
.pop select,.pop input[type=text],.pop input[type=number]{border:1px solid var(--line);border-radius:6px;padding:4px 7px;background:var(--panel)}
.pop .row{display:flex;gap:8px;align-items:center;font-size:13.5px;margin:6px 0}
/* quiz / widgets */
.quiz{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 14px;margin:14px 0}
.quiz .q{font-weight:600;margin-bottom:6px}
.quiz .opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 10px;margin:4px 0}
.quiz .opt:hover{background:var(--panel2)}
.quiz .opt.right{border-color:var(--ok);background:var(--ok-soft)}.quiz .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.quiz .fb{margin-top:6px;font-size:14px}
.wd{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 14px;margin:14px 0}
.wd h4{margin:0 0 8px;font-size:15px}
.wd input[type=text],.wd select,.wd input[type=number]{border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--panel);font-family:var(--mono);font-size:13px}
.urlparts{display:flex;flex-wrap:wrap;font:16px var(--mono);margin:8px 0;gap:0}
.urlparts span{padding:3px 5px;border-bottom:3px solid;border-radius:3px 3px 0 0}
.pc0{border-color:#2f7d4f;background:rgba(47,125,79,.12)}.pc1{border-color:#2f5fa8;background:rgba(47,95,168,.12)}.pc2{border-color:#7a4fa8;background:rgba(122,79,168,.12)}.pc3{border-color:#b7791f;background:rgba(183,121,31,.14)}.pc4{border-color:#b53a3a;background:rgba(181,58,58,.12)}.pc5{border-color:#5d6e6b;background:rgba(93,110,107,.14)}
.flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.flow .box{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 12px;font-size:13.5px;min-width:110px;text-align:center}
.flow .box.hl{border-color:var(--accent);background:var(--accent-soft)}
.flow .ar{color:var(--muted);font-size:20px}
.pill{display:inline-block;border-radius:20px;padding:0 9px;font-size:12px;border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.console{background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:12.5px/1.5 var(--mono);max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.console .l-error{color:var(--bad)}.console .l-warn{color:var(--warn)}.console .l-info{color:var(--info)}
.lab{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:16px 0;overflow:hidden}
.lab .hd{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--panel2);border-bottom:1px solid var(--line);flex-wrap:wrap;font-size:13.5px}
.lab .hd b{margin-right:auto}
.lab .bd{padding:10px 12px;display:grid;gap:10px}
.lab .pv{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;background:var(--bg)}
.lab .pv .status{color:var(--muted);font-size:13.5px;min-height:1.4em}
.lab .pv ul{margin:6px 0;padding-left:18px}
.lab .pv .wcard{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--panel);display:inline-block;min-width:220px}
.chk{margin:4px 0;font-size:14px}
.chk.pass::before{content:"✓ ";color:var(--ok);font-weight:700}.chk.fail::before{content:"✗ ";color:var(--bad);font-weight:700}
.ladder{display:grid;gap:6px;margin:8px 0}
.ladder .rung{border:1px solid var(--line);border-radius:8px;padding:6px 12px;background:var(--panel2);opacity:.55}
.ladder .rung.hit{opacity:1;border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.net{width:100%;border-collapse:collapse;font-size:13px}
.net th,.net td{border-bottom:1px solid var(--line);padding:4px 8px;text-align:left}
.net tr.sel{background:var(--accent-soft)} .net tr{cursor:pointer}
.sr{position:absolute;left:-9999px}
@media (max-width:820px){
  body{overflow:auto}
  #side{position:fixed;z-index:20;left:0;top:52px;bottom:0;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.2)}
  #side.open{transform:none}
  .menu-btn{display:inline-block}
  .wbfull{grid-template-columns:1fr}.wbside{max-height:200px;border-right:0;border-bottom:1px solid var(--line)}
  .progress .bar{width:60px}
  .page{padding:18px 16px 60px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* mobile overflow fixes */
#main,.page{min-width:0}
.tw{overflow-x:auto;max-width:100%}
.page pre,.wd,.lab,.wb{max-width:100%}
.page pre{overflow-x:auto}
@media (max-width:820px){
  .wb{display:block}
  .wb *{max-width:100%}
  .page table.t{min-width:0}
  .page table.t td,.page table.t th{word-break:break-word}
  .urlparts{flex-wrap:wrap}
}
.card .mono{word-break:break-all;white-space:normal}
</style>
</head>
<body>
<header id="top">
  <button class="btn menu-btn" id="menuBtn" aria-label="Open lesson menu">☰</button>
  <div class="brand">API Playground <small>Fundamentals of APIs and Web Data</small></div>
  <div class="sp"></div>
  <div class="progress"><div class="bar"><i id="pbar"></i></div><span id="plab">0% done</span></div>
  <button class="btn" id="ctlBtn">⚙ Practice controls</button>
  <button class="btn" id="themeBtn" aria-label="Toggle light and dark theme">◐</button>
</header>
<div class="shell"><nav id="side" aria-label="Lessons"></nav><main id="main"></main></div>
<div class="pop" id="pop" role="dialog" aria-label="Practice controls"></div>
<script>
const STARTER = {".env.example":"# Copy this file to .env and fill in YOUR values. Never commit .env. Names only here, no secrets.\n\n# --- Module 5: read-only user (views only) ---\nDB_HOST=localhost\nDB_PORT=3306\nDB_USER=portfolio_web\nDB_PASSWORD=\nDB_NAME=future_portfolio_db\n\n# --- Module 7: the writer user (least privilege) ---\nDB_WRITE_USER=portfolio_writer\nDB_WRITE_PASSWORD=\n\n# --- Module 8: the owner's key (python -c \"import secrets; print(secrets.token_urlsafe(32))\") ---\nOWNER_API_KEY=\n# Exact origins allowed to call the API from a browser (no trailing slash, no path, never *)\nCORS_ORIGINS=http://127.0.0.1:5500,https://your-username.github.io\n# Fine-grained token: Public repositories (read-only), 30 days\nGITHUB_TOKEN=\nGITHUB_USER=\n",".gitignore":"# Never commit these two (Module 5, slide 5)\n.venv/\n.env\n\n# Python housekeeping\n__pycache__/\n*.pyc\n","README.md":"# Course 5 starter: Fundamentals of APIs and Web Data\n\nEverything in the **API Fundamentals Playground** has a real, runnable version here. The playground runs Python in your browser against a practice database; this folder is the same code for your own laptop and a real MySQL.\n\n## Setup\n\n```\npython -m venv .venv\n.venv\\Scripts\\activate        # macOS/Linux: source .venv/bin/activate\npip install -r requirements.txt\ncopy .env.example .env        # macOS/Linux: cp .env.example .env   then fill in the values\n```\n\n`.env` is ignored by Git. **Never commit it.**\n\n## Run\n\n| Module | Command / file |\n|---|---|\n| 5 | `python exercise2.py` · `python scripts/query_awards.py` · `python scripts/db_to_json.py` |\n| 6–8 | `cd api` then `fastapi dev main.py` → http://127.0.0.1:8000/docs (earlier stages: `api/stages/`) |\n| 4, 7, 8 | Open `api/requests/*.http` with the REST Client extension (copy `.env.example` to `.env` there) |\n| 9 | Open `resume.html` and `contact.html` with VS Code Live Server (port 5500) |\n\nSQL for the course views, `contact_messages` and the withdraw procedure is in `sql/`; run the files in order in MySQL Workbench.\n\n## Layout\n\n```\nscripts/   Module 5 Python (db.py, query_awards.py, db_to_json.py)\napi/       FastAPI app: main.py (final), db.py, resume.py, models.py, db_errors.py,\n           security.py, errors.py, github.py · stages/ · docs/ · requests/\nsql/       11_api_views · 12_contact_messages · 13_withdraw_appointment\njs/        config.js, api.js, resume.js, contact.js, github.js (Module 9)\ndata/      resume.json (the public snapshot; regenerate with scripts/db_to_json.py)\n```\n\n## Where the course slides defer to files\n\nSome slides say \"see the MD file\". These pieces were written for this starter and may differ from your own copies: `sql/` files, the `.http` files, `ORDER BY` choices for skills and education, the Chai Corner example, and the test definitions (`api/docs/test-matrix.md`). Replace them with the course versions where they differ.\n","api/db.py":"\"\"\"Shared database helpers for the API (copy of scripts/db.py, plus Module 7's write support).\"\"\"\nimport os\n\nimport mysql.connector\nfrom dotenv import load_dotenv\n\nload_dotenv()  # searches upward from this file, so one .env serves the scripts and the API\n\n\ndef connect(write=False):\n    \"\"\"Reads use portfolio_web (views only). Only write endpoints call connect(write=True).\"\"\"\n    prefix = \"DB_WRITE_\" if write else \"DB_\"\n    return mysql.connector.connect(\n        host=os.getenv(\"DB_HOST\", \"localhost\"),\n        port=int(os.getenv(\"DB_PORT\", \"3306\")),\n        user=os.getenv(prefix + \"USER\"),\n        password=os.getenv(prefix + \"PASSWORD\"),\n        database=os.getenv(\"DB_NAME\", \"future_portfolio_db\"),\n    )\n\n\ndef fetch_all(conn, sql, params=()):\n    \"\"\"Run a SELECT and return a list of dictionaries (one per row).\"\"\"\n    with conn.cursor(dictionary=True) as cursor:\n        cursor.execute(sql, params)\n        return cursor.fetchall()\n\n\ndef execute(conn, sql, params=()):\n    \"\"\"Run an INSERT / UPDATE / DELETE. Returns (rows affected, new id).\"\"\"\n    with conn.cursor() as cursor:\n        cursor.execute(sql, params)\n        return cursor.rowcount, cursor.lastrowid\n","api/db_errors.py":"\"\"\"Turn MySQL errors into HTTP errors written for the client (Module 7, slide 16).\n\nNever send MySQL's own text to a client: it names tables and constraints.\n\"\"\"\nfrom fastapi import HTTPException\n\n# MySQL error number -> (HTTP status, message for the client)\nKNOWN = {\n    1062: (409, \"That already exists.\"),                                  # UNIQUE (Course 4 Module 3)\n    1048: (422, \"A required value is missing.\"),                          # NOT NULL\n    1452: (422, \"That refers to something that does not exist.\"),         # FOREIGN KEY (Course 4 Module 2)\n    3819: (422, \"Those values break a rule, for example an end date before the start.\"),  # CHECK\n}\n\n\ndef raise_for_db_error(error):\n    \"\"\"Always raises. Anything not in KNOWN is the server's problem: 500.\"\"\"\n    status, message = KNOWN.get(error.errno, (500, \"The server could not complete that.\"))\n    if status == 500:\n        raise error  # lets the server log the real error; the client sees only a generic 500\n    raise HTTPException(status_code=status, detail=message)\n","api/docs/acceptance.md":"# Acceptance record (Module 6)\n\nSend each request from `module-04.http` while the server log is visible. One row per request.\n\n| # | Request | Expected | Actual | Pass? | If not, why (and which module fixes it) |\n|---|---------|----------|--------|-------|------------------------------------------|\n| A01 | GET /api/awards | 200, 19 items, X-Total-Count 19 | | | |\n| A02 | GET /api/awards?category=Industry | 200, 7 items | | | |\n| A03 | GET /api/awards?category=Personal | 422 | | | body is {\"detail\": …}, not our format → Module 8 |\n| A04 | GET /api/education/1 | 200 | | | |\n| A05 | GET /api/education/99 | 404 | | | |\n| A06 | GET /api/awards?year_from=2020 | 200, 7 items | | | |\n| A07 | GET /api/awards?limit=500 | 422 | | | |\n| A08 | GET /api/awards?page=2&limit=5 | 200, 5 items, total 19 | | | |\n| A09 | GET /api/experience?company=CloudHarbor Software | 4 items | | | |\n| A10 | GET /api/projects?skill=Platform migration | 8 rows | | | |\n| A11 | GET /api/skills?evidenced=false | 2 items | | | |\n| A12 | GET /api/resume | 17 roles, no @ anywhere | | | |\n| A13 | GET /api/summary | 7 / 17 / 16 / 17 / 19 / 40.0 | | | |\n| A14 | DELETE /api/summary | 405 | | | |\n| A15 | GET /api/messages | 401 | | | route does not exist yet → Modules 7 and 8 |\n\n## Spec gaps (what /docs does not show yet)\n\n- /docs lists only 200 and 422. The spec also promises 404, 405 and the error format.\n- Responses are plain dictionaries. Pydantic models (Module 7) will describe them.\n- (Add your own.)\n\n> The A-numbers and expected values above come from the playground's own test list. If your `module-04.http` differs, your file wins.\n","api/docs/design-decisions.md":"# Design decisions\n\nWrite one short paragraph per decision: what you chose, what you rejected, why.\n\n- **Snapshot vs live:** why the public page uses `data/resume.json` and the local page uses the API.\n- **Why the key is on the server:** the GitHub token and owner key never reach a page.\n- **One error format:** why `code` is for programs and `message` is for people.\n- **Failures from the test matrix:** anything you found and how you fixed it.\n","api/docs/publishing.md":"# Publishing the snapshot\n\nThe public site is only as fresh as the last snapshot you committed.\n\n1. Start MySQL. In the project folder: `python scripts/db_to_json.py` (rewrites `data/resume.json` and its `generated_at` date).\n2. Open `resume.html?source=snapshot` with Live Server. The badge must show today's date.\n3. `git status`: only `data/resume.json` (and code you meant to change) should be modified. **No `.env`.**\n4. `git add data/resume.json` → `git commit -m \"Refresh resume snapshot\"` → `git push`.\n5. GitHub Pages serves it a minute later. Open the public URL; the badge must show the new date and the contact form must be disabled.\n6. Re-run the history search from Module 8: `git log -p --all | grep -n -i -E \"(password|_key|token)[ ]*=[ ]*[^ ]\"`.\n","api/docs/security-review.md":"# Security review (Module 8 lab)\n\n| Threat | Our defence | Tested by |\n|---|---|---|\n| SQL injection | Values as `%s`; structure from fixed lists | Module 5 attack |\n| Private data | `v_api_*` views; no email; messages private | A12; search responses for `@` |\n| Too much database power | `portfolio_web` (read) / `portfolio_writer` (write) grants | `SHOW GRANTS` |\n| Strangers on owner endpoints | `require_owner` on five endpoints | S01–S04, A15 |\n| Bad input | Type hints, `Query`, Pydantic, constraints | A03, A07, W02–W04 |\n| Errors revealing internals | One error format; one-sentence 500 | Stop MySQL, send A01 |\n| Other sites' pages | CORS: two exact origins | S10, S11 |\n| Keys in the browser or in Git | Proxy; `.env` ignored; history searched | S12; the audit command |\n\n## Known gaps (accepted for now)\n\n1. No rate limit on the contact form.\n2. One shared owner key (no accounts).\n3. Plain HTTP on localhost.\n4. *Your own gap here:*\n","api/docs/test-matrix.md":"# Module 9 test matrix\n\nDo each row, look at the page, the Network tab and the API terminal, then record **Pass** or **Fail** and a screenshot name.\nTick **Disable cache** in DevTools first. Test from `127.0.0.1` (not `localhost`: a different origin).\n\n| # | Situation | Expected | Result | Screenshot / note |\n|---|---|---|---|---|\n| T01 | Live Server, API running | Badge \"Live from the Future Portfolio API\"; awards page 1 of 4 | | |\n| T02 | Live Server, **API stopped** | Badge \"Published snapshot, updated …\"; page still complete | | |\n| T03 | `?source=snapshot`, API running | Snapshot badge; no request to port 8000 | | |\n| T04 | Public host (GitHub Pages) | Snapshot; nothing tries 127.0.0.1 | | |\n| T05 | Awards: Next to page 2, then 4 | Pager correct; Next disabled on last page; same in snapshot mode | | |\n| T06 | `?category=Company` | Only company awards; total changes; same from both sources | | |\n| T07 | `?category=Personal` (live) | A sentence about categories, not a crash | | |\n| T08 | Contact: good message (live) | \"Thank you … reference #n\"; form cleared; row visible with the owner key | | |\n| T09 | Contact: `ravi-at-example` | Email field highlighted and focused; typed message kept | | |\n| T10 | Contact: double-click Send | One message only | | |\n| T11 | Contact with the API stopped | \"We can't reach the service right now.\"; input kept; button back | | |\n| T12 | A project name containing `\u003cimg onerror=…>` | Shows as text; nothing runs | | |\n| T13 | GitHub card: proxy, then stop API, then offline | Proxy first; GitHub direct second; page cache or status line last | | |\n| T14 | Contact form on the public site | Form disabled with an explanation; no failed request | | |\n\nNote: this is a working version written for the playground. Replace any row that differs from your course's own `test-matrix.md`.\n","api/errors.py":"\"\"\"One error format for every kind of error (Module 8).\n\n    {\"error\": {\"status\": 422, \"code\": \"invalid_input\", \"message\": \"...\", \"fields\": {...}}}\n\ncode is for programs (stable words), message is for people, fields only for validation.\n\"\"\"\nimport logging\n\nfrom fastapi import FastAPI\nfrom fastapi.exceptions import RequestValidationError\nfrom fastapi.responses import JSONResponse\nfrom starlette.exceptions import HTTPException as StarletteHTTPException\n\nlogger = logging.getLogger(\"api\")\n\nCODES = {\n    401: \"unauthorized\",\n    403: \"forbidden\",\n    404: \"not_found\",\n    405: \"method_not_allowed\",\n    409: \"conflict\",\n    422: \"invalid_input\",\n    500: \"server_error\",\n    502: \"upstream_error\",\n}\n\n# FastAPI's own routing errors carry these generic words; swap them for friendlier sentences.\nDEFAULT_MESSAGES = {\n    404: \"Nothing here: check the URL.\",\n    405: \"This URL doesn't support that method.\",\n}\n\n\ndef error_response(status, message, fields=None, headers=None):\n    error = {\"status\": status, \"code\": CODES.get(status, \"error\"), \"message\": message}\n    if fields:\n        error[\"fields\"] = fields\n    return JSONResponse({\"error\": error}, status_code=status, headers=headers)\n\n\ndef http_error(request, exc):\n    \"\"\"Ours (404, 409, 401, 403...) and FastAPI's (unknown path, wrong method).\"\"\"\n    if exc.detail in (\"Not Found\", \"Method Not Allowed\"):\n        message = DEFAULT_MESSAGES[exc.status_code]\n    else:\n        message = str(exc.detail)\n    return error_response(exc.status_code, message, headers=exc.headers)  # a 405 keeps its Allow header\n\n\ndef validation_error(request, exc):\n    \"\"\"Pydantic's list of problems becomes one field -> message object.\"\"\"\n    fields = {}\n    for problem in exc.errors():\n        # loc is a path: [\"query\", \"category\"] -> category, [\"body\", \"email\"] -> email\n        name = \".\".join(str(part) for part in problem[\"loc\"][1:]) or str(problem[\"loc\"][0])\n        fields[name] = problem[\"msg\"]\n    return error_response(422, \"Some fields are not valid.\", fields)\n\n\ndef unexpected_error(request, exc):\n    \"\"\"The last line of defence: one calm sentence for the client, the full traceback for the developer.\"\"\"\n    logger.exception(\"Unexpected error on %s %s\", request.method, request.url.path)\n    return error_response(500, \"Something went wrong on our side. Please try again later.\")\n\n\ndef add_error_handlers(app: FastAPI):\n    app.add_exception_handler(StarletteHTTPException, http_error)\n    app.add_exception_handler(RequestValidationError, validation_error)\n    app.add_exception_handler(Exception, unexpected_error)\n","api/github.py":"\"\"\"GET /api/github: a proxy that keeps the GitHub token on the server (Module 8).\n\nThe slide compresses some lines with semicolons and ellipses; this is the full version. The token appears in\nexactly ONE place: a request header sent to GitHub. It is never in a response body.\n\"\"\"\nimport logging\nimport os\nimport time\n\nimport httpx\nfrom fastapi import APIRouter, HTTPException, Response\n\nlogger = logging.getLogger(\"api\")\nrouter = APIRouter()\n\nCACHE = {\"data\": None, \"fetched_at\": 0.0}  # shared by every visitor; empties when the server restarts\nMAX_AGE = 10 * 60\n\n\ndef github_get(path, params=None):\n    response = httpx.get(\n        f\"https://api.github.com{path}\",\n        params=params,\n        headers={\n            \"Authorization\": f\"Bearer {os.getenv('GITHUB_TOKEN')}\",\n            \"Accept\": \"application/vnd.github+json\",\n        },\n        timeout=5.0,\n    )\n    response.raise_for_status()\n    return response.json()\n\n\n@router.get(\"/api/github\", tags=[\"GitHub\"])\ndef github_summary(response: Response):\n    \"\"\"A trimmed GitHub summary (six repos), cached for 10 minutes.\"\"\"\n    if CACHE[\"data\"] and time.time() - CACHE[\"fetched_at\"] \u003c MAX_AGE:\n        response.headers[\"X-Cache\"] = \"HIT\"\n        return CACHE[\"data\"]\n    user = os.getenv(\"GITHUB_USER\")\n    try:\n        profile = github_get(f\"/users/{user}\")\n        repos = github_get(f\"/users/{user}/repos\", {\"sort\": \"pushed\", \"per_page\": 6})\n    except httpx.HTTPError as error:\n        logger.warning(\"GitHub request failed: %s\", error)\n        if CACHE[\"data\"]:  # stale cache beats an error page\n            response.headers[\"X-Cache\"] = \"STALE\"\n            return CACHE[\"data\"]\n        raise HTTPException(\n            status_code=502,\n            detail=\"GitHub can't be reached right now. Please try again later.\",\n        )\n    data = {  # 30+ fields come in; only these go out. Nothing is published that you did not choose.\n        \"login\": profile[\"login\"],\n        \"name\": profile[\"name\"],\n        \"public_repos\": profile[\"public_repos\"],\n        \"url\": profile[\"html_url\"],\n        \"repos\": [\n            {\"name\": r[\"name\"], \"html_url\": r[\"html_url\"], \"pushed_at\": r[\"pushed_at\"]}\n            for r in repos[:6]\n        ],\n    }\n    CACHE.update(data=data, fetched_at=time.time())\n    response.headers[\"X-Cache\"] = \"MISS\"\n    return data\n","api/main.py":"\"\"\"Module 8: the API can be trusted. Run from the api/ folder:  fastapi dev main.py\"\"\"\nimport json\nimport os\nfrom typing import Literal\n\nimport mysql.connector\nfrom fastapi import Depends, FastAPI, HTTPException, Query, Response\nfrom fastapi.middleware.cors import CORSMiddleware\n\nfrom db import connect, execute, fetch_all\nfrom db_errors import raise_for_db_error\nfrom errors import add_error_handlers\nfrom github import router as github_router\nfrom models import AppointmentIn, MessageIn, MessageOut, MessagePatch, ProjectPatch\nfrom resume import build_resume\nfrom security import require_owner\n\napp = FastAPI(title=\"Future Portfolio API\", version=\"2.0\")\nadd_error_handlers(app)  # one error format, for every kind of error\napp.include_router(github_router)\n\n# ---------- CORS: exactly the origins listed in .env, never \"*\" ----------\nALLOWED_ORIGINS = [\n    origin.strip()\n    for origin in os.getenv(\"CORS_ORIGINS\", \"http://127.0.0.1:5500\").split(\",\")\n]\napp.add_middleware(\n    CORSMiddleware,\n    allow_origins=ALLOWED_ORIGINS,\n    allow_methods=[\"GET\", \"POST\", \"PATCH\", \"DELETE\"],\n    allow_headers=[\"Content-Type\", \"X-API-Key\"],\n    expose_headers=[\"X-Total-Count\", \"Location\"],  # without this, headers.get(\"X-Total-Count\") is null\n)\n\n\n# ---------- Cache-Control: the spec's caching rule ----------\n@app.middleware(\"http\")\nasync def cache_headers(request, call_next):\n    response = await call_next(request)\n    if request.method == \"GET\" and response.status_code == 200:\n        if request.url.path.startswith(\"/api/messages\"):\n            response.headers[\"Cache-Control\"] = \"no-store\"\n        elif request.url.path.startswith(\"/api/\"):\n            response.headers[\"Cache-Control\"] = \"public, max-age=300\"\n    return response\n\n\n# One check, five endpoints (the contact form POST stays public by design)\nOWNER = [Depends(require_owner)]\n\nCategory = Literal[\"Company\", \"Industry\", \"Community\"]\n\n\n# ---------- practice endpoints (delete /api/echo before you commit) ----------\n@app.get(\"/api/hello\", tags=[\"Practice\"])\ndef hello():\n    return {\"message\": \"Hello from the Future Portfolio API\"}\n\n\n@app.get(\"/api/echo/{item_id}\", tags=[\"Practice\"])\ndef echo(item_id: int, q: str | None = None, limit: int = 10):\n    return {\"item_id\": item_id, \"q\": q, \"limit\": limit}\n\n\n# ---------- the one helper every list uses (slide 12) ----------\ndef list_from_view(response, view, where, params, order, page, limit, write=False):\n    where_sql = f\" WHERE {' AND '.join(where)}\" if where else \"\"\n    with connect(write=write) as conn:  # write=True only for the owner-only message view\n        total = fetch_all(\n            conn,\n            f\"SELECT COUNT(*) AS total FROM {view}{where_sql}\",\n            params,\n        )[0][\"total\"]\n        rows = fetch_all(\n            conn,\n            f\"SELECT * FROM {view}{where_sql} \"\n            f\"ORDER BY {order} LIMIT %s OFFSET %s\",\n            [*params, limit, (page - 1) * limit],\n        )\n    response.headers[\"X-Total-Count\"] = str(total)\n    return rows\n\n\n# ---------- awards ----------\n@app.get(\"/api/awards\", tags=[\"Awards\"])\ndef list_awards(\n    response: Response,\n    category: Category | None = None,\n    year_from: int | None = Query(None, ge=1980, le=2100),\n    year_to: int | None = Query(None, ge=1980, le=2100),\n    sort: Literal[\"year\", \"-year\"] = \"-year\",\n    page: int = Query(1, ge=1),\n    limit: int = Query(50, ge=1, le=50),\n):\n    \"\"\"Awards, filtered, sorted and paged.\"\"\"\n    where, params = [], []\n    if category is not None:\n        where.append(\"category = %s\")\n        params.append(category)\n    if year_from is not None:\n        where.append(\"year >= %s\")\n        params.append(year_from)\n    if year_to is not None:\n        where.append(\"year \u003c= %s\")\n        params.append(year_to)\n    order = {\"year\": \"year, id\", \"-year\": \"year DESC, id\"}[sort]\n    return list_from_view(response, \"v_api_awards\", where, params, order, page, limit)\n\n\n@app.get(\"/api/awards/{award_id}\", tags=[\"Awards\"])\ndef get_award(award_id: int):\n    \"\"\"One award by its id.\"\"\"\n    with connect() as conn:\n        rows = fetch_all(conn, \"SELECT * FROM v_api_awards WHERE id = %s\", (award_id,))\n    if not rows:\n        raise HTTPException(status_code=404, detail=f\"No award with id {award_id}.\")\n    return rows[0]\n\n\n# ---------- education ----------\n@app.get(\"/api/education\", tags=[\"Education\"])\ndef list_education(\n    response: Response,\n    page: int = Query(1, ge=1),\n    limit: int = Query(50, ge=1, le=50),\n):\n    \"\"\"All education entries, newest first.\"\"\"\n    return list_from_view(response, \"v_api_education\", [], [], \"start_year DESC, id\", page, limit)\n\n\n@app.get(\"/api/education/{education_id}\", tags=[\"Education\"])\ndef get_education(education_id: int):\n    \"\"\"One education entry.\"\"\"\n    with connect() as conn:\n        rows = fetch_all(conn, \"SELECT * FROM v_api_education WHERE id = %s\", (education_id,))\n    if not rows:\n        raise HTTPException(status_code=404, detail=f\"No education entry with id {education_id}.\")\n    return rows[0]\n\n\n# ---------- single objects ----------\n@app.get(\"/api/profile\", tags=[\"Resume\"])\ndef get_profile():\n    \"\"\"The public profile (no email).\"\"\"\n    with connect() as conn:\n        return fetch_all(conn, \"SELECT * FROM v_api_profile\")[0]\n\n\n@app.get(\"/api/summary\", tags=[\"Resume\"])\ndef get_summary():\n    \"\"\"Headline numbers.\"\"\"\n    with connect() as conn:\n        return fetch_all(conn, \"SELECT * FROM v_api_summary\")[0]\n\n\n@app.get(\"/api/resume\", tags=[\"Resume\"])\ndef get_resume():\n    \"\"\"The whole resume.json document, built from the views on every request.\"\"\"\n    with connect() as conn:\n        return build_resume(conn)\n\n\n# ---------- experience, projects, skills ----------\n@app.get(\"/api/experience\", tags=[\"Experience\"])\ndef list_experience(\n    response: Response,\n    company: str | None = None,\n    page: int = Query(1, ge=1),\n    limit: int = Query(50, ge=1, le=50),\n):\n    \"\"\"Roles, newest first. ?company=CloudHarbor Software gives 4.\"\"\"\n    where, params = [], []\n    if company is not None:\n        where.append(\"company = %s\")\n        params.append(company)\n    return list_from_view(response, \"v_api_experience\", where, params, \"start_date DESC, id\", page, limit)\n\n\n@app.get(\"/api/projects\", tags=[\"Projects\"])\ndef list_projects(\n    response: Response,\n    skill: str | None = None,\n    company: str | None = None,\n    page: int = Query(1, ge=1),\n    limit: int = Query(50, ge=1, le=50),\n):\n    \"\"\"Projects. ?skill=Platform migration gives 8 rows.\"\"\"\n    where, params = [], []\n    if skill is not None:\n        where.append(\"JSON_CONTAINS(skills, JSON_QUOTE(%s))\")\n        params.append(skill)\n    if company is not None:\n        where.append(\"company = %s\")\n        params.append(company)\n    rows = list_from_view(response, \"v_api_projects\", where, params, \"project_id, role\", page, limit)\n    for row in rows:\n        row[\"skills\"] = json.loads(row[\"skills\"])  # without this, skills is a string: a contract break\n    return rows\n\n\n@app.get(\"/api/skills\", tags=[\"Skills\"])\ndef list_skills(\n    response: Response,\n    evidenced: bool | None = None,\n    category: str | None = None,\n    page: int = Query(1, ge=1),\n    limit: int = Query(50, ge=1, le=50),\n):\n    \"\"\"Skills. evidenced=true means used in at least one project; false gives 2 (skills 2 and 17).\"\"\"\n    where, params = [], []\n    if evidenced is not None:\n        where.append(\"project_count > 0\" if evidenced else \"project_count = 0\")\n    if category is not None:\n        where.append(\"category = %s\")\n        params.append(category)\n    return list_from_view(response, \"v_api_skills\", where, params, \"category, skill\", page, limit)\n\n\n# =====================================================================\n# Module 7: writing data\n# =====================================================================\n\n# ---------- messages: POST is public, the rest become owner-only in Module 8 ----------\n@app.post(\"/api/messages\", status_code=201, tags=[\"Messages\"])\ndef create_message(body: MessageIn, response: Response):\n    \"\"\"Send a message from the contact form.\"\"\"\n    with connect(write=True) as conn:\n        _, new_id = execute(\n            conn,\n            \"INSERT INTO contact_messages (name, email, message) VALUES (%s, %s, %s)\",\n            (body.name, body.email, body.message),\n        )\n        conn.commit()  # autocommit is OFF in the Python connector: no commit, no row\n        sent_at = fetch_all(\n            conn, \"SELECT sent_at FROM v_owner_messages WHERE id = %s\", (new_id,)\n        )[0][\"sent_at\"]\n    response.headers[\"Location\"] = f\"/api/messages/{new_id}\"\n    return {\"id\": new_id, \"sent_at\": sent_at}  # never echo the visitor's email back\n\n\n@app.get(\"/api/messages\", response_model=list[MessageOut], tags=[\"Messages\"], dependencies=OWNER)\ndef list_messages(\n    response: Response,\n    page: int = Query(1, ge=1),\n    limit: int = Query(50, ge=1, le=50),\n):\n    \"\"\"Owner only: newest first.\"\"\"\n    return list_from_view(response, \"v_owner_messages\", [], [], \"sent_at DESC, id DESC\", page, limit, write=True)\n\n\n@app.patch(\"/api/messages/{message_id}\", response_model=MessageOut, tags=[\"Messages\"], dependencies=OWNER)\ndef mark_message(message_id: int, body: MessagePatch):\n    \"\"\"Mark a message read or unread.\"\"\"\n    with connect(write=True) as conn:\n        execute(\n            conn,\n            \"UPDATE contact_messages SET is_read = %s WHERE message_id = %s\",\n            (body.is_read, message_id),\n        )\n        conn.commit()\n        # Look it up instead of trusting rowcount: UPDATE counts rows CHANGED, not rows FOUND.\n        rows = fetch_all(conn, \"SELECT * FROM v_owner_messages WHERE id = %s\", (message_id,))\n    if not rows:\n        raise HTTPException(status_code=404, detail=f\"No message with id {message_id}.\")\n    return rows[0]\n\n\n@app.delete(\"/api/messages/{message_id}\", status_code=204, tags=[\"Messages\"], dependencies=OWNER)\ndef delete_message(message_id: int):\n    \"\"\"Delete a message.\"\"\"\n    with connect(write=True) as conn:\n        deleted, _ = execute(conn, \"DELETE FROM contact_messages WHERE message_id = %s\", (message_id,))\n        conn.commit()\n    if deleted == 0:\n        raise HTTPException(status_code=404, detail=f\"No message with id {message_id}.\")\n    return Response(status_code=204)\n\n\n# ---------- PATCH a project: only the fields that were sent ----------\n@app.patch(\"/api/projects/{project_id}\", tags=[\"Projects\"], dependencies=OWNER)\ndef update_project(project_id: int, body: ProjectPatch):\n    \"\"\"Change a project's name and/or description.\"\"\"\n    changes = body.model_dump(exclude_unset=True)\n    if not changes:\n        raise HTTPException(status_code=422, detail=\"Send at least one field to change.\")\n    # Column names come only from the model's own two fields (extra=\"forbid\"): structure from code.\n    set_sql = \", \".join(f\"{column} = %s\" for column in changes)\n    with connect(write=True) as conn:\n        if not fetch_all(conn, \"SELECT project_id FROM projects WHERE project_id = %s\", (project_id,)):\n            raise HTTPException(status_code=404, detail=f\"No project with id {project_id}.\")\n        try:\n            execute(conn, f\"UPDATE projects SET {set_sql} WHERE project_id = %s\", [*changes.values(), project_id])\n            conn.commit()\n        except mysql.connector.Error as error:\n            conn.rollback()\n            raise_for_db_error(error)\n        return fetch_all(\n            conn,\n            \"SELECT project_id, project_name, description FROM projects WHERE project_id = %s\",\n            (project_id,),\n        )[0]\n\n\n# ---------- one request, one transaction ----------\n@app.post(\"/api/appointments\", status_code=201, tags=[\"Appointments\"], dependencies=OWNER)\ndef create_appointment(body: AppointmentIn):\n    \"\"\"A board appointment: company, period, role, project and skills, all or nothing.\"\"\"\n    with connect(write=True) as conn:\n        try:\n            conn.start_transaction()\n            _, company_id = execute(conn, \"INSERT INTO companies (company_name) VALUES (%s)\", (body.company_name,))\n            _, employment_id = execute(\n                conn,\n                \"INSERT INTO employment (company_id, start_date, end_date) VALUES (%s, %s, %s)\",\n                (company_id, body.start_date, body.end_date),\n            )\n            _, role_id = execute(\n                conn,\n                \"INSERT INTO roles (employment_id, role_title, role_start, role_end) VALUES (%s, %s, %s, %s)\",\n                (employment_id, body.role_title, body.start_date, body.end_date),\n            )\n            _, project_id = execute(conn, \"INSERT INTO projects (project_name) VALUES (%s)\", (body.project_name,))\n            execute(conn, \"INSERT INTO role_projects (role_id, project_id) VALUES (%s, %s)\", (role_id, project_id))\n            for skill_id in body.skill_ids:\n                execute(conn, \"INSERT INTO project_skills (project_id, skill_id) VALUES (%s, %s)\", (project_id, skill_id))\n            if body.headline is not None:\n                execute(conn, \"UPDATE people SET headline = %s WHERE person_id = 1\", (body.headline,))\n            conn.commit()  # once, at the end\n        except mysql.connector.Error as error:\n            conn.rollback()  # every time: MySQL does not undo the earlier statements by itself\n            raise_for_db_error(error)\n    return {\n        \"company_id\": company_id,\n        \"employment_id\": employment_id,\n        \"role_id\": role_id,\n        \"project_id\": project_id,\n    }\n","api/models.py":"\"\"\"Request and response bodies as Pydantic models (Module 7).\"\"\"\nfrom datetime import date, datetime\n\nfrom pydantic import BaseModel, ConfigDict, EmailStr, Field\n\n\nclass MessageIn(BaseModel):\n    \"\"\"What the contact form sends.\"\"\"\n\n    model_config = ConfigDict(str_strip_whitespace=True)\n\n    name: str = Field(min_length=1, max_length=100)\n    email: EmailStr\n    message: str = Field(min_length=1, max_length=2000)\n\n\nclass MessageOut(BaseModel):\n    \"\"\"What the owner reads back.\"\"\"\n\n    id: int\n    name: str\n    email: str\n    message: str\n    sent_at: datetime\n    is_read: bool\n\n\nclass MessagePatch(BaseModel):\n    \"\"\"The only thing the owner changes on a message.\"\"\"\n\n    is_read: bool\n\n\nclass ProjectPatch(BaseModel):\n    \"\"\"Only the fields that were sent. A typo like \"projectName\" is a loud 422.\"\"\"\n\n    model_config = ConfigDict(str_strip_whitespace=True, extra=\"forbid\")\n\n    project_name: str | None = Field(None, min_length=1, max_length=150)\n    description: str | None = Field(None, max_length=2000)\n\n\nclass AppointmentIn(BaseModel):\n    \"\"\"One request that adds a company, a period, a role, a project and its skills.\"\"\"\n\n    model_config = ConfigDict(str_strip_whitespace=True)\n\n    company_name: str = Field(min_length=1, max_length=150)\n    role_title: str = Field(min_length=1, max_length=150)\n    start_date: date\n    end_date: date | None = None\n    project_name: str = Field(min_length=1, max_length=150)\n    skill_ids: list[int] = []\n    headline: str | None = Field(None, max_length=300)\n","api/requests/.env.example":"# Copy to api/requests/.env (ignored by Git). The SAME value as OWNER_API_KEY in api/.env, one line, no spaces.\nOWNER_API_KEY=\n","api/requests/module-04.http":"# module-04.http: acceptance requests A01-A15 (VS Code \"REST Client\" extension).\n# Click \"Send Request\" above any ### line. Start the API first:  cd api && fastapi dev main.py\n# NOTE: reconstructed by the playground author from the course's acceptance list. If your own\n# module-04.http from Module 4 differs, yours wins.\n@base = http://127.0.0.1:8000\n\n### A01 All awards -> 200, 19 items, X-Total-Count 19\nGET {{base}}/api/awards\n\n### A02 Industry awards -> 200, 7 items\nGET {{base}}/api/awards?category=Industry\n\n### A03 Bad category -> 422\nGET {{base}}/api/awards?category=Personal\n\n### A04 One education entry -> 200 (the B.E.)\nGET {{base}}/api/education/1\n\n### A05 Missing education entry -> 404\nGET {{base}}/api/education/99\n\n### A06 From 2020 -> 200, 7 items\nGET {{base}}/api/awards?year_from=2020\n\n### A07 limit too big -> 422\nGET {{base}}/api/awards?limit=500\n\n### A08 Page 2, limit 5 -> 5 items, X-Total-Count 19\nGET {{base}}/api/awards?page=2&limit=5\n\n### A09 Experience at one company -> 4\nGET {{base}}/api/experience?company=CloudHarbor%20Software\n\n### A10 Projects by skill -> 8 rows, skills is an ARRAY\nGET {{base}}/api/projects?skill=Platform%20migration\n\n### A11 Skills with no evidence -> 2\nGET {{base}}/api/skills?evidenced=false\n\n### A12 The whole resume -> 17 roles, no \"@\" anywhere\nGET {{base}}/api/resume\n\n### A13 Summary -> 7 / 17 / 16 / 17 / 19 / 40.0\nGET {{base}}/api/summary\n\n### A14 Wrong method -> 405 with an Allow header\nDELETE {{base}}/api/summary\n\n### A15 Messages with no key -> 401 (Module 8; today 404, then 200 after Module 7: still a FAIL)\nGET {{base}}/api/messages\n","api/requests/module-07.http":"# module-07.http: write requests W01-W16 (VS Code \"REST Client\" extension).\n# Use @example.com addresses only. Messages are personal data, even in a lab.\n# NOTE: reconstructed by the playground author from the course's write-test list; yours wins if it differs.\n@base = http://127.0.0.1:8000\n# From Module 8 the owner requests also need:  X-API-Key: {{key}}\n@key = your-owner-key-from-.env\n\n### W01 A valid message -> 201, Location header, {id, sent_at}\nPOST {{base}}/api/messages\nContent-Type: application/json\n\n{ \"name\": \"Ravi Kumar\", \"email\": \"ravi@example.com\", \"message\": \"Hello from the lab\" }\n\n### W02 No email key -> 422\nPOST {{base}}/api/messages\nContent-Type: application/json\n\n{ \"name\": \"Ravi Kumar\", \"message\": \"Hello\" }\n\n### W03 \"ravi-at-example\" -> 422\nPOST {{base}}/api/messages\nContent-Type: application/json\n\n{ \"name\": \"Ravi Kumar\", \"email\": \"ravi-at-example\", \"message\": \"Hello\" }\n\n### W04 message of three spaces -> 422 (str_strip_whitespace turns it into \"\")\nPOST {{base}}/api/messages\nContent-Type: application/json\n\n{ \"name\": \"Ravi Kumar\", \"email\": \"ravi@example.com\", \"message\": \"   \" }\n\n### W05 Read messages (newest first, is_read is false not 0)\nGET {{base}}/api/messages\nX-API-Key: {{key}}\n\n### W06 Mark message 1 read (send it twice: 200 both times)\nPATCH {{base}}/api/messages/1\nContent-Type: application/json\nX-API-Key: {{key}}\n\n{ \"is_read\": true }\n\n### W07 Mark a message that is not there -> 404\nPATCH {{base}}/api/messages/99999\nContent-Type: application/json\nX-API-Key: {{key}}\n\n{ \"is_read\": true }\n\n### W08 Delete message 1 -> 204, no body\nDELETE {{base}}/api/messages/1\nX-API-Key: {{key}}\n\n### W09 Delete it again -> 404\nDELETE {{base}}/api/messages/1\nX-API-Key: {{key}}\n\n### W10 Change only a description -> 200 (restore it afterwards)\nPATCH {{base}}/api/projects/14\nContent-Type: application/json\nX-API-Key: {{key}}\n\n{ \"description\": \"Rolled out to the whole company.\" }\n\n### W11 Give project 1 project 2's name -> 409\nPATCH {{base}}/api/projects/1\nContent-Type: application/json\nX-API-Key: {{key}}\n\n{ \"project_name\": \"Branch Banking Portal\" }\n\n### W12a An empty PATCH -> 422\nPATCH {{base}}/api/projects/1\nContent-Type: application/json\nX-API-Key: {{key}}\n\n{}\n\n### W12b A field that does not exist -> 422 (extra=\"forbid\")\nPATCH {{base}}/api/projects/1\nContent-Type: application/json\nX-API-Key: {{key}}\n\n{ \"budget\": 5 }\n\n### W13 Appointment, end BEFORE start -> 422 and NOTHING is left behind\nPOST {{base}}/api/appointments\nContent-Type: application/json\nX-API-Key: {{key}}\n\n{\n  \"company_name\": \"Kestrel Ridge Analytics\",\n  \"role_title\": \"Non-Executive Director\",\n  \"start_date\": \"2026-06-01\",\n  \"end_date\": \"2026-05-31\",\n  \"project_name\": \"Acquisition technology due diligence\",\n  \"skill_ids\": [17],\n  \"headline\": \"Former Chief Technology Officer | Non-Executive Director, Kestrel Ridge Analytics\"\n}\n\n### W14 The board appointment -> 201 with FOUR ids; then GET /api/summary -> 8 / 18 / 17 / 17 / 19 / 43.0\nPOST {{base}}/api/appointments\nContent-Type: application/json\nX-API-Key: {{key}}\n\n{\n  \"company_name\": \"Kestrel Ridge Analytics\",\n  \"role_title\": \"Non-Executive Director\",\n  \"start_date\": \"2026-06-01\",\n  \"end_date\": \"2029-05-31\",\n  \"project_name\": \"Acquisition technology due diligence\",\n  \"skill_ids\": [17],\n  \"headline\": \"Former Chief Technology Officer | Non-Executive Director, Kestrel Ridge Analytics\"\n}\n\n### W15 Send W14 again -> 409, summary unchanged\nPOST {{base}}/api/appointments\nContent-Type: application/json\nX-API-Key: {{key}}\n\n{\n  \"company_name\": \"Kestrel Ridge Analytics\",\n  \"role_title\": \"Non-Executive Director\",\n  \"start_date\": \"2026-06-01\",\n  \"end_date\": \"2029-05-31\",\n  \"project_name\": \"Acquisition technology due diligence\",\n  \"skill_ids\": [17],\n  \"headline\": \"Former Chief Technology Officer | Non-Executive Director, Kestrel Ridge Analytics\"\n}\n\n### W16 (stretch) A skill that does not exist -> predict 1452 -> 422, nothing left behind\nPOST {{base}}/api/appointments\nContent-Type: application/json\nX-API-Key: {{key}}\n\n{\n  \"company_name\": \"Zed Labs\",\n  \"role_title\": \"Advisor\",\n  \"start_date\": \"2026-06-01\",\n  \"end_date\": \"2027-05-31\",\n  \"project_name\": \"Zed advisory\",\n  \"skill_ids\": [99]\n}\n\n### Extra: PUT is not in our spec -> 405 with an Allow header\nPUT {{base}}/api/messages/1\nContent-Type: application/json\nX-API-Key: {{key}}\n\n{ \"is_read\": true }\n","api/requests/module-08.http":"# module-08.http: security requests S01-S13 (VS Code \"REST Client\" extension).\n# The key is read from api/requests/.env (ignored by Git):  OWNER_API_KEY=the-same-value-as-api/.env\n# NOTE: reconstructed by the playground author from the course's S-list; yours wins if it differs.\n@base = http://localhost:8000\n@key = {{$dotenv OWNER_API_KEY}}\n\n### S01 No key -> 401, code unauthorized\nGET {{base}}/api/messages\n\n### S02 Wrong key -> 403, code forbidden\nGET {{base}}/api/messages\nX-API-Key: wrong\n\n### S03 The right key -> 200, Cache-Control: no-store\nGET {{base}}/api/messages\nX-API-Key: {{key}}\n\n### S04 PATCH a project, no key, invalid body -> 401 (the key is checked BEFORE the body)\nPATCH {{base}}/api/projects/14\nContent-Type: application/json\n\n{ \"budget\": 5 }\n\n### S05 POST a message, no key -> 201 (the public contact form must still work)\nPOST {{base}}/api/messages\nContent-Type: application/json\n\n{ \"name\": \"Lab\", \"email\": \"lab@example.com\", \"message\": \"Public form still works\" }\n\n### S06 One error format for validation -> 422, error.fields.category\nGET {{base}}/api/awards?category=Personal\n\n### S07 Unknown path -> 404 in OUR format\nGET {{base}}/api/nothing-here\n\n### S08 Wrong method -> 405 with an Allow header\nPUT {{base}}/api/messages/1\nContent-Type: application/json\nX-API-Key: {{key}}\n\n{}\n\n### S09 Cache-Control: public, max-age=300 on a public read\nGET {{base}}/api/awards\n\n### S10 Preflight from Live Server -> 200 + Access-Control-Allow-* headers\nOPTIONS {{base}}/api/messages\nOrigin: http://127.0.0.1:5500\nAccess-Control-Request-Method: GET\nAccess-Control-Request-Headers: x-api-key\n\n### S11 Preflight from an unlisted origin -> 400\nOPTIONS {{base}}/api/messages\nOrigin: https://evil.example\nAccess-Control-Request-Method: GET\n\n### S12 GitHub proxy: send TWICE -> X-Cache MISS, then HIT. Search the body for github_pat_ (must not be there)\nGET {{base}}/api/github\n\n### S13 Set GITHUB_TOKEN=wrong in .env, restart the server -> 502, code upstream_error\nGET {{base}}/api/github\n","api/resume.py":"\"\"\"build_resume(conn): the same function as scripts/db_to_json.py (Module 5), copied here for the API (Module 6, slide 17).\"\"\"\nimport json\nfrom datetime import date\n\nfrom db import fetch_all\n\n\ndef build_resume(conn):\n    projects = fetch_all(conn, \"SELECT * FROM v_api_projects ORDER BY project_id\")\n    for project in projects:\n        project[\"skills\"] = json.loads(project[\"skills\"])\n    return {\n        \"generated_at\": date.today().isoformat(),\n        \"profile\": fetch_all(conn, \"SELECT * FROM v_api_profile\")[0],\n        \"summary\": fetch_all(conn, \"SELECT * FROM v_api_summary\")[0],\n        \"experience\": fetch_all(conn, \"SELECT * FROM v_api_experience ORDER BY start_date DESC\"),\n        \"projects\": projects,\n        \"skills\": fetch_all(conn, \"SELECT * FROM v_api_skills ORDER BY category, skill\"),\n        \"education\": fetch_all(conn, \"SELECT * FROM v_api_education ORDER BY start_year DESC\"),\n        \"awards\": fetch_all(conn, \"SELECT * FROM v_api_awards ORDER BY year DESC, id\"),\n    }\n","api/security.py":"\"\"\"The owner's API key check (Module 8). One owner, one key, no logins.\"\"\"\nimport os\nimport secrets\n\nfrom fastapi import Header, HTTPException\n\n\ndef require_owner(x_api_key: str | None = Header(default=None)):\n    \"\"\"Allow the request only with the owner's API key.\n\n    401 = no credentials (who are you?).  403 = credentials not accepted (you can't do this).\n    \"\"\"\n    expected = os.getenv(\"OWNER_API_KEY\")\n    if not x_api_key:\n        raise HTTPException(\n            status_code=401,\n            detail=\"This endpoint needs an API key in the X-API-Key header.\",\n        )\n    # Fail closed: no key in .env means every request is refused (never open by accident).\n    # compare_digest takes the same time whether the guess fails early or late.\n    if not expected or not secrets.compare_digest(x_api_key, expected):\n        raise HTTPException(status_code=403, detail=\"That API key is not accepted.\")\n","api/stages/module06_main.py":"\"\"\"Module 6: the read-only API. Run from the api/ folder:  fastapi dev main.py\"\"\"\nimport json\nfrom typing import Literal\n\nfrom fastapi import FastAPI, HTTPException, Query, Response\n\nfrom db import connect, fetch_all\nfrom resume import build_resume\n\napp = FastAPI(title=\"Future Portfolio API\", version=\"2.0\")\n\nCategory = Literal[\"Company\", \"Industry\", \"Community\"]\n\n\n# ---------- practice endpoints (delete /api/echo before you commit) ----------\n@app.get(\"/api/hello\", tags=[\"Practice\"])\ndef hello():\n    return {\"message\": \"Hello from the Future Portfolio API\"}\n\n\n@app.get(\"/api/echo/{item_id}\", tags=[\"Practice\"])\ndef echo(item_id: int, q: str | None = None, limit: int = 10):\n    return {\"item_id\": item_id, \"q\": q, \"limit\": limit}\n\n\n# ---------- the one helper every list uses (slide 12) ----------\ndef list_from_view(response, view, where, params, order, page, limit):\n    where_sql = f\" WHERE {' AND '.join(where)}\" if where else \"\"\n    with connect() as conn:\n        total = fetch_all(\n            conn,\n            f\"SELECT COUNT(*) AS total FROM {view}{where_sql}\",\n            params,\n        )[0][\"total\"]\n        rows = fetch_all(\n            conn,\n            f\"SELECT * FROM {view}{where_sql} \"\n            f\"ORDER BY {order} LIMIT %s OFFSET %s\",\n            [*params, limit, (page - 1) * limit],\n        )\n    response.headers[\"X-Total-Count\"] = str(total)\n    return rows\n\n\n# ---------- awards ----------\n@app.get(\"/api/awards\", tags=[\"Awards\"])\ndef list_awards(\n    response: Response,\n    category: Category | None = None,\n    year_from: int | None = Query(None, ge=1980, le=2100),\n    year_to: int | None = Query(None, ge=1980, le=2100),\n    sort: Literal[\"year\", \"-year\"] = \"-year\",\n    page: int = Query(1, ge=1),\n    limit: int = Query(50, ge=1, le=50),\n):\n    \"\"\"Awards, filtered, sorted and paged.\"\"\"\n    where, params = [], []\n    if category is not None:\n        where.append(\"category = %s\")\n        params.append(category)\n    if year_from is not None:\n        where.append(\"year >= %s\")\n        params.append(year_from)\n    if year_to is not None:\n        where.append(\"year \u003c= %s\")\n        params.append(year_to)\n    order = {\"year\": \"year, id\", \"-year\": \"year DESC, id\"}[sort]\n    return list_from_view(response, \"v_api_awards\", where, params, order, page, limit)\n\n\n@app.get(\"/api/awards/{award_id}\", tags=[\"Awards\"])\ndef get_award(award_id: int):\n    \"\"\"One award by its id.\"\"\"\n    with connect() as conn:\n        rows = fetch_all(conn, \"SELECT * FROM v_api_awards WHERE id = %s\", (award_id,))\n    if not rows:\n        raise HTTPException(status_code=404, detail=f\"No award with id {award_id}.\")\n    return rows[0]\n\n\n# ---------- education ----------\n@app.get(\"/api/education\", tags=[\"Education\"])\ndef list_education(\n    response: Response,\n    page: int = Query(1, ge=1),\n    limit: int = Query(50, ge=1, le=50),\n):\n    \"\"\"All education entries, newest first.\"\"\"\n    return list_from_view(response, \"v_api_education\", [], [], \"start_year DESC, id\", page, limit)\n\n\n@app.get(\"/api/education/{education_id}\", tags=[\"Education\"])\ndef get_education(education_id: int):\n    \"\"\"One education entry.\"\"\"\n    with connect() as conn:\n        rows = fetch_all(conn, \"SELECT * FROM v_api_education WHERE id = %s\", (education_id,))\n    if not rows:\n        raise HTTPException(status_code=404, detail=f\"No education entry with id {education_id}.\")\n    return rows[0]\n\n\n# ---------- single objects ----------\n@app.get(\"/api/profile\", tags=[\"Resume\"])\ndef get_profile():\n    \"\"\"The public profile (no email).\"\"\"\n    with connect() as conn:\n        return fetch_all(conn, \"SELECT * FROM v_api_profile\")[0]\n\n\n@app.get(\"/api/summary\", tags=[\"Resume\"])\ndef get_summary():\n    \"\"\"Headline numbers.\"\"\"\n    with connect() as conn:\n        return fetch_all(conn, \"SELECT * FROM v_api_summary\")[0]\n\n\n@app.get(\"/api/resume\", tags=[\"Resume\"])\ndef get_resume():\n    \"\"\"The whole resume.json document, built from the views on every request.\"\"\"\n    with connect() as conn:\n        return build_resume(conn)\n\n\n# ---------- experience, projects, skills ----------\n@app.get(\"/api/experience\", tags=[\"Experience\"])\ndef list_experience(\n    response: Response,\n    company: str | None = None,\n    page: int = Query(1, ge=1),\n    limit: int = Query(50, ge=1, le=50),\n):\n    \"\"\"Roles, newest first. ?company=CloudHarbor Software gives 4.\"\"\"\n    where, params = [], []\n    if company is not None:\n        where.append(\"company = %s\")\n        params.append(company)\n    return list_from_view(response, \"v_api_experience\", where, params, \"start_date DESC, id\", page, limit)\n\n\n@app.get(\"/api/projects\", tags=[\"Projects\"])\ndef list_projects(\n    response: Response,\n    skill: str | None = None,\n    company: str | None = None,\n    page: int = Query(1, ge=1),\n    limit: int = Query(50, ge=1, le=50),\n):\n    \"\"\"Projects. ?skill=Platform migration gives 8 rows.\"\"\"\n    where, params = [], []\n    if skill is not None:\n        where.append(\"JSON_CONTAINS(skills, JSON_QUOTE(%s))\")\n        params.append(skill)\n    if company is not None:\n        where.append(\"company = %s\")\n        params.append(company)\n    rows = list_from_view(response, \"v_api_projects\", where, params, \"project_id, role\", page, limit)\n    for row in rows:\n        row[\"skills\"] = json.loads(row[\"skills\"])  # without this, skills is a string: a contract break\n    return rows\n\n\n@app.get(\"/api/skills\", tags=[\"Skills\"])\ndef list_skills(\n    response: Response,\n    evidenced: bool | None = None,\n    category: str | None = None,\n    page: int = Query(1, ge=1),\n    limit: int = Query(50, ge=1, le=50),\n):\n    \"\"\"Skills. evidenced=true means used in at least one project; false gives 2 (skills 2 and 17).\"\"\"\n    where, params = [], []\n    if evidenced is not None:\n        where.append(\"project_count > 0\" if evidenced else \"project_count = 0\")\n    if category is not None:\n        where.append(\"category = %s\")\n        params.append(category)\n    return list_from_view(response, \"v_api_skills\", where, params, \"category, skill\", page, limit)\n","api/stages/module07_main.py":"\"\"\"Module 7: the API learns to write. Run from the api/ folder:  fastapi dev main.py\"\"\"\nimport json\nfrom typing import Literal\n\nimport mysql.connector\nfrom fastapi import FastAPI, HTTPException, Query, Response\n\nfrom db import connect, execute, fetch_all\nfrom db_errors import raise_for_db_error\nfrom models import AppointmentIn, MessageIn, MessageOut, MessagePatch, ProjectPatch\nfrom resume import build_resume\n\napp = FastAPI(title=\"Future Portfolio API\", version=\"2.0\")\n\nCategory = Literal[\"Company\", \"Industry\", \"Community\"]\n\n\n# ---------- practice endpoints (delete /api/echo before you commit) ----------\n@app.get(\"/api/hello\", tags=[\"Practice\"])\ndef hello():\n    return {\"message\": \"Hello from the Future Portfolio API\"}\n\n\n@app.get(\"/api/echo/{item_id}\", tags=[\"Practice\"])\ndef echo(item_id: int, q: str | None = None, limit: int = 10):\n    return {\"item_id\": item_id, \"q\": q, \"limit\": limit}\n\n\n# ---------- the one helper every list uses (slide 12) ----------\ndef list_from_view(response, view, where, params, order, page, limit, write=False):\n    where_sql = f\" WHERE {' AND '.join(where)}\" if where else \"\"\n    with connect(write=write) as conn:  # write=True only for the owner-only message view\n        total = fetch_all(\n            conn,\n            f\"SELECT COUNT(*) AS total FROM {view}{where_sql}\",\n            params,\n        )[0][\"total\"]\n        rows = fetch_all(\n            conn,\n            f\"SELECT * FROM {view}{where_sql} \"\n            f\"ORDER BY {order} LIMIT %s OFFSET %s\",\n            [*params, limit, (page - 1) * limit],\n        )\n    response.headers[\"X-Total-Count\"] = str(total)\n    return rows\n\n\n# ---------- awards ----------\n@app.get(\"/api/awards\", tags=[\"Awards\"])\ndef list_awards(\n    response: Response,\n    category: Category | None = None,\n    year_from: int | None = Query(None, ge=1980, le=2100),\n    year_to: int | None = Query(None, ge=1980, le=2100),\n    sort: Literal[\"year\", \"-year\"] = \"-year\",\n    page: int = Query(1, ge=1),\n    limit: int = Query(50, ge=1, le=50),\n):\n    \"\"\"Awards, filtered, sorted and paged.\"\"\"\n    where, params = [], []\n    if category is not None:\n        where.append(\"category = %s\")\n        params.append(category)\n    if year_from is not None:\n        where.append(\"year >= %s\")\n        params.append(year_from)\n    if year_to is not None:\n        where.append(\"year \u003c= %s\")\n        params.append(year_to)\n    order = {\"year\": \"year, id\", \"-year\": \"year DESC, id\"}[sort]\n    return list_from_view(response, \"v_api_awards\", where, params, order, page, limit)\n\n\n@app.get(\"/api/awards/{award_id}\", tags=[\"Awards\"])\ndef get_award(award_id: int):\n    \"\"\"One award by its id.\"\"\"\n    with connect() as conn:\n        rows = fetch_all(conn, \"SELECT * FROM v_api_awards WHERE id = %s\", (award_id,))\n    if not rows:\n        raise HTTPException(status_code=404, detail=f\"No award with id {award_id}.\")\n    return rows[0]\n\n\n# ---------- education ----------\n@app.get(\"/api/education\", tags=[\"Education\"])\ndef list_education(\n    response: Response,\n    page: int = Query(1, ge=1),\n    limit: int = Query(50, ge=1, le=50),\n):\n    \"\"\"All education entries, newest first.\"\"\"\n    return list_from_view(response, \"v_api_education\", [], [], \"start_year DESC, id\", page, limit)\n\n\n@app.get(\"/api/education/{education_id}\", tags=[\"Education\"])\ndef get_education(education_id: int):\n    \"\"\"One education entry.\"\"\"\n    with connect() as conn:\n        rows = fetch_all(conn, \"SELECT * FROM v_api_education WHERE id = %s\", (education_id,))\n    if not rows:\n        raise HTTPException(status_code=404, detail=f\"No education entry with id {education_id}.\")\n    return rows[0]\n\n\n# ---------- single objects ----------\n@app.get(\"/api/profile\", tags=[\"Resume\"])\ndef get_profile():\n    \"\"\"The public profile (no email).\"\"\"\n    with connect() as conn:\n        return fetch_all(conn, \"SELECT * FROM v_api_profile\")[0]\n\n\n@app.get(\"/api/summary\", tags=[\"Resume\"])\ndef get_summary():\n    \"\"\"Headline numbers.\"\"\"\n    with connect() as conn:\n        return fetch_all(conn, \"SELECT * FROM v_api_summary\")[0]\n\n\n@app.get(\"/api/resume\", tags=[\"Resume\"])\ndef get_resume():\n    \"\"\"The whole resume.json document, built from the views on every request.\"\"\"\n    with connect() as conn:\n        return build_resume(conn)\n\n\n# ---------- experience, projects, skills ----------\n@app.get(\"/api/experience\", tags=[\"Experience\"])\ndef list_experience(\n    response: Response,\n    company: str | None = None,\n    page: int = Query(1, ge=1),\n    limit: int = Query(50, ge=1, le=50),\n):\n    \"\"\"Roles, newest first. ?company=CloudHarbor Software gives 4.\"\"\"\n    where, params = [], []\n    if company is not None:\n        where.append(\"company = %s\")\n        params.append(company)\n    return list_from_view(response, \"v_api_experience\", where, params, \"start_date DESC, id\", page, limit)\n\n\n@app.get(\"/api/projects\", tags=[\"Projects\"])\ndef list_projects(\n    response: Response,\n    skill: str | None = None,\n    company: str | None = None,\n    page: int = Query(1, ge=1),\n    limit: int = Query(50, ge=1, le=50),\n):\n    \"\"\"Projects. ?skill=Platform migration gives 8 rows.\"\"\"\n    where, params = [], []\n    if skill is not None:\n        where.append(\"JSON_CONTAINS(skills, JSON_QUOTE(%s))\")\n        params.append(skill)\n    if company is not None:\n        where.append(\"company = %s\")\n        params.append(company)\n    rows = list_from_view(response, \"v_api_projects\", where, params, \"project_id, role\", page, limit)\n    for row in rows:\n        row[\"skills\"] = json.loads(row[\"skills\"])  # without this, skills is a string: a contract break\n    return rows\n\n\n@app.get(\"/api/skills\", tags=[\"Skills\"])\ndef list_skills(\n    response: Response,\n    evidenced: bool | None = None,\n    category: str | None = None,\n    page: int = Query(1, ge=1),\n    limit: int = Query(50, ge=1, le=50),\n):\n    \"\"\"Skills. evidenced=true means used in at least one project; false gives 2 (skills 2 and 17).\"\"\"\n    where, params = [], []\n    if evidenced is not None:\n        where.append(\"project_count > 0\" if evidenced else \"project_count = 0\")\n    if category is not None:\n        where.append(\"category = %s\")\n        params.append(category)\n    return list_from_view(response, \"v_api_skills\", where, params, \"category, skill\", page, limit)\n\n\n# =====================================================================\n# Module 7: writing data\n# =====================================================================\n\n# ---------- messages: POST is public, the rest become owner-only in Module 8 ----------\n@app.post(\"/api/messages\", status_code=201, tags=[\"Messages\"])\ndef create_message(body: MessageIn, response: Response):\n    \"\"\"Send a message from the contact form.\"\"\"\n    with connect(write=True) as conn:\n        _, new_id = execute(\n            conn,\n            \"INSERT INTO contact_messages (name, email, message) VALUES (%s, %s, %s)\",\n            (body.name, body.email, body.message),\n        )\n        conn.commit()  # autocommit is OFF in the Python connector: no commit, no row\n        sent_at = fetch_all(\n            conn, \"SELECT sent_at FROM v_owner_messages WHERE id = %s\", (new_id,)\n        )[0][\"sent_at\"]\n    response.headers[\"Location\"] = f\"/api/messages/{new_id}\"\n    return {\"id\": new_id, \"sent_at\": sent_at}  # never echo the visitor's email back\n\n\n@app.get(\"/api/messages\", response_model=list[MessageOut], tags=[\"Messages\"])\ndef list_messages(\n    response: Response,\n    page: int = Query(1, ge=1),\n    limit: int = Query(50, ge=1, le=50),\n):\n    \"\"\"Owner only (Module 8): newest first.\"\"\"\n    return list_from_view(response, \"v_owner_messages\", [], [], \"sent_at DESC, id DESC\", page, limit, write=True)\n\n\n@app.patch(\"/api/messages/{message_id}\", response_model=MessageOut, tags=[\"Messages\"])\ndef mark_message(message_id: int, body: MessagePatch):\n    \"\"\"Mark a message read or unread.\"\"\"\n    with connect(write=True) as conn:\n        execute(\n            conn,\n            \"UPDATE contact_messages SET is_read = %s WHERE message_id = %s\",\n            (body.is_read, message_id),\n        )\n        conn.commit()\n        # Look it up instead of trusting rowcount: UPDATE counts rows CHANGED, not rows FOUND.\n        rows = fetch_all(conn, \"SELECT * FROM v_owner_messages WHERE id = %s\", (message_id,))\n    if not rows:\n        raise HTTPException(status_code=404, detail=f\"No message with id {message_id}.\")\n    return rows[0]\n\n\n@app.delete(\"/api/messages/{message_id}\", status_code=204, tags=[\"Messages\"])\ndef delete_message(message_id: int):\n    \"\"\"Delete a message.\"\"\"\n    with connect(write=True) as conn:\n        deleted, _ = execute(conn, \"DELETE FROM contact_messages WHERE message_id = %s\", (message_id,))\n        conn.commit()\n    if deleted == 0:\n        raise HTTPException(status_code=404, detail=f\"No message with id {message_id}.\")\n    return Response(status_code=204)\n\n\n# ---------- PATCH a project: only the fields that were sent ----------\n@app.patch(\"/api/projects/{project_id}\", tags=[\"Projects\"])\ndef update_project(project_id: int, body: ProjectPatch):\n    \"\"\"Change a project's name and/or description.\"\"\"\n    changes = body.model_dump(exclude_unset=True)\n    if not changes:\n        raise HTTPException(status_code=422, detail=\"Send at least one field to change.\")\n    # Column names come only from the model's own two fields (extra=\"forbid\"): structure from code.\n    set_sql = \", \".join(f\"{column} = %s\" for column in changes)\n    with connect(write=True) as conn:\n        if not fetch_all(conn, \"SELECT project_id FROM projects WHERE project_id = %s\", (project_id,)):\n            raise HTTPException(status_code=404, detail=f\"No project with id {project_id}.\")\n        try:\n            execute(conn, f\"UPDATE projects SET {set_sql} WHERE project_id = %s\", [*changes.values(), project_id])\n            conn.commit()\n        except mysql.connector.Error as error:\n            conn.rollback()\n            raise_for_db_error(error)\n        return fetch_all(\n            conn,\n            \"SELECT project_id, project_name, description FROM projects WHERE project_id = %s\",\n            (project_id,),\n        )[0]\n\n\n# ---------- one request, one transaction ----------\n@app.post(\"/api/appointments\", status_code=201, tags=[\"Appointments\"])\ndef create_appointment(body: AppointmentIn):\n    \"\"\"A board appointment: company, period, role, project and skills, all or nothing.\"\"\"\n    with connect(write=True) as conn:\n        try:\n            conn.start_transaction()\n            _, company_id = execute(conn, \"INSERT INTO companies (company_name) VALUES (%s)\", (body.company_name,))\n            _, employment_id = execute(\n                conn,\n                \"INSERT INTO employment (company_id, start_date, end_date) VALUES (%s, %s, %s)\",\n                (company_id, body.start_date, body.end_date),\n            )\n            _, role_id = execute(\n                conn,\n                \"INSERT INTO roles (employment_id, role_title, role_start, role_end) VALUES (%s, %s, %s, %s)\",\n                (employment_id, body.role_title, body.start_date, body.end_date),\n            )\n            _, project_id = execute(conn, \"INSERT INTO projects (project_name) VALUES (%s)\", (body.project_name,))\n            execute(conn, \"INSERT INTO role_projects (role_id, project_id) VALUES (%s, %s)\", (role_id, project_id))\n            for skill_id in body.skill_ids:\n                execute(conn, \"INSERT INTO project_skills (project_id, skill_id) VALUES (%s, %s)\", (project_id, skill_id))\n            if body.headline is not None:\n                execute(conn, \"UPDATE people SET headline = %s WHERE person_id = 1\", (body.headline,))\n            conn.commit()  # once, at the end\n        except mysql.connector.Error as error:\n            conn.rollback()  # every time: MySQL does not undo the earlier statements by itself\n            raise_for_db_error(error)\n    return {\n        \"company_id\": company_id,\n        \"employment_id\": employment_id,\n        \"role_id\": role_id,\n        \"project_id\": project_id,\n    }\n","api/stages/module08_main.py":"\"\"\"M
