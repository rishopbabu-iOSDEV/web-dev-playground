<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>API Playground</title>
<style>/* Layout idea: fixed top bar, left lesson sidebar, one wide reading column with embedded mini-Postman panels. */
:root{
  --bg:#f5f6f4; --panel:#ffffff; --panel2:#eef1ef; --ink:#1d2b2a; --muted:#5d6e6b; --line:#d9dfdc;
  --accent:#1f6f78; --accent-ink:#ffffff; --accent-soft:#dff0f1;
  --ok:#2f7d4f; --ok-soft:#e1f2e8; --warn:#a8641a; --warn-soft:#fbeedb; --bad:#b53a3a; --bad-soft:#f9e2e2; --info:#2f5fa8; --info-soft:#e0e9f8;
  --m-get:#2f7d4f; --m-post:#b7791f; --m-put:#2f5fa8; --m-patch:#7a4fa8; --m-delete:#b53a3a; --m-other:#5d6e6b;
  --code-bg:#f0f3f1; --k-key:#1f5f9a; --k-str:#2f7d4f; --k-num:#b7501f; --k-bool:#7a4fa8; --k-null:#8a8f8d;
  --font:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --radius:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121817; --panel:#1a2221; --panel2:#222c2b; --ink:#e3ebe9; --muted:#9aaba7; --line:#2d3a38;
  --accent:#4fb3bd; --accent-ink:#0b1514; --accent-soft:#1c3638;
  --ok:#5fc08a; --ok-soft:#1b3326; --warn:#e0a257; --warn-soft:#3a2d18; --bad:#e57b7b; --bad-soft:#3b2121; --info:#7aa6e8; --info-soft:#1d2a40;
  --m-get:#5fc08a; --m-post:#e0a257; --m-put:#7aa6e8; --m-patch:#b898e3; --m-delete:#e57b7b; --m-other:#9aaba7;
  --code-bg:#151c1b; --k-key:#7ab4e8; --k-str:#7fcf9f; --k-num:#e8a070; --k-bool:#b898e3; --k-null:#8a9a96; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121817; --panel:#1a2221; --panel2:#222c2b; --ink:#e3ebe9; --muted:#9aaba7; --line:#2d3a38;
  --accent:#4fb3bd; --accent-ink:#0b1514; --accent-soft:#1c3638;
  --ok:#5fc08a; --ok-soft:#1b3326; --warn:#e0a257; --warn-soft:#3a2d18; --bad:#e57b7b; --bad-soft:#3b2121; --info:#7aa6e8; --info-soft:#1d2a40;
  --m-get:#5fc08a; --m-post:#e0a257; --m-put:#7aa6e8; --m-patch:#b898e3; --m-delete:#e57b7b; --m-other:#9aaba7;
  --code-bg:#151c1b; --k-key:#7ab4e8; --k-str:#7fcf9f; --k-num:#e8a070; --k-bool:#b898e3; --k-null:#8a9a96; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
code,pre,.mono{font-family:var(--mono);font-size:.88em}
code{background:var(--code-bg);padding:.1em .35em;border-radius:4px}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;overflow:auto;margin:10px 0;line-height:1.5}
pre code{background:none;padding:0}
/* shell */
#top{height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
#top .brand{font-weight:700;letter-spacing:.2px;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
#top .brand small{color:var(--muted);font-weight:500}
#top .sp{flex:1}
.progress{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.bar{width:120px;height:6px;background:var(--panel2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;font-size:13.5px}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:2px 8px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:none;color:var(--accent)}
.shell{display:flex;height:calc(100% - 52px)}
#side{width:272px;flex:none;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:10px 8px 40px}
#side h4{margin:16px 8px 4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
#side a{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:14px}
#side a:hover{background:var(--panel2)}
#side a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
#side a .n{width:30px;flex:none;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
#side a .d{margin-left:auto;color:var(--ok);font-size:12px}
#main{flex:1;overflow:auto;scroll-behavior:smooth}
.page{max-width:980px;margin:0 auto;padding:26px 24px 80px}
.page h1{font-size:28px;line-height:1.2;margin:4px 0 6px;text-wrap:balance}
.page h2{font-size:20px;margin:30px 0 8px;text-wrap:balance}
.page h3{font-size:16px;margin:20px 0 6px}
.page p,.page li{max-width:74ch}
.tag{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:1px 10px;margin-right:6px}
.lead{font-size:17px;color:var(--muted);max-width:68ch;margin:0 0 6px}
.menu-btn{display:none}
/* callouts */
.note{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--radius) var(--radius) 0;padding:10px 14px;margin:14px 0;max-width:80ch}
.note b.t{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.7px;margin-bottom:2px}
.note.warn{border-color:var(--warn);background:var(--warn-soft)} .note.bad{border-color:var(--bad);background:var(--bad-soft)}
.note.ok{border-color:var(--ok);background:var(--ok-soft)} .note.info{border-color:var(--info);background:var(--info-soft)}
.note p{margin:4px 0}
table.t{border-collapse:collapse;margin:12px 0;font-size:14px;width:100%;max-width:100%}
.tw{overflow-x:auto;margin:12px 0}
table.t th,table.t td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
table.t th{background:var(--panel2);font-weight:600}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin:12px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.card h4{margin:0 0 4px;font-size:15px}
.card p{margin:4px 0;font-size:14px}
.nav2{display:flex;justify-content:space-between;gap:10px;margin-top:40px;border-top:1px solid var(--line);padding-top:16px}
/* method + status chips */
.mth{font:700 12px var(--mono);letter-spacing:.3px}
.m-GET{color:var(--m-get)}.m-POST{color:var(--m-post)}.m-PUT{color:var(--m-put)}.m-PATCH{color:var(--m-patch)}.m-DELETE{color:var(--m-delete)}.m-HEAD,.m-OPTIONS{color:var(--m-other)}
.st{display:inline-block;font:700 13px var(--mono);padding:2px 9px;border-radius:5px}
.st2{background:var(--ok-soft);color:var(--ok)}.st3{background:var(--info-soft);color:var(--info)}.st4{background:var(--warn-soft);color:var(--warn)}.st5{background:var(--bad-soft);color:var(--bad)}.st0{background:var(--bad-soft);color:var(--bad)}
/* workbench */
.wb{border:1px solid var(--line);background:var(--panel);border-radius:10px;margin:14px 0;overflow:hidden}
.wb .cap{padding:8px 12px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.wb .chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:1px 10px;font-size:12.5px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.wb .reqbar{display:flex;gap:6px;padding:10px 12px;flex-wrap:wrap}
.wb select.meth{font:700 13px var(--mono);border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:5px 6px}
.wb input.url{flex:1;min-width:200px;font:13.5px var(--mono);border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--panel)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 10px;overflow-x:auto}
.tabs button{border:0;background:none;padding:7px 12px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-color:var(--accent);font-weight:600}
.tabc{padding:10px 12px}
.kv{display:grid;grid-template-columns:22px 1fr 1.4fr 24px;gap:4px;align-items:center;font-size:13px}
.kv input[type=text]{width:100%;border:1px solid var(--line);border-radius:5px;padding:3px 7px;background:var(--panel);font:13px var(--mono)}
.kv .x{border:0;background:none;color:var(--muted)}
.kv .auto{opacity:.55}
textarea.ed{width:100%;min-height:120px;font:13px/1.5 var(--mono);border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--panel);resize:vertical;tab-size:2;white-space:pre}
.resp{border-top:1px solid var(--line)}
.resp .sum{display:flex;gap:12px;align-items:center;padding:8px 12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.resp .why{padding:0 12px 8px;font-size:13.5px}
.resp .body{padding:10px 12px;max-height:440px;overflow:auto}
.resp .body pre{margin:0;white-space:pre-wrap;word-break:break-word}
.resp iframe{width:100%;height:260px;border:1px solid var(--line);border-radius:6px;background:#fff}
.hdr-table td:first-child{font-family:var(--mono);color:var(--k-key);white-space:nowrap}
.hdr-table td:last-child{font-family:var(--mono);word-break:break-all}
.hdr-table tr.hid td{opacity:.5;text-decoration:line-through}
.k-key{color:var(--k-key)}.k-str{color:var(--k-str)}.k-num{color:var(--k-num)}.k-bool{color:var(--k-bool)}.k-null{color:var(--k-null);font-style:italic}
.empty{color:var(--muted);padding:14px;text-align:center;font-size:14px}
.err{padding:12px 14px;margin:0;background:var(--bad-soft);color:var(--ink);border-radius:6px}
.err b{color:var(--bad)}
.wbfull{display:grid;grid-template-columns:230px 1fr;gap:0}
.wbside{border-right:1px solid var(--line);max-height:640px;overflow:auto;padding:8px;font-size:13px}
.wbside h5{margin:10px 4px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
.wbside button{display:flex;gap:6px;width:100%;text-align:left;border:0;background:none;padding:3px 6px;border-radius:5px;font-size:12.5px}
.wbside button:hover{background:var(--panel2)}
.wbside button span.u{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* env popover */
.pop{position:fixed;top:56px;right:12px;width:340px;max-height:80vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:12px 14px;z-index:30;display:none}
.pop.open{display:block}
.pop label{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--muted);margin:8px 0}
.pop select,.pop input[type=text],.pop input[type=number]{border:1px solid var(--line);border-radius:6px;padding:4px 7px;background:var(--panel)}
.pop .row{display:flex;gap:8px;align-items:center;font-size:13.5px;margin:6px 0}
/* quiz / widgets */
.quiz{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 14px;margin:14px 0}
.quiz .q{font-weight:600;margin-bottom:6px}
.quiz .opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 10px;margin:4px 0}
.quiz .opt:hover{background:var(--panel2)}
.quiz .opt.right{border-color:var(--ok);background:var(--ok-soft)}.quiz .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.quiz .fb{margin-top:6px;font-size:14px}
.wd{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 14px;margin:14px 0}
.wd h4{margin:0 0 8px;font-size:15px}
.wd input[type=text],.wd select,.wd input[type=number]{border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--panel);font-family:var(--mono);font-size:13px}
.urlparts{display:flex;flex-wrap:wrap;font:16px var(--mono);margin:8px 0;gap:0}
.urlparts span{padding:3px 5px;border-bottom:3px solid;border-radius:3px 3px 0 0}
.pc0{border-color:#2f7d4f;background:rgba(47,125,79,.12)}.pc1{border-color:#2f5fa8;background:rgba(47,95,168,.12)}.pc2{border-color:#7a4fa8;background:rgba(122,79,168,.12)}.pc3{border-color:#b7791f;background:rgba(183,121,31,.14)}.pc4{border-color:#b53a3a;background:rgba(181,58,58,.12)}.pc5{border-color:#5d6e6b;background:rgba(93,110,107,.14)}
.flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.flow .box{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 12px;font-size:13.5px;min-width:110px;text-align:center}
.flow .box.hl{border-color:var(--accent);background:var(--accent-soft)}
.flow .ar{color:var(--muted);font-size:20px}
.pill{display:inline-block;border-radius:20px;padding:0 9px;font-size:12px;border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.console{background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:12.5px/1.5 var(--mono);max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.console .l-error{color:var(--bad)}.console .l-warn{color:var(--warn)}.console .l-info{color:var(--info)}
.lab{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:16px 0;overflow:hidden}
.lab .hd{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--panel2);border-bottom:1px solid var(--line);flex-wrap:wrap;font-size:13.5px}
.lab .hd b{margin-right:auto}
.lab .bd{padding:10px 12px;display:grid;gap:10px}
.lab .pv{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;background:var(--bg)}
.lab .pv .status{color:var(--muted);font-size:13.5px;min-height:1.4em}
.lab .pv ul{margin:6px 0;padding-left:18px}
.lab .pv .wcard{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--panel);display:inline-block;min-width:220px}
.chk{margin:4px 0;font-size:14px}
.chk.pass::before{content:"✓ ";color:var(--ok);font-weight:700}.chk.fail::before{content:"✗ ";color:var(--bad);font-weight:700}
.ladder{display:grid;gap:6px;margin:8px 0}
.ladder .rung{border:1px solid var(--line);border-radius:8px;padding:6px 12px;background:var(--panel2);opacity:.55}
.ladder .rung.hit{opacity:1;border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.net{width:100%;border-collapse:collapse;font-size:13px}
.net th,.net td{border-bottom:1px solid var(--line);padding:4px 8px;text-align:left}
.net tr.sel{background:var(--accent-soft)} .net tr{cursor:pointer}
.sr{position:absolute;left:-9999px}
@media (max-width:820px){
  body{overflow:auto}
  #side{position:fixed;z-index:20;left:0;top:52px;bottom:0;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.2)}
  #side.open{transform:none}
  .menu-btn{display:inline-block}
  .wbfull{grid-template-columns:1fr}.wbside{max-height:200px;border-right:0;border-bottom:1px solid var(--line)}
  .progress .bar{width:60px}
  .page{padding:18px 16px 60px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* mobile overflow fixes */
#main,.page{min-width:0}
.tw{overflow-x:auto;max-width:100%}
.page pre,.wd,.lab,.wb{max-width:100%}
.page pre{overflow-x:auto}
@media (max-width:820px){
  .wb{display:block}
  .wb *{max-width:100%}
  .page table.t{min-width:0}
  .page table.t td,.page table.t th{word-break:break-word}
  .urlparts{flex-wrap:wrap}
}
.card .mono{word-break:break-all;white-space:normal}
</style>
</head>
<body>
<header id="top">
  <button class="btn menu-btn" id="menuBtn" aria-label="Open lesson menu">☰</button>
  <div class="brand">API Playground <small>Fundamentals of APIs and Web Data</small></div>
  <div class="sp"></div>
  <div class="progress"><div class="bar"><i id="pbar"></i></div><span id="plab">0% done</span></div>
  <button class="btn" id="ctlBtn">⚙ Practice controls</button>
  <button class="btn" id="themeBtn" aria-label="Toggle light and dark theme">◐</button>
</header>
<div class="shell"><nav id="side" aria-label="Lessons"></nav><main id="main"></main></div>
<div class="pop" id="pop" role="dialog" aria-label="Practice controls"></div>
<script>
/* ===== Practice internet: pretend servers that live inside this page ===== */
const Env = {
  client: 'rest',            // 'rest' (REST Client / curl) or 'browser' (fetch with CORS rules)
  origin: 'http://127.0.0.1:5500',
  network: 'normal',         // normal | slow | offline
  timeoutMs: 8000,
  server8000: true,
  ghUsed: 0,

  ghReset: Math.floor(Date.now() / 1000) + 3600,

  changed() { Env.listeners.forEach(f => { try { f(); } catch (e) {} }); }
};
const OWNER_KEY = 'owner-secret-123';

/* ---------- Ananya's portfolio data (practice copy; counts match the slides) ---------- */
const PD = (() => {
  const roles = [
    [1,'Kaveri Infotech','Software Engineer','1986-07-01','1989-03-31',null],
    [2,'Kaveri Infotech','Senior Software Engineer','1989-04-01','1992-01-31',6],
    [3,'Kaveri Infotech','Technical Lead','1992-02-01','1994-05-31',12],
    [4,'Bluepeak Systems','Project Manager','1994-06-01','1996-12-31',18],
    [5,'Bluepeak Systems','Senior Project Manager','1997-01-01','1999-06-30',35],
    [6,'Bluepeak Systems','Delivery Head','1999-07-01','2001-08-31',60],
    [7,'Orbit Labs','Engineering Manager','2001-09-01','2003-02-28',45],

    [9,'Orbit Labs','Senior Director, Engineering','2005-01-01','2006-06-30',null],
    [10,'CloudHarbor Software','Director, Platform','2006-07-01','2008-03-31',120],
    [11,'CloudHarbor Software','Vice President, Platform','2008-04-01','2010-02-28',210],
    [12,'CloudHarbor Software','Vice President, Engineering','2010-03-01','2011-12-31',260],
    [13,'NexaCollab','VP, Product Engineering','2012-01-01','2013-09-30',300],
    [14,'NexaCollab','Head of Engineering','2013-10-01','2014-08-31',340],
    [15,'Aster Data Platforms','SVP, Engineering','2014-09-01','2017-06-30',410],
    [16,'Aster Data Platforms','Chief Product & Tech. Officer','2017-07-01','2021-05-31',950],
    [17,'Lumina Software','Chief Technology Officer','2021-06-01','2026-05-31',1800]
  ].map(r => ({ id: r[0], company: r[1], role: r[2], start_date: r[3], end_date: r[4], team_size: r[5] }));
  const projDefs = [
    [1,'Billing Engine Rewrite',[2],['Platform migration','Payments']],
    [2,'Branch Banking Portal',[3],['Payments','Compliance']],
    [3,'Telecom Provisioning Suite',[4],['Program management','Vendor management']],
    [4,'Y2K Readiness Programme',[5,6],['Program management','Compliance']],
    [5,'Offshore Delivery Centre',[7],['Hiring & org design','Program management']],
    [6,'Search Relevance Overhaul',[8],['Search & relevance','Data platforms']],
    [7,'Data Centre Consolidation',[10],['Cloud architecture','Site reliability']],
    [8,'Cloud Migration Wave 1',[11,12],['Cloud architecture','Platform migration','Site reliability']],
    [9,'Collaboration Suite 2.0',[13],['Mobile engineering','Developer experience']],
    [10,'Mobile-first Rebuild',[14],['Mobile engineering','Platform migration']],
    [11,'Data Platform Launch',[15],['Data platforms','Cloud architecture']],
    [12,'Analytics Marketplace',[16],['Data platforms','Platform migration']],
    [13,'Platform Renewal',[17],['Platform migration','Site reliability','Cloud architecture']],
    [14,'Enterprise Assistant Deployment',[17],['Product security','AI product governance']],
    [15,'Security Posture Programme',[16],['Product security','Compliance','Site reliability']],
    [16,'Developer Experience Platform',[9],['Developer experience','Platform migration']]
  ];
  const projects = [];
  projDefs.forEach(p => p[2].forEach(rid => {
    const r = roles.find(x => x.id === rid);

async function loadResume() {
  try {
    const response = await fetch("data/resume.json");
    if (!response.ok) throw new Error(\`HTTP \${response.status}\`);
    const resume = await response.json();

  solution: `// js/resume.js
function formatMonth(iso) {
  if (!iso) return "Present";
  const [year, month] = iso.split("-");
  return ${MONTHS}[Number(month) - 1] + " " + year;
}

function renderExperience(list) {
  const sorted = [...list].sort((a, b) => b.start_date.localeCompare(a.start_date));
  document.querySelector("#experience").innerHTML =
    "<h2>Experience</h2><ul>" + sorted.map(r =>
      \`<li>\${r.role}, \${r.company} (\${formatMonth(r.start_date)} – \${formatMonth(r.end_date)})\${r.team_size !== null ? " · team of " + r.team_size : ""}</li>\`
    ).join("") + "</ul>";
}

function renderProfile(profile) {
  document.querySelector("#profile").innerHTML =
    \`<h1>\${profile.full_name}</h1><p>\${profile.headline}</p><p>\${profile.location}</p>\`;
}

function renderAwards(awards) {
  const newestFirst = [...awards].sort((a, b) => b.year - a.year);
  document.querySelector("#awards").innerHTML =
    "<h2>Awards</h2><ul>" + newestFirst.map(a =>
      \`<li>\${a.award} (\${a.awarded_by}, \${a.year})</li>\`).join("") + "</ul>";
}

async function loadResume() {
  try {
    const response = await fetch("data/resume.json");
    if (!response.ok) throw new Error(\`HTTP \${response.status}\`);
    const resume = await response.json();
    renderProfile(resume.profile);
    renderExperience(resume.experience);
    renderAwards(resume.awards);
  } catch (error) {
    document.querySelector("#experience").textContent =
      "The resume could not be loaded.";
    console.error(error);
  }
}
document.addEventListener("DOMContentLoaded", loadResume);`,

const WEATHER_CODE = `const WEATHER_KEY = "weather-bengaluru";
const WEATHER_MAX_AGE = 15 * 60 * 1000;           // 15 minutes
const TIMEOUT = 8000;
const params = new URLSearchParams({
  latitude: 12.97, longitude: 77.59,
  current: "temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m",
  timezone: "Asia/Kolkata"
});
const WEATHER_URL = \`https://api.open-meteo.com/v1/forecast?\${params}\`;
const CONDITIONS = { 0: "Clear sky", 1: "Mainly clear", 2: "Partly cloudy", 3: "Overcast", 45: "Fog", 61: "Light rain" };

function cacheRead(key) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
  catch { localStorage.removeItem(key); return null; }      // corrupted: throw it away
}
function cacheWrite(key, data) {
  localStorage.setItem(key, JSON.stringify({ savedAt: Date.now(), data }));
}
function isFresh(saved, maxAge) {
  return saved && Date.now() - saved.savedAt < maxAge;
}

function setWeatherStatus(text) {
  document.querySelector("#weather .status").textContent = text;
}
function renderWeather(data, savedAt, message) {
  const box = document.querySelector("#weather .body");
  box.textContent = "";                                     // textContent only: never innerHTML
  const c = data.current, u = data.current_units;
  [ c.temperature_2m + " " + u.temperature_2m,
    CONDITIONS[c.weather_code] || "Conditions unavailable",
    "Humidity " + c.relative_humidity_2m + " " + u.relative_humidity_2m,
    "Wind " + c.wind_speed_10m + " " + u.wind_speed_10m
  ].forEach(text => { const p = document.createElement("p"); p.textContent = text; box.append(p); });
  const when = savedAt ? "Updated " + new Date(savedAt).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" }) : "";
  setWeatherStatus([when, message].filter(Boolean).join(". "));
}

async function loadWeather() {
  const saved = cacheRead(WEATHER_KEY);
  if (isFresh(saved, WEATHER_MAX_AGE)) {
    console.log("state: fresh cache (no request sent)");
    return renderWeather(saved.data, saved.savedAt);
  }
  setWeatherStatus("Loading the weather…");
  console.log("state: loading");
  try {
    const data = await getJSON(WEATHER_URL, TIMEOUT);
    cacheWrite(WEATHER_KEY, data);
    console.log("state: fetched and saved");
    renderWeather(data, Date.now());
  } catch (error) {
    console.error(error);
    if (saved) {
      console.log("state: stale cache shown with the error message");
      return renderWeather(saved.data, saved.savedAt, messageFor(error));
    }
    try {
      const sample = await getJSON("fixtures/weather-bengaluru.json");
      console.log("state: sample data");
      renderWeather(sample, null, "Showing sample data.");
    } catch {
      console.log("state: error");
      setWeatherStatus(messageFor(error));
    }
  }
}
loadWeather();`;

  { id: 'tool-http', title: '.http file runner', tool: true, lead: 'Paste a `.http` file (like module-01.http). Each block gets a Send button. `@base = …` variables and `{{base}}` work.', blocks: [['w', 'httpRunner', { rows: 300 }]] },
  { id: 'tool-json', title: 'JSON checker', tool: true, lead: 'Paste any JSON. The problems list updates as you type.', blocks: [['w', 'jsonLinter', { rows: 300 }], ['w', 'jsonTypes']] },
  { id: 'tool-contract', title: 'resume.json checker', tool: true, lead: 'Paste the file from Module 2 Lab A and check it against the contract.', blocks: [['w', 'contractChecker']] },
  { id: 'tool-catalog', title: 'Practice internet map', tool: true, lead: 'Every pretend site in this playground and what it offers.', blocks: [['catalog']] },
  { id: 'tool-cheat', title: 'Cheat sheet', tool: true, lead: 'The one-page summary of all four modules.', blocks: [['cheat']] }
];

/* ===== app shell ===== */
const MODS = { 0: 'Start here', 1: 'Module 1 · How the Web Talks', 2: 'Module 2 · JSON and Web Data', 3: 'Module 3 · Consuming APIs in JavaScript', 4: 'Module 4 · Designing a REST API' };
let done = store.get('done', {});
function allPages() { return LESSONS.concat(PAGES); }
function renderBlocks(blocks, into) {
  blocks.forEach(b => {
    const t = b[0];
    if (t === 'h2' || t === 'h3') into.append(h(t, {}, b[1]));
    else if (t === 'p') into.append(h('p', { html: md(b[1]) }));
    else if (t === 'ul') into.append(h('ul', {}, ...b[1].map(x => h('li', { html: md(x) }))));
    else if (t === 'note') { const n = h('div', { class: 'note ' + (b[1] || '') }); if (b[2]) n.append(h('b', { class: 't' }, b[2])); n.append(h('p', { html: md(b[3]) })); into.append(n); }
    else if (t === 'details') into.append(h('details', { style: 'margin:8px 0' }, h('summary', {}, b[1]), h('p', { html: md(b[2]) })));
    else if (t === 'code') into.append(h('pre', {}, b[1]));
    else if (t === 'html') into.append(h('div', { html: b[1] }));
    else if (t === 'table') { const tb = h('table', { class: 't' }, h('tr', {}, ...b[1].map(x => h('th', {}, x)))); b[2].forEach(r => tb.append(h('tr', {}, ...r.map(c => h('td', { html: md(c) }))))); into.append(h('div', { class: 'tw' }, tb)); }
    else if (t === 'grid') into.append(h('div', { class: 'grid' }, ...b[1].map(c => h('div', { class: 'card' }, h('h4', { html: md(c[0]) }), h('p', { html: md(c[1]) })))));
    else if (t === 'try') into.append(Workbench(b[1]));
    else if (t === 'wbfull') into.append(Workbench({ full: true, caption: 'Mini Postman', reqs: [COLLECTIONS[0].items[0]] }));
    else if (t === 'lab') into.append(Lab(LABS[b[1]]()));
    else if (t === 'w') into.append(W[b[1]](b[2]));
    else if (t === 'quiz') into.append(Quiz(b[1], b[2]));
    else if (t === 'catalog') into.append(catalogView());
    else if (t === 'cheat') into.append(cheatView());
  });
}
function catalogView() {
  const rows = [['httpbin.org (and postman-echo.com)', 'A server that echoes what you send. Great for learning.', ['GET /get', 'POST /post', 'PUT /put', 'PATCH /patch', 'DELETE /delete', 'GET /headers', 'GET /html', 'GET /json', '/status/{code}', '/delay/{seconds}']], ['jsonplaceholder.typicode.com', 'A fake blog: 100 posts, comments, 10 users. POST, PUT, PATCH, DELETE answer but nothing is really saved.', ['/posts', '/posts/{id}', '/posts/{id}/comments', '/comments', '/users', '/users/{id}', '?userId=1', '?_page=2&_limit=10 (X-Total-Count)']], ['api.github.com + github.com', 'Practice copy of GitHub profile data (octocat) with the 60-per-hour rate limit and Link headers.', ['/users/octocat', '/users/octocat/repos?per_page=2&page=2', 'github.com/octocat (HTML page)']], ['api.open-meteo.com', 'Weather. No key, and CORS is allowed. Values are illustrative.', ['/v1/forecast?latitude=12.97&longitude=77.59&current=temperature_2m,…']], ['localhost:8000', 'Ananya’s portfolio API: a reference build of the Module 4 design. Owner key: owner-secret-123 (X-API-Key header).', ['GET /api/resume, /profile, /summary, /experience, /projects, /skills, /education, /awards, /awards/{id}', 'POST/GET /api/messages · PATCH/DELETE /api/messages/{id}', 'PATCH /api/projects/{project_id}', 'POST /api/appointments']], ['127.0.0.1:5500', 'Live Server: your own site.', ['/resume.html', '/data/resume.json', '/data/raw/{experience,awards,summary}.json', '/fixtures/weather-bengaluru.json', 'anything else → HTML 404']], ['api.nocors.example', 'A server that forgot CORS.', ['/quotes (no CORS headers)', '/paged (CORS ok, X-Total-Count not exposed)']]];
  const box = h('div'); rows.forEach(r => box.append(h('div', { class: 'card', style: 'margin:10px 0' }, h('h4', { class: 'mono' }, r[0]), h('p', {}, r[1]), h('p', { class: 'mono', style: 'color:var(--muted)' }, r[2].join('   ')))));
  box.append(h('div', { class: 'note info', html: '<p>Any other host gives <b>ENOTFOUND</b> (no such server), just like a typo in real life. These sites are pretend copies that live inside this page, so they work offline.</p>' })); return box;
}
function cheatView() {
  const b = h('div'); renderBlocks([
    ['h2', 'URL'], ['code', 'https://api.github.com:443/users/octocat/repos?per_page=5&page=2#top\nscheme   host            port path                 query              fragment (never sent)'],
    ['h2', 'Methods'], ['table', ['Method', 'CRUD', 'SQL', 'Safe to repeat?'], [['GET', 'Read', 'SELECT', 'Yes (never changes data)'], ['POST', 'Create', 'INSERT', 'No (double-click = two)'], ['PUT', 'Replace', 'UPDATE all columns', 'Yes'], ['PATCH', 'Change part', 'UPDATE some columns', 'Usually'], ['DELETE', 'Delete', 'DELETE', 'Yes (second gets 404)']]],
    ['h2', 'Status codes'], ['table', ['Family', 'Meaning', 'Codes'], [['2xx', 'It worked', '200 OK · 201 Created · 204 No Content'], ['3xx', 'Look elsewhere', '301 Moved · 304 Not Modified'], ['4xx', 'Fix your request', '400 · 401 no key · 403 not allowed · 404 not found · 405 wrong method · 409 conflict · 422 invalid values · 429 too many'], ['5xx', 'Server broke', '500 · 502 · 503']]],
    ['h2', 'Headers'], ['table', ['Header', 'Use'], [['Content-Type', 'What the body is'], ['Accept', 'What I want back'], ['Authorization / X-API-Key', 'Who is asking'], ['Cache-Control', 'How long to reuse'], ['Location', 'Where the new thing lives (with 201)'], ['x-ratelimit-remaining · Retry-After', 'Allowance left · seconds to wait'], ['Access-Control-Allow-Origin / -Expose-Headers', 'CORS: who may read, which headers JS may see']]],
    ['h2', 'JSON'], ['code', 'six types: string number boolean null object array\n"double quotes" · "quoted": keys · no trailing commas · no comments · no undefined\ndates are strings: "2021-06-01"      null is not 0 and not ""'],
    ['h2', 'fetch() safely'], ['code', 'const response = await fetch(url, { signal: AbortSignal.timeout(8000) });\nif (!response.ok) throw new Error(`HTTP ${response.status}`);   // 404 does NOT reject\nconst type = response.headers.get("Content-Type") || "";\nif (!type.includes("application/json")) throw new Error("format");\nconst data = await response.json();\nconst params = new URLSearchParams({ q: "Product & Platform", page: 2 });'],
    ['h2', 'REST design'], ['ul', ['Nouns, plural, lowercase: `/api/awards`. Item id in the path: `/api/awards/5`.', 'Filters in the query: `?category=Industry&page=2&limit=10`.', 'Missing item → 404. Valid filter with no matches → `200 []`. Invalid value → 422.', 'One error format: `{"error": {"status", "code", "message", "fields"}}`.', 'Within a version only add. Renames and type changes break clients.']]
  ], b); return b;
}

/* ---------- shell ---------- */
const main = $('#main'), side = $('#side');
function drawSide(cur) {
  side.innerHTML = '';
  let lastMod = -1; LESSONS.forEach(l => { if (l.mod !== lastMod) { side.append(h('h4', {}, MODS[l.mod])); lastMod = l.mod; } side.append(h('a', { href: '#' + l.id, class: l.id === cur ? 'on' : '' }, h('span', { class: 'n' }, l.n || '★'), h('span', {}, l.title.length > 38 ? l.title.slice(0, 36) + '…' : l.title), done[l.id] ? h('span', { class: 'd' }, '✓') : null)); });
  side.append(h('h4', {}, 'Tools')); PAGES.forEach(p => side.append(h('a', { href: '#' + p.id, class: p.id === cur ? 'on' : '' }, h('span', { class: 'n' }, '⚙'), p.title)));
  const pct = Math.round(100 * LESSONS.filter(l => done[l.id]).length / LESSONS.length); $('#pbar').style.width = pct + '%'; $('#plab').textContent = pct + '% done';
}
function show(id) {
  const pages = allPages(); let p = pages.find(x => x.id === id) || LESSONS[0]; const idx = LESSONS.indexOf(p);
  main.innerHTML = ''; const pg = h('div', { class: 'page' });
  if (p.n) pg.append(h('div', {}, h('span', { class: 'tag' }, MODS[p.mod]), p.src ? h('span', { class: 'tag' }, p.src) : null)); else if (p.src) pg.append(h('div', {}, h('span', { class: 'tag' }, p.src)));
  pg.append(h('h1', {}, (p.n ? p.n + '  ' : '') + p.title), h('p', { class: 'lead' }, p.lead || ''));
  renderBlocks(p.blocks, pg);
  if (idx >= 0) {
    const prev = LESSONS[idx - 1], next = LESSONS[idx + 1];
    pg.append(h('div', { class: 'nav2' }, prev ? h('a', { class: 'btn', href: '#' + prev.id }, '← ' + prev.title) : h('span'), h('button', { class: 'btn' + (done[p.id] ? '' : ' primary'), onclick: () => { done[p.id] = true; store.set('done', done); drawSide(p.id); if (next) location.hash = next.id; } }, done[p.id] ? 'Done ✓' + (next ? ' · Next →' : '') : 'Mark done' + (next ? ' and continue →' : ' ✓'))));
  }
  main.append(pg); main.scrollTop = 0; document.title = (p.n ? p.n + ' ' : '') + p.title + ' · API Playground'; drawSide(p.id); side.classList.remove('open');
}
function route() { show((location.hash || '').replace('#', '') || 'welcome'); }
window.addEventListener('hashchange', route);
/* theme */
function setTheme(t) { document.documentElement.setAttribute('data-theme', t); store.set('theme', t); }
$('#themeBtn').onclick = () => { const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); setTheme(cur === 'dark' ? 'light' : 'dark'); };
const savedTheme = store.get('theme', null); if (savedTheme) setTheme(savedTheme);
$('#menuBtn').onclick = () => side.classList.toggle('open');
/* practice controls */
const pop = $('#pop');
function drawPop() {
  pop.innerHTML = '';
  const net = h('select', { 'aria-label': 'Network', onchange: e => { Env.network = e.target.value; Env.changed(); } }, ...[['normal', 'Normal'], ['slow', 'Slow 3G (+1.5 s each request)'], ['offline', 'Offline']].map(o => h('option', { value: o[0], selected: Env.network === o[0] ? '' : null }, o[1])));
  const gh = h('div', { class: 'row' }, h('span', {}, 'GitHub allowance left: ', h('b', {}, String(60 - Env.ghUsed) + ' / 60')), h('button', { class: 'btn small', onclick: () => { Env.ghUsed = 60; Env.changed(); } }, 'Use it all up'), h('button', { class: 'btn small', onclick: () => { Env.ghUsed = 0; Env.changed(); } }, 'Reset'));
  pop.append(h('b', {}, 'Practice controls'), h('p', { style: 'font-size:13px;color:var(--muted);margin:4px 0' }, 'Break things on purpose. These change the pretend internet for every request and lab.'),
    h('label', {}, 'Network (like DevTools throttling)', net),
    h('label', {}, 'Timeout for the Mini Postman (ms)', h('input', { type: 'number', value: Env.timeoutMs, min: 100, step: 100, oninput: e => { Env.timeoutMs = Math.max(100, +e.target.value || 8000); } })),
    h('label', { class: 'row', style: 'flex-direction:row' }, h('input', { type: 'checkbox', checked: Env.server8000 ? '' : null, onchange: e => { Env.server8000 = e.target.checked; Env.changed(); } }), 'Server on localhost:8000 is running'),
    gh, h('label', {}, 'Page origin used by “web page” requests (CORS)', h('select', { onchange: e => { Env.origin = e.target.value; } }, ...['http://127.0.0.1:5500', 'https://ananya.github.io', 'http://localhost:3000'].map(o => h('option', { selected: Env.origin === o ? '' : null }, o)))),
    h('div', { class: 'row' }, h('button', { class: 'btn small', onclick: () => { Env.network = 'normal'; Env.timeoutMs = 8000; Env.server8000 = true; Env.ghUsed = 0; Env.blocked = []; Env.changed(); drawPop(); } }, 'Reset everything')));
}
$('#ctlBtn').onclick = () => { pop.classList.toggle('open'); drawPop(); };
document.addEventListener('click', e => { if (!pop.contains(e.target) && e.target !== $('#ctlBtn')) pop.classList.remove('open'); });
Env.listeners.push(() => { if (pop.classList.contains('open')) drawPop(); $('#ctlBtn').classList.toggle('primary', Env.network !== 'normal' || !Env.server8000 || Env.ghUsed >= 60); });
route();

</script>
