```js run err | Forgot cups++ (guarded)\nlet cups = 0;\n\nwhile (cups < 5) {\n  // we forgot cups++ here, so cups is always 0\n}\n\nconsole.log(\"This line is never reached\");\n```\n\n> tip: If a real tab freezes, close **just that tab**. You do not need to restart the laptop. The fix is nearly always a missing increment, or a condition that can never become false.\n\n```lab\ntitle: Bulk Price Table\nkind: exercise\nmode: console\n@@intro\nTurn the loop above into something Asha could actually print and stick on the counter.\n@@steps\n- Declare `const price` set to any number, for example `20`.\n- Write a `for` loop that prints the price of 1 to 10 cups, for example `7 x 1 = 7`.\n- Change your loop to **only print the even totals** by combining the loop with an `if` and `%`.\n- **Bonus:** write a second loop that counts backwards from 10 to 1 (a closing-time countdown).\n@@js\nconst price = 20;\n\n// loop 1: the price table\n\n\n// loop 2 (bonus): countdown from 10 to 1\n\n@@hint\nStart the counter at 1 and stop at 10: `for (let n = 1; n <= 10; n++) { ... }`.\n@@hint\nInside the loop, compute the total first: `const total = price * n;` then `if (total % 2 === 0) { ... }`.\n@@hint\nTo count backwards, start high and subtract: `for (let n = 10; n >= 1; n--)`.\n@@solution\nconst price = 20;\n\nfor (let n = 1; n <= 10; n++) {\n  const total = price * n;\n  if (total % 2 === 0) {\n    console.log(`${price} x ${n} = ${total}`);\n  }\n}\n\nfor (let n = 10; n >= 1; n--) {\n  console.log(`Closing in ${n}...`);\n}\nconsole.log(\"Closed!\");\n```\n\n## Repeating \"until something happens\": while, break, continue\n\nUse a **`for`** loop when you know **how many** times to repeat (\"ten cups\"). Use a **`while`** loop when you repeat **until something happens** and do not know how many steps that will take.\n\n> analogy: A for loop is \"stir exactly 10 times\". A while loop is \"keep stirring until the sugar dissolves\". You do not know how many stirs that is going to take.\n\n```js run | A while loop\nlet sugarLumps = 10;\n\nwhile (sugarLumps > 0) {\n  console.log(`Sugar left: ${sugarLumps}`);\n  sugarLumps = sugarLumps - 3;   // without a line that changes the condition: infinite loop!\n}\nconsole.log(\"Dissolved. Final value:\", sugarLumps);\n```\n\n**Every `while` loop must change something that affects its condition**, or it never ends. That last line inside the loop is the \"stirring\".\n\n### break and continue: skipping and stopping\n\n| Keyword | What it does | In the café |\n| --- | --- | --- |\n| `break` | Leave the loop **right now**, completely | \"Stop making cups, the milk ran out.\" |\n| `continue` | Skip **just this round**, then carry on with the next | \"This one is sold out. Skip it and move to the next.\" |\n\n```js run | break stops, continue skips\nconsole.log(\"--- break at 6 ---\");\nfor (let i = 1; i <= 10; i++) {\n  if (i === 6) {\n    break;            // the whole loop ends here\n  }\n  console.log(i);     // prints 1 to 5\n}\n\nconsole.log(\"--- continue on evens ---\");\nfor (let i = 1; i <= 10; i++) {\n  if (i % 2 === 0) {\n    continue;         // skip this round only\n  }\n  console.log(i);     // prints only the odd numbers\n}\n```\n\n```lab\ntitle: Countdown and Number Filter\nkind: exercise\nmode: console\n@@intro\nOne loop of each kind, each using the new keywords.\n@@steps\n- Using a **while** loop, print a countdown from 5 down to 1, then `Go!`.\n- Using a **for** loop from 1 to 20, print every number **except multiples of 3** (skip them with `continue`).\n- Using a **for** loop from 1 to 100, **stop completely** (`break`) at the first number over 15 that is divisible by 5, and print it.\n@@js\n// 1. while countdown\n\n\n// 2. for loop with continue\n\n\n// 3. for loop with break\n\n@@hint\nCountdown: `let n = 5; while (n >= 1) { console.log(n); n--; }` then log `\"Go!\"` after the loop.\n@@hint\nFor the break task, the condition has two parts: `i > 15 && i % 5 === 0`.\n@@solution\nlet n = 5;\nwhile (n >= 1) {\n  console.log(n);\n  n--;\n}\nconsole.log(\"Go!\");\n\nfor (let i = 1; i <= 20; i++) {\n  if (i % 3 === 0) {\n    continue;\n  }\n  console.log(i);\n}\n\nfor (let i = 1; i <= 100; i++) {\n  if (i > 15 && i % 5 === 0) {\n    console.log(`First one over 15 divisible by 5: ${i}`);\n    break;\n  }\n}\n```\n\n## Functions: recipes you can reuse\n\nYou have been repeating code. A **function** lets you write a set of steps once, give it a name, and run it whenever you like.\n\n> analogy: A function is a **recipe card** pinned in the kitchen. The *ingredients* you hand it are the **parameters**. The finished drink it gives back is the **return value**. Anyone can follow the card without knowing how it works inside.\n\nTwo ways to write the same function:\n\n```js run | Declaration and expression\n// Function declaration\nfunction greet(name) {\n  return `Hello, ${name}!`;\n}\n\n// Function expression: a function stored in a jar\nconst greet2 = function (name) {\n  return `Hello, ${name}!`;\n};\n\nconsole.log(greet(\"Asha\"));    // calling the function: greet is the name, (\"Asha\") hands in the ingredient\nconsole.log(greet2(\"Ravi\"));\n```\n\n- **Parameters** (`name`) are the placeholders written in the function. **Arguments** (`\"Asha\"`) are the real values handed in when you call it.\n- **`return`** sends a value back out **and stops the function immediately**. Nothing after `return` runs.\n- **Calling** a function means writing its name followed by brackets. Without the brackets you are just pointing at the recipe card, not following it.\n\nA difference between the two styles: a **declaration** can be called *before* it appears in the file (it is \"hoisted\", lifted to the top). An **expression** only works *after* the line that creates it.\n\n```js run err | Declarations are hoisted, expressions are not\nconsole.log(greet(\"Asha\"));    // works even though greet is written below\n\nfunction greet(name) {\n  return `Hello, ${name}!`;\n}\n\nconsole.log(greet2(\"Asha\"));   // too early: the jar is not filled yet\n\nconst greet2 = function (name) {\n  return `Hello, ${name}!`;\n};\n```\n\n### The number one bug: console.log is not return\n\n> bug: This single mistake will bite you again and again, so spend real time on it.\n\n```js run | Printing is not returning\nfunction addBroken(a, b) {\n  console.log(a + b);        // this only PRINTS the answer for humans to read\n}\n\nfunction addFixed(a, b) {\n  return a + b;              // this HANDS the answer back\n}\n\nconst result1 = addBroken(3, 4);   // prints 7\nconsole.log(result1);              // undefined: the function never gave anything back\n\nconst result2 = addFixed(3, 4);    // prints nothing\nconsole.log(result2);              // 7\nconsole.log(addFixed(3, 4) * 2);   // 14: we can keep calculating with it!\n```\n\n> analogy: `console.log` is **shouting the price across the café**. Everyone hears it, but nobody is holding anything. `return` is **handing the bill to the customer**. They can now pay it, fold it, or show it to a friend. A function with no `return` always hands back `undefined`, an empty hand.\n\n```lab\ntitle: Function Practice\nkind: exercise\nmode: console\n@@intro\nFour tiny functions. The last one is a deliberate bug.\n@@steps\n- Write a declaration `chaiCost(cups)` that **returns** `cups * 20`. Call it with three numbers and log each result.\n- Write an expression `isHappyHour(hour)` that returns `true` or `false` using a ternary inside `return` (happy hour is from 3 pm to 5 pm: hours 15 and 16).\n- Write `describeChaiTemp(temp)` returning `\"cold\"`, `\"warm\"`, `\"perfect\"` or `\"scorching\"` using `if / else if / else`.\n- Intentionally forget a `return` in one function and confirm the result is `undefined`. Add a comment explaining why.\n@@js\n// 1. chaiCost\n\n\n// 2. isHappyHour (function expression)\n\n\n// 3. describeChaiTemp\n\n\n// 4. a function that forgets to return\n\n@@hint\n`function chaiCost(cups) { return cups * 20; }` then `console.log(chaiCost(3));`\n@@hint\nFor the ternary: `return hour >= 15 && hour < 17 ? true : false;`\n@@solution\nfunction chaiCost(cups) {\n  return cups * 20;\n}\nconsole.log(chaiCost(1));\nconsole.log(chaiCost(3));\nconsole.log(chaiCost(10));\n\nconst isHappyHour = function (hour) {\n  return hour >= 15 && hour < 17 ? true : false;\n};\nconsole.log(isHappyHour(16));\nconsole.log(isHappyHour(9));\n\nfunction describeChaiTemp(temp) {\n  if (temp < 40) {\n    return \"cold\";\n  } else if (temp < 60) {\n    return \"warm\";\n  } else if (temp <= 75) {\n    return \"perfect\";\n  } else {\n    return \"scorching\";\n  }\n}\nconsole.log(describeChaiTemp(30));\nconsole.log(describeChaiTemp(70));\nconsole.log(describeChaiTemp(90));\n\nfunction forgetful(a, b) {\n  a + b; // no return, so the caller gets nothing back\n}\nconsole.log(forgetful(2, 3)); // undefined: a function with no return gives back undefined\n@@explain\nThe `isHappyHour` ternary is a little redundant, because `hour >= 15 && hour < 17` already *is* true or false. The deck asks for the ternary to practise the syntax. In real code you could simply `return hour >= 15 && hour < 17;`.\n```\n\n## Putting it together: the lucky customer counter\n\nOne function, one loop, three conditions. Asha runs a game at the counter:\n\n- Every **3rd** customer gets a free biscuit (**Fizz**).\n- Every **5th** customer gets a free sticker (**Buzz**).\n- Every **15th** customer, who is both, gets both (**FizzBuzz**).\n- Everyone else just gets their number.\n\n```js run | Mini FizzBuzz: the lucky customer counter\nfunction luckyReward(n) {\n  if (n % 15 === 0) return \"FizzBuzz\";   // both! check this first\n  else if (n % 3 === 0) return \"Fizz\";\n  else if (n % 5 === 0) return \"Buzz\";\n  else return String(n);\n}\n\nfor (let customer = 1; customer <= 20; customer++) {\n  console.log(`Customer ${customer}: ${luckyReward(customer)}`);\n}\n```\n\n> why: **Why check `n % 15` first?** A number divisible by both 3 and 5 is also divisible by 15. If you checked `n % 3` first, customer 15 would match \"Fizz\" immediately and the FizzBuzz branch could never be reached. It is the same ordering lesson as the loyalty tiers.\n\n```lab\ntitle: Your Own Crowd Counter\nkind: exercise\nmode: console\n@@intro\nBuild a variant of the lucky-customer function that describes how busy the café is.\n@@steps\n- Write `describeCrowd(n)`: `\"Quiet\"` under 10, `\"Busy\"` from 10 to 49, `\"Packed\"` for 50 and above. It must **return** the word.\n- Use a `for` loop to call it for numbers 1 to 60 and log each result.\n- Change the loop to `continue` (skip) any number that is a multiple of 7.\n- **Bonus:** rewrite `describeCrowd` as a function expression and confirm it still works.\n@@js\nfunction describeCrowd(n) {\n  // return \"Quiet\", \"Busy\" or \"Packed\"\n}\n\n// loop from 1 to 60 here\n\n@@hint\nCheck the smallest range first: `if (n < 10) return \"Quiet\";` then `else if (n < 50) return \"Busy\";` then `else return \"Packed\";`.\n@@solution\nfunction describeCrowd(n) {\n  if (n < 10) return \"Quiet\";\n  else if (n < 50) return \"Busy\";\n  else return \"Packed\";\n}\n\nfor (let n = 1; n <= 60; n++) {\n  if (n % 7 === 0) {\n    continue;\n  }\n  console.log(`${n} people: ${describeCrowd(n)}`);\n}\n\n// bonus: the expression version\nconst describeCrowd2 = function (n) {\n  if (n < 10) return \"Quiet\";\n  else if (n < 50) return \"Busy\";\n  else return \"Packed\";\n};\nconsole.log(describeCrowd2(25));\n```\n\n```quiz\nq: A function has `console.log(total)` as its last line and no `return`. What does `const x = thatFunction();` store in `x`?\na: The total\na*: undefined\na: null\na: An error\nwhy: Printing is only for humans. Without `return` the function hands back `undefined`.\nq: Which of these is **not** falsy?\na: 0\na: \"\"\na*: \"0\"\na: undefined\nwhy: `\"0\"` is text with a character in it, so it is truthy. Only `0`, `\"\"`, `null`, `undefined`, `NaN` and `false` are falsy.\nq: `for (let i = 0; i < 5; i++)` runs how many times?\na: 4\na*: 5\na: 6\na: Forever\nwhy: `i` takes the values 0, 1, 2, 3, 4. The condition `i < 5` fails when `i` becomes 5.\nq: You want \"repeat until the milk runs out\", and you do not know how many cups that is. Which loop fits best?\na: for\na*: while\na: if\na: continue\nwhy: `while` repeats until a condition changes. `for` is for a known count.\nq: What does `continue` do inside a loop?\na: Stops the loop completely\na*: Skips the rest of this round and goes to the next one\na: Restarts the loop from the beginning\na: Does nothing\nwhy: `break` leaves the loop. `continue` only skips the current round.\nq: In the FizzBuzz function, why is the `n % 15` check first?\na: It is the smallest number\na*: Numbers divisible by 15 would match `n % 3` first and never reach FizzBuzz\na: JavaScript requires the biggest number first\na: It runs faster\nwhy: The first matching branch wins, so the most specific condition must come first.\n```\n\n## Building blocks from this module\n\n```raw\n<div class=\"flow\">\n  <div class=\"step\"><b>Decide<\/b><span><code>if / else if / else<\/code> · ternary <code>?:<\/code> · truthy and falsy<\/span><\/div>\n  <div class=\"step\"><b>Repeat<\/b><span><code>for<\/code> · <code>while<\/code> · <code>break<\/code> · <code>continue<\/code><\/span><\/div>\n  <div class=\"step\"><b>Package<\/b><span>function declaration · function expression · <code>return<\/code><\/span><\/div>\n<\/div>\n```\n\n> note: **Next up: Module 3, Functions Deep Dive and Scope.** Shorter arrow-function syntax, default values, \"guard clauses\", and the rules for where a variable can be seen from.\n\n```check\ntitle: Self-check before Module 3\n- `homework-day1.js` and `homework.html` exist in `js-practice`, linked with `defer`\n- `letterGrade(score)` is a function that **returns** a string, with no stray `console.log`-only logic\n- `attendanceStatus(daysPresent, totalDays)` computes a percentage **before** comparing it\n- A `for` loop calls both functions for 8 or more simulated students and logs a readable summary line\n- `honorRoll(score, attendancePercent)` uses a ternary and returns a boolean\n- The Console shows no errors when `homework.html` is opened, and the code is commented\n```\n", "m3": "title: Functions Deep Dive and Scope\ntag: Module 3 · Day 2, morning\nshort: Arrows, defaults, scope\ntagline: Yesterday's functions worked. Today they get shorter, safer, and you learn the rule that decides which parts of your code can see which variables.\nstory: The till code is getting long, and the same price-formatting lines are copied in five places. Today Asha learns to write functions in a shorter style, to give them sensible defaults, to turn away bad input at the door, and to understand why a variable made in one part of the code is invisible in another. We are still working in the console-only `js-practice` folder.\nobjectives:\n- Write arrow functions in block-body and implicit-return form, and say when one reads better than a declaration\n- Give a function a default parameter, and use an early return as a guard clause instead of nesting `if / else`\n- Explain global, function and block scope, and the exact problem `let` and `const` fixed that `var` caused\n- Write small helper functions and call one from inside another\n- Refactor Module 2 functions into arrow form without changing their behaviour\n---\n## Arrow functions: the short recipe card\n\nYou already know two ways to write a function. JavaScript has a third, shorter one called an **arrow function**, written with `=>`. It does the same job in less space.\n\n```js run | The same function, three ways\n// 1. function declaration\nfunction double1(n) { return n * 2; }\n\n// 2. arrow function, block body (curly braces and a return)\nconst double2 = (n) => {\n  return n * 2;\n};\n\n// 3. arrow function, implicit return (no braces, no return word)\nconst double3 = (n) => n * 2;\n\nconsole.log(double1(21), double2(21), double3(21));   // 42 42 42\n```\n\nRead `(n) => n * 2` as: **\"given n, hand back n times 2.\"** The arrow `=>` separates the ingredients (left) from the result (right).\n\nThree small rules:\n\n- **Implicit return.** When the body is a *single expression*, drop the braces **and** the word `return`. The value of the expression is handed back automatically.\n- **Block body.** When you need several statements, use `{ }` and write `return` yourself, as you always have.\n- **Brackets around parameters.** A single parameter can legally drop them (`n => n * 2`), but **this course always keeps them** for consistency. With **no** parameters the brackets are required: `() => console.log(\"hi\")`.\n\n> warn: If you open curly braces `{ }` after the arrow, you are back in block-body mode and you **must** write `return`. Writing `(n) => { n * 2 }` hands back `undefined`, the same \"forgot to return\" bug from Module 2.\n\n```js run | Block body forgets to return\nconst good = (n) => n * 2;          // implicit return\nconst broken = (n) => { n * 2 };    // braces, but no return\n\nconsole.log(good(5));    // 10\nconsole.log(broken(5));  // undefined\n```\n\n### When arrows read better, and when they do not\n\n> analogy: An arrow function is a **sticky note** with a quick instruction (\"double this\"). A function declaration is a **recipe card pinned on the wall** with a proper name. Sticky notes are perfect for one-off jobs. Recipes you use all the time deserve a name on the wall.\n\n| Arrow functions shine when… | Stick with a declaration when… |\n| --- | --- |\n| It is a short, throwaway helper you only use once, right here | It is a top-level, reusable function called from many places |\n| It is a one-line transformation like `(a, b) => a + b` | A descriptive name is more helpful than an arrow stored in a `const` |\n| You would describe it aloud as \"just take this and give back that\" | You want to call it **before** the line that defines it (declarations are hoisted) |\n\n**Rule of thumb:** if you can describe the function in five words or less, an arrow is perfect. If it is a named, reusable piece of the program's logic, a declaration is usually clearer.\n\nArrow functions will become your best friend in Module 4, when you hand tiny functions to `.map()` and `.filter()`.\n\n```js run | Refactoring Module 2 into arrows\n// Module 2 style\nfunction greetUser1(name) {\n  return `Welcome, ${name}!`;\n}\n\n// arrow, block body (same logic, new clothes)\nconst greetUser = (name) => {\n  return `Welcome, ${name}!`;\n};\n\n// a one-liner with implicit return\nconst shout = (message) => message.toUpperCase() + \"!\";\n\nconsole.log(greetUser(\"Ada\"));\nconsole.log(shout(\"fresh samosas\"));\n```\n\n```lab\ntitle: Refactor to Arrows\nkind: exercise\nmode: console\n@@intro\nTake two functions you already wrote and rewrite them as arrows without changing what they do.\n@@steps\n- Below are two Module 2 style functions. Rewrite **both** as arrow functions with the same parameter(s) and the same behaviour.\n- Decide for each: does it read better as a block-body arrow, or can it become an implicit-return one-liner?\n- Call each rewritten function at least twice with different inputs and `console.log` the results.\n@@js\n// Module 2 versions (keep these for reference)\nfunction chaiCost(cups) {\n  return cups * 20;\n}\n\nfunction describeChaiTemp(temp) {\n  if (temp < 40) {\n    return \"cold\";\n  } else if (temp <= 75) {\n    return \"perfect\";\n  } else {\n    return \"scorching\";\n  }\n}\n\n// your arrow versions go here\n@@hint\n`chaiCost` is a single expression, so it can be an implicit-return one-liner: `const chaiCost = (cups) => cups * 20;`\n@@hint\n`describeChaiTemp` has several statements, so it stays as a block-body arrow with `{ }` and `return`.\n@@solution\nconst chaiCostArrow = (cups) => cups * 20;\n\nconst describeChaiTempArrow = (temp) => {\n  if (temp < 40) {\n    return \"cold\";\n  } else if (temp <= 75) {\n    return \"perfect\";\n  } else {\n    return \"scorching\";\n  }\n};\n\nconsole.log(chaiCostArrow(3), chaiCostArrow(10));\nconsole.log(describeChaiTempArrow(20), describeChaiTempArrow(70), describeChaiTempArrow(95));\n@@explain\nUse a different name for the arrow version (`chaiCostArrow`) if the old function is still in the file. Two things cannot share one name in the same scope.\n```\n\n## Parameters in depth: defaults and early returns\n\n### Default parameters catch the gaps\n\nWhat happens if someone calls a function and forgets an ingredient?\n\n```js run | The bug waiting to happen\nconst greet = (name) => {\n  return `Hello, ${name}!`;\n};\n\nconsole.log(greet(\"Asha\"));  // Hello, Asha!\nconsole.log(greet());        // Hello, undefined!   <- nobody told it a name\n```\n\nA missing argument becomes `undefined`. A **default parameter** gives the ingredient a backup value:\n\n```js run | A default parameter\nfunction greet(name = \"friend\") {\n  return `Hello, ${name}!`;\n}\n\nconsole.log(greet());          // Hello, friend!   <- the default kicked in\nconsole.log(greet(\"Ada\"));     // Hello, Ada!\nconsole.log(greet(\"\"));        // \"Hello, !\"  <- the default did NOT kick in\nconsole.log(greet(0));         // \"Hello, 0!\" <- same here\n```\n\n> analogy: A default is the barista's rule: \"if the customer does not say how much sugar, use medium\". But if the customer says \"none\" (an empty answer), the barista has been *told* something, so the rule does not apply.\n\n> note: A default value is used **only when the argument is missing or `undefined`**. Passing something falsy such as `\"\"` or `0` still counts as \"provided\", so the default is ignored.\n\n### Guard clauses: turn bad input away at the door\n\nSuppose a price calculator should return `0` for a bad price or a bad quantity. The first attempt nests `if` inside `if`:\n\n```js run | The nested version (hard to read)\nfunction calculateTotalNested(price, quantity, discountPercent = 0) {\n  if (price > 0) {\n    if (quantity > 0) {\n      return price * quantity * (1 - discountPercent / 100);\n    } else {\n      return 0;\n    }\n  } else {\n    return 0;\n  }\n}\n\nconsole.log(calculateTotalNested(20, 3, 10));  // 54\nconsole.log(calculateTotalNested(-5, 3));      // 0\n```\n\nFeel how the \"real\" calculation is buried three levels deep. The fix is to **return early**:\n\n```js run | The guard-clause version\nfunction calculateTotal(price, quantity, discountPercent = 0) {\n  if (price <= 0) return 0;        // guard: bad price, leave immediately\n  if (quantity <= 0) return 0;     // guard: bad quantity, leave immediately\n\n  return price * quantity * (1 - discountPercent / 100);   // the real work, easy to find\n}\n\nconsole.log(calculateTotal(20, 3, 10));  // 54\nconsole.log(calculateTotal(-5, 3));      // 0\nconsole.log(calculateTotal(20, 0));      // 0\n```\n\n> analogy: A guard clause is a **bouncer at the door**. Anyone who does not meet the rules is turned away immediately, so the people inside never have to wonder if they belong. The moment you know a function's answer (including \"this input is invalid, I give up\") **return it**. Do not wrap the rest of the function in an `else` you do not need.\n\n```lab\ntitle: Defaults and Guard Clauses\nkind: exercise\nmode: console\n@@intro\nPractise both ideas together.\n@@steps\n- Write `formatPrice(amount, currencySymbol = \"₹\")` that returns a string like `\"₹499\"`, defaulting to ₹ when no symbol is passed.\n- Write `loyaltyTier(points)` using an **early return** for the invalid case: a negative number returns `\"Invalid points\"` immediately. Then return `\"Gold\"` (150+), `\"Silver\"` (75+) or `\"Member\"`.\n- Test both with at least three calls each, including **one call that relies on the default**.\n@@js\n// formatPrice\n\n\n// loyaltyTier\n\n@@hint\n`` function formatPrice(amount, currencySymbol = \"₹\") { return `${currencySymbol}${amount}`; } ``\n@@hint\nGuard first: `if (points < 0) return \"Invalid points\";` then the other checks, each with its own `return`.\n@@solution\nfunction formatPrice(amount, currencySymbol = \"₹\") {\n  return `${currencySymbol}${amount}`;\n}\n\nconsole.log(formatPrice(499));        // relies on the default\nconsole.log(formatPrice(499, \"$\"));\nconsole.log(formatPrice(20));\n\nfunction loyaltyTier(points) {\n  if (points < 0) return \"Invalid points\";\n  if (points >= 150) return \"Gold\";\n  if (points >= 75) return \"Silver\";\n  return \"Member\";\n}\n\nconsole.log(loyaltyTier(200));\nconsole.log(loyaltyTier(80));\nconsole.log(loyaltyTier(-5));\n@@explain\nNo `else` is needed anywhere. Each `return` already leaves the function, so reading top to bottom is like reading a checklist.\n```\n\n## Scope: which code can see which jar?\n\nNot every variable can be seen from everywhere. **Scope** is the rule that decides where a name is visible.\n\n> analogy: Think of the café as a building with rooms. A notice on the **front door** can be read by everyone inside. A note pinned in the **kitchen** is visible only in the kitchen. A label on one **shelf** in the kitchen is only visible while you stand at that shelf. **A room can see everything in the rooms around it (outward), but never the rooms inside it.**\n\n```raw\n<div class=\"rooms\">\n  <div class=\"rname\">Global scope · the whole café<\/div>\n  <div class=\"rvars\">const cafeName = \"Chai Corner\"<\/div>\n  <div class=\"room\">\n    <div class=\"rname\">Function scope · the kitchen (inside a function)<\/div>\n    <div class=\"rvars\">const barista = \"Asha\"<\/div>\n    <div class=\"room\">\n      <div class=\"rname\">Block scope · one shelf (inside the { } of an if or a loop)<\/div>\n      <div class=\"rvars\">let cupsOnShelf = 3<\/div>\n    <\/div>\n  <\/div>\n<\/div>\n```\n\n| Level | Made where | Visible where |\n| --- | --- | --- |\n| **Global** | Outside any function or block | Everywhere, including inside every function |\n| **Function** | Inside a function | Only inside that function |\n| **Block** | Inside any `{ }` using `let` or `const` | Only inside that block |\n\n```js run err | Global is visible inside, function-level is not visible outside\nconst cafeName = \"Chai Corner\";            // global\n\nfunction describeShift() {\n  const barista = \"Asha\";                  // function scope\n  console.log(`${barista} works at ${cafeName}`);   // can see both\n}\n\ndescribeShift();\nconsole.log(barista);   // ReferenceError: barista is not defined (we are outside the kitchen)\n```\n\n### The bug that `let` fixed\n\nBefore 2015, JavaScript only had `var`, and `var` ignored blocks. A variable made inside a loop **leaked** out into the rest of the code:\n\n```js run | var leaks out of the loop\nfor (var i = 0; i < 3; i++) {\n  console.log(`Inside the loop, i is ${i}`);\n}\nconsole.log(`After the loop, i is ${i}`);   // 3 -- it leaked out, and nobody asked for it\n```\n\n```js run err | let respects the block\nfor (let i = 0; i < 3; i++) {\n  console.log(`Inside the loop, i is ${i}`);\n}\nconsole.log(`After the loop, i is ${i}`);   // ReferenceError: the shelf's label is gone\n```\n\nThat leak is why we say **never use `var`**. Accidentally reusing a loop counter name somewhere else could silently clash. `let` and `const` stay inside the block where they were made.\n\n### Shadowing: same name, different jar\n\n```js run manual | Predict, then run\nlet total = 0;\n\nfunction addBonus() {\n  let total = 100;       // a BRAND NEW total, living only inside this function\n  console.log(`Inside addBonus, total is ${total}`);\n}\n\naddBonus();\nconsole.log(`Outside addBonus, total is ${total}`);\n```\n\n> predict: What does each line print? Write it down before pressing Run. Is the outer `total` changed by the function?\n\nIt prints `100`, then `0`. The inner `total` is a **new jar that hides the outer one** while we are inside the function. This is called **shadowing**. Two staff called Raj: inside the kitchen, \"Raj\" means the kitchen's Raj. The front-of-house Raj is unaffected.\n\n```lab\ntitle: Predict, Then Run\nkind: exercise\nmode: console\n@@intro\nThis is the most common scope mix-up in the whole course. Take the extra minute to actually predict first.\n@@steps\n- Read the `addBonus` snippet below and **write down** what you think prints. Then run it and compare.\n- Write your own small example of **block scope** using an `if`: make a variable inside the braces, and log it **outside** to see a `ReferenceError`.\n@@js\nlet total = 0;\n\nfunction addBonus() {\n  let total = 100;\n  console.log(`Inside addBonus, total is ${total}`);\n}\n\naddBonus();\nconsole.log(`Outside addBonus, total is ${total}`);\n\n// your own block-scope example below\n@@hint\nMake the variable inside an `if (true) { ... }` block with `const secret = \"free cake\";`. Then try `console.log(secret);` **after** the closing brace.\n@@solution\nlet total = 0;\n\nfunction addBonus() {\n  let total = 100;\n  console.log(`Inside addBonus, total is ${total}`);\n}\n\naddBonus();\nconsole.log(`Outside addBonus, total is ${total}`);\n\nif (true) {\n  const secret = \"free cake\";\n  console.log(`Inside the block: ${secret}`);\n}\n// console.log(secret);   // un-comment this line to see: ReferenceError: secret is not defined\n@@explain\nThe last line is commented out so the file keeps running. Remove the `//` to see the error. You will meet a clean way to *catch* errors like this in Module 9.\n```\n\n## Functions calling functions\n\nThe best programs are built from **small, named pieces** that each do one job, and larger functions that call them.\n\n```js run | One function trusting another\nfunction formatPrice(amount, currencySymbol = \"₹\") {\n  return `${currencySymbol}${amount.toFixed(2)}`;     // toFixed(2) always shows two decimals\n}\n\nfunction describeItem(itemName, price) {\n  const priceText = formatPrice(price);               // one function calling another\n  return `${itemName}: ${priceText}`;\n}\n\nconsole.log(describeItem(\"Masala Chai\", 20));   // Masala Chai: ₹20.00\nconsole.log(describeItem(\"Samosa\", 15.5));      // Samosa: ₹15.50\n```\n\n`describeItem` did not need to know **how** a price gets formatted. It just trusted `formatPrice` to handle that part. If Asha later wants \"Rs.\" instead of \"₹\", you change **one** place and every sentence updates. Build complexity out of small pieces and let each piece do one job well.\n\n> cafe: This is how the real site will work. In Module 7 a `renderMenu()` function will call a small `menuCard()` helper for every item, and that helper will call `formatPrice()`. You are building the toolbox now.\n\n```lab\ntitle: Build the Function Toolkit (Capstone)\nkind: exercise\nmode: console\n@@intro\nThe last lab of the module. Build the helpers a real till would need, in one file.\n@@steps\n- `formatPrice(amount, currencySymbol = \"₹\")`: reuse it from Exercise 2, or write it now. Use `toFixed(2)`.\n- `isValidQuantity(qty)` using an early-return guard clause (your slides call the same idea `isValidAge`). It returns `false` for anything below 1 or above 100.\n- `calculateDiscountedPrice = (price, discountPercent = 0) => ...`: an **arrow** function with a guard clause that ignores invalid percentages (below 0 or above 100).\n- `describePurchase(itemName, price, discountPercent)` which **calls both helpers** above and returns a full sentence.\n- Call `describePurchase` at least **three times** with different items, prices and discounts, including a 0% or missing discount.\n- Add a short comment above each function naming its scope level (global, function or block).\n@@js\n// scope: global\nfunction formatPrice(amount, currencySymbol = \"₹\") {\n  // return the price as text\n}\n\n// build the other three below\n\n@@hint\n`calculateDiscountedPrice`: first `if (discountPercent < 0 || discountPercent > 100) return price;` then `return price - (price * discountPercent) / 100;`.\n@@hint\nInside `describePurchase`, compute `const finalPrice = calculateDiscountedPrice(price, discountPercent);` and then use `formatPrice(finalPrice)` in the template literal.\n@@solution\n// scope: global (visible everywhere)\nfunction formatPrice(amount, currencySymbol = \"₹\") {\n  return `${currencySymbol}${amount.toFixed(2)}`;\n}\n\n// scope: global\nfunction isValidQuantity(qty) {\n  if (typeof qty !== \"number\") return false;\n  if (qty < 1) return false;\n  if (qty > 100) return false;\n  return true;\n}\n\n// scope: global (the arrow is stored in a global const)\nconst calculateDiscountedPrice = (price, discountPercent = 0) => {\n  if (discountPercent < 0 || discountPercent > 100) return price;\n  return price - (price * discountPercent) / 100;\n};\n\n// scope: global. Its own variables are function-scoped.\nfunction describePurchase(itemName, price, discountPercent) {\n  const finalPrice = calculateDiscountedPrice(price, discountPercent);\n  return `${itemName}: ${formatPrice(price)} -> ${formatPrice(finalPrice)}`;\n}\n\nconsole.log(describePurchase(\"Cold Coffee\", 60, 10));\nconsole.log(describePurchase(\"Samosa\", 15));          // discount missing: default 0\nconsole.log(describePurchase(\"Veg Sandwich\", 50, 0));\nconsole.log(describePurchase(\"Lemon Soda\", 35, 150)); // invalid discount is ignored\nconsole.log(isValidQuantity(3), isValidQuantity(0), isValidQuantity(500));\n@@explain\nNotice `describePurchase` never repeats the discount maths or the formatting. It *asks* the helpers. That is the whole idea of this module.\n```\n\n```quiz\nq: What does `const add = (a, b) => { a + b };` return when called as `add(2, 3)`?\na: 5\na*: undefined\na: \"5\"\na: An error\nwhy: Curly braces switch the arrow into block-body mode, so you must write `return`. Without it the function hands back `undefined`.\nq: `function greet(name = \"friend\")`. What does `greet(\"\")` produce?\na: \"Hello, friend!\"\na*: \"Hello, !\"\na: An error\na: \"Hello, undefined!\"\nwhy: A default only applies when the argument is missing or `undefined`. An empty string was provided, so it is used as is.\nq: What is the main benefit of a guard clause?\na: It makes the code run faster\na*: It handles bad input first and keeps the main logic flat and easy to read\na: It replaces the need for return\na: It catches all errors automatically\nwhy: Returning early avoids deep nesting, so the real logic is easy to find.\nq: After `for (let i = 0; i < 3; i++) { }`, what happens if you log `i`?\na: It prints 3\na: It prints 0\na*: ReferenceError: i is not defined\na: It prints undefined\nwhy: `let` is block-scoped. The `i` exists only inside the loop. With `var` it would have leaked and printed 3.\nq: In the shadowing example, what is the outer `total` after `addBonus()` runs?\na: 100\na*: 0\na: undefined\na: 200\nwhy: The inner `total` is a separate jar. The outer one was never touched.\n```\n\n## Building blocks from this module\n\n```raw\n<div class=\"flow\">\n  <div class=\"step\"><b>Functions<\/b><span>arrow function · implicit return<\/span><\/div>\n  <div class=\"step\"><b>Parameters<\/b><span>default parameter · guard clause<\/span><\/div>\n  <div class=\"step\"><b>Scope<\/b><span>global · function · block · shadowing<\/span><\/div>\n<\/div>\n```\n\n> note: **Next up: Module 4, Arrays, Objects and Data Structures.** We stop working with single values and start working with *collections*. By the end you will have written real project data you can reuse.\n\n```check\ntitle: Self-check before Module 4\n- `functions-scope.js` exists inside `js-practice`, alongside `practice.js`\n- At least **6 functions** across today's work and the assignment, with no duplicated logic\n- At least one function uses a **default parameter**, shown by a call that omits that argument\n- At least one function uses an **early-return guard clause**\n- At least one function **calls another function** from inside its own body\n- No `var` appears anywhere, and your scope explanation comment is in your own words\n```\n", "m4": "title: Arrays, Objects and Data Structures\ntag: Module 4 · Day 2, afternoon\nshort: Lists, bundles, the menu\ntagline: Until now each jar held one thing. Real apps hold collections of things. This is the module where the café's menu finally becomes data.\nstory: A café with one drink is not a café. Asha needs a menu: a list of items, each with a name, a description, a category and a price. By the end of the afternoon you will have written that menu as data and printed it neatly to the Console. This is **the first thing from the course you keep**. In Module 7 the website will draw its menu cards straight from this data.\nobjectives:\n- Create, index and change arrays with `[]`, `.length`, `.push()` and `.pop()`\n- Explain the difference between `.forEach()`, `.map()`, `.filter()` and `.find()`, and choose the right one\n- Write object literals and read and write properties with dot and bracket notation\n- Recognise and build the \"array of objects\" shape, the standard way real apps hold lists of things\n- Combine arrays, objects and `.forEach()` / `.map()` to print formatted output from structured data\n- Produce a complete, correct data file that Module 7 reuses as it is\n---\n## Arrays: an ordered list\n\n> analogy: An array is a **row of numbered cup holders** on the counter. Each holder has a position number, and **the first holder is number 0**, not 1. You can ask \"what is in holder 2?\" or \"how many holders are there?\"\n\n```js run | Creating and indexing an array\nconst drinks = [\"Masala Chai\", \"Filter Coffee\", \"Cold Coffee\"];\n\nconsole.log(drinks);           // the whole list\nconsole.log(drinks[0]);        // \"Masala Chai\"  <- the FIRST item is index 0\nconsole.log(drinks[2]);        // \"Cold Coffee\"\nconsole.log(drinks[3]);        // undefined      <- there is no holder number 3\nconsole.log(drinks.length);    // 3              <- how many items\nconsole.log(drinks[drinks.length - 1]);   // the LAST item, whatever the length\n```\n\nThree habits to build now:\n\n- Arrays are **zero-indexed**. The first item is `[0]`. This trips up almost everyone at first.\n- `.length` is a **property**. No brackets after it: `drinks.length`, not `drinks.length()`.\n- Arrays can hold any type, even mixed ones, but we will mostly keep one type per array.\n\n### Adding and removing: push and pop\n\n```js run | push adds to the end, pop takes from the end\nconst toDoList = [\"wipe tables\", \"restock cups\"];\n\ntoDoList.push(\"order milk\");           // adds to the END\nconsole.log(toDoList);                 // [\"wipe tables\", \"restock cups\", \"order milk\"]\n\nconst finished = toDoList.pop();       // removes from the END and hands it back\nconsole.log(finished);                 // \"order milk\"\nconsole.log(toDoList);                 // [\"wipe tables\", \"restock cups\"]\n\ntoDoList.unshift(\"open shutters\");     // the same ideas at the FRONT: unshift adds...\nconsole.log(toDoList.shift());         // ...and shift removes from the front\n```\n\n`.push()` and `.pop()` cover about 95% of what you need this week. `.unshift()` and `.shift()` do the same thing at the front.\n\n> note: **A `const` array can still change.** `const` seals the *jar* (you cannot point `toDoList` at a different list), but the cup holders inside can still be added to and removed. What you cannot do is `toDoList = []` on a `const`.\n\n## The four methods that matter most\n\nAn array method is a built-in skill every array knows. Four of them do almost all the day-to-day work in front-end code. Each one takes a **small function** (usually an arrow function from Module 3) and applies it to every item.\n\n```raw\n<div class=\"trio\">\n  <div class=\"mini-card\"><div class=\"big\">.forEach()<\/div><h4>Do something with each<\/h4><p>Runs your function once per item for its <em>side effect<\/em> (like printing). Returns nothing useful.<\/p><\/div>\n  <div class=\"mini-card\"><div class=\"big\">.map()<\/div><h4>Transform each<\/h4><p>Runs your function per item and collects the results into a <strong>new array of the same length<\/strong>.<\/p><\/div>\n  <div class=\"mini-card\"><div class=\"big\">.filter()<\/div><h4>Keep only some<\/h4><p>Keeps the items that pass your test. Returns a <strong>new, possibly shorter array<\/strong>.<\/p><\/div>\n  <div class=\"mini-card\"><div class=\"big\">.find()<\/div><h4>Get the first match<\/h4><p>Stops at the first match. Returns <strong>one item<\/strong>, or <code>undefined<\/code>.<\/p><\/div>\n<\/div>\n```\n\n> analogy: Imagine a tray of six items.<br>**forEach**: walk along the tray and announce each item aloud. You do not leave with anything new.<br>**map**: put a new price sticker on every item, and end up with a second tray of the re-priced items.<br>**filter**: pick out only the items under ₹40 and carry that smaller tray away.<br>**find**: grab the *first* item that matches and stop looking.\n\n### forEach: do something, return nothing\n\n```js run | forEach\nconst prices = [20, 30, 60, 35, 15, 50];\n\nprices.forEach(function (price) {\n  console.log(`Price: ₹${price}`);\n});\n\n// the same thing with an arrow function (you will see this style everywhere)\nprices.forEach((price) => console.log(`Price: ₹${price}`));\n\nconst result = prices.forEach((price) => price);\nconsole.log(result);   // undefined: forEach DOES something, it does not BUILD something\n```\n\n### map: transform into a new array\n\n```js run | map\nconst prices = [20, 30, 60, 35, 15, 50];\n\nconst festivalPrices = prices.map((price) => price + 5);   // add ₹5 to every price\n\nconsole.log(festivalPrices);   // [25, 35, 65, 40, 20, 55]\nconsole.log(prices);           // [20, 30, 60, 35, 15, 50]  <- the original is untouched\n```\n\n`.map()`'s function **must return a value for every item**, because that returned value is what ends up in the new array.\n\n```js run | The classic map bug: forgetting return\nconst prices = [20, 30, 60];\n\nconst good = prices.map((p) => p + 5);        // implicit return\nconst broken = prices.map((p) => { p + 5 });  // braces, but no return\n\nconsole.log(good);    // [25, 35, 65]\nconsole.log(broken);  // [undefined, undefined, undefined]\n```\n\n### filter and find: a list, or one thing\n\n```js run | filter vs find\nconst prices = [20, 30, 60, 35, 15, 50];\n\nconst cheap = prices.filter((price) => price < 40);\nconsole.log(cheap);                 // [20, 30, 35, 15]  <- a LIST of everything that passed\n\nconst firstBig = prices.find((price) => price >= 50);\nconsole.log(firstBig);              // 60                <- ONE item: the FIRST match (not 60 and 50)\n\nconst nothing = prices.find((price) => price > 200);\nconsole.log(nothing);               // undefined         <- no match means undefined\n```\n\n| Method | Gives back | Length of result | Typical use |\n| --- | --- | --- | --- |\n| `.forEach()` | `undefined` | n/a | Print, log, update the page |\n| `.map()` | a new array | **same** as the original | Turn data into other data (prices, names, HTML) |\n| `.filter()` | a new array | **same or shorter** | Search, category filters |\n| `.find()` | one item or `undefined` | n/a | Look something up by id or name |\n\nThese four are the backbone of almost every front-end feature you will build for the rest of the course.\n\n```lab\ntitle: Array Methods Warm-Up\nkind: exercise\nmode: console\n@@intro\nAll four methods on the same little array of numbers.\n@@steps\n- Create an array of at least 6 numbers: cups sold on each day.\n- Use `.forEach()` to log each one with a label, for example `Cups: 84`.\n- Use `.map()` to build a **new** array where every day has 10 extra cups (festival week).\n- Use `.filter()` to build a new array containing only days of **80 cups or more**.\n- Use `.find()` to get the first day **below 60** cups. If the result is `undefined`, log `No slow days!`.\n- **Stretch:** repeat all four operations on an array of your favourite drinks instead of numbers.\n@@js\nconst cupsPerDay = [84, 52, 91, 66, 120, 47, 78];\n\n@@hint\n`` cupsPerDay.forEach((cups) => console.log(`Cups: ${cups}`)); `` Mind the backticks.\n@@hint\nFor find, store the result first: `const slowDay = cupsPerDay.find((cups) => cups < 60);` then use an `if` on it, or a ternary.\n@@solution\nconst cupsPerDay = [84, 52, 91, 66, 120, 47, 78];\n\ncupsPerDay.forEach((cups) => console.log(`Cups: ${cups}`));\n\nconst festivalWeek = cupsPerDay.map((cups) => cups + 10);\nconsole.log(festivalWeek);\n\nconst busyDays = cupsPerDay.filter((cups) => cups >= 80);\nconsole.log(busyDays);\n\nconst slowDay = cupsPerDay.find((cups) => cups < 60);\nconsole.log(slowDay === undefined ? \"No slow days!\" : `First slow day: ${slowDay} cups`);\n```\n\n## Objects: one thing with several facts\n\nAn array is a list of things. An **object** describes **one** thing using several named facts.\n\n> analogy: An object is an **order slip** with labelled boxes: *Item: Masala Chai, Price: 20, In stock: yes*. Each box has a **name** (the key) and a **value**. The pair is called a *property*.\n\n```js run | An object literal\nconst item = {\n  name: \"Masala Chai\",\n  category: \"Hot\",\n  price: 20,\n  inStock: true\n};\n\nconsole.log(item.name);             // dot notation: \"Masala Chai\"\nconsole.log(item[\"category\"]);      // bracket notation: \"Hot\"\n\nitem.price = 25;                    // change a fact\nitem.sweet = true;                  // add a new fact\nconsole.log(item);\n```\n\nThere are two ways to read a property:\n\n| Notation | Looks like | Use it when |\n| --- | --- | --- |\n| **Dot** | `item.price` | The name is a simple word you already know (nearly always) |\n| **Bracket** | `item[\"price\"]` | The name has spaces or hyphens, **or the name is stored in a variable** |\n\n```js run | When bracket notation is required\nconst special = {\n  name: \"Cold Coffee\",\n  \"gluten free\": true      // a key with a space needs quotes\n};\n\nconsole.log(special[\"gluten free\"]);   // true: bracket notation works fine\n// console.log(special.gluten free);   // SyntaxError: dot notation cannot do this\n\nconst whichFact = \"name\";              // a key held in a variable\nconsole.log(special[whichFact]);       // \"Cold Coffee\"   (special.whichFact would look for a key literally called whichFact)\n```\n\n> tip: Sixty seconds spent on bracket notation now saves a lot of confusion later. Whenever you want to read a property whose name is **in a variable**, you need brackets.\n\n## The array-of-objects shape\n\nPut the two ideas together: a **list** where every item is a **bundle of facts**.\n\n```js run | The menu board as data\nconst menu = [\n  { name: \"Masala Chai\", category: \"Hot\", price: 20 },\n  { name: \"Cold Coffee\", category: \"Cold\", price: 60 },\n  { name: \"Samosa\", category: \"Snacks\", price: 15 }\n];\n\nmenu.forEach((item) => {\n  console.log(`${item.name} [${item.category}] ₹${item.price}`);\n});\n\nconsole.log(menu[1].name);      // \"Cold Coffee\": index into the array, then dot into the object\nconsole.table(menu);            // a neat table: one row per object, one column per key\n```\n\n> note: **This is the most useful data shape in front-end development.** A list of products, a feed of posts, a table of users: almost every real interface is, underneath, an array of objects. Your whole Module 7 will be \"turn this shape into cards on the page\".\n\nNow the four methods start to shine on real-looking data:\n\n```js run | Asking questions of the menu\n{{menu}}\n\nconst names = menu.map((item) => item.name);\nconsole.log(\"All names:\", names);\n\nconst inStock = menu.filter((item) => item.inStock);\nconsole.log(\"In stock:\", inStock.length, \"items\");\n\nconst hotDrinks = menu.filter((item) => item.category === \"Hot\");\nconsole.log(\"Hot drinks:\", hotDrinks.map((item) => item.name));\n\nconst samosa = menu.find((item) => item.name === \"Samosa\");\nconsole.log(`A samosa costs ₹${samosa.price}`);\n\n// chaining: filter first, then map the survivors\nconst affordableStock = menu.filter((item) => item.inStock && item.price < 40).map((item) => item.name);\nconsole.log(\"In stock and under ₹40:\", affordableStock);\n```\n\n> bug: **Inconsistent spelling quietly breaks things.** If one item has `category: \"Hot\"` and another has `\"hot\"`, they are *different* strings. A filter for `\"Hot\"` will miss the second one, and in Module 7 a category button would appear twice. Pick one casing convention and stick to it.\n\n## Capstone: build your menu data file\n\n> portfolio: In your slides this file is called `projects-data.js`, and each object has `title`, `description`, `tag` and `link`. The café version uses `name`, `description`, `category` and `price`. **Same shape, different words.** Whatever you build here is what your real site will show in Module 7, so slow down on the descriptions.\n\nEverything else today has been scratch work you can throw away. **This file is different. Keep it.**\n\n```lab\ntitle: Build the Menu Data File\nkind: exercise\nmode: console\n@@intro\nCreate the data and print it two ways. In your real folder this lives in a new file you keep. Here you write the same code.\n@@steps\n- Declare a `const` array called `menu`.\n- Add **4 to 6 objects**, each with at least `name`, `description`, `category` and `price`. (You can also add a `link` property like `\"#\"` as a placeholder.)\n- Write a `.forEach()` that logs each item as `Name — description [category]`.\n- Then write a `.map()` pass that builds a **new array of those same formatted strings**, and log that array.\n- Check: all categories use the **same casing**, and every description is a complete sentence with no \"TODO\".\n@@js\nconst menu = [\n  { name: \"Masala Chai\", description: \"Strong ginger-cardamom tea simmered with milk\", category: \"Hot\", price: 20 },\n  // add 3 to 5 more items here\n];\n\n@@hint\nCopy the first object's shape for each new item. Do not forget the comma between objects.\n@@hint\nThe `.map()` version needs a `return` if you use curly braces: `` menu.map((item) => { return `...`; }) ``, or use an implicit return without braces.\n@@solution\nconst menu = [\n  { name: \"Masala Chai\", description: \"Strong ginger-cardamom tea simmered with milk\", category: \"Hot\", price: 20 },\n  { name: \"Filter Coffee\", description: \"South Indian decoction coffee in a steel tumbler\", category: \"Hot\", price: 30 },\n  { name: \"Cold Coffee\", description: \"Chilled coffee blended with ice cream\", category: \"Cold\", price: 60 },\n  { name: \"Lemon Soda\", description: \"Fresh lime, salt and fizzy soda\", category: \"Cold\", price: 35 },\n  { name: \"Samosa\", description: \"Crisp pastry with spiced potato filling\", category: \"Snacks\", price: 15 },\n  { name: \"Veg Sandwich\", description: \"Grilled with mint chutney and cheese\", category: \"Snacks\", price: 50 }\n];\n\nmenu.forEach((item) => {\n  console.log(`${item.name} — ${item.description} [${item.category}]`);\n});\n\nconst formattedList = menu.map((item) => {\n  return `${item.name} — ${item.description} [${item.category}]`;\n});\nconsole.log(formattedList);\n@@explain\n`forEach` prints as it goes and gives back nothing. `map` builds a brand new array of strings you can reuse. In Module 7 the same `map` idea will build pieces of HTML instead of strings.\n```\n\n```quiz\nq: `const drinks = [\"a\", \"b\", \"c\"];` What is `drinks[3]`?\na: \"c\"\na*: undefined\na: An error\na: \"d\"\nwhy: Indexes run 0, 1, 2. There is no index 3, so you get `undefined`.\nq: Which method would you use to get **only the in-stock items** as a new list?\na: forEach\na: map\na*: filter\na: find\nwhy: `filter` keeps the items that pass a test and returns a new array.\nq: What does `[1, 2, 3].map((n) => n * 2)` return?\na: undefined\na*: [2, 4, 6]\na: 6\na: [1, 2, 3]\nwhy: `map` returns a new array of the same length containing each function result.\nq: How do you read a property whose name is stored in a variable `key`?\na: item.key\na*: item[key]\na: item(key)\na: item->key\nwhy: Dot notation looks for a property literally named `key`. Brackets use the value inside the variable.\nq: What does `.find()` return when nothing matches?\na: An empty array\na: null\na*: undefined\na: false\nwhy: `find` returns a single item or `undefined`. (`filter` is the one that returns an empty array.)\n```\n\n## Building blocks from this module\n\n```raw\n<div class=\"flow\">\n  <div class=\"step\"><b>Arrays<\/b><span><code>[ ]<\/code> · index from 0 · <code>.length<\/code> · <code>.push()<\/code> / <code>.pop()<\/code><\/span><\/div>\n  <div class=\"step\"><b>Methods<\/b><span><code>forEach<\/code> · <code>map<\/code> · <code>filter<\/code> · <code>find<\/code><\/span><\/div>\n  <div class=\"step\"><b>Objects<\/b><span><code>{ key: value }<\/code> · dot · bracket<\/span><\/div>\n  <div class=\"step\"><b>The shape<\/b><span>an array of objects<\/span><\/div>\n<\/div>\n```\n\n> note: **Next up: Module 5, the DOM.** This is the last time the course touches only the Console. Tomorrow your JavaScript reaches into a real page.\n\n```check\ntitle: Self-check before Module 5\n- Your data file exists in `js-practice` and contains a `const` array (`projects` in your slides, `menu` here)\n- The array has **4 to 6 objects**, each with `title`/`name`, `description`, `tag`/`category` and a link or price\n- Descriptions are complete sentences with no placeholder text like \"TODO\"\n- Tags or categories use **one consistent casing** across all objects\n- The `.forEach()` formatted-log code runs without errors and prints every item cleanly\n- The file is saved and **kept, not deleted**\n```\n", "m5": "title: The DOM: Selecting and Modifying Elements\ntag: Module 5 · Day 3, morning\nshort: Reach into the real page\ntagline: For the first time, your JavaScript touches a real web page. Pick an element, change what it says, change how it looks, and build brand new ones.\nstory: The safety net comes off. Until now our code lived in a quiet back office. Today it walks onto the shop floor: Asha's actual café page. We will make two small features that every visitor can see: a footer that always shows the **current year**, and a greeting that says **\"Good morning\"** or **\"Good evening\"** depending on the time. Every lab on this page is a miniature version of that page with a live preview.\nobjectives:\n- Explain what the DOM is and how it differs from the HTML file it was built from\n- Select one or many elements with `document.querySelector()` and `document.querySelectorAll()`\n- Change an element's content safely with `.textContent`, and know when `.innerHTML` is risky\n- Change attributes and CSS classes with `.setAttribute()`, `.getAttribute()` and `.classList`\n- Create an element with `document.createElement()` and insert it with `.appendChild()` or `.append()`\n- Ship two genuine features: an auto-updating year and a time-aware greeting\n---\n## Today, JavaScript touches your real site\n\n### What is the DOM?\n\nYour `index.html` file on disk is a **recipe card**: static text describing what the page should look like. The moment a browser loads it, the browser cooks it into a separate, **live, in-memory structure** that represents the page *right now*. That is the **DOM** (Document Object Model).\n\n> analogy: The HTML file is the **recipe card** in the drawer. The DOM is the **dish on the counter**. You can add salt to the dish without touching the card. When you remake the dish from the card tomorrow, the salt is gone.\n\nOpen any real website, right-click a heading and choose **Inspect**. Edit its text by hand in the Elements panel. The page changes instantly. Refresh: it reverts, because you only changed the dish, not the recipe card. **So what if a script made the same change, automatically, every time the page loads?** That question is this entire module.\n\nBelow is a tiny version of the café page. The **HTML** tab is the recipe card. The **Elements** tab under the preview shows the live DOM, the dish. Run it and compare the two. Then press **Reload page** and see that the HTML text never changed.\n\n```lab\ntitle: The recipe card and the dish\nkind: playground\nmode: dom\nheight: 250\n@@html\n<header class=\"top\">\n  <h1>Chai Corner<\/h1>\n<\/header>\n<p class=\"intro-text\">Hand-brewed chai and fresh snacks, since 2019.<\/p>\n<ul id=\"menuList\">\n  <li>Masala Chai — ₹20<\/li>\n  <li>Samosa — ₹15<\/li>\n<\/ul>\n@@css\n@@js\n// This script runs after the page is built, and edits the live DOM.\nconst heading = document.querySelector('h1');\nheading.textContent = 'Chai Corner · now with JavaScript';\n@@explain\n```\n\nThings to try: switch to the **Elements** tab and find the `<h1>`. It shows the new text. Switch to the **index.html** tab: the original `Chai Corner` is still there. Delete the two JavaScript lines and run again: the heading goes back, because the recipe never changed.\n\n## Selecting elements\n\nBefore you can change anything you have to **point at it**. JavaScript points using the **same selectors you wrote in CSS**.\n\n```raw\n<div class=\"trio\">\n  <div class=\"mini-card\"><div class=\"big\">querySelector(selector)<\/div><h4>The first match<\/h4><p>Returns <strong>the first<\/strong> matching element, or <code>null<\/code> if nothing matches.<\/p><\/div>\n  <div class=\"mini-card\"><div class=\"big\">querySelectorAll(selector)<\/div><h4>Every match<\/h4><p>Returns a <strong>NodeList<\/strong> (array-like) of <em>every<\/em> matching element.<\/p><\/div>\n<\/div>\n```\n\n| Selector | Picks | Same as in your CSS |\n| --- | --- | --- |\n| `'h1'` | every `<h1>` | `h1 { }` |\n| `'.intro-text'` | elements with `class=\"intro-text\"` | `.intro-text { }` |\n| `'#greeting'` | the one element with `id=\"greeting\"` | `#greeting { }` |\n| `'nav a'` | every link **inside** the nav | `nav a { }` |\n\n> analogy: `querySelector` is a **laser pointer**. You say \"the heading\", \"the footer\", \"the link in the nav\", and a dot of light lands on it. Now you can talk about that exact thing.\n\n```lab\ntitle: Find it first\nkind: exercise\nmode: dom\nheight: 250\n@@intro\nA warm-up on the page's real structure. **Nothing is changed yet.** The goal is confidence that you can reach into the page from code.\n@@steps\n- Select the page's `<h1>` and `console.log` it.\n- Select the `<footer>` and log it.\n- Select **every** `<a>` with `querySelectorAll()` and log how many there are using `.length`.\n- Then try a selector that matches nothing, like `'.does-not-exist'`, and see what you get.\n@@html\n<header class=\"top\">\n  <h1>Chai Corner<\/h1>\n<\/header>\n<nav>\n  <a href=\"#\">Home<\/a>\n  <a href=\"#\">Menu<\/a>\n  <a href=\"#\">About<\/a>\n  <a href=\"#\">Contact<\/a>\n<\/nav>\n<p class=\"intro-text\">Hand-brewed chai and fresh snacks, since 2019.<\/p>\n{{footer}}\n@@css\n@@js\n// 1. the h1\n\n\n// 2. the footer\n\n\n// 3. all the links, and how many\n\n\n// 4. a selector that matches nothing\n\n@@hint\n`const heading = document.querySelector('h1');` then `console.log(heading);`\n@@hint\nFor many elements: `const links = document.querySelectorAll('nav a');` then `console.log(links.length);`\n@@solution\nconst heading = document.querySelector('h1');\nconsole.log(heading);\n\nconst footer = document.querySelector('footer');\nconsole.log(footer);\n\nconst links = document.querySelectorAll('a');\nconsole.log(links.length);        // 4\nconsole.log(links);               // a NodeList you can expand\n\nconst ghost = document.querySelector('.does-not-exist');\nconsole.log(ghost);               // null\n```\n\n### Selecting nothing: the null case\n\n```lab\ntitle: The most common beginner bug\nkind: playground\nmode: dom\nheight: 200\n@@html\n<h1>Chai Corner<\/h1>\n<p id=\"greeting\">Hello!<\/p>\n@@css\n@@js\nconst ghost = document.querySelector('.greeting');   // typo: the element has an id, not a class\nconsole.log(ghost);                                  // null\n\n// Un-comment the next line to see the real error:\n// ghost.textContent = 'Welcome!';                   // TypeError: Cannot read properties of null\n@@explain\n```\n\nIf nothing matches, `querySelector` gives you `null`, **not an error**. The error only appears when you then try to *use* it. The most common bug of the whole week is a typo between the HTML and the selector string (`'.greeting'` instead of `'#greeting'`). **Habit: `console.log()` the result of a selector before you use it.** If it prints `null`, you know the selector is wrong before anything breaks.\n\n> note: A **NodeList** (what `querySelectorAll` returns) is *array-like*. It has `.length` and you can use `.forEach()` on it. But `.map()` and `.filter()` are not available unless you convert it first with `Array.from(list)`.\n\n## Reading and changing content: textContent vs innerHTML\n\nOnce you have an element, you can read or replace what is inside it.\n\n| Property | What it does | When |\n| --- | --- | --- |\n| `.textContent` | Reads/sets **plain text only**. Never treats input as HTML. Safe and predictable. | **The default choice.** |\n| `.innerHTML` | Reads/sets text **and HTML tags**. | Only when you genuinely need to insert markup. |\n\n```lab\ntitle: textContent vs innerHTML\nkind: playground\nmode: dom\nheight: 240\n@@html\n<h1>Chai Corner<\/h1>\n<p class=\"intro-text\">Old intro text.<\/p>\n<p id=\"note1\"><\/p>\n<p id=\"note2\"><\/p>\n@@css\n@@js\nconst heading = document.querySelector('h1');\nheading.textContent = 'Chai Corner, Coimbatore';\n\n// innerHTML understands tags\nconst intro = document.querySelector('.intro-text');\nintro.innerHTML = 'Famous for <strong>ginger chai<\/strong> and <em>hot samosas<\/em>.';\n\n// Same string, two different properties\nconst risky = 'Try our <b>NEW<\/b> filter coffee';\ndocument.querySelector('#note1').textContent = risky;   // shows the tags as plain text\ndocument.querySelector('#note2').innerHTML = risky;     // the tags are interpreted: NEW becomes bold\n@@explain\n```\n\n> warn: **Never put raw text typed by someone else into `.innerHTML`.** A visitor could type HTML (or worse, a hidden script) into a form, and `innerHTML` would run it on every other visitor's screen. `.textContent` can never do that. Default to `.textContent`, and reach for `.innerHTML` only when *you* are building markup from data *you* control. (Module 7 does exactly that safely with your own menu data.)\n\n### Milestone: linking script.js to your real site\n\nThis is the moment the work moves from `js-practice` into the real `my-portfolio` folder. Four steps:\n\n1. Create a brand-new file named exactly `script.js`.\n2. In `index.html`, just before `<\/body>`, add: `<script src=\"script.js\" defer><\/script>`\n3. Wrap the footer's year in a span so the script can target it: `<span id=\"year\">2023<\/span>`\n4. Remember: `defer` waits until the whole page is parsed. Placed before `<\/body>`, it avoids the number one \"why is my code not working\" bug.\n\nIn this playground you never need to link anything. The **script.js** tab is already wired to the page for you.\n\n### The wow moment: a footer year that never goes out of date\n\n```lab\ntitle: Own the Footer\nkind: exercise\nmode: dom\nheight: 220\n@@intro\nThe first feature that goes live. The year in the footer should come from today's date, not from a number you typed in 2023.\n@@steps\n- Look at the footer in the HTML tab: the year is hard-coded as `2023`.\n- In `script.js`, select `#year` and set its `.textContent` to `new Date().getFullYear()`.\n- Add `console.log('script.js is running on the real site!')` above it as a sanity-check habit.\n- Run it and confirm the footer shows the **current** year.\n@@html\n<header class=\"top\">\n  <h1>Chai Corner<\/h1>\n<\/header>\n<p class=\"intro-text\">Hand-brewed chai and fresh snacks, since 2019.<\/p>\n{{footer}}\n@@css\n@@js\n// sanity check\n\n// footer year\n\n@@hint\nThree lines: select the span, get the year with `new Date().getFullYear()`, then assign it to `.textContent`.\n@@solution\nconsole.log('script.js is running on the real site!');\n\nconst yearSpan = document.querySelector('#year');\nconst currentYear = new Date().getFullYear();\nyearSpan.textContent = currentYear;\n@@explain\nThat number did not come from the HTML file. Your own JavaScript put it there, just now, based on today's actual date, and it will stay correct every year with no editing.\n```\n\n## Attributes and classes\n\nElements have **attributes** (`href`, `src`, `title`, `id`, `class`) and **classes** you use for styling. JavaScript can read and change both.\n\n| Code | Does |\n| --- | --- |\n| `el.setAttribute('title', 'Hello')` | Set (or overwrite) any attribute |\n| `el.getAttribute('title')` | Read an attribute's current value |\n| `el.classList.add('highlight')` | Add a CSS class |\n| `el.classList.remove('highlight')` | Remove it |\n| `el.classList.toggle('highlight')` | Add it if missing, **remove it if present** (a light switch) |\n| `el.classList.contains('highlight')` | `true` or `false`: does it have the class? |\n\n> analogy: A class is a **sticker** you can put on an item: \"Special\", \"Sold out\". The CSS already knows what every sticker looks like. JavaScript's only job is to **stick it on or peel it off**. `toggle` is a light switch: flip it on, flip it off.\n\n> cafe: Tomorrow `classList.toggle()` is what opens and closes the mobile menu and flips the light/dark theme. Everything in Module 6 builds on this one method.\n\n```lab\ntitle: Attributes and classes\nkind: playground\nmode: dom\nheight: 220\n@@html\n<h1>Chai Corner<\/h1>\n<p>Hover over the heading to see its tooltip.<\/p>\n<p id=\"special\">Today's special: Masala Chai<\/p>\n@@css\n.highlight {\n  background: #fff0b8;\n  outline: 2px solid #e6c15a;\n  outline-offset: 2px;\n}\n@@js\nconst heading = document.querySelector('h1');\n\nheading.setAttribute('title', 'Hover to see this tooltip!');\nconsole.log(heading.getAttribute('title'));\n\nconst special = document.querySelector('#special');\nspecial.classList.add('highlight');                        // sticker on\nconsole.log('has highlight?', special.classList.contains('highlight'));\n\nspecial.classList.toggle('highlight');                     // flips it off...\nspecial.classList.toggle('highlight');                     // ...and on again\nconsole.log('has highlight now?', special.classList.contains('highlight'));\n@@explain\n```\n\n```lab\ntitle: Flip a Class\nkind: exercise\nmode: dom\nheight: 220\n@@intro\nDeliberately throwaway. Its only job is muscle memory for `classList`, which Module 6 depends on completely.\n@@steps\n- In the CSS tab, confirm the small `.highlight` utility class exists.\n- In `script.js`, select the `<h1>` and `.classList.toggle('highlight')` it **once**.\n- Comment that line out after you have seen it work. It was a test, not part of the final features.\n@@html\n<h1>Chai Corner<\/h1>\n<p>Welcome in!<\/p>\n@@css\n.highlight {\n  background: #fff0b8;\n  outline: 2px solid #e6c15a;\n  outline-offset: 2px;\n}\n@@js\n@@hint\n`document.querySelector('h1').classList.toggle('highlight');`\n@@solution\nconst heading = document.querySelector('h1');\nheading.classList.toggle('highlight');\n// heading.classList.toggle('highlight'); // comment it out once you have seen it work\n```\n\n## Creating and inserting elements\n\nYou can also build **brand new** elements out of nothing, in two steps: **create it**, then **put it on the page**.\n\n> analogy: `createElement` is **baking a new item**. It exists, but it is sitting in the kitchen, not yet on the shelf. `appendChild` is **putting it on the shelf** where customers can see it.\n\n```lab\ntitle: createElement and appendChild\nkind: playground\nmode: dom\nheight: 260\n@@html\n<h1>Chai Corner<\/h1>\n<main>\n  <p>Fresh from the kitchen:<\/p>\n  <ul id=\"menuList\">\n    <li>Masala Chai — ₹20<\/li>\n  <\/ul>\n<\/main>\n@@css\n@@js\nconst newItem = document.createElement('li');       // 1. create it (not on the page yet)\nnewItem.textContent = 'Samosa — ₹15';               // 2. fill it\ndocument.querySelector('#menuList').appendChild(newItem);   // 3. put it on the page\n\nconst funFact = document.createElement('p');\nfunFact.textContent = 'Fun fact: this paragraph did not exist in the HTML.';\nfunFact.classList.add('highlight');\ndocument.querySelector('main').append(funFact);     // .append() also works, and accepts text too\n@@explain\n```\n\nPress **Reload page** and watch it get rebuilt from scratch, because the new item only exists in the DOM until the script runs again. To make it appear *every time* someone loads the page, the code lives in `script.js`. That is what the capstone below does with a real feature.\n\n## Capstone: a greeting that knows the time\n\nTwo real features go live today. The first (the year) is done. The second is a **time-of-day-aware greeting**.\n\nHow it works: `new Date().getHours()` gives the current hour as a number from `0` to `23`. You turn that into `morning`, `afternoon` or `evening` with the `if / else if / else` you learned in Module 2, then drop it into a template literal.\n\n```lab\ntitle: A Time-of-Day Greeting\nkind: exercise\nmode: dom\nheight: 240\n@@intro\nFill the empty `<p id=\"greeting\">` just under the heading with a message that matches the time on the visitor's clock.\n@@steps\n- Get the hour: `const hour = new Date().getHours();`\n- Use `if / else if / else` to pick `'morning'` (before 12), `'afternoon'` (before 18) or `'evening'`.\n- Select `#greeting` and set its `.textContent` to a template literal like `` `Good ${timeOfDay}! Welcome to Chai Corner.` ``\n- **Test every branch:** temporarily replace the hour with `9`, `15` and `21` to see all three messages.\n- Check: if you see nothing, `console.log()` the selector result first. A `null` means a typo between the HTML id and your selector.\n@@html\n<header class=\"top\">\n  <h1>Chai Corner<\/h1>\n<\/header>\n<p id=\"greeting\"><\/p>\n<p class=\"intro-text\">Hand-brewed chai and fresh snacks, since 2019.<\/p>\n{{footer}}\n@@css\n@@js\n// footer year\ndocument.querySelector('#year').textContent = new Date().getFullYear();\n\n// greeting\nconst hour = new Date().getHours(); // 0-23 (try 9, 15 and 21 while testing)\n\n@@hint\nDeclare `let timeOfDay;` first, then assign it inside the `if / else if / else`.\n@@solution\n// footer year\ndocument.querySelector('#year').textContent = new Date().getFullYear();\n\n// greeting\nconst hour = new Date().getHours(); // change to 9, 15 or 21 to test each branch\nlet timeOfDay;\n\nif (hour < 12) {\n  timeOfDay = 'morning';\n} else if (hour < 18) {\n  timeOfDay = 'afternoon';\n} else {\n  timeOfDay = 'evening';\n}\n\nconst greetingElement = document.querySelector('#greeting');\ngreetingElement.textContent = `Good ${timeOfDay}! Welcome to Chai Corner.`;\n@@explain\nTwo real features, both generated by JavaScript, both still correct after a full page refresh. This exact pattern (select, work something out, put it on the page) is the engine of the rest of the course.\n```\n\n> portfolio: Same two features on your real site. Add an empty `<p id=\"greeting\"><\/p>` under your `<h1>`, and wrap the footer year in `<span id=\"year\">`. Add one more small, original DOM change of your own for the assignment.\n\n```quiz\nq: What is the difference between the HTML file and the DOM?\na: There is no difference\na*: The HTML file is static text on disk. The DOM is the live, in-memory page the browser builds from it, and JavaScript can change it.\na: The DOM is stored on the server\na: The HTML file is faster\nwhy: Changes you make to the DOM disappear on refresh, because the HTML file never changed.\nq: `document.querySelector('.nope')` when no element has that class returns...\na: An empty array\na: An error\na*: null\na: undefined\nwhy: `querySelector` returns `null` when nothing matches. The error only shows up when you try to use that `null`.\nq: Which is the safer default for putting text on the page?\na*: .textContent\na: .innerHTML\na: .outerHTML\na: .value\nwhy: `.textContent` never treats input as HTML, so a visitor cannot sneak tags or scripts in.\nq: What does `element.classList.toggle('open')` do?\na: Always adds `open`\na: Always removes `open`\na*: Adds `open` if missing, removes it if present\na: Checks if `open` exists\nwhy: `toggle` is a light switch. It flips the state each time.\nq: Creating an element with `document.createElement('p')` is enough to make it visible.\na: True\na*: False, you must also insert it with something like `appendChild`\na: True, but only in Chrome\na: False, you need `innerHTML`\nwhy: A freshly created element lives only in memory until you put it on the page.\n```\n\n## Building blocks from this module\n\n```raw\n<div class=\"flow\">\n  <div class=\"step\"><b>The idea<\/b><span>the DOM · live page, not the file<\/span><\/div>\n  <div class=\"step\"><b>Select<\/b><span><code>querySelector<\/code> · <code>querySelectorAll<\/code><\/span><\/div>\n  <div class=\"step\"><b>Change<\/b><span><code>textContent<\/code> · <code>innerHTML<\/code><\/span><\/div>\n  <div class=\"step\"><b>Attributes<\/b><span><code>setAttribute<\/code> · <code>classList.toggle<\/code><\/span><\/div>\n  <div class=\"step\"><b>Build<\/b><span><code>createElement<\/code> · <code>appendChild<\/code><\/span><\/div>\n<\/div>\n```\n\n> note: **Next up: Module 6, Events.** JavaScript learns to react to what a visitor *does*, not just what the clock says. A real mobile menu and a light/dark switch, both powered by `classList.toggle()`.\n\n```check\ntitle: Self-check before Module 6\n- `script.js` exists in `my-portfolio`, linked **only from `index.html`**, via `<script src=\"script.js\" defer><\/script>`\n- The footer shows the current year, generated by `new Date().getFullYear()`, not hard-coded\n- A greeting element shows a time-of-day message from `new Date().getHours()` and conditionals\n- Each feature has a short explanatory comment above it\n- One additional, original small DOM change has been added and works after a refresh\n- Changes are committed and pushed to GitHub with a clear commit message\n```\n", "m6": "title: Events and Interaction\ntag: Module 6 · Day 3, afternoon\nshort: React to the visitor\ntagline: Until now the page changed on its own schedule. Now it listens. A click, a key press, a scroll: your code wakes up exactly when the visitor does something.\nstory: A café with a silent counter is just a shop window. Today Chai Corner gets a **doorbell**. We wire up a real mobile menu button and a light/dark switch. Both are powered by one method you already know from Module 5: `classList.toggle()`.\nobjectives:\n- Explain what an event is and what an event listener does\n- Use `addEventListener('click', handler)` correctly, and know why you pass the function without `()`\n- Read the `event` object, especially `event.target`\n- Build a nav toggle and a theme switch with `classList.toggle()`\n- Understand why a theme switch resets on refresh (a hint of Module 8)\n- Keep your code tidy with a shared pattern for wiring many elements\n---\n## Events: the doorbell\n\nAn **event** is something that *happens*: a click, a key press, the mouse entering an element, the page finishing loading. The browser is constantly noticing these. Your job is to say *\"when this happens to that thing, run this function.\"*\n\n> analogy: Think of a **doorbell**. The bell button is the **element**. Someone pressing it is the **event**. The chime inside the house is the **function** that runs. You did not stand at the door waiting; you just told the house what to do *when* the bell rings.\n\nThat sentence has exactly three parts, and every listener you write has them:\n\n```raw\n<div class=\"flow\">\n  <div class=\"step\"><b>1 · Which element?<\/b><span>the thing to watch<\/span><\/div>\n  <div class=\"step\"><b>2 · Which event?<\/b><span><code>'click'<\/code>, <code>'keydown'<\/code>…<\/span><\/div>\n  <div class=\"step\"><b>3 · What to do?<\/b><span>a function<\/span><\/div>\n<\/div>\n```\n\n```lab\ntitle: Your first listener\nkind: playground\nmode: dom\nheight: 240\n@@html\n<h1>Chai Corner<\/h1>\n<button id=\"orderBtn\">Order a chai<\/button>\n<p id=\"status\">No orders yet.<\/p>\n@@css\n@@js\nconst button = document.querySelector('#orderBtn');\nconst statusEl = document.querySelector('#status');\nlet orders = 0;\n\nbutton.addEventListener('click', function () {\n  orders++;\n  statusEl.textContent = `Orders so far: ${orders}`;\n  console.log('bell rang! total =', orders);\n});\n@@explain\n```\n\nClick the button in the preview. Every click rings the bell again, because the listener stays attached for as long as the page lives.\n\n> warn: **The classic mistake: parentheses.** `addEventListener('click', sayHi)` hands over the function so the browser can call it **later**. `addEventListener('click', sayHi())` calls it **right now**, and passes its result (usually `undefined`) to the browser. Result: it runs once at page load and never on click.\n\n```lab\ntitle: Spot the parentheses bug\nkind: playground\nmode: dom\nheight: 220\n@@html\n<button id=\"btn\">Click me<\/button>\n<p id=\"out\">waiting...<\/p>\n@@css\n@@js\nfunction sayHi() {\n  document.querySelector('#out').textContent = 'Hi! (' + new Date().toLocaleTimeString() + ')';\n}\n\nconst btn = document.querySelector('#btn');\n\n// WRONG: runs immediately, the click does nothing afterwards\nbtn.addEventListener('click', sayHi());\n\n// RIGHT: remove the two slashes below and delete the line above\n// btn.addEventListener('click', sayHi);\n@@explain\n```\n\n## Arrow functions work here too\n\nMost professional code writes the handler as an arrow function (Module 3). The behaviour is identical:\n\n```js run\n// Nothing to click in the console, so we simulate \"the browser calling your handler later\".\nconst handler = () => console.log('doorbell!');\nconst fakeBrowser = { ring(cb) { cb(); } };\nfakeBrowser.ring(handler);   // the browser calls it for you\n```\n\n## The event object: what exactly happened?\n\nWhen the browser calls your handler it gives it one argument: an **event object**. It carries details about what just happened. You name it whatever you like; everyone writes `event` or `e`.\n\n| Property | What you get |\n| --- | --- |\n| `event.type` | `'click'`, `'keydown'`… |\n| `event.target` | The exact element that was interacted with |\n| `event.key` | For keyboard events, which key (`'Enter'`, `'a'`…) |\n| `event.preventDefault()` | Cancel the browser's default action (Module 8 uses it heavily) |\n\n> analogy: The event object is the **order slip** that arrives with every doorbell ring: who rang, when, which door, which button. You can ignore it, but it often has exactly what you need.\n\n```lab\ntitle: Meet event.target\nkind: playground\nmode: dom\nheight: 270\n@@html\n<h1>Chai Corner<\/h1>\n<ul id=\"menuList\">\n  <li>Masala Chai<\/li>\n  <li>Ginger Chai<\/li>\n  <li>Samosa<\/li>\n<\/ul>\n<p id=\"picked\">Click a menu item.<\/p>\n@@css\nli { cursor: pointer; }\n.picked { background: #fff0b8; }\n@@js\nconst items = document.querySelectorAll('#menuList li');\n\nitems.forEach(function (item) {\n  item.addEventListener('click', function (event) {\n    console.log('type:', event.type);\n    console.log('target text:', event.target.textContent);\n    document.querySelector('#picked').textContent = 'You picked: ' + event.target.textContent;\n    event.target.classList.toggle('picked');\n  });\n});\n@@explain\n```\n\nNotice the pattern: `querySelectorAll` gives a list, `forEach` visits each item, and **each one gets its own listener**. That is how you wire \"everything that looks like this\" in a few lines.\n\n## Other events you will meet\n\n| Event | Fires when |\n| --- | --- |\n| `click` | The element is clicked or tapped |\n| `dblclick` | Double click |\n| `mouseover` / `mouseout` | Pointer enters / leaves |\n| `keydown` | A key is pressed (works on `document` too) |\n| `input` | The value of a text field changes, on every keystroke |\n| `chang
