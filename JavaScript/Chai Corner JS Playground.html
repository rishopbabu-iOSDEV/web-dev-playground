e` | A field is committed (a select changed, a box ticked) |\n| `submit` | A form is submitted (Module 8) |\n| `DOMContentLoaded` | The page's HTML has been fully parsed |\n\n```lab\ntitle: Keyboard and mouse\nkind: playground\nmode: dom\nheight: 260\n@@html\n<h1>Chai Corner<\/h1>\n<p>Press any key while this preview is focused (click in it first), and hover the card.<\/p>\n<div class=\"card\" id=\"card\">Hover over me<\/div>\n<p id=\"log\">...<\/p>\n@@css\n@@js\nconst log = document.querySelector('#log');\nconst card = document.querySelector('#card');\n\ndocument.addEventListener('keydown', function (e) {\n  log.textContent = 'You pressed: ' + e.key;\n});\n\ncard.addEventListener('mouseover', () => card.classList.add('highlight'));\ncard.addEventListener('mouseout', () => card.classList.remove('highlight'));\n@@explain\n```\n\n## Feature 1: the mobile nav toggle\n\nOn a phone the navigation is hidden behind a **menu button**. Clicking it opens and closes the links. The recipe has three ingredients, all of which you already own:\n\n1. **HTML:** a `<button id=\"menuToggle\">` and a `<nav id=\"mainNav\">`.\n2. **CSS:** `nav.open` is shown; plain `nav` is hidden on narrow screens.\n3. **JS:** on click, `nav.classList.toggle('open')`.\n\n> analogy: CSS decides what each sticker looks like. JavaScript never styles anything; it only **sticks the \"open\" sticker on or peels it off**. This split (CSS looks, JS decides) is why professionals keep the two apart.\n\n```lab\ntitle: Wire the Mobile Menu\nkind: exercise\nmode: dom\nheight: 300\n@@intro\nThe HTML and CSS are finished. Only the listener is missing. Use the **Phone width** toggle on the preview to see the real mobile layout.\n@@steps\n- Select the button `#menuToggle` and the nav `#mainNav`.\n- Add a click listener to the button.\n- Inside it, `toggle` the class `open` on the nav.\n- Bonus: also update the button's text between `Menu` and `Close` using `classList.contains('open')`.\n@@html\n<header class=\"top\">\n  <h1>Chai Corner<\/h1>\n  <button id=\"menuToggle\">Menu<\/button>\n<\/header>\n<nav id=\"mainNav\">\n  <a href=\"#\">Home<\/a>\n  <a href=\"#\">Menu<\/a>\n  <a href=\"#\">About<\/a>\n  <a href=\"#\">Contact<\/a>\n<\/nav>\n<p class=\"intro-text\">Hand-brewed chai and fresh snacks, since 2019.<\/p>\n@@css\n#menuToggle { display: none; }\n@media (max-width: 520px) {\n  #menuToggle { display: inline-block; }\n  #mainNav { display: none; flex-direction: column; }\n  #mainNav.open { display: flex; }\n}\n@@js\n// 1. select\n\n// 2. listen\n\n@@hint\n`const toggleBtn = document.querySelector('#menuToggle');` and `const nav = document.querySelector('#mainNav');`\n@@hint\n`toggleBtn.addEventListener('click', () => { nav.classList.toggle('open'); });`\n@@solution\nconst toggleBtn = document.querySelector('#menuToggle');\nconst nav = document.querySelector('#mainNav');\n\ntoggleBtn.addEventListener('click', () => {\n  nav.classList.toggle('open');\n  const isOpen = nav.classList.contains('open');\n  toggleBtn.textContent = isOpen ? 'Close' : 'Menu';\n});\n@@explain\nOne listener, one `toggle`. On a wide screen the button is hidden, so the nav is always visible; on a phone the button controls it.\n```\n\n## Feature 2: the light / dark switch\n\nSame idea, new target. Toggle a class (`dark`) on the **`<body>`**, and let CSS repaint everything underneath it.\n\n```lab\ntitle: Theme Switch\nkind: exercise\nmode: dom\nheight: 300\n@@intro\nThe CSS already has `body.dark { ... }`. Add the button's behaviour.\n@@steps\n- Select `#themeToggle`.\n- On click, `document.body.classList.toggle('dark')`.\n- Run it, flip to dark, then press **Reload page**. Notice what happens to your choice.\n@@html\n<header class=\"top\">\n  <h1>Chai Corner<\/h1>\n  <button id=\"themeToggle\">Toggle theme<\/button>\n<\/header>\n<p class=\"intro-text\">Hand-brewed chai and fresh snacks, since 2019.<\/p>\n<div class=\"card\">Today's special: Masala Chai<\/div>\n@@css\nbody.dark { background: #1d2224; color: #e8ecec; }\nbody.dark .card, body.dark .top { background: #2a3033; color: #e8ecec; }\n@@js\n@@hint\n`document.querySelector('#themeToggle').addEventListener('click', () => document.body.classList.toggle('dark'));`\n@@solution\nconst themeBtn = document.querySelector('#themeToggle');\n\nthemeBtn.addEventListener('click', () => {\n  document.body.classList.toggle('dark');\n});\n@@explain\nIt works, but **the choice vanishes on refresh**. The DOM is rebuilt from the HTML file every time, and your toggle only changed the DOM. Remembering the choice across visits needs somewhere to store it. That is `localStorage`, and Module 8 adds exactly that.\n```\n\n> note: A theme switch that forgets on reload is not a bug in your code. It is the DOM behaving exactly as Module 5 described: the dish is thrown away and cooked again from the recipe card. Memory has to live somewhere that *survives*.\n\n## Event delegation (a peek ahead)\n\nPutting a listener on every item is fine for three items. For a list that **grows** (items you add later), a smarter trick is to listen once on the parent, and ask `event.target` who was actually clicked. Module 7 uses this for menu cards.\n\n```lab\ntitle: One listener, many children\nkind: playground\nmode: dom\nheight: 260\n@@html\n<h1>Chai Corner<\/h1>\n<ul id=\"menuList\">\n  <li>Masala Chai<\/li>\n  <li>Ginger Chai<\/li>\n<\/ul>\n<button id=\"add\">Add a new item<\/button>\n<p id=\"picked\">Click any item, even ones added later.<\/p>\n@@css\nli { cursor: pointer; }\n@@js\nconst list = document.querySelector('#menuList');\n\n// ONE listener on the parent\nlist.addEventListener('click', function (event) {\n  if (event.target.tagName === 'LI') {\n    document.querySelector('#picked').textContent = 'You picked: ' + event.target.textContent;\n  }\n});\n\n// New items work automatically, with no extra listeners\nlet n = 0;\ndocument.querySelector('#add').addEventListener('click', () => {\n  n++;\n  const li = document.createElement('li');\n  li.textContent = 'Special #' + n;\n  list.appendChild(li);\n});\n@@explain\n```\n\n## Capstone: wire the whole site\n\n```lab\ntitle: Interactive Chai Corner\nkind: exercise\nmode: dom\nheight: 340\n@@intro\nCombine everything from Modules 5 and 6 on one page: footer year, time-of-day greeting, mobile nav toggle, and theme switch.\n@@steps\n- Footer year and greeting (from Module 5), already given.\n- Add the **mobile menu** toggle.\n- Add the **theme switch**.\n- Test on **Phone width**, and in both themes.\n@@html\n<header class=\"top\">\n  <h1>Chai Corner<\/h1>\n  <button id=\"menuToggle\">Menu<\/button>\n  <button id=\"themeToggle\">Theme<\/button>\n<\/header>\n<nav id=\"mainNav\">\n  <a href=\"#\">Home<\/a>\n  <a href=\"#\">Menu<\/a>\n  <a href=\"#\">About<\/a>\n<\/nav>\n<p id=\"greeting\"><\/p>\n<p class=\"intro-text\">Hand-brewed chai and fresh snacks, since 2019.<\/p>\n{{footer}}\n@@css\n#menuToggle { display: none; }\n@media (max-width: 520px) {\n  #menuToggle { display: inline-block; }\n  #mainNav { display: none; flex-direction: column; }\n  #mainNav.open { display: flex; }\n}\nbody.dark { background: #1d2224; color: #e8ecec; }\nbody.dark .top { background: #2a3033; color: #e8ecec; }\n@@js\n// Module 5 features\ndocument.querySelector('#year').textContent = new Date().getFullYear();\n\nconst hour = new Date().getHours();\nconst part = hour < 12 ? 'morning' : hour < 18 ? 'afternoon' : 'evening';\ndocument.querySelector('#greeting').textContent = `Good ${part}! Welcome to Chai Corner.`;\n\n// Module 6 features: add them below\n\n@@hint\nTwo separate `addEventListener` calls, one per button. Each uses `classList.toggle`.\n@@solution\n// Module 5 features\ndocument.querySelector('#year').textContent = new Date().getFullYear();\n\nconst hour = new Date().getHours();\nconst part = hour < 12 ? 'morning' : hour < 18 ? 'afternoon' : 'evening';\ndocument.querySelector('#greeting').textContent = `Good ${part}! Welcome to Chai Corner.`;\n\n// Module 6 features\nconst navBtn = document.querySelector('#menuToggle');\nconst nav = document.querySelector('#mainNav');\nnavBtn.addEventListener('click', () => nav.classList.toggle('open'));\n\nconst themeBtn = document.querySelector('#themeToggle');\nthemeBtn.addEventListener('click', () => document.body.classList.toggle('dark'));\n```\n\n> portfolio: Add a mobile menu button to your real site and a theme switch. Link `script.js` once. Check both on your phone or in DevTools device mode.\n\n```quiz\nq: In `btn.addEventListener('click', sayHi)`, why no parentheses after sayHi?\na: They are optional\na*: You are handing over the function to be called later; `sayHi()` would call it immediately\na: It makes it faster\na: Parentheses are only for arrow functions\nwhy: `sayHi()` runs now and passes its return value. `sayHi` passes the function itself.\nq: What is `event.target`?\na: The page URL\na*: The exact element that triggered the event\na: The event's name\na: The parent element, always\nwhy: It is the element that was actually clicked, typed in, or hovered.\nq: Why does a dark-mode switch reset after refreshing the page?\na: A bug in `classList`\na*: The change only lives in the DOM, which is rebuilt from the HTML file on reload\na: Browsers block themes\na: `toggle` only works once\nwhy: Persisting it needs somewhere that survives reloads, such as localStorage (Module 8).\nq: The best split between CSS and JS for an open/close menu is...\na: JS sets every style by hand\na*: CSS defines what `.open` looks like, JS toggles the class\na: Use inline styles from HTML\na: Avoid classes\nwhy: Keeping looks in CSS and decisions in JS keeps both easy to change.\nq: Why would you use event delegation?\na*: One listener on a parent can handle children, including ones added later\na: It is required for buttons\na: It stops events\na: It makes `event.target` null\nwhy: Delegation avoids re-attaching listeners when the list changes.\n```\n\n## Building blocks from this module\n\n```raw\n<div class=\"flow\">\n  <div class=\"step\"><b>Listen<\/b><span><code>addEventListener<\/code><\/span><\/div>\n  <div class=\"step\"><b>Inspect<\/b><span><code>event.target<\/code> · <code>event.key<\/code><\/span><\/div>\n  <div class=\"step\"><b>Toggle<\/b><span><code>classList.toggle<\/code><\/span><\/div>\n  <div class=\"step\"><b>Delegate<\/b><span>listen on the parent<\/span><\/div>\n<\/div>\n```\n\n> note: **Next up: Module 7, Rendering lists and filtering.** Instead of typing every menu card in HTML, JavaScript will build them all from your menu data (Module 4) and filter them with buttons.\n\n```check\ntitle: Self-check before Module 7\n- A mobile menu button toggles the nav, and works at phone width\n- A theme switch toggles a class on `<body>`, and both themes look right\n- Every listener passes a function **without** `()` after its name\n- You can explain why the theme resets on refresh\n- Everything is committed and pushed\n```\n", "m7": "title: Rendering Lists and Filtering\ntag: Module 7 · Day 4, morning\nshort: Build the page from data\ntagline: Stop typing menu cards by hand. Keep the menu as data, let JavaScript draw every card, and add filter buttons that redraw the page in a blink.\nstory: Asha's menu changes every week. If each dish is hand-typed into HTML, every change means editing markup in six places. Instead we keep **one array** (the menu from Module 4) and write **one function** that turns it into cards. Change the data, and the page follows.\nobjectives:\n- Explain the render pattern: data in, HTML out\n- Build cards from an array with `map()` and `join('')`\n- Avoid the `[object Object]` and stray-comma bugs\n- Filter data with `filter()` and redraw\n- Create filter buttons from the data itself using a `Set`\n- Show a friendly empty state, and use event delegation for card clicks\n---\n## The render pattern\n\nEvery dynamic page on the internet does the same three things:\n\n```raw\n<div class=\"flow\">\n  <div class=\"step\"><b>1 · Data<\/b><span>an array of objects<\/span><\/div>\n  <div class=\"step\"><b>2 · Render<\/b><span>a function that builds HTML<\/span><\/div>\n  <div class=\"step\"><b>3 · Page<\/b><span>put it into a container<\/span><\/div>\n<\/div>\n```\n\n> analogy: Data is the **ingredients list**, the render function is the **kitchen**, and the page is the **plate**. Want a different dish? Change the ingredients or filter them. The kitchen stays the same.\n\nHere is the menu we will use for the whole module (the same one you built at the end of Module 4):\n\n```js run\n{{menu}}\nconsole.log(menu.length + ' items');\nconsole.log(menu[0]);\n```\n\n### Step 1: one card from one object\n\nA template literal (Module 1) can hold HTML. We splice in values with `${}`.\n\n```js run\nconst item = { name: \"Masala Chai\", description: \"Strong ginger-cardamom tea\", category: \"Hot\", price: 20 };\n\nconst card = `\n  <article class=\"card\">\n    <h3>${item.name}<\/h3>\n    <p>${item.description}<\/p>\n    <span class=\"tag\">${item.category}<\/span>\n    <strong>₹${item.price}<\/strong>\n  <\/article>`;\n\nconsole.log(card);\n```\n\n### Step 2: many cards from many objects\n\n`map()` (Module 4) turns each object into a string of HTML. The result is an **array of strings**.\n\n```js run\n{{menu}}\nconst cards = menu.map(item => `<article class=\"card\"><h3>${item.name}<\/h3><\/article>`);\nconsole.log(cards);\nconsole.log(typeof cards, Array.isArray(cards));\n```\n\n> bug: **The stray-comma bug.** If you put an *array* into `innerHTML` directly, JavaScript converts it to a string by separating items with **commas**, and your page shows `,` between cards. The fix is `.join('')`, which glues the pieces with nothing in between.\n\n```lab\ntitle: The comma bug and the join fix\nkind: playground\nmode: dom\nheight: 280\n@@html\n<h1>Chai Corner<\/h1>\n<div id=\"broken\"><\/div>\n<hr>\n<div id=\"fixed\"><\/div>\n@@css\n@@js\nconst names = ['Masala Chai', 'Filter Coffee', 'Samosa'];\nconst html = names.map(n => `<span class=\"tag\">${n}<\/span>`);\n\ndocument.querySelector('#broken').innerHTML = html;           // commas appear between the tags\ndocument.querySelector('#fixed').innerHTML = html.join('');   // clean\n\nconsole.log(html.toString());\n@@explain\n```\n\n> bug: **`[object Object]`.** Writing `${item}` instead of `${item.name}` prints `[object Object]`, because you dropped a whole object into a string. Always reach for a property.\n\n## The render function\n\nWrap the logic in one function that takes any array of items. We use `.textContent`-style safety later; here the data is **ours**, so `innerHTML` is acceptable.\n\n```lab\ntitle: renderMenu()\nkind: playground\nmode: dom\nheight: 380\n@@html\n<header class=\"top\"><h1>Chai Corner<\/h1><\/header>\n<section id=\"menuGrid\" class=\"grid\"><\/section>\n@@css\n.soldout { opacity: .55; }\n@@js\n{{menu}}\n\nfunction renderMenu(items) {\n  const grid = document.querySelector('#menuGrid');\n  grid.innerHTML = items.map(item => `\n    <article class=\"card ${item.inStock ? '' : 'soldout'}\">\n      <span class=\"tag\">${item.category}<\/span>\n      <h3>${item.name}<\/h3>\n      <p>${item.description}<\/p>\n      <strong>₹${item.price}<\/strong>\n      ${item.inStock ? '' : '<em> · sold out<\/em>'}\n    <\/article>\n  `).join('');\n}\n\nrenderMenu(menu);\n@@explain\n```\n\nEdit the data (change a price, flip an `inStock`) and run again. The page redraws with no HTML touched. **This is the entire idea of modern front-end frameworks, in 10 lines.**\n\n## Filtering\n\n`filter()` (Module 4) gives you a smaller array. Feed that into the *same* render function.\n\n```lab\ntitle: Category Filters\nkind: exercise\nmode: dom\nheight: 420\n@@intro\nThree filter buttons are in the HTML. The render function is done. Connect them.\n@@steps\n- Select all `.filters button` elements.\n- On click, read the button's `data-category` attribute (`event.target.dataset.category`).\n- If it is `All`, render the whole menu. Otherwise render `menu.filter(i => i.category === category)`.\n- Bonus: add an `active` class to the pressed button and remove it from the others.\n@@html\n<header class=\"top\"><h1>Chai Corner<\/h1><\/header>\n<div class=\"filters\">\n  <button data-category=\"All\">All<\/button>\n  <button data-category=\"Hot\">Hot<\/button>\n  <button data-category=\"Cold\">Cold<\/button>\n  <button data-category=\"Snacks\">Snacks<\/button>\n<\/div>\n<section id=\"menuGrid\" class=\"grid\"><\/section>\n@@css\n.filters button.active { background: #2f6b68; color: #fff; }\n@@js\n{{menu}}\n\nfunction renderMenu(items) {\n  document.querySelector('#menuGrid').innerHTML = items.map(item => `\n    <article class=\"card\">\n      <span class=\"tag\">${item.category}<\/span>\n      <h3>${item.name}<\/h3>\n      <strong>₹${item.price}<\/strong>\n    <\/article>`).join('');\n}\nrenderMenu(menu);\n\n// connect the buttons below\n\n@@hint\n`document.querySelectorAll('.filters button').forEach(btn => btn.addEventListener('click', ...))`\n@@hint\nInside the handler: `const category = btn.dataset.category;` then choose `menu` or `menu.filter(...)`.\n@@solution\n{{menu}}\n\nfunction renderMenu(items) {\n  document.querySelector('#menuGrid').innerHTML = items.map(item => `\n    <article class=\"card\">\n      <span class=\"tag\">${item.category}<\/span>\n      <h3>${item.name}<\/h3>\n      <strong>₹${item.price}<\/strong>\n    <\/article>`).join('');\n}\nrenderMenu(menu);\n\nconst buttons = document.querySelectorAll('.filters button');\n\nbuttons.forEach(btn => {\n  btn.addEventListener('click', () => {\n    const category = btn.dataset.category;\n    const visible = category === 'All' ? menu : menu.filter(i => i.category === category);\n    renderMenu(visible);\n\n    buttons.forEach(b => b.classList.remove('active'));\n    btn.classList.add('active');\n  });\n});\n@@explain\nNotice what stayed the same: the data, and the render function. Only the array you hand to it changes.\n```\n\n> analogy: Filtering is a **waiter showing only the Cold page of the menu**. The menu in the kitchen is still complete. You never delete data; you just choose what to *show*.\n\n## Buttons built from the data\n\nTyping the category buttons by hand breaks the moment Asha adds a \"Desserts\" category. Let the data produce them. A **`Set`** keeps only unique values, which is exactly what we want.\n\n```js run\n{{menu}}\nconst categories = menu.map(i => i.category);\nconsole.log(categories);                // duplicates: Hot, Hot, Cold...\n\nconst unique = new Set(categories);\nconsole.log(unique);\n\nconst list = ['All', ...unique];        // spread it into a fresh array\nconsole.log(list);\n```\n\n```lab\ntitle: Self-building filters\nkind: playground\nmode: dom\nheight: 420\n@@html\n<header class=\"top\"><h1>Chai Corner<\/h1><\/header>\n<div class=\"filters\" id=\"filters\"><\/div>\n<section id=\"menuGrid\" class=\"grid\"><\/section>\n@@css\n.filters button.active { background: #2f6b68; color: #fff; }\n@@js\n{{menu}}\n\nconst grid = document.querySelector('#menuGrid');\nconst filterBar = document.querySelector('#filters');\nlet activeCategory = 'All';\n\nfunction renderMenu() {\n  const visible = activeCategory === 'All' ? menu : menu.filter(i => i.category === activeCategory);\n  grid.innerHTML = visible.map(i => `\n    <article class=\"card\"><span class=\"tag\">${i.category}<\/span><h3>${i.name}<\/h3><strong>₹${i.price}<\/strong><\/article>`).join('');\n}\n\nfunction renderFilters() {\n  const categories = ['All', ...new Set(menu.map(i => i.category))];\n  filterBar.innerHTML = categories.map(c =>\n    `<button data-category=\"${c}\" class=\"${c === activeCategory ? 'active' : ''}\">${c}<\/button>`).join('');\n}\n\n// ONE listener on the parent (event delegation)\nfilterBar.addEventListener('click', event => {\n  if (event.target.tagName !== 'BUTTON') return;\n  activeCategory = event.target.dataset.category;\n  renderFilters();\n  renderMenu();\n});\n\nrenderFilters();\nrenderMenu();\n@@explain\n```\n\nTwo upgrades here worth studying: the buttons are generated from the data, and one **delegated listener** handles all of them, even though the buttons are re-created on every click (Module 6 preview).\n\n## The empty state\n\nWhat if nothing matches? A blank page feels broken. A friendly message feels designed.\n\n```lab\ntitle: Search and the Empty State\nkind: exercise\nmode: dom\nheight: 400\n@@intro\nA search box is wired in the HTML. Filter by name as the visitor types, and handle the \"nothing found\" case.\n@@steps\n- On the `input` event, read `event.target.value`, lower-case and trimmed.\n- Filter `menu` where `name.toLowerCase().includes(term)`.\n- If the result array is empty, show `No items match \"term\"`. Otherwise render the cards.\n@@html\n<header class=\"top\"><h1>Chai Corner<\/h1><\/header>\n<input id=\"search\" type=\"search\" placeholder=\"Search the menu...\">\n<section id=\"menuGrid\" class=\"grid\"><\/section>\n@@css\n.msg { padding: .6rem; color: #6b7a78; }\n@@js\n{{menu}}\nconst grid = document.querySelector('#menuGrid');\n\nfunction renderMenu(items) {\n  grid.innerHTML = items.map(i => `<article class=\"card\"><h3>${i.name}<\/h3><strong>₹${i.price}<\/strong><\/article>`).join('');\n}\nrenderMenu(menu);\n\n@@hint\n`const term = event.target.value.toLowerCase().trim();`\n@@hint\nCheck `results.length === 0` before rendering, and set `grid.innerHTML` to a `<p class=\"msg\">` in that case. When echoing the term back, use `textContent`, because it is a visitor's input.\n@@solution\n{{menu}}\nconst grid = document.querySelector('#menuGrid');\n\nfunction renderMenu(items) {\n  grid.innerHTML = items.map(i => `<article class=\"card\"><h3>${i.name}<\/h3><strong>₹${i.price}<\/strong><\/article>`).join('');\n}\nrenderMenu(menu);\n\ndocument.querySelector('#search').addEventListener('input', event => {\n  const term = event.target.value.toLowerCase().trim();\n  const results = menu.filter(i => i.name.toLowerCase().includes(term));\n\n  if (results.length === 0) {\n    const p = document.createElement('p');\n    p.className = 'msg';\n    p.textContent = `No items match \"${term}\"`;     // textContent: safe for user input\n    grid.replaceChildren(p);\n  } else {\n    renderMenu(results);\n  }\n});\n@@explain\nTwo safety rules in one lab: the visitor's text goes in with `textContent`, never `innerHTML`; and the menu's own cards (our data) are fine to build with `innerHTML`.\n```\n\n## Capstone: the full menu page\n\n```lab\ntitle: Menu with filters, search and cart count\nkind: exercise\nmode: dom\nheight: 480\n@@intro\nBring the module together. The page has filter buttons, a search box, and an \"Add\" button on every card that bumps a counter.\n@@steps\n- Render the cards. Each card has a button with `data-id`.\n- Use **one delegated listener** on the grid for the Add buttons.\n- On Add, find the item by id with `menu.find(...)`, increase `cart`, and show `Cart: n items · ₹total`.\n- Sold-out items should not have an Add button.\n@@html\n<header class=\"top\"><h1>Chai Corner<\/h1><span id=\"cartInfo\">Cart: 0 items<\/span><\/header>\n<section id=\"menuGrid\" class=\"grid\"><\/section>\n@@css\n.soldout { opacity: .55; }\n@@js\n{{menu}}\nconst grid = document.querySelector('#menuGrid');\nconst cartInfo = document.querySelector('#cartInfo');\nconst cart = [];\n\nfunction renderMenu(items) {\n  grid.innerHTML = items.map(i => `\n    <article class=\"card ${i.inStock ? '' : 'soldout'}\">\n      <h3>${i.name}<\/h3>\n      <strong>₹${i.price}<\/strong>\n      ${i.inStock ? `<button data-id=\"${i.id}\">Add<\/button>` : '<em>sold out<\/em>'}\n    <\/article>`).join('');\n}\nrenderMenu(menu);\n\n// delegated Add listener below\n\n@@hint\n`grid.addEventListener('click', e => { if (e.target.dataset.id) { ... } })`. Remember `dataset.id` is a string; use `Number(...)`.\n@@solution\n{{menu}}\nconst grid = document.querySelector('#menuGrid');\nconst cartInfo = document.querySelector('#cartInfo');\nconst cart = [];\n\nfunction renderMenu(items) {\n  grid.innerHTML = items.map(i => `\n    <article class=\"card ${i.inStock ? '' : 'soldout'}\">\n      <h3>${i.name}<\/h3>\n      <strong>₹${i.price}<\/strong>\n      ${i.inStock ? `<button data-id=\"${i.id}\">Add<\/button>` : '<em>sold out<\/em>'}\n    <\/article>`).join('');\n}\nrenderMenu(menu);\n\ngrid.addEventListener('click', e => {\n  const id = Number(e.target.dataset.id);\n  if (!id) return;\n  const item = menu.find(i => i.id === id);\n  cart.push(item);\n  const total = cart.reduce((sum, i) => sum + i.price, 0);\n  cartInfo.textContent = `Cart: ${cart.length} items · ₹${total}`;\n});\n```\n\n> portfolio: Your portfolio's projects list is the same pattern: an array of project objects, a `renderProjects()` function, filter buttons by tag.\n\n```quiz\nq: What does `array.map(fn).join('')` produce?\na: An array of strings\na*: One big string with the pieces glued together\na: A number\na: An object\nwhy: `map` makes an array of HTML strings; `join('')` glues them into one string you can put in `innerHTML`.\nq: Cards show commas between them. The most likely cause?\na*: An array was put straight into `innerHTML` without `.join('')`\na: A CSS bug\na: `filter` is broken\na: Too many cards\nwhy: Array-to-string conversion separates elements with commas.\nq: What does `[...new Set(list)]` do?\na: Sorts the list\na*: Removes duplicates\na: Reverses the list\na: Counts items\nwhy: A `Set` only holds unique values; spread turns it back into an array.\nq: Which should you use to echo a visitor's typed text onto the page?\na*: `.textContent`\na: `.innerHTML`\na: `eval`\na: `document.write`\nwhy: `textContent` can never run injected HTML or script.\nq: Why is delegation good for re-rendered lists?\na*: The parent persists, so one listener keeps working as children are replaced\na: It makes listeners faster to type\na: It disables bubbling\na: It is needed for forms\nwhy: Replacing `innerHTML` destroys child elements and their listeners, but not the parent's.\n```\n\n## Building blocks from this module\n\n```raw\n<div class=\"flow\">\n  <div class=\"step\"><b>Render<\/b><span><code>map<\/code> + <code>join('')<\/code><\/span><\/div>\n  <div class=\"step\"><b>Filter<\/b><span><code>filter<\/code> then re-render<\/span><\/div>\n  <div class=\"step\"><b>Unique<\/b><span><code>new Set()<\/code><\/span><\/div>\n  <div class=\"step\"><b>Empty state<\/b><span>friendly message<\/span><\/div>\n  <div class=\"step\"><b>Delegate<\/b><span>listen on the parent<\/span><\/div>\n<\/div>\n```\n\n> note: **Next up: Module 8, Forms and localStorage.** Visitors will send a message through your contact form, and the page will remember them between visits.\n\n```check\ntitle: Self-check before Module 8\n- Your projects (or menu) live in an **array of objects**, not hand-typed HTML\n- One `render...()` function draws them with `map()` and `join('')`\n- Filter buttons redraw the list; an empty state appears when nothing matches\n- No `[object Object]` or stray commas anywhere\n- Committed and pushed\n```\n", "m8": "title: Forms and localStorage\ntag: Module 8 · Day 4, afternoon\nshort: Take input, remember it\ntagline: A page that only talks is a poster. Now it listens to typed input, checks it, and remembers things between visits.\nstory: Customers want to message Asha (\"Do you cater parties?\") and want the site to remember their light/dark choice. Two jobs: **take and check what they type**, and **store it in the browser** so it survives a refresh. That fixes the theme switch from Module 6.\nobjectives:\n- Handle a form's `submit` event and stop the page reload with `event.preventDefault()`\n- Read input values and validate them (empty, too short, bad email)\n- Show friendly error and success messages\n- Store and read data with `localStorage` (`setItem`, `getItem`, `removeItem`)\n- Convert objects and arrays with `JSON.stringify()` and `JSON.parse()`\n- Persist the theme choice, and save and display submitted messages\n---\n## What a form does by default\n\nWhen a form is submitted, the browser's default behaviour is to **reload the page** (sending the data to a server). We have no server yet, so we take control: we listen for `submit`, cancel the default, and handle the data ourselves.\n\n> analogy: A form is a **suggestion box**. By default, dropping a slip in makes the whole shop shut and reopen (the page reload). `preventDefault()` says \"don't close the shop, just hand me the slip.\"\n\n```lab\ntitle: Without and with preventDefault\nkind: playground\nmode: dom\nheight: 260\n@@html\n<h1>Chai Corner<\/h1>\n<form id=\"contactForm\">\n  <input id=\"nameInput\" placeholder=\"Your name\">\n  <button type=\"submit\">Send<\/button>\n<\/form>\n<p id=\"out\">Type a name and press Send.<\/p>\n@@css\n@@js\nconst form = document.querySelector('#contactForm');\n\nform.addEventListener('submit', function (event) {\n  // event.preventDefault();      // <- un-comment this line and compare\n  const name = document.querySelector('#nameInput').value;\n  document.querySelector('#out').textContent = 'Thanks, ' + name + '!';\n});\n@@explain\n```\n\nWith the line commented out, the page reloads (this playground shows a \"page would reload\" notice) and your message disappears instantly. With it active, the page stays and the message appears.\n\n## Reading and checking input\n\n`input.value` is always a **string**. Always `.trim()` it, because a field containing only spaces looks filled but is empty.\n\n| Check | Code |\n| --- | --- |\n| Empty | `value.trim() === ''` |\n| Too short | `value.trim().length < 10` |\n| Rough email | `value.includes('@') && value.includes('.')` |\n\n> cafe: Validation is a **bouncer at the door** of your data. Cheap checks on the way in save you pain everywhere downstream.\n\n## Exercise: the contact form\n\n```lab\ntitle: Validate the Contact Form\nkind: exercise\nmode: dom\nheight: 440\n@@intro\nA contact form with name, email and message. Add the `submit` handler so that bad input shows a friendly error, and good input shows a success message.\n@@steps\n- Listen for `submit` on the form and call `event.preventDefault()` first.\n- Read the three values and `.trim()` them.\n- Name must not be empty, email must contain `@` and `.`, message must be at least 10 characters.\n- If anything fails: show the error in `#formError` (add the class `show`), and `return` early.\n- If all is fine: hide the error, show `#formSuccess`, and `form.reset()`.\n@@html\n<header class=\"top\"><h1>Contact Chai Corner<\/h1><\/header>\n<form id=\"contactForm\">\n  <p><input id=\"nameInput\" placeholder=\"Your name\"><\/p>\n  <p><input id=\"emailInput\" placeholder=\"Email\"><\/p>\n  <p><textarea id=\"messageInput\" rows=\"3\" placeholder=\"Your message\"><\/textarea><\/p>\n  <button type=\"submit\">Send<\/button>\n<\/form>\n<p id=\"formError\" class=\"error-message\"><\/p>\n<p id=\"formSuccess\" class=\"success-message\">Thanks! We'll get back to you soon.<\/p>\n@@css\n@@js\nconst form = document.querySelector('#contactForm');\nconst errorBox = document.querySelector('#formError');\nconst successBox = document.querySelector('#formSuccess');\n\n@@hint\nStructure: `form.addEventListener('submit', event => { event.preventDefault(); ... })`.\n@@hint\nFor each check: `if (name === '') { errorBox.textContent = '...'; errorBox.classList.add('show'); return; }`\n@@solution\nconst form = document.querySelector('#contactForm');\nconst errorBox = document.querySelector('#formError');\nconst successBox = document.querySelector('#formSuccess');\n\nfunction showError(text) {\n  errorBox.textContent = text;\n  errorBox.classList.add('show');\n  successBox.classList.remove('show');\n}\n\nform.addEventListener('submit', event => {\n  event.preventDefault();\n\n  const name = document.querySelector('#nameInput').value.trim();\n  const email = document.querySelector('#emailInput').value.trim();\n  const message = document.querySelector('#messageInput').value.trim();\n\n  if (name === '') return showError('Please tell us your name.');\n  if (!email.includes('@') || !email.includes('.')) return showError('That email does not look right.');\n  if (message.length < 10) return showError('Your message should be at least 10 characters.');\n\n  errorBox.classList.remove('show');\n  successBox.classList.add('show');\n  form.reset();\n});\n@@explain\nGuard clauses (Module 3) again: reject early, and the happy path sits at the bottom, flat and readable.\n```\n\n## localStorage: the browser's pantry\n\nA page forgets everything when you close it. **`localStorage`** is a small shelf inside the browser where a site can leave notes that **survive closing and reopening**.\n\n> analogy: The DOM is the **counter**, wiped clean every closing time. `localStorage` is the **pantry cupboard**: put something on a labelled shelf, and it is still there tomorrow.\n\n| Method | Does |\n| --- | --- |\n| `localStorage.setItem('key', 'value')` | Put a note on a shelf |\n| `localStorage.getItem('key')` | Read it back (`null` if missing) |\n| `localStorage.removeItem('key')` | Remove one |\n| `localStorage.clear()` | Empty the cupboard |\n\n```lab\ntitle: Pantry basics\nkind: playground\nmode: console\nstorage: true\nheight: 260\n@@js\nlocalStorage.setItem('favourite', 'Masala Chai');\nconsole.log(localStorage.getItem('favourite'));      // Masala Chai\nconsole.log(localStorage.getItem('nothing-here'));   // null\n\n// The Storage panel shows what is in the pantry.\n// Run it, then run again: the value is still there, as it would be after a real refresh.\n@@explain\n```\n\n> note: In this playground each lab has its **own private pantry** (see the Storage tab) that survives re-runs. On a real site it is per website, per browser.\n\n### The catch: strings only\n\n`localStorage` stores **only strings**. Store a number and you get a string back. Store an object and you get `\"[object Object]\"`. The fix is JSON.\n\n```lab\ntitle: JSON round trip\nkind: playground\nmode: console\nstorage: true\nheight: 280\n@@js\nlocalStorage.setItem('count', 5);\nconsole.log(typeof localStorage.getItem('count'));    // string!\n\nconst note = { name: 'Priya', message: 'Do you cater parties?' };\n\nlocalStorage.setItem('bad', note);\nconsole.log(localStorage.getItem('bad'));             // [object Object]\n\nlocalStorage.setItem('good', JSON.stringify(note));   // object -> text\nconst back = JSON.parse(localStorage.getItem('good'));// text -> object\nconsole.log(back.name, '/', back.message);\n@@explain\n```\n\n> analogy: `JSON.stringify` is **vacuum-packing** an object so it fits on the shelf. `JSON.parse` is **unpacking** it. Always pack on the way in, unpack on the way out.\n\n## Fix the theme switch (finally)\n\nRemember Module 6's switch that forgot on refresh? Now save the choice and read it on load.\n\n```lab\ntitle: Remember the Theme\nkind: exercise\nmode: dom\nstorage: true\nheight: 320\n@@intro\nMake the choice persist. Press **Reload page** after switching: the page should come back in the same theme.\n@@steps\n- On load, read `localStorage.getItem('theme')`. If it equals `'dark'`, add the `dark` class to `<body>`.\n- In the click handler, after toggling, save `'dark'` or `'light'` with `setItem`.\n- Test it: toggle to dark, hit **Reload page**.\n@@html\n<header class=\"top\">\n  <h1>Chai Corner<\/h1>\n  <button id=\"themeToggle\">Toggle theme<\/button>\n<\/header>\n<div class=\"card\">Today's special: Masala Chai<\/div>\n@@css\nbody.dark { background: #1d2224; color: #e8ecec; }\nbody.dark .card, body.dark .top { background: #2a3033; color: #e8ecec; }\n@@js\nconst themeBtn = document.querySelector('#themeToggle');\n\nthemeBtn.addEventListener('click', () => {\n  document.body.classList.toggle('dark');\n});\n@@hint\n`const isDark = document.body.classList.contains('dark'); localStorage.setItem('theme', isDark ? 'dark' : 'light');`\n@@solution\nconst themeBtn = document.querySelector('#themeToggle');\n\n// 1. restore on load\nif (localStorage.getItem('theme') === 'dark') {\n  document.body.classList.add('dark');\n}\n\n// 2. save on change\nthemeBtn.addEventListener('click', () => {\n  document.body.classList.toggle('dark');\n  const isDark = document.body.classList.contains('dark');\n  localStorage.setItem('theme', isDark ? 'dark' : 'light');\n});\n@@explain\nTwo tiny additions and the memory problem is solved. This is the pattern for any preference: restore on load, save on change.\n```\n\n## Saving messages (arrays in storage)\n\nTo keep a **list** of submitted messages, store an array as JSON. The recipe is always three steps: **read → change → write**.\n\n```lab\ntitle: Message log that survives reloads\nkind: exercise\nmode: dom\nstorage: true\nheight: 440\n@@intro\nEach valid submission is saved, and all saved messages are shown below the form, even after a reload.\n@@steps\n- Write `loadMessages()` which returns `JSON.parse(localStorage.getItem('messages')) || []`.\n- Write `saveMessages(list)` which stores `JSON.stringify(list)`.\n- On submit: validate (empty check is enough), push `{ name, text, time }`, save, re-render.\n- Call `renderMessages()` once at load so old messages appear.\n@@html\n<header class=\"top\"><h1>Guest Book<\/h1><\/header>\n<form id=\"guestForm\">\n  <p><input id=\"nameInput\" placeholder=\"Your name\"><\/p>\n  <p><input id=\"textInput\" placeholder=\"A short note\"><\/p>\n  <button type=\"submit\">Post<\/button>\n  <button type=\"button\" id=\"clearBtn\">Clear all<\/button>\n<\/form>\n<section id=\"messages\"><\/section>\n@@css\n@@js\nconst form = document.querySelector('#guestForm');\nconst box = document.querySelector('#messages');\n\nfunction loadMessages() {\n  // return the saved array, or an empty one\n  return [];\n}\n\nfunction saveMessages(list) {\n  // store it\n}\n\nfunction renderMessages() {\n  const list = loadMessages();\n  box.replaceChildren(...list.map(m => {\n    const p = document.createElement('p');\n    p.className = 'msg';\n    p.textContent = `${m.name}: ${m.text}`;      // visitor text, so textContent\n    return p;\n  }));\n}\n\nrenderMessages();\n\n@@hint\n`return JSON.parse(localStorage.getItem('messages')) || [];` works because `JSON.parse(null)` gives `null`, and `null || []` gives `[]`.\n@@solution\nconst form = document.querySelector('#guestForm');\nconst box = document.querySelector('#messages');\n\nfunction loadMessages() {\n  return JSON.parse(localStorage.getItem('messages')) || [];\n}\n\nfunction saveMessages(list) {\n  localStorage.setItem('messages', JSON.stringify(list));\n}\n\nfunction renderMessages() {\n  const list = loadMessages();\n  box.replaceChildren(...list.map(m => {\n    const p = document.createElement('p');\n    p.className = 'msg';\n    p.textContent = `${m.name}: ${m.text}`;\n    return p;\n  }));\n}\n\nform.addEventListener('submit', event => {\n  event.preventDefault();\n  const name = document.querySelector('#nameInput').value.trim();\n  const text = document.querySelector('#textInput').value.trim();\n  if (!name || !text) return;\n\n  const list = loadMessages();             // read\n  list.push({ name, text, time: Date.now() });   // change\n  saveMessages(list);                      // write\n  renderMessages();\n  form.reset();\n});\n\ndocument.querySelector('#clearBtn').addEventListener('click', () => {\n  localStorage.removeItem('messages');\n  renderMessages();\n});\n\nrenderMessages();\n@@explain\nRead, change, write. Every \"save a list\" feature you will ever build is this loop.\n```\n\n> bug: **Corrupt data crash.** If someone (or an old version of your code) stored something that is not valid JSON, `JSON.parse` throws and your whole page stops. Wrapping the parse in `try / catch` (Module 9) keeps one bad note from breaking the site.\n\n> warn: **Never store passwords or private data in `localStorage`.** Any script on the page can read it, and visitors can open it in DevTools. It is for preferences and harmless notes.\n\n> portfolio: Add a working contact form to your site. Validate it, show friendly messages, and persist the theme choice. Save submitted messages in `localStorage` so you can show them off.\n\n```quiz\nq: What does `event.preventDefault()` do on a form submit?\na: Deletes the form\na*: Stops the browser from reloading the page so you can handle the data yourself\na: Validates the form automatically\na: Submits twice\nwhy: Without it, the default submit reloads the page and your script's state disappears.\nq: `localStorage.setItem('n', 5); typeof localStorage.getItem('n')` gives...\na: \"number\"\na*: \"string\"\na: \"undefined\"\na: \"object\"\nwhy: localStorage stores strings only.\nq: How do you store an array of messages?\na: `setItem('m', array)`\na*: `setItem('m', JSON.stringify(array))`\na: `setItem(array)`\na: You cannot\nwhy: Stringify on the way in, parse on the way out.\nq: What does `getItem('missing')` return?\na: undefined\na: An empty string\na*: null\na: An error\nwhy: A missing key reads as `null`, so `JSON.parse(...) || []` is a common fallback.\nq: Which is the correct order for updating a saved list?\na: write, read, change\na*: read, change, write\na: change, write, read\na: read, write, change\nwhy: Load the current array, modify it, then save the new version.\n```\n\n## Building blocks from this module\n\n```raw\n<div class=\"flow\">\n  <div class=\"step\"><b>Submit<\/b><span><code>preventDefault<\/code><\/span><\/div>\n  <div class=\"step\"><b>Check<\/b><span>trim · empty · length · email<\/span><\/div>\n  <div class=\"step\"><b>Pantry<\/b><span><code>setItem<\/code> · <code>getItem<\/code><\/span><\/div>\n  <div class=\"step\"><b>Pack<\/b><span><code>JSON.stringify<\/code> / <code>parse<\/code><\/span><\/div>\n<\/div>\n```\n\n> note: **Next up: Module 9, Asynchronous JavaScript and APIs.** Fetching live data (like today's specials) from a server, and handling waiting and failure.\n\n```check\ntitle: Self-check before Module 9\n- The contact form validates and shows friendly errors; nothing reloads the page\n- The theme choice survives a refresh\n- Messages are saved as JSON in `localStorage` and render on load\n- No passwords or private data are stored\n- Committed and pushed\n```\n", "m9": "title: Asynchronous JavaScript and APIs\ntag: Module 9 · Day 5, morning\nshort: Waiting without freezing\ntagline: Some things take time: a server answering, a timer ticking. Learn how JavaScript keeps going while it waits, then fetch live data into your page.\nstory: Asha wants a **\"Today's Specials\"** panel that reads from a server, so she can change prices without touching the website. A server takes a moment to answer, and it can fail. Today the page learns to **ask, wait politely, and cope with bad news**.\nobjectives:\n- Explain synchronous vs asynchronous with the restaurant picture\n- Predict the order output of code with `setTimeout`\n- Read and write a Promise chain with `.then()` and `.catch()`\n- Use `async` / `await` with `try / catch`\n- Fetch JSON, check `response.ok`, and parse with `.json()`\n- Show loading, success and error states in the UI\n---\n## Waiting is normal\n\nAsking a server for data is not instant: your request travels, the server thinks, the answer travels back. If JavaScript **froze** until then, the whole page would hang (no clicks, no scrolling).\n\n> analogy: Picture a café with **one waiter**. A *synchronous* waiter takes your order, then stands at the kitchen door until your food is ready, ignoring everyone else. An *asynchronous* waiter takes your order, hands it to the kitchen, and **goes to the next table**. When a dish is ready, the kitchen rings a bell and the waiter delivers it.\n\n```widget\nrestaurant\n```\n\nJavaScript is the second waiter. It has one thread (one waiter), but any slow job (a timer, a network request) is handed off, and your code continues. When the result arrives, the bell rings and your **callback** runs.\n\n## setTimeout: the simplest kitchen timer\n\n```js run manual\nconsole.log('1: order taken');\n\nsetTimeout(() => {\n  console.log('2: dish is ready');\n}, 1000);\n\nconsole.log('3: waiter serves another table');\n```\n\n### Predict the order\n\nThe output is **1, 3, 2**. `setTimeout` does not pause; it sets a timer and moves on. The callback is queued and only runs once the current code has finished **and** the time is up.\n\n> predict: What does this print, and in what order? Even with a delay of `0`, where does `B` appear?\n\n```js run\nconsole.log('A');\nsetTimeout(() => console.log('B (delay 0)'), 0);\nconsole.log('C');\n```\n\n`A, C, B`. A zero delay still means \"later\", after all the current code has finished. Understanding that is the key to async.\n\n```lab\ntitle: Predict the Order\nkind: exercise\nmode: console\nheight: 280\n@@intro\nBefore running, write down your prediction. Then run it and compare.\n@@steps\n- Predict the output order of the starter code.\n- Run it. Were you right?\n- Change the timers so the output order becomes `1, 2, 3` without changing the `console.log` texts.\n@@js\nsetTimeout(() => console.log('3: coffee'), 300);\nsetTimeout(() => console.log('1: chai'), 100);\nsetTimeout(() => console.log('2: samosa'), 200);\nconsole.log('0: waiter says hello');\n@@hint\nThe numbers are delays in milliseconds. The smallest delay fires first, regardless of where it sits in the file.\n@@solution\nsetTimeout(() => console.log('1: chai'), 100);\nsetTimeout(() => console.log('2: samosa'), 200);\nsetTimeout(() => console.log('3: coffee'), 300);\nconsole.log('0: waiter says hello');\n@@explain\nOrder in time depends on the *delays*, not on the order of the lines. And the plain `console.log` always comes first because it runs immediately.\n```\n\n## Promises: an IOU slip\n\nMany async functions return a **Promise**, a stand-in for a value that will arrive later.\n\n> analogy: A Promise is the **token** you get at a busy counter. It is not your chai yet, but it is a promise of one. It will end up either **fulfilled** (chai arrives) or **rejected** (sorry, we ran out).\n\n| State | Meaning | You handle it with |\n| --- | --- | --- |\n| pending | still waiting | (nothing yet) |\n| fulfilled | success, here is the value | `.then(value => ...)` |\n| rejected | failure, here is the reason | `.catch(error => ...)` |\n\n```js run manual\nfunction brewChai(shouldWork) {\n  return new Promise((resolve, reject) => {\n    setTimeout(() => {\n      if (shouldWork) resolve('☕ chai is ready');\n      else reject(new Error('out of milk'));\n    }, 500);\n  });\n}\n\nbrewChai(true)\n  .then(result => console.log('OK:', result))\n  .catch(err => console.log('Problem:', err.message))\n  .finally(() => console.log('Counter cleaned either way'));\n\nbrewChai(false)\n  .then(result => console.log('OK:', result))\n  .catch(err => console.log('Problem:', err.message));\n```\n\n## async / await: the readable way\n\n`.then()` chains get tangled. `async / await` lets you write the same thing so it **reads top to bottom**.\n\n* Mark a function `async`; it now returns a Promise.\n* Inside it, `await` pauses *that function* (not the whole page) until the Promise settles.\n* Wrap the awaits in `try / catch` to handle failure.\n\n```js run manual\nfunction brewChai(shouldWork) {\n  return new Promise((resolve, reject) => {\n    setTimeout(() => shouldWork ? resolve('☕ chai is ready') : reject(new Error('out of milk')), 500);\n  });\n}\n\nasync function serveCustomer() {\n  try {\n    console.log('taking order...');\n    const chai = await brewChai(true);\n    console.log('serving:', chai);\n    const second = await brewChai(false);     // throws here\n    console.log('never reached', second);\n  } catch (error) {\n    console.log('Sorry:', error.message);\n  } finally {\n    console.log('next customer please');\n  }\n}\n\nserveCustomer();\n```\n\n> note: `await` only works inside an `async` function. Using it elsewhere is a syntax error.\n\n## fetch(): asking a server\n\n`fetch(url)` returns a Promise of a **Response**. Getting the data out is two awaits: one for the response, one to unpack its body as JSON.\n\n```raw\n<div class=\"flow\">\n  <div class=\"step\"><b>1 · fetch(url)<\/b><span>send the request<\/span><\/div>\n  <div class=\"step\"><b>2 · response.ok?<\/b><span>was it a success code?<\/span><\/div>\n  <div class=\"step\"><b>3 · response.json()<\/b><span>unpack the body<\/span><\/div>\n  <div class=\"step\"><b>4 · use the data<\/b><span>render it<\/span><\/div>\n<\/div>\n```\n\n> cafe: In this playground there is a pretend server at `https://api.chaicorner.test`. It has `/specials`, `/menu`, and `/baristas/asha`. It behaves like a real API, delay and all. Real public APIs only work in a real page; the sandbox here blocks them.\n\n```lab\ntitle: Your first fetch\nkind: playground\nmode: console\nheight: 320\n@@js\nasync function loadSpecials() {\n  console.log('asking the server...');\n  const response = await fetch('https://api.chaicorner.test/specials');\n  console.log('status:', response.status, 'ok?', response.ok);\n\n  const specials = await response.json();\n  console.log('got', specials.length, 'specials');\n  specials.forEach(s => console.log(`- ${s.name} (₹${s.price}) ${s.note}`));\n}\n\nloadSpecials();\nconsole.log('this line runs BEFORE the data arrives');\n@@explain\n```\n\nLook at the order: the last `console.log` fires first. The page was never frozen.\n\n### The trap: fetch does not throw on 404\n\n`fetch` only rejects when the **network** fails. A \"404 Not Found\" or \"403 Forbidden\" is a successful *conversation* with bad news. So **always check `response.ok`**.\n\n```lab\ntitle: Error handling that actually works\nkind: playground\nmode: console\nmood: true\nheight: 340\n@@js\nasync function loadBarista(name) {\n  try {\n    const response = await fetch(`https://api.chaicorner.test/baristas/${name}`);\n\n    if (!response.ok) {\n      throw new Error(`Server said ${response.status}`);\n    }\n\n    const person = await response.json();\n    console.log('found:', person.name || person.login);\n  } catch (error) {\n    console.log('failed:', error.message);\n  }\n}\n\nloadBarista('asha');\nloadBarista('nobody-here');      // 404\n@@explain\n```\n\nUse the **network condition** menu in the run bar: switch to *Offline* (the network itself fails), *Rate limited* (403) or *Slow* (a long wait), and see each failure surface in `catch`.\n\n## Exercise: Today's Specials\n\n```lab\ntitle: Today's Specials panel\nkind: exercise\nmode: dom\nmood: true\nheight: 400\n@@intro\nFetch the specials and show them in a panel. Show a loading message first, and a friendly error if anything goes wrong.\n@@steps\n- Show `Loading specials...` immediately.\n- `await fetch('https://api.chaicorner.test/specials')`, then check `response.ok`.\n- Parse JSON and render each special as a card (name, note, price).\n- In `catch`, show a friendly error in the panel and `console.error` the detail.\n- Test with the network menu: **Offline** and **Rate limited** must show a friendly message, not a blank panel.\n@@html\n<header class=\"top\"><h1>Chai Corner<\/h1><\/header>\n<h2>Today's Specials<\/h2>\n<section id=\"specials\" class=\"grid\"><\/section>\n@@css\n@@js\nconst panel = document.querySelector('#specials');\n\nasync function loadSpecials() {\n  // your code\n}\n\nloadSpecials();\n@@hint\nStart with `panel.innerHTML = '<p class=\"loading\">Loading specials...<\/p>';` then a `try { ... } catch (e) { ... }`.\n@@hint\nInside `try`: `const res = await fetch(url); if (!res.ok) throw new Error('Server said ' + res.status); const data = await res.json();`\n@@solution\nconst panel = document.querySelector('#specials');\n\nasync function loadSpecials() {\n  panel.innerHTML = '<p class=\"loading\">Loading specials...<\/p>';\n  try {\n    const res = await fetch('https://api.chaicorner.test/specials');\n    if (!res.ok) throw new Error('Server said ' + res.status);\n    const specials = await res.json();\n\n    panel.innerHTML = specials.map(s => `\n      <article class=\"card\">\n        <h3>${s.name}<\/h3>\n        <p>${s.note}<\/p>\n        <strong>₹${s.price}<\/strong>\n      <\/article>`).join('');\n  } catch (error) {\n    console.error(error);\n    panel.innerHTML = '<p class=\"error-message show\">Could not load specials right now. Please try again in a moment.<\/p>';\n  }\n}\n\nloadSpecials();\n@@explain\nThree states, every time: loading, success, error. A page that only handles success looks broken the first time the network hiccups.\n```\n\n## JSON in two directions\n\nJSON looks like a JavaScript object written as text. It is the common language of web APIs.\n\n```js run\nconst barista = { name: 'Asha', drinks: 1240, active: true, tips: null };\n\nconst text = JSON.stringify(barista);     // object -> string\nconsole.log(text);\nconsole.log(typeof text);\n\nconst back = JSON.parse(text);            // string -> object\nconsole.log(back.name, back.drinks);\n```\n\n> note: `response.json()` does the `JSON.parse` for you, and returns a Promise (reading the body takes time too), which is why it needs its own `await`.\n\n## Capstone: the Barista Card\n\nA \"barista card\" component, like the GitHub profile cards in many portfolios. Some profiles are missing fields: Asha has no `bio`, Ravi has no `name`. A robust card handles the gaps.\n\n```lab\ntitle: Barista Card\nkind: exercise\nmode: dom\nmood: true\nheight: 440\n@@intro\nFetch a barista by name from `/baristas/:name` and render a card. Handle missing fields, unknown names (404) and network failure.\n@@steps\n- Use the input and button to fetch `https://api.chaicorner.test/baristas/${name}`.\n- Show the name (fall back to `login` if `name` is `null`) and the bio (fall back to `No bio yet` if `null`).\n- Show drinks made, followers and location.\n- On 404 show `Barista not found`. On network failure show a different friendly message.\n- Try `asha`, `ravi` and `nobody`.\n@@html\n<header class=\"top\"><h1>Meet the Team<\/h1><\/header>\n<form id=\"lookup\">\n  <input id=\"who\" value=\"asha\" aria-label=\"barista name\">\n  <button type=\"submit\">Find<\/button>\n<\/form>\n<section id=\"card\"><\/section>\n@@css\n@@js\nconst form = document.querySelector('#lookup');\nconst out = document.querySelector('#card');\n\nform.addEventListener('submit', event => {\n  event.preventDefault();\n  const name = document.querySelector('#who').value.trim();\n  if (name) showBarista(name);\n});\n\nasync function showBarista(name) {\n  // your code\n}\n@@hint\n`const res = await fetch(...)`; if `res.status === 404`, show \"not found\"; otherwise if `!res.ok`, throw.\n@@solution\nconst form = document.querySelector('#lookup');\nconst out = document.querySelector('#card');\n\nform.addEventListener('submit', event => {\n  event.preventDefault();\n  const name = document.querySelector('#who').value.trim();\n  if (name) showBarista(name);\n});\n\nasync function showBarista(name) {\n  out.innerHTML = '<p class=\"loading\">Looking up ' + encodeURIComponent(name) + '...<\/p>';\n  try {\n    const res = await fetch(`https://api.chaicorner.test/baristas/${encodeURIComponent(name)}`);\n    if (res.status === 404) {\n      out.innerHTML = '<p class=\"barista-error\">Barista not found.<\/p>';\n      return;\n    }\n    if (!res.ok) throw new Error('Server said ' + res.status);\n\n    const b = await res.json();\n    out.innerHTML = `\n      <article class=\"barista-card\">\n        <img src=\"${b.avatar_url}\" alt=\"\" width=\"64\" height=\"64\">\n        <h3>${b.name ?? b.login}<\/h3>\n        <p>${b.bio ?? 'No bio yet'}<\/p>\n        <p>${b.drinks_made} drinks · ${b.followers} followers · ${b.location}<\/p>\n      <\/article>`;\n  } catch (error) {\n    console.error(error);\n    out.innerHTML = '<p class=\"barista-error\">Could not reach the team directory. Check your connection and try again.<\/p>';\n  }\n}\n@@explain\n`??` (nullish coalescing) means \"use the right side if the left side is `null` or `undefined`\". It is the neat way to supply a fallback for missing data.\n```\n\n> portfolio: Your portfolio can fetch a real public API (for example a GitHub profile) in a real browser page. Reuse these shapes: loading text, `response.ok`, `try / catch`, fallbacks for missing fields. Real APIs also impose **rate limits**; a 403 is normal, so handle it gracefully.\n\n```quiz\nq: What does this print: `console.log('A'); setTimeout(() => console.log('B'), 0); console.log('C');`\na: A B C\na*: A C B\na: B A C\na: C A B\nwhy: Even a 0 ms timeout runs after the current code finishes.\nq: A Promise can be in which states?\na: open, closed\na*: pending, fulfilled, rejected\na: true, false\na: sync, async\nwhy: Pending first, then it settles as fulfilled or rejected.\nq: `fetch('/missing')` receives a 404. What happens?\na: The Promise rejects\na*: The Promise fulfils; you must check `response.ok`\na: JavaScript crashes\na: It retries\nwhy: `fetch` only rejects on network failure.\nq: `await` can be used...\na: Anywhere\na*: Inside an `async` function\na: Only in loops\na: Only with fetch\nwhy: Outside async functions (in a classic script), it is a syntax error.\nq: What is `null ?? 'No bio yet'`?\na: null\na*: 'No bio yet'\na: undefined\na: false\nwhy: `??` falls back when the left side is `null` or `undefined`.\n```\n\n## Building blocks from this module\n\n```raw\n<div class=\"flow\">\n  <div class=\"step\"><b>Timers<\/b><span><code>setTimeout<\/code><\/span><\/div>\n  <div class=\"step\"><b>Promises<\/b><span><code>.then<\/code> · <code>.catch<\/code><\/span><\/div>\n  <div class=\"step\"><b>async / await<\/b><span><code>try / catch<\/code><\/span><\/div>\n  <div class=\"step\"><b>fetch<\/b><span><code>ok<\/code> · <code>.json()<\/code><\/span><\/div>\n  <div class=\"step\"><b>States<\/b><span>loading · success · error<\/span><\/div>\n<\/div>\n```\n\n> note: **Next up: Module 10, Code quality, Git and Demo Day.** Reading errors, debugging, refactoring, committing, and presenting the finished site.\n\n```check\ntitle
