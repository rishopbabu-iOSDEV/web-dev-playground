        out += word; i = j; last = "x"; continue;
      }
      out += c;
      if (!/\s/.test(c)) last = c;
      i++;
    }
    return out;
  } catch (e) {
    return src;
  }
}

/* ===================== editors ===================== */
function makeEditor(host, value, mode, onRun, onChange) {
  if (window.CodeMirror) {
    const cm = window.CodeMirror(host, {
      value, mode: mode === "css" ? "text/css" : mode, theme: "chai", lineNumbers: true, tabSize: 2, indentUnit: 2,
      indentWithTabs: false, matchBrackets: true, autoCloseBrackets: true, viewportMargin: Infinity,
      extraKeys: {
        "Ctrl-Enter": onRun, "Cmd-Enter": onRun,
        Tab: (c) => (c.somethingSelected() ? c.indentSelection("add") : c.replaceSelection("  ", "end")),
        "Shift-Tab": (c) => c.indentSelection("subtract")
      }
    });
    cm.on("change", onChange);
    let marked = null;
    return {
      get: () => cm.getValue(),
      set: (v) => cm.setValue(v),
      refresh: () => cm.refresh(),
      focus: () => cm.focus(),
      mark(line) {
        this.unmark();
        if (line >= 1 && line <= cm.lineCount()) { marked = line - 1; cm.addLineClass(marked, "background", "cm-errline"); }
      },
      unmark() { if (marked != null) { try { cm.removeLineClass(marked, "background", "cm-errline"); } catch (e) {} marked = null; } },
      goto(line) { cm.focus(); cm.setCursor({ line: Math.max(0, line - 1), ch: 0 }); cm.scrollIntoView({ line: Math.max(0, line - 1), ch: 0 }, 80); }
    };
  }
  const ta = h("textarea", { class: "fallback-editor", spellcheck: "false" });
  ta.value = value;
  ta.addEventListener("input", onChange);
  ta.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); onRun(); }
    if (e.key === "Tab") { e.preventDefault(); const s = ta.selectionStart; ta.setRangeText("  ", s, ta.selectionEnd, "end"); onChange(); }
  });
  host.append(ta);
  ta.rows = Math.min(24, Math.max(4, value.split("\n").length + 1));
  return { get: () => ta.value, set: (v) => { ta.value = v; }, refresh() {}, focus: () => ta.focus(), mark() {}, unmark() {}, goto() { ta.focus(); } };
}

function highlightInto(node, code, mode) {
  node.classList.add("cm-s-chai");
  if (window.CodeMirror && window.CodeMirror.runMode && mode && mode !== "text") {
    try { window.CodeMirror.runMode(code, mode === "css" ? "text/css" : mode, node); return; } catch (e) {}
  }
  node.textContent = code;
}

function copyText(text, btn) {
  const done = () => { if (!btn) return; const old = btn.textContent; btn.textContent = "Copied"; setTimeout(() => (btn.textContent = old), 1200); };
  const fallback = () => {
    const ta = h("textarea", { style: "position:fixed;opacity:0" }); ta.value = text; document.body.append(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (e) {} ta.remove();
  };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
}

function staticCode(b) {
  const pre = h("pre", { class: "code-static" });
  const code = h("code");
  highlightInto(code, b.code, b.lang === "js" || b.lang === "javascript" ? "javascript" : b.lang === "html" ? "htmlmixed" : b.lang === "css" ? "css" : "text");
  pre.append(code);
  const wrap = h("figure", { class: "codefig" });
  if (b.title) wrap.append(h("figcaption", { text: b.title }));
  const btn = h("button", { class: "copy-btn", type: "button", text: "Copy", onclick: () => copyText(b.code, btn) });
  wrap.append(pre, btn);
  return wrap;
}

/* ===================== console rendering ===================== */
function preview(v, depth) {
  switch (v.t) {
    case "str": return h("span", { class: "v-str", text: "'" + v.v.replace(/\n/g, "↵") + "'" });
    case "num": return h("span", { class: "v-num", text: v.v });
    case "bool": return h("span", { class: "v-bool", text: String(v.v) });
    case "null": return h("span", { class: "v-nil", text: "null" });
    case "undef": return h("span", { class: "v-nil", text: "undefined" });
    case "sym": return h("span", { class: "v-str", text: v.v });
    case "fn": return h("span", { class: "v-fn", text: (/^(async\s+)?(function|class)\b/.test(v.v) ? "ƒ " : "") + v.v.slice(0, depth > 0 ? 40 : 100) + (v.v.length > (depth > 0 ? 40 : 100) ? "…" : "") });
    case "node": return h("span", { class: "v-node", text: v.v });
    case "date": case "re": return h("span", { class: "v-str", text: v.v });
    case "promise": return h("span", { class: "v-obj", text: "Promise {<pending>}" });
    case "circ": return h("span", { class: "v-nil", text: "[Circular]" });
    case "more": return h("span", { class: "v-nil", text: "…" });
    case "deep": return h("span", { class: "v-obj", text: v.ctor });
    case "err": return h("span", { class: "v-err", text: v.name + ": " + v.msg });
    case "arr": {
      const s = h("span", { class: "v-obj" });
      if (v.label) s.append(v.label + "(" + v.len + ") ");
      else if (v.len > 1) s.append("(" + v.len + ") ");
      s.append("[");
      if (depth >= 2) { s.append(v.len ? "…" : ""); }
      else v.items.slice(0, 8).forEach((it, i) => { if (i) s.append(", "); s.append(preview(it, depth + 1)); });
      if (depth < 2 && v.len > 8) s.append(", …");
      s.append("]");
      return s;
    }
    case "set": case "map": {
      const s = h("span", { class: "v-obj" }, (v.t === "set" ? "Set(" : "Map(") + v.size + ") {");
      if (depth < 2) v.items.slice(0, 6).forEach((it, i) => {
        if (i) s.append(", ");
        if (v.t === "set") s.append(preview(it, depth + 1)); else { s.append(preview(it[0], depth + 1), " => ", preview(it[1], depth + 1)); }
      });
      s.append("}");
      return s;
    }
    case "obj": {
      const s = h("span", { class: "v-obj" });
      if (v.ctor) s.append(v.ctor + " ");
      s.append("{");
      if (depth >= 2) { s.append(v.props.length ? "…" : ""); }
      else {
        v.props.slice(0, 6).forEach((p, i) => { if (i) s.append(", "); s.append(h("span", { class: "v-key", text: p[0] }), ": ", preview(p[1], depth + 1)); });
        if (v.props.length > 6 || v.more > 0) s.append(", …");
      }
      s.append("}");
      return s;
    }
  }
  return h("span", { text: "?" });
}
function expandable(v) {
  return (v.t === "arr" && v.items.length) || (v.t === "obj" && v.props.length) || ((v.t === "set") && v.items.length) || (v.t === "map" && v.items.length);
}
function tree(v, key) {
  const label = key != null ? [h("span", { class: "v-key", text: key }), ": "] : [];
  if (!expandable(v)) return h("div", { class: "tr-leaf" }, label, preview(v, 0));
  const d = h("details", { class: "tr" });
  d.append(h("summary", null, label, preview(v, 0)));
  const body = h("div", { class: "tr-body" });
  if (v.t === "arr") v.items.forEach((it, i) => body.append(tree(it, String(i))));
  if (v.t === "obj") v.props.forEach((p) => body.append(tree(p[1], p[0])));
  if (v.t === "set") v.items.forEach((it, i) => body.append(tree(it, String(i))));
  if (v.t === "map") v.items.forEach((it, i) => body.append(h("div", { class: "tr-leaf" }, h("span", { class: "v-key", text: i }), ": ", preview(it[0], 1), " => ", preview(it[1], 1))));
  if (v.t === "arr") body.append(h("div", { class: "tr-leaf v-nil", text: "length: " + v.len }));
  d.append(body);
  return d;
}
function topValue(v) {
  if (v.t === "str") return h("span", { class: "v-plain", text: v.v });
  if (v.t === "err") return h("span", { class: "v-err", text: v.name + ": " + v.msg });
  return tree(v, null);
}

/* ===================== labs ===================== */
const RUNS = {};
let runSeq = 0;
let ACTIVE_LABS = [];

const defaultPhone = false;

function codeKey(id) { return "chai:v1:code:" + id; }

function createLab(spec, ctx) {
  const id = "m" + ctx.mod + "-l" + ctx.labN++;
  const saved = store.get(codeKey(id), null);
  const lab = {
    id, spec, mode: spec.mode === "dom" ? "dom" : "console", editors: {}, entries: [], frame: null, rid: null,
    store: store.get("chai:v1:store:" + id, {}), mood: "normal", deferOn: spec.opts.defer === "off" ? false : true,
    deferToggle: spec.opts.defer === "toggle" || spec.opts.defer === "off",
    errorsSeen: 0, ranOnce: false, done: false, domRows: null, ctx
  };
  lab.code = {
    html: saved && saved.html != null ? saved.html : spec.html,
    css: saved && saved.css != null ? saved.css : spec.css,
    js: saved && saved.js != null ? saved.js : spec.js
  };
  lab.root = buildLabUI(lab);
  ACTIVE_LABS.push(lab);
  return lab;
}

function labCode(lab) {
  return {
    html: lab.editors.html ? lab.editors.html.get() : lab.code.html,
    css: lab.editors.css ? lab.editors.css.get() : lab.code.css,
    js: lab.editors.js ? lab.editors.js.get() : lab.code.js
  };
}

function buildLabUI(lab) {
  const spec = lab.spec;
  const isDom = lab.mode === "dom";
  const isEx = spec.kind === "exercise";
  const root = h("section", { class: "lab " + (isEx ? "lab-ex" : spec.kind === "example" ? "lab-example" : "lab-play") + (isDom ? " lab-dom" : "") });
  const kindLabel = isEx ? "Your turn" : spec.kind === "example" ? "Try it" : "Playground";
  const head = h("header", { class: "lab-head" },
    h("span", { class: "lab-kind", text: kindLabel }),
    h("h4", { text: spec.title }));
  root.append(head);

  let doneBtn = null;
  if (isEx) {
    doneBtn = h("button", { class: "btn btn-quiet done-btn", type: "button", "aria-pressed": "false" });
    const sync = () => {
      const on = !!progress.ex[lab.id];
      doneBtn.textContent = on ? "Done ✓" : "Mark as done";
      doneBtn.setAttribute("aria-pressed", String(on));
      doneBtn.classList.toggle("is-on", on);
    };
    doneBtn.addEventListener("click", () => { progress.ex[lab.id] = !progress.ex[lab.id]; saveProgress(); sync(); refreshProgressUI(); });
    sync();
    head.append(doneBtn);
  }

  if (spec.intro.length || spec.steps.length) {
    const intro = h("div", { class: "lab-intro" });
    spec.intro.forEach((b) => intro.append(renderBlock(b, lab.ctx)));
    if (spec.steps.length) {
      intro.append(h("div", { class: "lab-steps-label", text: "What to do" }));
      spec.steps.forEach((b) => intro.append(renderBlock(b, lab.ctx)));
    }
    root.append(intro);
  }

  const body = h("div", { class: "lab-body" });
  const codeCol = h("div", { class: "lab-code" });
  const outCol = h("div", { class: "lab-out" });
  body.append(codeCol, outCol);
  root.append(body);

  /* ---- editor tabs ---- */
  const wantTabs = isDom ? (spec.opts.tabs || "html,css,js").split(",").map((s) => s.trim()) : ["js"];
  const tabNames = { html: "index.html", css: "styles.css", js: "script.js" };
  const modes = { html: "htmlmixed", css: "css", js: "javascript" };
  const tabBar = h("div", { class: "tabs", role: "tablist" });
  const panes = h("div", { class: "panes" });
  const paneEls = {};
  const onChange = () => {
    clearTimeout(lab.saveT);
    lab.saveT = setTimeout(() => store.set(codeKey(lab.id), labCode(lab)), 400);
  };
  const run = () => runLab(lab);
  const showTab = (name) => {
    wantTabs.forEach((t) => {
      paneEls[t].hidden = t !== name;
      const tb = tabBar.querySelector('[data-tab="' + t + '"]');
      if (tb) tb.setAttribute("aria-selected", String(t === name));
    });
    if (!lab.editors[name]) {
      lab.editors[name] = makeEditor(paneEls[name], lab.code[name], modes[name], run, onChange);
    }
    lab.editors[name].refresh();
  };
  wantTabs.forEach((t) => {
    paneEls[t] = h("div", { class: "pane", hidden: true });
    panes.append(paneEls[t]);
    if (wantTabs.length > 1 || isDom) {
      tabBar.append(h("button", { class: "tab", type: "button", role: "tab", "data-tab": t, text: tabNames[t], onclick: () => showTab(t) }));
    }
  });
  if (tabBar.children.length) codeCol.append(tabBar); else codeCol.append(h("div", { class: "file-label", text: "script.js" }));
  codeCol.append(panes);
  lab.showTab = showTab;
  lab.wantTabs = wantTabs;
  // make sure every editor exists (needed to read values & for tests)
  showTab(wantTabs[wantTabs.length - 1] === "js" ? "js" : wantTabs[0]);
  wantTabs.forEach((t) => { if (!lab.editors[t]) { const was = paneEls[t].hidden; paneEls[t].hidden = false; lab.editors[t] = makeEditor(paneEls[t], lab.code[t], modes[t], run, onChange); paneEls[t].hidden = was; } });

  /* ---- action bar ---- */
  const status = h("span", { class: "status", "aria-live": "polite" });
  lab.status = status;
  const bar = h("div", { class: "lab-bar" });
  bar.append(h("button", { class: "btn btn-primary", type: "button", title: "Run (Ctrl or Cmd + Enter)", onclick: run, html: "<span aria-hidden='true'>▶</span> Run" }));
  bar.append(h("button", { class: "btn", type: "button", text: "Reset", onclick: () => resetLab(lab) }));
  if (isDom && lab.deferToggle) {
    const cb = h("input", { type: "checkbox", id: lab.id + "-defer" });
    cb.checked = lab.deferOn;
    cb.addEventListener("change", () => { lab.deferOn = cb.checked; runLab(lab); });
    bar.append(h("label", { class: "toggle", for: lab.id + "-defer" }, cb, " defer"));
  }
  if (spec.opts.mood) {
    const sel = h("select", { id: lab.id + "-mood", "aria-label": "Network condition" },
      h("option", { value: "normal", text: "Network: working" }),
      h("option", { value: "offline", text: "Network: Wi-Fi off" }),
      h("option", { value: "ratelimit", text: "Server: busy (403)" }),
      h("option", { value: "slow", text: "Network: very slow" }));
    sel.addEventListener("change", () => { lab.mood = sel.value; runLab(lab); });
    bar.append(sel);
  }
  bar.append(h("span", { class: "hint-keys", html: "<kbd>Ctrl</kbd>+<kbd>Enter</kbd>" }));
  bar.append(status);
  codeCol.append(bar);

  /* ---- output ---- */
  const consoleBody = h("div", { class: "console-body", role: "log" });
  lab.consoleBody = consoleBody;
  const consolePane = h("div", { class: "dt-pane" },
    h("div", { class: "dt-tools" }, h("span", { class: "dt-title", text: "Console" }),
      h("button", { class: "btn-tiny", type: "button", text: "Clear", onclick: () => { consoleBody.textContent = ""; lab.entries = []; renderEmpty(lab); } })),
    consoleBody);
  lab.consolePane = consolePane;

  if (isDom) {
    const frameWrap = h("div", { class: "frame-wrap" });
    lab.frameWrap = frameWrap;
    const chrome = h("div", { class: "chrome" },
      h("span", { class: "dots", "aria-hidden": "true" }, h("i"), h("i"), h("i")),
      h("span", { class: "url", text: "chaicorner.test/" + (spec.opts.page || "index.html") }),
      h("button", { class: "btn-tiny", type: "button", text: "Phone width", "aria-pressed": "false", onclick: (e) => {
        const on = frameWrap.classList.toggle("phone");
        e.currentTarget.setAttribute("aria-pressed", String(on));
        e.currentTarget.textContent = on ? "Full width" : "Phone width";
      } }),
      h("button", { class: "btn-tiny", type: "button", text: "Reload page", onclick: run }));
    const stage = h("div", { class: "stage" }, frameWrap);
    stage.style.setProperty("--frame-h", (spec.opts.height || 280) + "px");
    outCol.append(h("div", { class: "preview" }, chrome, stage));

    const dtTabs = h("div", { class: "dt-tabs", role: "tablist" });
    const dtPanes = {};
    const domTree = h("div", { class: "dom-tree" }, h("div", { class: "dt-empty", text: "Run the page to see its live DOM here." }));
    lab.domTree = domTree;
    dtPanes.console = consolePane;
    dtPanes.elements = h("div", { class: "dt-pane" }, h("div", { class: "dt-tools" }, h("span", { class: "dt-title", text: "Elements (the live DOM)" })), domTree);
    const names = [["console", "Console"], ["elements", "Elements"]];
    if (spec.opts.storage) {
      const stBody = h("div", { class: "st-body" });
      lab.stBody = stBody;
      dtPanes.storage = h("div", { class: "dt-pane" }, h("div", { class: "dt-tools" }, h("span", { class: "dt-title", text: "Application → Local Storage" }),
        h("button", { class: "btn-tiny", type: "button", text: "Clear all", onclick: () => { lab.store = {}; store.set("chai:v1:store:" + lab.id, {}); renderStorage(lab); } })), stBody);
      names.push(["storage", "Storage"]);
      renderStorage(lab);
    }
    const showDt = (n) => {
      names.forEach(([k]) => { dtPanes[k].hidden = k !== n; dtTabs.querySelector('[data-dt="' + k + '"]').setAttribute("aria-selected", String(k === n)); });
    };
    names.forEach(([k, label]) => dtTabs.append(h("button", { class: "tab", type: "button", role: "tab", "data-dt": k, text: label, onclick: () => showDt(k) })));
    lab.showDt = showDt;
    const dt = h("div", { class: "devtools" }, dtTabs);
    names.forEach(([k]) => dt.append(dtPanes[k]));
    outCol.append(dt);
    showDt("console");
  } else {
    outCol.append(h("div", { class: "devtools devtools-solo" }, consolePane));
    lab.frameWrap = h("div", { class: "frame-hidden", "aria-hidden": "true" });
    outCol.append(lab.frameWrap);
  }
  renderEmpty(lab);

  /* ---- hints & solution ---- */
  if (isEx && (spec.hints.length || spec.solution.js != null)) {
    const help = h("div", { class: "lab-help" });
    const hintBox = h("div", { class: "hint-box" });
    let shown = 0;
    if (spec.hints.length) {
      const hb = h("button", { class: "btn", type: "button", text: "Show hint 1 of " + spec.hints.length });
      hb.addEventListener("click", () => {
        const c = h("div", { class: "hint" }, h("strong", { text: "Hint " + (shown + 1) + ". " }));
        spec.hints[shown].forEach((b) => c.append(renderBlock(b, lab.ctx)));
        hintBox.append(c); shown++;
        if (shown >= spec.hints.length) hb.remove(); else hb.textContent = "Show hint " + (shown + 1) + " of " + spec.hints.length;
      });
      help.append(hb);
    }
    if (spec.solution.js != null) {
      const sol = h("div", { class: "solution", hidden: true });
      const sb = h("button", { class: "btn", type: "button", text: "Show a solution" });
      sb.addEventListener("click", () => {
        sol.hidden = !sol.hidden;
        sb.textContent = sol.hidden ? "Show a solution" : "Hide solution";
        if (!sol.hidden && !sol.dataset.built) {
          sol.dataset.built = "1";
          sol.append(h("p", { class: "muted", text: "Try it yourself first. There are many correct answers. This is one of them." }));
          const parts = [["html", spec.solution.html], ["css", spec.solution.css], ["js", spec.solution.js]].filter((x) => x[1] != null);
          parts.forEach(([k, code]) => sol.append(staticCode({ lang: k, code, title: tabNames[k] })));
          const use = h("button", { class: "btn btn-primary", type: "button", text: "Load into the editor" });
          use.addEventListener("click", () => {
            parts.forEach(([k, code]) => lab.editors[k] && lab.editors[k].set(code));
            onChange(); runLab(lab);
          });
          sol.append(use);
          if (spec.explain.length) {
            const ex = h("div", { class: "explain" });
            spec.explain.forEach((b) => ex.append(renderBlock(b, lab.ctx)));
            sol.append(ex);
          }
        }
      });
      help.append(sb);
      help.append(hintBox, sol);
    } else help.append(hintBox);
    root.append(help);
  }

  lab.getSolution = () => spec.solution;
  return root;
}

function resetLab(lab) {
  const s = lab.spec;
  ["html", "css", "js"].forEach((k) => { if (lab.editors[k]) lab.editors[k].set(s[k]); });
  store.del(codeKey(lab.id));
  lab.store = {}; store.del("chai:v1:store:" + lab.id);
  if (lab.stBody) renderStorage(lab);
  runLab(lab, true);
}

function renderEmpty(lab) {
  if (!lab.consoleBody.children.length) {
    lab.consoleBody.append(h("div", { class: "console-empty", text: lab.ranOnce ? "Nothing was printed. Use console.log() to show something here." : "Press Run to see what your code prints." }));
  }
}

function addEntry(lab, node, cls) {
  const cb = lab.consoleBody;
  const empty = cb.querySelector(".console-empty");
  if (empty) empty.remove();
  node.classList.add("entry");
  if (cls) node.classList.add(cls);
  cb.append(node);
  cb.scrollTop = cb.scrollHeight;
}

function mapStack(stack, lab, skipFirst) {
  const lines = stack.split("\n");
  if (skipFirst) lines.shift();
  const out = [];
  for (const l of lines) {
    const m = l.match(/(?:about:srcdoc|<anonymous>)?:(\d+):(\d+)\)?\s*$/);
    if (!/at /.test(l) || !/srcdoc/.test(l)) continue;
    const ln = parseInt(m[1], 10) - lab.offset;
    if (ln < 1) continue;
    out.push(l.replace(/about:srcdoc:\d+:\d+/, "script.js:" + ln + ":" + m[2]).trim());
  }
  return out;
}

function locLink(lab, line, col) {
  const a = h("button", { class: "loc", type: "button", text: "script.js:" + line + (col ? ":" + col : "") });
  a.addEventListener("click", () => {
    if (lab.showTab) lab.showTab("js");
    lab.editors.js && lab.editors.js.goto(line);
  });
  return a;
}

function onLabMessage(lab, type, data) {
  switch (type) {
    case "log": {
      const row = h("div", { class: "row" });
      if (data.g) row.style.paddingLeft = data.g * 14 + "px";
      data.args.forEach((a, i) => {
        if (i) row.append(" ");
        row.append(i === 0 || a.t !== "str" ? topValue(a) : h("span", { class: "v-plain", text: a.v }));
      });
      if (data.m === "group") row.classList.add("is-group");
      lab.entries.push(data);
      const errArg = data.args.find((a) => a.t === "err");
      if (errArg) {
        const st = mapStack(errArg.stack, lab, true).slice(0, 3);
        if (st.length) row.append(h("div", { class: "stack", text: st.join("\n") }));
      }
      addEntry(lab, row, data.m === "error" ? "is-error" : data.m === "warn" ? "is-warn" : "");
      if (data.m === "error") lab.errorsSeen++;
      break;
    }
    case "table": {
      const t = h("table", { class: "ctable" });
      const hr = h("tr", null, h("th", { text: "(index)" }));
      data.cols.forEach((c) => hr.append(h("th", { text: c })));
      if (data.hasVal) hr.append(h("th", { text: "Value" }));
      t.append(h("thead", null, hr));
      const tb = h("tbody");
      data.rows.forEach((r) => {
        const tr = h("tr", null, h("td", { text: r.idx }));
        data.cols.forEach((c) => tr.append(h("td", { text: r.cells[c] == null ? "" : r.cells[c] })));
        if (data.hasVal) tr.append(h("td", { text: r.val == null ? "" : r.val }));
        tb.append(tr);
      });
      t.append(tb);
      addEntry(lab, h("div", { class: "row table-row" }, h("div", { class: "table-scroll" }, t)));
      break;
    }
    case "clear": lab.consoleBody.textContent = ""; lab.entries = []; break;
    case "uncaught": {
      lab.errorsSeen++;
      const line = data.line - lab.offset;
      const row = h("div", { class: "row" }, h("span", { class: "v-err", text: data.msg }));
      if (line >= 1 && data.line > 0) {
        row.append(" ", locLink(lab, line, data.col));
        if (lab.editors.js) lab.editors.js.mark(line);
      }
      lab.entries.push({ m: "error", uncaught: true, msg: data.msg });
      addEntry(lab, row, "is-error");
      break;
    }
    case "storage":
      lab.store = data.data;
      store.set("chai:v1:store:" + lab.id, lab.store);
      renderStorage(lab);
      break;
    case "dom":
      lab.domRows = data.rows;
      renderDomTree(lab);
      break;
    case "done":
      lab.done = true;
      lab.status.textContent = "Ran in " + data.ms + " ms";
      renderEmpty(lab);
      break;
    case "formreload": {
      const note = h("div", { class: "reload-note", role: "alert" },
        h("strong", { text: "The page just reloaded. " }),
        "No one called ", h("code", { text: "event.preventDefault()" }),
        ", so the browser did its default thing: it sent the form away and rebuilt the page. Anything typed in the form is gone.");
      lab.frameWrap.parentNode.append(note);
      lab.entries.push({ m: "log", formreload: true });
      setTimeout(() => { note.remove(); runLab(lab, true); }, 2600);
      break;
    }
  }
}

function renderDomTree(lab) {
  if (!lab.domTree || !lab.domRows) return;
  const t = lab.domTree;
  t.textContent = "";
  const attrs = (a) => a.map((p) => " " + p[0] + (p[1] !== "" ? '="' + p[1] + '"' : "")).join("");
  lab.domRows.forEach((r) => {
    const line = h("div", { class: "dl", style: "padding-left:" + (r.d * 14 + 6) + "px" });
    const tag = (s) => h("span", { class: "dl-tag", text: s });
    if (r.k === "text") line.append(h("span", { class: "dl-text", text: r.v }));
    else if (r.k === "open") line.append(tag("<" + r.tag), ...attrParts(r.attrs), tag(">"));
    else if (r.k === "close") line.append(tag("</" + r.tag + ">"));
    else if (r.k === "void") line.append(tag("<" + r.tag), ...attrParts(r.attrs), tag(">"));
    else line.append(tag("<" + r.tag), ...attrParts(r.attrs), tag(">"), h("span", { class: "dl-text", text: r.text }), tag("</" + r.tag + ">"));
    t.append(line);
  });
  function attrParts(a) {
    return a.map((p) => h("span", { class: "dl-attr" }, " " + p[0], p[1] !== "" ? ['="', h("span", { class: "dl-val", text: p[1] }), '"'] : ""));
  }
}

function renderStorage(lab) {
  if (!lab.stBody) return;
  const keys = Object.keys(lab.store || {});
  lab.stBody.textContent = "";
  if (!keys.length) { lab.stBody.append(h("div", { class: "dt-empty", text: "Nothing saved yet. localStorage is empty for this page." })); return; }
  const t = h("table", { class: "ctable st-table" }, h("thead", null, h("tr", null, h("th", { text: "Key" }), h("th", { text: "Value (always a string)" }), h("th"))));
  const tb = h("tbody");
  keys.forEach((k) => tb.append(h("tr", null, h("td", { class: "mono", text: k }), h("td", { class: "mono wrap", text: lab.store[k] }),
    h("td", null, h("button", { class: "btn-tiny", type: "button", "aria-label": "Delete " + k, text: "Delete", onclick: () => { delete lab.store[k]; store.set("chai:v1:store:" + lab.id, lab.store); renderStorage(lab); } })))));
  t.append(tb);
  lab.stBody.append(h("div", { class: "table-scroll" }, t));

function buildDoc(lab, code) {
  const jsG = guardLoops(code.js).replace(/<\/script/gi, "<\\/script");
  const cfg = JSON.stringify({ store: lab.store || {}, mood: lab.mood, latency: lab.spec.opts.latency ? +lab.spec.opts.latency : 700 }).replace(/</g, "\\u003c");
  const prelude = PRELUDE.replace("__RID__", () => lab.rid).replace("__CFG__", () => cfg);
  const isDom = lab.mode === "dom";
  let head = '<meta charset="utf-8"><style>' + (isDom ? PREVIEW_CSS : "") + "</style><style>" + code.css + "</style><script>" + prelude + "<\/script>";
  let prefix, suffix;
  const inHead = isDom && lab.deferToggle && !lab.deferOn;
  if (inHead) {
    prefix = "<!doctype html><html><head>" + head + "<script>\n";
    suffix = "<\/script></head><body>" + code.html + "</body></html>";
  } else {
    prefix = "<!doctype html><html><head>" + head + "</head><body>" + (isDom ? code.html : "") + "<script>\n";
    suffix = "<\/script></body></html>";
  }
  lab.offset = (prefix.match(/\n/g) || []).length;
  return prefix + jsG + "\n" + suffix;
}

function killFrame(lab) {
  if (lab.frame) { lab.frame.remove(); lab.frame = null; }
  if (lab.rid) delete RUNS[lab.rid];
}

function runLab(lab, quiet) {
  killFrame(lab);
  lab.ranOnce = true; lab.done = false; lab.errorsSeen = 0; lab.entries = [];
  lab.consoleBody.textContent = "";
  Object.values(lab.editors).forEach((e) => e.unmark && e.unmark());
  if (lab.domTree) lab.domTree.innerHTML = '<div class="dt-empty">Loading…</div>';
  lab.status.textContent = "Running…";
  lab.rid = lab.id + "#" + ++runSeq;
  RUNS[lab.rid] = lab;
  const code = labCode(lab);
  const doc = buildDoc(lab, code);
  const f = document.createElement("iframe");
  f.setAttribute("sandbox", "allow-scripts");
  f.setAttribute("title", lab.mode === "dom" ? "Page preview" : "Code runner");
  f.srcdoc = doc;
  lab.frame = f;
  lab.frameWrap.append(f);
  clearTimeout(lab.slowT);
  lab.slowT = setTimeout(() => { if (!lab.done) lab.status.textContent = "Still waiting (a request or timer is running)…"; }, 4000);
}

window.addEventListener("message", (ev) => {
  const d = ev.data;
  if (!d || !d.chai) return;
  const lab = RUNS[d.rid];
  if (!lab || !lab.frame || ev.source !== lab.frame.contentWindow) return;
  onLabMessage(lab, d.type, d.data);
});

const labObserver = "IntersectionObserver" in window ? new IntersectionObserver((entries) => {
  entries.forEach((en) => {
    if (en.isIntersecting) {
      const lab = en.target.__lab;
      labObserver.unobserve(en.target);
      if (lab && !lab.ranOnce) runLab(lab);
    }
  });
}, { rootMargin: "200px 0px" }) : null;

function disposeLabs() {
  ACTIVE_LABS.forEach((l) => { killFrame(l); });
  ACTIVE_LABS = [];
}

/* ===================== progress ===================== */
const progress = Object.assign({ ex: {}, quiz: {}, chk: {} }, store.get("chai:v1:prog", {}));
function saveProgress() { store.set("chai:v1:prog", progress); }

const MODS = {};   // id -> {id, meta, blocks, totals}
const ORDER = ["home", "m1", "m2", "m3", "m4", "m5", "m6", "m7", "m8", "m9", "m10", "cheat"];

function totalsFor(blocks) {
  let ex = 0, quiz = 0, chk = 0;
  const walk = (bs) => bs.forEach((b) => {
    if (b.t === "lab" && b.kind === "exercise") ex++;
    if (b.t === "quiz") quiz += b.qs.length;
    if (b.t === "check") chk += b.items.length;
    if (b.t === "callout") walk(b.body);
  });
  walk(blocks);
  return { ex, quiz, chk, all: ex + quiz + chk };
}

function modProgress(id) {
  const t = MODS[id].totals;
  const count = (obj, pred) => Object.keys(obj).filter((k) => k.indexOf(id + "-") === 0 && pred(obj[k])).length;
  const done = Math.min(t.ex, count(progress.ex, (v) => v)) + Math.min(t.quiz, count(progress.quiz, (v) => v && v.ok)) + Math.min(t.chk, count(progress.chk, (v) => v));
  return { done, total: t.all, pct: t.all ? Math.round((done / t.all) * 100) : 0 };
}

function refreshProgressUI() {
  let sumDone = 0, sumTotal = 0;
  ORDER.forEach((id) => {
    if (!MODS[id] || !MODS[id].totals.all) return;
    const p = modProgress(id);
    sumDone += p.done; sumTotal += p.total;
    const bar = $('[data-prog="' + id + '"]');
    if (bar) { bar.style.setProperty("--p", p.pct + "%"); bar.title = p.done + " of " + p.total + " done"; }
  });
  const all = $("#overall");
  if (all) {
    const pct = sumTotal ? Math.round((sumDone / sumTotal) * 100) : 0;
    all.querySelector(".bar-fill").style.width = pct + "%";
    all.querySelector(".pct").textContent = pct + "% of the course";
  }
  const cur = $("#modprog");
  if (cur && cur.dataset.mod) {
    const p = modProgress(cur.dataset.mod);
    cur.querySelector(".bar-fill").style.width = p.pct + "%";
    cur.querySelector(".txt").textContent = p.done + " of " + p.total + " activities done";
  }
}

const CALLOUTS = {
  analogy: "In plain words", tip: "Tip", warn: "Watch out", predict: "Predict first", note: "Good to know",
  cafe: "At Chai Corner", portfolio: "In your portfolio", bug: "Classic bug", why: "Why it works this way", story: "The story so far"
};

function renderBlocks(blocks, ctx) {
  const frag = document.createDocumentFragment();
  blocks.forEach((b) => frag.append(renderBlock(b, ctx)));

}

function renderBlock(b, ctx) {
  switch (b.t) {
    case "h2": return h("h2", { id: "s-" + slug(b.text), html: inline(b.text) });
    case "h3": return h("h3", { html: inline(b.text) });
    case "p": return h("p", { html: inline(b.text) });
    case "hr": return h("hr");
    case "ul": return h("ul", null, b.items.map((i) => h("li", { html: inline(i) })));
    case "ol": return h("ol", null, b.items.map((i) => h("li", { html: inline(i) })));

    }

      lab.autorun = autorun;

      return lab.root;
    }
    case "quiz": return renderQuiz(b, ctx);

    case "stepper": return renderStepper(b);

function renderQuiz(b, ctx) {
  const box = h("div", { class: "quiz" }, h("div", { class: "quiz-title", text: b.qs.length > 1 ? "Quick check" : "Quick check" }));
  b.qs.forEach((q) => {
    const id = ctx.mod + "-q" + ctx.quizN++;
    const card = h("div", { class: "qcard" }, h("p", { class: "qtext", html: inline(q.q) }));
    const opts = h("div", { class: "qopts", role: "group" });
    const why = h("div", { class: "qwhy", hidden: true, "aria-live": "polite" });
    const btns = q.opts.map((o, i) => {
      const btn = h("button", { class: "qopt", type: "button", html: inline(o) });
      btn.addEventListener("click", () => pick(i));
      opts.append(btn);
      return btn;
    });
    function pick(i) {
      const ok = i === q.correct;
      progress.quiz[id] = { pick: i, ok };
      saveProgress();
      paint(i, ok);
      refreshProgressUI();
    }
    function paint(i, ok) {
      btns.forEach((b2, k) => { b2.classList.remove("is-right", "is-wrong"); b2.disabled = false; if (k === i) b2.classList.add(ok ? "is-right" : "is-wrong"); if (ok && k === q.correct) b2.disabled = false; });
      why.hidden = false;
      why.innerHTML = "";
      why.append(h("strong", { text: ok ? "Right. " : "Not quite. " }));
      why.insertAdjacentHTML("beforeend", ok ? inline(q.why) : "Look at the options again and have another go. " + (q.hint ? inline(q.hint) : ""));
    }
    const prev = progress.quiz[id];
    if (prev && prev.ok) paint(prev.pick, true);
    card.append(opts, why);
    box.append(card);
  });
  return box;
}

function renderCheck(b, ctx) {
  const box = h("div", { class: "checklist" });
  if (b.title) box.append(h("div", { class: "quiz-title", text: b.title }));
  b.items.forEach((it) => {
    const id = ctx.mod + "-c" + ctx.chkN++;
    const cb = h("input", { type: "checkbox", id: "chk-" + id });
    cb.checked = !!progress.chk[id];
    cb.addEventListener("change", () => { progress.chk[id] = cb.checked; saveProgress(); refreshProgressUI(); });
    box.append(h("label", { class: "chk", for: "chk-" + id }, cb, h("span", { html: inline(it) })));
  });
  return box;
}

function renderStepper(b) {
  const lines = b.code.split("\n");
  let pos = 0;
  const codeEl = h("div", { class: "st-code cm-s-chai", role: "presentation" });
  const rows = lines.map((l, i) => {
    const row = h("div", { class: "st-line" }, h("span", { class: "st-no", text: i + 1 }), h("span", { class: "st-src" }));
    highlightInto(row.querySelector(".st-src"), l || " ", "javascript");
    codeEl.append(row);
    return row;
  });
  const scope = h("div", { class: "st-scope" });
  const note = h("div", { class: "st-note", "aria-live": "polite" });
  const counter = h("span", { class: "st-counter" });
  const nextBtn = h("button", { class: "btn btn-primary", type: "button", html: "Step over <span aria-hidden='true'>↓</span>" });
  const resumeBtn = h("button", { class: "btn", type: "button", text: "Resume to the end" });
  const restartBtn = h("button", { class: "btn", type: "button", text: "Start again" });
  function paint() {
    const st = b.trace[pos];
    rows.forEach((r, i) => r.classList.toggle("is-paused", i + 1 === st.line));
    const target = rows[st.line - 1];
    scope.textContent = "";
    scope.append(h("div", { class: "st-scope-title", text: "Scope (every variable alive right now)" }));
    const keys = Object.keys(st.vars);
    if (!keys.length) scope.append(h("div", { class: "dt-empty", text: "Nothing yet." }));
    keys.forEach((k) => scope.append(h("div", { class: "st-var" }, h("span", { class: "v-key", text: k }), h("span", { class: "st-eq", text: "=" }), h("span", { class: "mono", text: typeof st.vars[k] === "string" ? JSON.stringify(st.vars[k]) : JSON.stringify(st.vars[k]) }))));
    note.innerHTML = inline(st.note);
    counter.textContent = "Pause " + (pos + 1) + " of " + b.trace.length;
    nextBtn.disabled = pos >= b.trace.length - 1;
    resumeBtn.disabled = nextBtn.disabled;
  }
  nextBtn.addEventListener("click", () => { if (pos < b.trace.length - 1) { pos++; paint(); } });
  resumeBtn.addEventListener("click", () => { pos = b.trace.length - 1; paint(); });
  restartBtn.addEventListener("click", () => { pos = 0; paint(); });
  paint();
  return h("div", { class: "stepper" },
    h("div", { class: "lab-head" }, h("span", { class: "lab-kind", text: "Pretend debugger" }), h("h4", { text: b.title })),
    h("div", { class: "st-grid" }, h("div", { class: "st-left" }, codeEl), h("div", { class: "st-right" }, scope, note)),
    h("div", { class: "lab-bar" }, nextBtn, resumeBtn, restartBtn, counter));
}

function gantt(rows, total, unit) {
  const wrap = h("div", { class: "gantt" });
  rows.forEach((r) => {
    const track = h("div", { class: "g-track" });
    r.segs.forEach((s) => {
      const seg = h("div", { class: "g-seg " + s.cls, text: s.text || "" });
      seg.style.left = (s.s / total) * 100 + "%";
      seg.style.width = ((s.e - s.s) / total) * 100 + "%";
      seg.dataset.s = s.s; seg.dataset.e = s.e;
      track.append(seg);
    });
    wrap.append(h("div", { class: "g-row" }, h("div", { class: "g-label", text: r.label }), track));
  });
  const cursor = h("div", { class: "g-cursor" });
  wrap.append(cursor);
  return { el: wrap, cursor, total };
}

  if (m.meta.tagline) head.append(h("p", { class: "lede", html: inline(m.meta.tagline) }));
  if (isMod) {
    head.append(h("div", { class: "bar mini", id: "modprog", "data-mod": id }, h("div", { class: "bar-track" }, h("div", { class: "bar-fill" })), h("span", { class: "txt" })));
  }
  page.append(head);
  if (m.meta.story) page.append(h("aside", { class: "callout c-story" }, h("div", { class: "c-label", text: CALLOUTS.story }), h("p", { html: inline(m.meta.story) })));
  if (m.meta.objectives && m.meta.objectives.length) {
    page.append(h("section", { class: "objectives" }, h("h3", { text: "By the end of this module you can" }),
      h("ul", null, m.meta.objectives.map((o) => h("li", { html: inline(o) })))));
  }
  const heads = m.blocks.filter((b) => b.t === "h2");
  if (heads.length > 2) {
    page.append(h("nav", { class: "chips", "aria-label": "Sections in this module" }, heads.map((b) => h("a", { href: "#" + id, class: "chip", onclick: (e) => {
      e.preventDefault();
      const t = document.getElementById("s-" + slug(b.text));
      if (t) t.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
    }, html: inline(b.text) }))));
  }
  page.append(renderBlocks(m.blocks, ctx));
  if (isMod) {
    const avail = ORDER.filter((x) => MODS[x]);
    const idx = avail.indexOf(id);
    const prev = avail[idx - 1], next = avail[idx + 1];
    const nav = h("nav", { class: "pager", "aria-label": "Module navigation" });
    if (prev && prev !== "home") nav.append(h("a", { class: "pg prev", href: "#" + prev }, h("span", { class: "pg-dir", text: "Previous" }), h("span", { class: "pg-title", text: MODS[prev].meta.title })));
    else nav.append(h("a", { class: "pg prev", href: "#home" }, h("span", { class: "pg-dir", text: "Back to" }), h("span", { class: "pg-title", text: "Course map" })));
    if (next) nav.append(h("a", { class: "pg next", href: "#" + next }, h("span", { class: "pg-dir", text: "Next" }), h("span", { class: "pg-title", text: MODS[next].meta.title })));
    page.append(nav);
  }
  return page;
}

function show(id) {
  if (!MODS[id]) id = "home";
  currentId = id;
  const main = $("#main");
  main.textContent = "";
  main.append(renderModule(id));
  $$(".side-link").forEach((a) => a.classList.toggle("is-current", a.dataset.id === id));
  store.set("chai:v1:last", id);
  document.title = (id === "home" ? "" : MODS[id].meta.title + " · ") + "Chai Corner JS Playground";
  window.scrollTo(0, 0);
  closeDrawer();
  refreshProgressUI();
  // editors created while detached need a refresh once visible
  requestAnimationFrame(() => ACTIVE_LABS.forEach((l) => Object.values(l.editors).forEach((e) => e.refresh())));
}

function route() {
  const id = (location.hash || "#home").slice(1);
  show(MODS[id] ? id : "home");
}

/* ===================== chrome: sidebar, theme, drawer ===================== */
function buildSidebar() {
  const nav = $("#sidenav");
  nav.textContent = "";
  ORDER.forEach((id) => {
    const m = MODS[id]; if (!m) return;
    const isMod = /^m\d+$/.test(id);
    const a = h("a", { class: "side-link", href: "#" + id, "data-id": id },
      h("span", { class: "side-num", text: isMod ? id.slice(1) : id === "home" ? "◎" : "≡" }),
      h("span", { class: "side-txt" }, h("span", { class: "side-title", text: id === "home" ? "Course map" : m.meta.title }), isMod ? h("span", { class: "side-sub", text: m.meta.short || "" }) : null));
    if (isMod) a.append(h("span", { class: "side-bar", "data-prog": id }));
    nav.append(a);
  });
}

function setTheme(t) {
  const root = document.documentElement;
  if (t === "light" || t === "dark") root.setAttribute("data-theme", t); else root.removeAttribute("data-theme");
  store.set("chai:v1:theme", t || "system");
  const eff = effectiveTheme();
  const btn = $("#themeBtn");
  if (btn) { btn.setAttribute("aria-label", eff === "dark" ? "Switch to light theme" : "Switch to dark theme"); btn.dataset.eff = eff; btn.setAttribute("aria-pressed", String(eff === "dark")); }
}
function effectiveTheme() {
  const a = document.documentElement.getAttribute("data-theme");
  if (a === "dark" || a === "light") return a;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}

function openDrawer() { document.body.classList.add("drawer-open"); $("#menuBtn").setAttribute("aria-expanded", "true"); }
function closeDrawer() { document.body.classList.remove("drawer-open"); const b = $("#menuBtn"); if (b) b.setAttribute("aria-expanded", "false"); }

function boot() {
  ORDER.forEach((id) => {
    try {
      const src = CONTENT[id];
      if (!src) return;
      const parsed = parseModule(src);
      MODS[id] = { id, meta: parsed.meta, blocks: parsed.blocks, totals: totalsFor(parsed.blocks) };
    } catch (e) {
      console.error("Could not parse module " + id, e);
    }
  });
  buildSidebar();
  const saved = store.get("chai:v1:theme", "system");
  setTheme(saved === "light" || saved === "dark" ? saved : null);
  $("#themeBtn").addEventListener("click", () => setTheme(effectiveTheme() === "dark" ? "light" : "dark"));
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => setTheme(store.get("chai:v1:theme", "system") === "system" ? null : store.get("chai:v1:theme")));
  $("#menuBtn").addEventListener("click", () => (document.body.classList.contains("drawer-open") ? closeDrawer() : openDrawer()));
  $("#scrim").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });
  $("#resetAll").addEventListener("click", () => {
    const btn = $("#resetAll");
    if (btn.dataset.armed) {
      Object.keys(localStorage).filter((k) => k.indexOf("chai:v1:") === 0 && k !== "chai:v1:theme").forEach((k) => localStorage.removeItem(k));
      location.reload();
    } else {
      btn.dataset.armed = "1"; btn.textContent = "Tap again to erase all progress and code";
      setTimeout(() => { delete btn.dataset.armed; btn.textContent = "Reset all progress"; }, 4000);
    }
  });
  window.addEventListener("hashchange", route);
  if (!location.hash) {
    const last = store.get("chai:v1:last", "home");
    if (last && last !== "home" && MODS[last]) { location.hash = "#" + last; return; }
  }
  route();
  window.__chai = { MODS, ORDER, labs: () => ACTIVE_LABS, show, runLab, guardLoops, progress };
}

boot();

})();

</script>
