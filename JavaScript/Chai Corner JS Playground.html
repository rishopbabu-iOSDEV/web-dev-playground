/* Layout concept: a quiet reference-book shell. Sidebar course map on the left, one lesson column on the right.
   Labs sit inside the lesson as editor + console pairs. Colour stays muted; the code and output carry the contrast. */
:root {
  --bg: #f1f4f4;
  --surface: #ffffff;
  --surface-2: #e8eeee;
  --line: #d8e0e0;
  --line-2: #c3cfcf;
  --fg: #1b2528;
  --fg-2: #455659;
  --fg-3: #6b7d82;
  --accent: #2c716d;
  --accent-2: #21585a;
  --accent-soft: #dbeceb;
  --on-accent: #ffffff;
  --tip: #7d6120; --tip-bg: #f5eed6;
  --warn: #9a4540; --warn-bg: #f6e5e2;
  --note: #3b6791; --note-bg: #e1ecf6;
  --pred: #5d5090; --pred-bg: #ebe7f5;
  --cafe: #6f5538; --cafe-bg: #efe8dc;
  --port: #2c716d; --port-bg: #dbeceb;
  --ok: #2b7549; --ok-bg: #dff0e6;
  --bad: #9c3f36; --bad-bg: #f7e4e1;
  --code-bg: #f7f9f9;
  --console-bg: #fbfcfc;
  --syn-kw: #7a4c9e; --syn-def: #28668f; --syn-str: #3a7650; --syn-num: #a8602b;
  --syn-com: #84949a; --syn-prop: #2c716d; --syn-tag: #a04842; --syn-attr: #7d6120; --syn-op: #5c6f74;
  --shadow: 0 1px 2px rgba(18, 40, 42, 0.05), 0 6px 18px rgba(18, 40, 42, 0.05);
  --r: 10px;
  --font-ui: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --topbar-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101517; --surface: #172023; --surface-2: #1d282b; --line: #28363a; --line-2: #354649;
    --fg: #dde6e7; --fg-2: #a9b9bc; --fg-3: #7b8e92;
    --accent: #6fb5ae; --accent-2: #8bc9c2; --accent-soft: #1d3533; --on-accent: #0c1a19;
    --tip: #d2b567; --tip-bg: #2a2518; --warn: #e09a94; --warn-bg: #2d1f1e; --note: #8fb6dc; --note-bg: #1b2837;
    --pred: #b7aae6; --pred-bg: #26223a; --cafe: #d1b58f; --cafe-bg: #2a2319; --port: #6fb5ae; --port-bg: #1d3533;
    --ok: #7fcf9f; --ok-bg: #1b2e24; --bad: #e59a90; --bad-bg: #321f1d;
    --code-bg: #121a1c; --console-bg: #0f1618;
    --syn-kw: #c09be0; --syn-def: #7fb4dc; --syn-str: #92c9a4; --syn-num: #dca572;
    --syn-com: #6b7f85; --syn-prop: #7cc3bb; --syn-tag: #e39a93; --syn-attr: #d2b567; --syn-op: #9db1b6;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101517; --surface: #172023; --surface-2: #1d282b; --line: #28363a; --line-2: #354649;
  --fg: #dde6e7; --fg-2: #a9b9bc; --fg-3: #7b8e92;
  --accent: #6fb5ae; --accent-2: #8bc9c2; --accent-soft: #1d3533; --on-accent: #0c1a19;
  --tip: #d2b567; --tip-bg: #2a2518; --warn: #e09a94; --warn-bg: #2d1f1e; --note: #8fb6dc; --note-bg: #1b2837;
  --pred: #b7aae6; --pred-bg: #26223a; --cafe: #d1b58f; --cafe-bg: #2a2319; --port: #6fb5ae; --port-bg: #1d3533;
  --ok: #7fcf9f; --ok-bg: #1b2e24; --bad: #e59a90; --bad-bg: #321f1d;
  --code-bg: #121a1c; --console-bg: #0f1618;
  --syn-kw: #c09be0; --syn-def: #7fb4dc; --syn-str: #92c9a4; --syn-num: #dca572;
  --syn-com: #6b7f85; --syn-prop: #7cc3bb; --syn-tag: #e39a93; --syn-attr: #d2b567; --syn-op: #9db1b6;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--topbar-h) + 12px); }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.65 var(--font-ui);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
button, select, input, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
code, kbd, pre, .mono { font-family: var(--font-mono); }
code { font-size: 0.88em; background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 0.08em 0.38em; }
kbd { font-size: 0.72em; padding: 0.05em 0.4em; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; background: var(--surface); color: var(--fg-2); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.muted { color: var(--fg-3); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; height: var(--topbar-h);
  display: flex; align-items: center; gap: 12px; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--surface); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -0.01em; color: var(--fg); text-decoration: none; min-width: 0; }
.brand svg { flex: none; color: var(--accent); }
.brand span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand small { font-weight: 500; color: var(--fg-3); margin-left: 4px; }
.spacer { flex: 1; }
.icon-btn {
  width: 38px; height: 38px; display: inline-grid; place-items: center; border-radius: 9px; cursor: pointer;
  background: transparent; border: 1px solid var(--line); color: var(--fg-2);
}
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
#menuBtn { display: none; }
#themeBtn .sun { display: none; }
#themeBtn[data-eff="dark"] .sun { display: block; }
#themeBtn[data-eff="dark"] .moon { display: none; }
.overall { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; color: var(--fg-3); }
.overall .bar-track { width: 110px; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 296px minmax(0, 1fr); align-items: start; }
.sidebar {
  position: sticky; top: calc(var(--topbar-h) + env(safe-area-inset-top, 0px)); max-height: calc(100vh - var(--topbar-h));
  overflow-y: auto; padding: 16px 12px 28px max(12px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--line);
}
.side-link {
  display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 9px; text-decoration: none; color: var(--fg-2);
  position: relative; margin-bottom: 2px;
}
.side-link:hover { background: var(--surface-2); color: var(--fg); }
.side-link.is-current { background: var(--accent-soft); color: var(--fg); }
.side-num {
  flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font: 600 0.82rem var(--font-mono);
  background: var(--surface); border: 1px solid var(--line); color: var(--fg-2);
}
.side-link.is-current .side-num { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.side-txt { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
.side-title { font-size: 0.92rem; font-weight: 550; }
.side-sub { font-size: 0.76rem; color: var(--fg-3); }
.side-bar { position: absolute; left: 48px; right: 10px; bottom: 3px; height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
.side-bar::after { content: ""; display: block; height: 100%; width: var(--p, 0%); background: var(--accent); }
.side-foot { margin-top: 18px; padding: 12px 10px 0; border-top: 1px solid var(--line); font-size: 0.8rem; color: var(--fg-3); }
.link-btn { background: none; border: 0; padding: 0; color: var(--fg-3); text-decoration: underline; cursor: pointer; font-size: 0.8rem; text-align: left; }
.scrim { display: none; }

.main { min-width: 0; padding: 36px max(clamp(16px, 4vw, 52px), env(safe-area-inset-right, 0px)) 96px clamp(16px, 4vw, 52px); }
.page { max-width: 980px; margin: 0 auto; }
.page > p, .page > ul, .page > ol, .callout p, .callout ul, .callout ol { max-width: 72ch; }
.page h1 { font-size: clamp(1.9rem, 4.2vw, 2.7rem); line-height: 1.12; letter-spacing: -0.025em; margin: 4px 0 12px; text-wrap: balance; }
.page h2 { font-size: 1.55rem; line-height: 1.25; letter-spacing: -0.015em; margin: 3rem 0 0.4rem; text-wrap: balance; }
.page h3 { font-size: 1.12rem; margin: 1.8rem 0 0.2rem; }
.page p { margin: 0.7rem 0; }
.page ul, .page ol { padding-left: 1.3rem; margin: 0.6rem 0; }
.page li { margin: 0.28rem 0; }
.eyebrow { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin: 0; }
.lede { font-size: 1.15rem; color: var(--fg-2); max-width: 62ch; margin-top: 0; }
.mod-head { margin-bottom: 20px; }
hr { border: 0; border-top: 1px solid var(--line); margin: 2rem 0; }

.bar { display: flex; align-items: center; gap: 10px; }
.bar-track { flex: 1; height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
.bar-fill { height: 100%; width: 0; background: var(--accent); border-radius: 6px; transition: width 0.4s ease; }
.bar.mini { max-width: 380px; font-size: 0.82rem; color: var(--fg-3); margin-top: 14px; }
.bar.mini .bar-track { max-width: 200px; }

.objectives { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 22px 12px; margin: 22px 0 8px; box-shadow: var(--shadow); }
.objectives h3 { margin-top: 14px; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--fg-3); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 0; }
.chip { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: var(--fg-2); font-size: 0.85rem; }
.chip:hover { border-color: var(--accent); color: var(--accent-2); }

/* ---------- callouts ---------- */
.callout { border-radius: var(--r); padding: 12px 18px 14px; margin: 1.1rem 0; background: var(--note-bg); color: var(--fg); }
.callout p { margin: 0.45rem 0; }
.callout ul, .callout ol { margin: 0.4rem 0; }
.c-label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; margin-bottom: 2px; }
.c-analogy { background: var(--accent-soft); } .c-analogy .c-label { color: var(--accent-2); }
.c-tip { background: var(--tip-bg); } .c-tip .c-label { color: var(--tip); }
.c-warn, .c-bug { background: var(--warn-bg); } .c-warn .c-label, .c-bug .c-label { color: var(--warn); }
.c-note, .c-why { background: var(--note-bg); } .c-note .c-label, .c-why .c-label { color: var(--note); }
.c-predict { background: var(--pred-bg); } .c-predict .c-label { color: var(--pred); }
.c-cafe, .c-story { background: var(--cafe-bg); } .c-cafe .c-label, .c-story .c-label { color: var(--cafe); }
.c-portfolio { background: var(--port-bg); } .c-portfolio .c-label { color: var(--port); }
.callout code { background: color-mix(in srgb, var(--surface) 70%, transparent); }

/* ---------- tables ---------- */
.table-scroll { overflow-x: auto; max-width: 100%; }
.dtable { border-collapse: collapse; width: 100%; font-size: 0.93rem; margin: 1rem 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.dtable th, .dtable td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
.dtable th { background: var(--surface-2); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--fg-2); white-space: nowrap; }
.dtable tr:last-child td { border-bottom: 0; }

/* ---------- code ---------- */
.codefig { position: relative; margin: 1rem 0; }
.codefig figcaption { font: 600 0.74rem var(--font-mono); color: var(--fg-3); padding: 0 2px 4px; }
pre.code-static { margin: 0; padding: 14px 16px; background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--r); overflow-x: auto; font-size: 13px; line-height: 1.6; }
pre.code-static code { background: none; border: 0; padding: 0; font-size: inherit; }
.copy-btn { position: absolute; top: 6px; right: 8px; font-size: 0.72rem; padding: 2px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg-3); cursor: pointer; opacity: 0.85; }
.codefig figcaption + pre + .copy-btn { top: 24px; }

.cm-s-chai { color: var(--fg); }
.cm-s-chai .cm-keyword, .cm-s-chai .cm-atom, .cm-s-chai .cm-meta { color: var(--syn-kw); }
.cm-s-chai .cm-def, .cm-s-chai .cm-variable-2, .cm-s-chai .cm-variable-3 { color: var(--syn-def); }
.cm-s-chai .cm-string, .cm-s-chai .cm-string-2 { color: var(--syn-str); }
.cm-s-chai .cm-number { color: var(--syn-num); }
.cm-s-chai .cm-comment { color: var(--syn-com); font-style: italic; }
.cm-s-chai .cm-property, .cm-s-chai .cm-qualifier { color: var(--syn-prop); }
.cm-s-chai .cm-operator, .cm-s-chai .cm-bracket { color: var(--syn-op); }
.cm-s-chai .cm-tag { color: var(--syn-tag); }
.cm-s-chai .cm-attribute { color: var(--syn-attr); }
.cm-s-chai .cm-builtin { color: var(--syn-def); }
.cm-s-chai .cm-error { color: var(--bad); }

const CONTENT = {"cheat": "title: Cheat Sheet\ntag: Reference\nshort: One page, whole course\ntagline: Everything from the ten modules on one page, in the same café language. Skim it before Demo Day.\n---\n## Variables and types (Module 1)\n\n| Idea | Code | Remember |\n| --- | --- | --- |\n| Can't change | `const price = 20;` | Default choice |\n| Can change | `let count = 0;` | Only when it must |\n| Types | `string` `number` `boolean` `null` `undefined` | `typeof x` tells you |\n| Text with values | `` `Hello ${name}` `` | Backticks, `${}` |\n| Strict equality | `===` / `!==` | Avoid `==` |\n\n> tip: `'5' + 3` is `'53'` (join). `'5' * 3` is `15` (math). When numbers act strange, log `typeof`.\n\n## Decisions and loops (Module 2)\n\n```js\nif (points >= 100) { tier = 'Gold'; }\nelse if (points >= 50) { tier = 'Silver'; }\nelse { tier = 'Bronze'; }\n\nconst label = inStock ? 'Available' : 'Sold out';      // ternary\n\nfor (let i = 0; i < 3; i++) { /* ... */ }              // known count\nwhile (cond) { /* ... */ }                             // unknown count\n```\n\n* **Falsy:** `false`, `0`, `''`, `null`, `undefined`, `NaN`. Everything else is truthy.\n* `break` leaves the loop; `continue` skips to the next round.\n* `return` hands a value back; `console.log` only shows it.\n\n## Functions and scope (Module 3)\n\n```js\nfunction add(a, b) { return a + b; }\nconst addArrow = (a, b) => a + b;\nconst greet = (name = 'friend') => `Hi ${name}`;       // default value\nif (!input) return;                                      // guard clause\n```\n\n> analogy: Scope is **rooms**. An inner room can see out; the outside cannot see in. Prefer `let` / `const` (they respect rooms); `var` leaks.\n\n## Arrays and objects (Module 4)\n\n| Task | Code |\n| --- | --- |\n| Add / remove at end | `arr.push(x)` / `arr.pop()` |\n| Transform each | `arr.map(x => x * 2)` |\n| Keep matching | `arr.filter(x => x.inStock)` |\n| First match | `arr.find(x => x.id === 3)` |\n| Combine to one value | `arr.reduce((sum, x) => sum + x.price, 0)` |\n| Read / write a property | `item.name`, `item['name']`, `item.price = 25` |\n| Object in array | `menu[0].name` |\n\n## The DOM (Module 5)\n\n| Task | Code |\n| --- | --- |\n| Select one / many | `querySelector('.x')` / `querySelectorAll('li')` |\n| Change text (safe) | `el.textContent = '...'` |\n| Change with HTML | `el.innerHTML = '...'` (only your own data) |\n| Attributes | `setAttribute('title', 'Hi')`, `getAttribute('title')` |\n| Classes | `classList.add / remove / toggle / contains` |\n| Create and place | `createElement('li')`, `parent.appendChild(el)` |\n\n## Events (Module 6)\n\n```js\nbutton.addEventListener('click', () => nav.classList.toggle('open'));   // no () after the function name\nlist.addEventListener('click', e => { if (e.target.tagName === 'LI') { /* ... */ } });   // delegation\n```\n\n`event.target` = what was clicked · `event.key` = which key · `event.preventDefault()` = cancel default.\n\n## Rendering (Module 7)\n\n```js\ncontainer.innerHTML = items.map(i => `<article>${i.name}<\/article>`).join('');\nconst categories = ['All', ...new Set(items.map(i => i.category))];\n```\n\n* No `.join('')` → stray commas. `${item}` instead of `${item.name}` → `[object Object]`.\n* Always handle the **empty state**. Visitor text goes in via `textContent`.\n\n## Forms and storage (Module 8)\n\n```js\nform.addEventListener('submit', e => { e.preventDefault(); /* validate, then act */ });\nlocalStorage.setItem('theme', 'dark');\nlocalStorage.getItem('theme');                       // null when missing\nJSON.parse(localStorage.getItem('list')) || [];      // read\nlocalStorage.setItem('list', JSON.stringify(list));  // write\n```\n\nRead → change → write. Strings only. Never store secrets.\n\n## Async and APIs (Module 9)\n\n```js\nasync function load() {\n  try {\n    const res = await fetch(url);\n    if (!res.ok) throw new Error(`Server said ${res.status}`);\n    const data = await res.json();\n    /* render data */\n  } catch (error) {\n    console.error(error);\n    /* show a friendly message */\n  }\n}\n```\n\n* `setTimeout(fn, ms)` never pauses the page. Output order follows delay, not line order.\n* `fetch` rejects only on network failure; check `response.ok`.\n* Three UI states: **loading**, **success**, **error**. Use `??` for missing fields.\n\n## Debugging and shipping (Module 10)\n\n| Do | Because |\n| --- | --- |\n| Read the error type, message, `file:line` | It names the exact spot |\n| Label logs, use `console.table` | Unlabeled numbers lie |\n| Change **one** thing at a time | You learn what worked |\n| `<script src=\"script.js\" defer>` | Runs after the page exists |\n| Small commits, clear messages | History is documentation |\n| Remove debug logs | Ship tidy code |\n\n```raw\n<div class=\"flow\">\n  <div class=\"step\"><b>Common errors<\/b><span><code>ReferenceError<\/code> typo / scope<\/span><\/div>\n  <div class=\"step\"><b><\/b><span><code>TypeError<\/code> usually <code>null<\/code><\/span><\/div>\n  <div class=\"step\"><b><\/b><span><code>SyntaxError<\/code> a missing bracket<\/span><\/div>\n<\/div>\n```\n", "home": "title: Learn JavaScript by opening a café\ntag: Ten modules · Five days\nshort: Start here\ntagline: You are helping Asha open Chai Corner, a small café in Coimbatore. Each module adds one real feature to her website, and the same café follows you from the first line of code to demo day.\nstory: Asha already has a finished page built with HTML and CSS, but it just sits there like a printed poster. Over ten modules you will teach it to remember things, make decisions, react to clicks, draw its own menu, check an order form, remember a visitor's choices, and fetch live information. Nothing here needs setup. Every code block on this page runs right in your browser.\n---\n## How this playground works\n\n- **Blocks with a Run button are live code.** Change anything, press **Run** (or [[Ctrl]] + [[Enter]]), and read what comes out in the Console underneath. You cannot break anything. **Reset** puts the original back.\n- **\"Your turn\" blocks are the exercises from your slides**, rewritten for the café. Each has steps, hints that unlock one at a time, and a worked solution you can load into the editor when you are ready.\n- **Pretend browser blocks** show a small page with three tabs (HTML, CSS, JavaScript) and a live preview. A mini DevTools sits underneath with the Console, the Elements panel, and, in Module 8, the Application panel that shows what is saved.\n- **Quick checks** and **self-check lists** track your progress. Everything you type and tick is saved in this browser, on this device only.\n\n> tip: The fastest way to learn here is to *predict, then run*. Before pressing Run, say out loud what you expect to see. When the output surprises you, that is exactly the moment something new is sinking in.\n\n## The café you will build\n\nEvery module uses the same small business. Here is the data that appears again and again. It is the menu board, written as JavaScript. You will meet this exact shape in Module 4 and use it through to Module 10.\n\n```js run | Meet the menu\n{{menu}}\n\nconsole.log(\"Items on the menu:\", menu.length);\nconsole.table(menu);\n```\n\nLook at the table. Each row is one drink or snack. Each column is one fact about it. That \"list of things, each with the same facts\" shape is behind almost every app you have ever used: a list of songs, a feed of posts, a basket of shopping.\n\n## Course map\n\nTen modules over five days. Pick any of them from the left, or follow the order. Each module starts where the last one stopped.\n\n```widget\nmodules\n```\n\n## One café, two places\n\nYour slides build a portfolio website. The café is the same project wearing a different hat, so every idea you meet here transfers straight into your own site. Each module has a short \"In your portfolio\" note showing the translation.\n\n| Module | What the café gets | What your portfolio gets |\n| --- | --- | --- |\n| 1. Getting Started | Shop name, prices, open or closed | Your name, age, city |\n| 2. Control Flow | Loyalty tiers, bills, a lucky-customer counter | Grade checks, FizzBuzz |\n| 3. Functions and Scope | Price formatter, discount helpers | Small reusable helpers |\n| 4. Arrays and Objects | The menu as a list of items | `projects-data.js` |\n| 5. The DOM | A greeting that matches the time, a live footer year | The same two features |\n| 6. Events | Menu button and light/dark switch | The same two features |\n| 7. Data-Driven UI | Menu cards drawn from data, with category filter | The projects grid with a filter |\n| 8. Forms and Storage | Message form, saved messages, remembered theme | Contact form, saved messages |\n| 9. Fetch and Async | A \"today's barista\" card from a kitchen API | The GitHub activity card |\n| 10. Quality and Demo Day | Debug, tidy, ship, present | The same polish pass |\n\n## Words you will hear a lot\n\nIn plain language, with the formal term in brackets. The full list lives on the **Cheat sheet** page.\n\n- **A name that holds a value** (variable): a labelled jar.\n- **A reusable recipe** (function): ingredients in, finished drink out.\n- **A numbered list** (array): a row of cups, counted from 0.\n- **A labelled bundle of facts** (object): an order slip with fields.\n- **The live page in memory** (the DOM): the café as it is right now, not the printed recipe card.\n- **Something the visitor does** (event): the doorbell rings.\n- **A request that comes back later** (asynchronous): order now, food arrives when it is ready.\n", "m1": "title: Getting Started with JavaScript\ntag: Module 1 · Day 1, morning\nshort: Variables, types, operators\ntagline: Before the café website can react to anyone, JavaScript has to learn to remember things and make small decisions. That is all this module is about.\nstory: Asha's page looks great but does nothing, because HTML and CSS only describe a page that sits still. Today we leave that finished page alone and open a quiet back office instead, a scratch workspace called `js-practice`. Nobody can see it, so nothing can go wrong. The only way our code talks to us is the **Console**, the café's back-office notice board.\nobjectives:\n- Explain, in plain terms, what JavaScript adds that HTML and CSS cannot\n- Set up `js-practice` and use `console.log()` to watch your code work\n- Declare variables with `const` and `let`, and say why `var` is avoided\n- Name JavaScript's core data types and check them with `typeof`\n- Build sentences with template literals instead of `+`\n- Use arithmetic, comparison (`===`, `!==`) and logical (`&&`, `||`, `!`) operators\n---\n## What JavaScript actually does\n\nThink of the café website as the café itself.\n\n```raw\n<div class=\"trio\">\n  <div class=\"mini-card\"><div class=\"big\">HTML<\/div><h4>The structure<\/h4><p>The menu board: which drinks exist, what the headings say. <strong>The food itself.<\/strong><\/p><\/div>\n  <div class=\"mini-card\"><div class=\"big\">CSS<\/div><h4>The styling<\/h4><p>Colours, spacing, fonts. How the board is decorated. <strong>How the food is plated.<\/strong><\/p><\/div>\n  <div class=\"mini-card\"><div class=\"big\">JavaScript<\/div><h4>The behaviour<\/h4><p>What happens when someone clicks, types or waits. <strong>The staff who respond.<\/strong><\/p><\/div>\n<\/div>\n```\n\nHTML and CSS describe a page that sits perfectly still. A printed menu on the wall can look beautiful, but it cannot say \"sorry, the samosas are sold out\" or tell you what time it is. **JavaScript is what makes a page react.**\n\n> analogy: A café with only HTML and CSS is a beautiful, silent shop with nobody inside. JavaScript is the person behind the counter who greets you, remembers your usual, adds up your bill, and tells you what is sold out.\n\n> note: **Why we are not touching the real site today.** Your finished portfolio is deployed and looks great, but it is pure HTML and CSS. We leave it alone so there is zero risk of breaking Course 1's work while learning a brand new language. In `js-practice` there is no layout and nothing to protect, only raw JavaScript: variables, data, logic. We come back to the real site in Module 5.\n\n```quiz\nq: Which one decides what happens when a visitor clicks a button?\na: HTML\na: CSS\na*: JavaScript\na: The browser tab\nwhy: HTML says what is on the page and CSS says how it looks. Behaviour, meaning what happens when someone does something, is JavaScript's job.\n```\n\n## The back office: js-practice and the Console\n\nIn real life you would create a folder called `js-practice` with two files. Here is `practice.html`, the page that loads the script:\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <title>JS Practice<\/title>\n  <script src=\"practice.js\" defer><\/script>\n<\/head>\n<body>\n  <h1>JavaScript Practice Page<\/h1>\n  <p>Open the browser console to see output.<\/p>\n<\/body>\n<\/html>\n```\n\nThere is exactly one new line compared to what you already know: the `<script>` tag.\n\n- `src=\"practice.js\"` says \"load this JavaScript file for this page\". HTML and JavaScript live in separate files, exactly like CSS does.\n- `defer` says \"wait until you have finished reading the whole HTML page, then run the script\". **Always use it.** Without it, the script can run before the elements it wants to touch even exist.\n\n> analogy: `defer` is the barista waiting until the café is fully set up (tables out, lights on) before starting to serve. Starting early means reaching for cups that are not on the shelf yet.\n\n### The Console is our entire output today\n\nRight-click your page in the browser, choose **Inspect** (or press [[F12]], or [[Ctrl]] + [[Shift]] + [[I]], or on a Mac [[Cmd]] + [[Option]] + [[I]]), and click the **Console** tab. Anything you send with `console.log()` appears there. Below, the Console is built into the page. Press Run.\n\n```js run | Your first three console.log lines\nconsole.log(\"Hello from JavaScript!\");\nconsole.log(2 + 2);\nconsole.log(\"This is line three.\");\n```\n\nThree things to notice:\n\n1. **Order.** JavaScript runs **one statement at a time, top to bottom**, like reading a recipe. Line one finishes before line two starts.\n2. **Text vs maths.** `\"Hello...\"` is text, so it needs quotes. `2 + 2` is a calculation, so JavaScript works it out and prints `4`.\n3. **Semicolons.** Each statement ends with `;`. Think of it as the full stop at the end of a sentence.\n\nYou can also leave notes for humans. Anything after `//` is ignored by JavaScript:\n\n```js run | Comments are notes to yourself\n// This line is ignored. It is a note for humans.\nconsole.log(\"Chai Corner is open!\"); // notes can sit at the end of a line too\n```\n\n```lab\ntitle: Console Roll Call\nkind: exercise\nmode: console\n@@intro\nYour first warm-up. The first three lines are already written. You add three more of your own and check that all six appear in order.\n@@steps\n- Add one `console.log()` with **your name** as text.\n- Add one with **any maths expression**, for example `10 * 4`.\n- Add one with **any short sentence** about the café.\n- Run it and confirm all six lines appear in the order you wrote them.\n@@js\nconsole.log(\"Chai Corner opens at 8 am.\");\nconsole.log(\"Today's special: masala chai.\");\nconsole.log(\"Welcome!\");\n\n// your three lines go below\n@@hint\nText goes inside quotes: `console.log(\"Asha\");`. A calculation does not: `console.log(10 * 4);`.\n@@hint\nEach `console.log(...)` needs its own line and ends with `;`. Check for a missing quote or bracket if you see a red error.\n@@solution\nconsole.log(\"Chai Corner opens at 8 am.\");\nconsole.log(\"Today's special: masala chai.\");\nconsole.log(\"Welcome!\");\n\nconsole.log(\"Asha\");\nconsole.log(10 * 4);\nconsole.log(\"We make our own ginger syrup.\");\n@@explain\nIf nothing appears, the usual suspects are: the Console is not open (in a real browser), `defer` is missing from the script tag, or you forgot to save and refresh. In the playground the Console is always right there.\n```\n\n## Variables: let and const\n\nSo far our code forgets everything instantly. A **variable** is how JavaScript remembers something for later.\n\n> analogy: A variable is a **labelled jar** on the café shelf. The label is the name (`shopName`), and what is inside is the value (`\"Chai Corner\"`). Any time you say the label, you get what is inside.\n\nThere are three ways to put a label on a jar:\n\n| Keyword | What it means | When to use it |\n| --- | --- | --- |\n| `const` | A jar with a **sealed lid**. You cannot swap the contents later. | **The default.** Use it unless you have a reason not to. |\n| `let` | A jar with a **removable lid**. You can replace the contents. | Only when the value genuinely needs to change, like a counter. |\n| `var` | The old way. | **Never in this course.** Its rules are confusing (Module 3 shows the bug it causes). |\n\n> tip: Start every variable with `const`. If JavaScript later complains that you are reassigning it, switch just that one to `let`. You will almost always find that most of your variables never needed to change.\n\n```js run | const and let in the café\nconst shopName = \"Chai Corner\";   // sealed: this will not change\nconsole.log(shopName);\n\nlet cupsSold = 0;                 // removable lid: this will change all day\ncupsSold = cupsSold + 10;         // sold ten cups\nconsole.log(\"Cups sold so far:\", cupsSold);\n\ncupsSold = cupsSold + 5;          // five more\nconsole.log(\"Cups sold now:\", cupsSold);\n```\n\nRead `cupsSold = cupsSold + 10` carefully. The `=` does **not** mean \"equals\" like in maths. It means **\"put the thing on the right into the jar on the left\"**. JavaScript first works out the right side (`0 + 10`), then stores the answer back in `cupsSold`.\n\n**Naming rules.** Names are case-sensitive (`cupsSold` and `cupssold` are different jars). They cannot start with a number or contain spaces. The common style is **camelCase**: first word small, every later word starts with a capital (`todaysSpecial`, `isOpenNow`). Pick names that describe the contents: `price`, not `x`.\n\n### Try to break the sealed jar, on purpose\n\n```js run err | The error is a feature\nconst shopName = \"Chai Corner\";\nconsole.log(\"Before:\", shopName);\n\nshopName = \"Tea Time\";   // trying to swap the contents of a sealed jar\n\nconsole.log(\"After:\", shopName); // this line never runs\n```\n\nLook at the red message. A `TypeError` when you reassign a `const` is not a failure. **It is the language protecting you** from changing something you promised would stay the same. Also notice the last line never ran: when an error stops the code, nothing below it executes.\n\n```lab\ntitle: Const First\nkind: exercise\nmode: console\n@@intro\nPractice choosing the right kind of jar.\n@@steps\n- Declare a `const` called `favoriteDrink` holding a drink you like.\n- Declare a `let` called `attempts` starting at `1`.\n- Reassign `attempts` to `attempts + 1` and log it again.\n- Try reassigning `favoriteDrink` on purpose. Watch the error, then **comment that line out** with `//`.\n@@js\n// 1. a const for your favourite drink\n\n\n// 2. a let called attempts that starts at 1\n\n\n// 3. add one to attempts and log it\n\n\n// 4. try to change favoriteDrink (then comment it out)\n\n@@hint\n`const favoriteDrink = \"Filter Coffee\";` and `let attempts = 1;`\n@@hint\nTo add one: `attempts = attempts + 1;` and then `console.log(attempts);`\n@@solution\nconst favoriteDrink = \"Filter Coffee\";\nconsole.log(favoriteDrink);\n\nlet attempts = 1;\nconsole.log(attempts);\n\nattempts = attempts + 1;\nconsole.log(attempts);\n\n// favoriteDrink = \"Cold Coffee\"; // TypeError: Assignment to constant variable.\n@@explain\nThe last line is commented out so the rest of your file keeps working. In your real `practice.js`, leave a comment like this to remind yourself why a `const` cannot be reassigned.\n```\n\n## Data types and typeof\n\nEvery value in a jar is of a certain **type**. The type decides what you can do with it: you can add numbers, but you cannot sensibly \"add\" two yes/no answers.\n\n```raw\n<div class=\"trio\">\n  <div class=\"mini-card\"><div class=\"big\">string<\/div><h4>Text<\/h4><p><code>\"Chai Corner\"<\/code>, <code>'Asha'<\/code>. Anything in quotes.<\/p><\/div>\n  <div class=\"mini-card\"><div class=\"big\">number<\/div><h4>Numbers<\/h4><p><code>42<\/code>, <code>3.14<\/code>, <code>-7<\/code>. Whole or decimal, one type.<\/p><\/div>\n  <div class=\"mini-card\"><div class=\"big\">boolean<\/div><h4>Yes or no<\/h4><p><code>true<\/code> or <code>false<\/code>. Nothing else.<\/p><\/div>\n  <div class=\"mini-card\"><div class=\"big\">undefined<\/div><h4>Empty jar<\/h4><p>A jar with a label but nothing inside yet.<\/p><\/div>\n  <div class=\"mini-card\"><div class=\"big\">null<\/div><h4>Left empty on purpose<\/h4><p>A jar with a note: \"deliberately nothing here\".<\/p><\/div>\n<\/div>\n```\n\n> analogy: `undefined` and `null` both mean \"no value\", but for different reasons. **`undefined`** is a new jar nobody has filled yet (\"JavaScript has not been told a value\"). **`null`** is a jar a person emptied and marked *\"nothing here, on purpose\"* (\"a programmer decided there is no value\").\n\nThe `typeof` keyword asks a jar: \"what kind of thing are you holding?\"\n\n```js run | typeof asks what's inside\nconst shopName = \"Chai Corner\";\nconst price = 20;\nconst isOpen = true;\nlet todaysSpecial;            // declared, never filled\nconst coupon = null;          // empty on purpose\n\nconsole.log(typeof shopName);   // \"string\"\nconsole.log(typeof price);      // \"number\"\nconsole.log(typeof isOpen);     // \"boolean\"\nconsole.log(typeof todaysSpecial); // \"undefined\"\nconsole.log(typeof coupon);     // \"object\"  <- wait, what?\n```\n\n> warn: **`typeof null` says `\"object\"`.** That is a real, famous bug in JavaScript from 1995 that can never be fixed without breaking old websites. It is not a mistake you are making. Just remember: `null` is \"empty on purpose\".\n\n### A trap worth seeing early: numbers that look like text\n\n```js run | The quotes change everything\nconsole.log(20 + 5);       // 25   (two numbers: real maths)\nconsole.log(\"20\" + 5);     // \"205\" (text + number: sticks them together!)\nconsole.log(\"20\" - 5);     // 15   (minus has no text meaning, so JavaScript converts)\nconsole.log(typeof \"20\");  // \"string\"\nconsole.log(0.1 + 0.2);    // 0.30000000000000004  (computers count in binary; this is normal)\n```\n\nThis matters a lot soon. When someone types a number into a form, JavaScript receives it as **text**. Knowing the difference between `20` and `\"20\"` will save you hours in Module 8.\n\n```lab\ntitle: Type Detective\nkind: exercise\nmode: console\n@@intro\nMake one variable of each of the five types, then ask JavaScript what it thinks each one is.\n@@steps\n- Declare five variables about the café, **one of each type**: string, number, boolean, undefined, null.\n- Use `console.log(typeof ...)` on each one.\n- Confirm the console prints the type you expected for all five. (Remember the `null` surprise.)\n@@js\n// string\n\n\n// number\n\n\n// boolean\n\n\n// undefined (declare it but do not give it a value)\n\n\n// null\n\n@@hint\nFor undefined, declare with `let` and no equals sign: `let todaysSpecial;`.\n@@hint\nPattern for each one: `const cafeName = \"Chai Corner\";` then `console.log(typeof cafeName);`\n@@solution\nconst cafeName = \"Chai Corner\";\nconsole.log(typeof cafeName);\n\nconst cupsPerDay = 120;\nconsole.log(typeof cupsPerDay);\n\nconst isOpen = true;\nconsole.log(typeof isOpen);\n\nlet todaysSpecial;\nconsole.log(typeof todaysSpecial);\n\nconst coupon = null;\nconsole.log(typeof coupon); // \"object\": the famous quirk\n```\n\n## Template literals: sentences with blanks\n\nPutting text and variables together used to be clumsy:\n\n```js run | The old way (avoid) vs the new way (use)\nconst name = \"Asha\";\nconst age = 29;\n\n// old way: lots of + and quote marks, easy to get wrong\nconsole.log(\"My name is \" + name + \" and I am \" + age + \" years old.\");\n\n// template literal: backticks, with ${ } where the blanks go\nconsole.log(`My name is ${name} and I am ${age} years old.`);\n```\n\n> analogy: A template literal is a **printed bill with blanks**: \"Table ___, total ₹___\". You write the sentence once and the `${ }` slots get filled in from the jars. The backtick (`` ` ``) key sits just left of [[1]] on most keyboards. It is **not** the same as the apostrophe.\n\nAnything that is valid JavaScript can go inside `${ }`, not only a variable name:\n\n```js run | ${ } can hold any expression\nconst price = 20;\nconst cups = 3;\n\nconsole.log(`${cups} cups of chai cost ₹${price * cups}.`);\nconsole.log(`Next year is ${2026 + 1}.`);\nconsole.log(`Shouting: ${\"masala chai\".toUpperCase()}!`);\n\n// backticks also allow several lines\nconsole.log(`Chai Corner\nOpen 8 am to 9 pm\nCoimbatore`);\n```\n\n```lab\ntitle: Introduce Yourself, Dynamically\nkind: exercise\nmode: console\n@@intro\nWrite one sentence about the café that is built from jars instead of typed by hand.\n@@steps\n- Make three variables: the café's name, how many cups it sells in a day, and the city.\n- Write **one** `console.log()` using a template literal that combines **all three** into a readable sentence.\n- Example shape (do not copy the wording): `` `Hi, I'm ${name}, I'm ${age}, and I'm from ${city}.` ``\n- Change one of the variables and run again. The sentence should update by itself.\n@@js\nconst cafeName = \"Chai Corner\";\n// add two more variables, then write your sentence below\n\n@@hint\nUse backticks, not quotes, and wrap each variable like `${cafeName}`.\n@@solution\nconst cafeName = \"Chai Corner\";\nconst cupsPerDay = 120;\nconst city = \"Coimbatore\";\n\nconsole.log(`${cafeName} in ${city} serves about ${cupsPerDay} cups a day.`);\n@@explain\nChange `cupsPerDay` to `200` and run again. The sentence rebuilds itself. That \"write it once, reuse it with new values\" idea is the whole reason we use variables.\n```\n\n## Operators: doing things with values\n\nOperators are the little symbols that combine values. There are three families.\n\n### Arithmetic: the till\n\n| Operator | Meaning | Example | Result |\n| --- | --- | --- | --- |\n| `+` | add | `5 + 3` | `8` |\n| `-` | subtract | `5 - 3` | `2` |\n| `*` | multiply | `5 * 3` | `15` |\n| `/` | divide | `5 / 2` | `2.5` |\n| `%` | **remainder** (modulo) | `5 % 2` | `1` |\n\nThe one people forget is `%`. It tells you **what is left over after dividing**. `10 % 3` is `1`, because 3 goes into 10 three times (that is 9) and 1 is left. The remainder is wonderfully useful: `n % 2 === 0` means \"n is even\", and `cupsSold % 5 === 0` means \"this is every fifth cup\".\n\n```js run | A bill, and every fifth cup\nconst chaiPrice = 20;\nconst samosaPrice = 15;\n\nconst bill = 2 * chaiPrice + 1 * samosaPrice;\nconsole.log(`Bill for 2 chai and 1 samosa: ₹${bill}`);\n\nconsole.log(10 % 3);     // 1  (3 goes in 3 times = 9, remainder 1)\nconsole.log(15 % 5);     // 0  (divides exactly)\n\nconst cupsSold = 15;\nconsole.log(`Is cup number ${cupsSold} a free one? ${cupsSold % 5 === 0}`);\n```\n\nJavaScript follows the usual maths order: `*` and `/` before `+` and `-`. Use brackets when you want to be sure: `(2 + 3) * 4`.\n\n### Comparison: asking yes/no questions\n\nComparison operators always answer with `true` or `false`.\n\n| Operator | Meaning |\n| --- | --- |\n| `===` | strictly equal. **Always use this** to check equality. |\n| `!==` | strictly not equal. **Always use this** to check inequality. |\n| `<` `>` `<=` `>=` | less than, greater than, and \"or equal\" versions |\n| `==` and `!=` | \"loose\" equal. It quietly converts types first. **Avoid completely in this course.** |\n\n```js run | Why we never use == \nconsole.log(5 === 5);     // true\nconsole.log(5 === \"5\");   // false: a number and a piece of text are different things\nconsole.log(5 == \"5\");    // true  <- JavaScript quietly converted one. This is exactly why we avoid ==\nconsole.log(10 > 7);      // true\nconsole.log(20 !== 30);   // true\n```\n\n> warn: A single `=` **stores** a value (`let x = 5`). Three `===` **asks a question** (`x === 5`). Mixing them up inside conditions is one of the most common beginner mistakes.\n\n### Logical: combining yes/no answers\n\n| Operator | Name | Plain meaning |\n| --- | --- | --- |\n| `&&` | AND | true only if **both** sides are true. \"I need this **and** that.\" |\n| `\\|\\|` | OR | true if **at least one** side is true. \"I need this **or** that.\" |\n| `!` | NOT | flips it. `true` becomes `false`, `false` becomes `true`. |\n\n> analogy: To serve chai the café needs milk **and** tea leaves (`&&`). To pay, a customer needs cash **or** a UPI app (`||`). If the sign says `!isOpen` it means \"not open\".\n\n```js run | Open for business?\nconst hasMilk = true;\nconst hasTeaLeaves = true;\nconst hasCash = false;\nconst hasUpi = true;\n\nconsole.log(hasMilk && hasTeaLeaves);  // true:  both are true\nconsole.log(hasCash || hasUpi);        // true:  at least one is true\nconsole.log(hasCash && hasUpi);        // false: one of them is false\nconsole.log(!hasCash);                 // true:  flipped\n```\n\n```lab\ntitle: Do the Math, Check the Answer\nkind: exercise\nmode: console\n@@intro\nRun all five arithmetic operators on two numbers and explain each result in a sentence.\n@@steps\n- Declare two `const` numbers, `x` and `y`.\n- Log the result of `+ - * / %` using a template literal that explains each, for example `` `x + y = ${x + y}` ``.\n- Log one comparison using `===` and one using `!==` between `x` and `y`.\n@@js\nconst x = 17;\nconst y = 5;\n\n@@hint\nYou need five log lines for the five operators, then two more for the comparisons.\n@@solution\nconst x = 17;\nconst y = 5;\n\nconsole.log(`x + y = ${x + y}`);\nconsole.log(`x - y = ${x - y}`);\nconsole.log(`x * y = ${x * y}`);\nconsole.log(`x / y = ${x / y}`);\nconsole.log(`x % y = ${x % y}`);\n\nconsole.log(`x === y is ${x === y}`);\nconsole.log(`x !== y is ${x !== y}`);\n```\n\n```lab\ntitle: True or False, Logically\nkind: exercise\nmode: console\n@@intro\nLast exercise of the day. Tomorrow these same true/false values start controlling what code actually does.\n@@steps\n- Declare three `const` booleans about the café's day (real or made up).\n- Log the result of combining two of them with `&&`, and two with `||`.\n- Log the result of using `!` on one of them.\n- For each, add a template literal explaining in plain English what the result means.\n@@js\nconst hasPower = true;\nconst hasMilk = false;\nconst hasStaff = true;\n\n@@hint\n`console.log(`Can we brew? ${hasPower && hasMilk}`);`\n@@solution\nconst hasPower = true;\nconst hasMilk = false;\nconst hasStaff = true;\n\nconsole.log(`Can we brew chai (power AND milk)? ${hasPower && hasMilk}`);\nconsole.log(`Can we open at all (power OR staff)? ${hasPower || hasStaff}`);\nconsole.log(`Are we short of milk? ${!hasMilk}`);\n```\n\n## Putting it all together\n\nEverything from this module in one small program: the café's morning report. Read it, predict the output, then run it.\n\n```js run manual | The morning report\n// --- the facts (all jars) ---\nconst shopName = \"Chai Corner\";\nconst chaiPrice = 20;\nconst samosaPrice = 15;\nlet cupsSold = 0;\nlet isOpen = true;\n\n// --- a busy morning ---\ncupsSold = cupsSold + 40;\nconst chaiRevenue = cupsSold * chaiPrice;\n\n// --- the report ---\nconsole.log(`=== ${shopName} morning report ===`);\nconsole.log(`Open now: ${isOpen}`);\nconsole.log(`Cups sold: ${cupsSold}`);\nconsole.log(`Chai revenue: ₹${chaiRevenue}`);\nconsole.log(`Every 5th cup free? ${cupsSold % 5 === 0}`);\nconsole.log(`Both chai and samosa under ₹25? ${chaiPrice < 25 && samosaPrice < 25}`);\n```\n\n```quiz\nq: Which keyword should you reach for first when declaring a variable?\na*: const\na: let\na: var\na: variable\nwhy: `const` is the default. Use `let` only when the value really has to change, and never use `var` in this course.\nq: What does `typeof null` print?\na: \"null\"\na: \"undefined\"\na*: \"object\"\na: \"empty\"\nwhy: It is a 1995 bug that stays for compatibility. `null` is still \"empty on purpose\", despite what `typeof` says.\nq: What is the result of `\"20\" + 5`?\na: 25\na*: \"205\"\na: NaN\na: An error\nwhy: With text on one side, `+` sticks the pieces together instead of adding. This is why numbers typed into forms need converting later.\nq: Which is the right way to build a sentence with a variable called `price`?\na: \"Price is \" + price\na*: `Price is ${price}`\na: 'Price is ${price}'\na: Price is ${price}\nwhy: Template literals use backticks. Single or double quotes would print the text `${price}` literally.\nq: What does `17 % 5` give?\na: 3.4\na*: 2\na: 12\na: 0\nwhy: `%` is the remainder. 5 fits into 17 three times (15) and 2 is left over.\n```\n\n## Building blocks from this module\n\n```raw\n<div class=\"flow\">\n  <div class=\"step\"><b>Output<\/b><span><code>console.log()<\/code><\/span><\/div>\n  <div class=\"step\"><b>Variables<\/b><span><code>const<\/code> · <code>let<\/code> (never <code>var<\/code>)<\/span><\/div>\n  <div class=\"step\"><b>Types<\/b><span>string · number · boolean · undefined · null · <code>typeof<\/code><\/span><\/div>\n  <div class=\"step\"><b>Strings<\/b><span>backticks and <code>${ }<\/code><\/span><\/div>\n  <div class=\"step\"><b>Operators<\/b><span><code>+ - * / %<\/code> · <code>=== !==<\/code> · <code>&amp;&amp; || !<\/code><\/span><\/div>\n<\/div>\n```\n\n> note: **Next up: Module 2, Control Flow.** This afternoon the same building blocks start *making decisions*. The yes/no answers you made today will decide which line of code runs.\n\n```check\ntitle: Self-check before Module 2\n- `js-practice` contains exactly `practice.html` and `practice.js`, linked with `defer`\n- `practice.js` is organised with a `//` comment above each exercise or section\n- An assignment section (\"Personal Data Summary\") uses **all five** data types at least once each\n- That section also uses `typeof`, a template literal, arithmetic, comparison and logical operators\n- Opening `practice.html` and checking the Console shows **no red errors**\n- `my-portfolio` was **not** modified today\n```\n", "m10": "title: Code Quality, Git and Demo Day\ntag: Module 10 · Day 5, afternoon\nshort: Debug, tidy, ship\ntagline: Working code is the start, not the finish. Learn to read errors without panic, hunt bugs methodically, tidy what you wrote, and present it with confidence.\nstory: Chai Corner is built. Before opening day, Asha asks three questions: *Why did that break? Is the code clean enough to change next month? Can I see how it got built?* Debugging, refactoring and Git are the answers. Then the finished site goes on show.\nobjectives:\n- Read an error message and its stack trace to find the exact line\n- Debug methodically: reproduce, locate, form a hypothesis, test it\n- Use `console.log`, `console.error`, `console.table` and the `defer` attribute wisely\n- Step through code like a debugger, tracking variables line by line\n- Refactor: smaller functions, clear names, no duplication, no leftover debug logs\n- Describe a clean Git history and what a good commit message looks like\n- Present the finished site (Demo Day) against a clear rubric\n---\n## Reading an error is a skill\n\nAn error message is not an insult; it is a **note from the machine saying exactly what it tripped over**. It has three parts worth reading in this order:\n\n```raw\n<div class=\"flow\">\n  <div class=\"step\"><b>1 · The type<\/b><span><code>TypeError<\/code>, <code>ReferenceError<\/code>…<\/span><\/div>\n  <div class=\"step\"><b>2 · The message<\/b><span>what went wrong<\/span><\/div>\n  <div class=\"step\"><b>3 · The location<\/b><span><code>script.js:LINE:COL<\/code><\/span><\/div>\n<\/div>\n```\n\n| Error | Usually means | Example |\n| --- | --- | --- |\n| `ReferenceError` | You used a name that does not exist (typo, wrong scope) | `barista is not defined` |\n| `TypeError` | You used a value the wrong way, often `null` or `undefined` | `Cannot read properties of null (reading 'textContent')` |\n| `SyntaxError` | The code is not valid JavaScript at all (missing bracket, quote) | `Unexpected token '}'` |\n\n> analogy: A stack trace is a **delivery tracking history**: \"left warehouse, reached depot, failed at the doorstep\". It tells you not just where the parcel stopped, but the route it took to get there.\n\nClick the red location link in the console below. It jumps to and highlights the exact line.\n\n```lab\ntitle: Trace the error\nkind: playground\nmode: console\nexpectError: true\nheight: 300\n@@js\nfunction getPrice(item) {\n  return item.price * 2;\n}\n\nfunction makeBill(items) {\n  return items.map(i => getPrice(i));\n}\n\nconst order = [{ name: 'Chai', price: 20 }, undefined, { name: 'Samosa', price: 15 }];\nconsole.log(makeBill(order));\n@@explain\n```\n\nRead it bottom to top: the bill-maker called `getPrice` with `undefined` (the second item), so `item.price` crashed. The bug is not really in `getPrice`; it is that **bad data got in**. The stack trace shows you the chain so you can decide where to fix it.\n\n## The debugging loop\n\n1. **Reproduce:** make it fail on purpose, reliably.\n2. **Locate:** where is the first wrong value? Read the error line. Add logs.\n3. **Hypothesise:** \"I think `hour` is a string here.\"\n4. **Test one change.** Change one thing and run again.\n5. **Confirm and clean up.** Remove temporary logs.\n\n> why: Changing five things at once means you will never know which one fixed it, or what you broke along the way.\n\n### Better logging\n\n```js run\nconst order = [\n  { name: 'Masala Chai', qty: 2, price: 20 },\n  { name: 'Samosa', qty: 3, price: 15 }\n];\n\nconsole.log('order is:', order);          // label your logs!\nconsole.table(order);                      // arrays of objects as a table\nconsole.warn('Stock is low');              // yellow\nconsole.info('Order #12 received');        // info (errors print in red with console.error)\n```\n\n> tip: Label every log (`'total:', total`). Five unlabeled numbers tell you nothing at 11 pm.\n\n### Silent bugs\n\nNot every bug raises an error. Sometimes the code runs and gives the **wrong answer**. These are the hardest ones, and logging is your main tool.\n\n```lab\ntitle: Find the silent bug\nkind: exercise\nmode: console\nheight: 360\n@@intro\nThis bill calculator prints a total without crashing, but the total is wrong. Use logs to find out why.\n@@steps\n- Run it. Does the total look right? (It should be `₹115`.)\n- Add `console.log` inside the loop to see each running value.\n- Identify the bug, fix it, and remove your temporary logs.\n@@js\nconst order = [\n  { name: 'Masala Chai', qty: 2, price: '20' },\n  { name: 'Samosa', qty: 3, price: '15' },\n  { name: 'Filter Coffee', qty: 1, price: '30' }\n];\n\nlet total = 0;\nfor (const line of order) {\n  total = total + line.price;\n}\nconsole.log('Total: ₹' + total);\n@@hint\nLog `typeof line.price`. `qty * price` coerces to numbers, but what does `+` do with a string?\n@@solution\n// price is a string ('20'), so `0 + '20'` JOINS text instead of adding.\n// Also, the quantity was ignored. Convert, then multiply by qty.\nconst order = [\n  { name: 'Masala Chai', qty: 2, price: '20' },\n  { name: 'Samosa', qty: 3, price: '15' },\n  { name: 'Filter Coffee', qty: 1, price: '30' }\n];\n\nlet total = 0;\nfor (const line of order) {\n  total += Number(line.price) * line.qty;\n}\nconsole.log('Total: ₹' + total);       // 115\n@@explain\nThe lesson is Module 1's `'5' + 3` vs `'5' * 3` again, now in a real bill. When a number looks off, log its `typeof`.\n```\n\n## Stepping through code like a debugger\n\nReal debuggers pause at a line and show you every variable. Below you can **step through** a small function and watch the values change, one line at a time.\n\n```stepper\ntitle: Watch the loyalty total build up\n@@code\nconst prices = [20, 15, 30];\nlet total = 0;\nfor (const p of prices) {\n  total += p;\n}\nconst withTax = total * 1.05;\nconsole.log(withTax);\n@@trace\n1 | {} | Start. Nothing exists yet.\n2 | {\"prices\":\"[20, 15, 30]\"} | The array is created.\n3 | {\"prices\":\"[20, 15, 30]\",\"total\":0} | `total` starts at 0.\n3 | {\"prices\":\"[20, 15, 30]\",\"total\":0,\"p\":20} | First loop: p = 20.\n4 | {\"prices\":\"[20, 15, 30]\",\"total\":20,\"p\":20} | total becomes 0 + 20.\n3 | {\"prices\":\"[20, 15, 30]\",\"total\":20,\"p\":15} | Second loop: p = 15.\n4 | {\"prices\":\"[20, 15, 30]\",\"total\":35,\"p\":15} | total becomes 35.\n3 | {\"prices\":\"[20, 15, 30]\",\"total\":35,\"p\":30} | Third loop: p = 30.\n4 | {\"prices\":\"[20, 15, 30]\",\"total\":65,\"p\":30} | total becomes 65.\n6 | {\"prices\":\"[20, 15, 30]\",\"total\":65,\"withTax\":68.25} | 65 * 1.05 = 68.25.\n7 | {\"prices\":\"[20, 15, 30]\",\"total\":65,\"withTax\":68.25} | Prints 68.25.\n```\n\n> tip: In DevTools, the **Sources** tab lets you click a line number to add a *breakpoint*; the page freezes there so you can inspect variables. That is the stepper above, on your real code.\n\n## Why `defer` matters (a final look)\n\nA `<script>` in the `<head>` runs **before** the body exists. `querySelector` finds nothing, returns `null`, and the next line crashes. `defer` tells the browser: \"download now, run after the page is built.\"\n\n```lab\ntitle: The defer toggle\nkind: playground\nmode: dom\ndefer: true\nheight: 260\n@@html\n<h1 id=\"title\">Chai Corner<\/h1>\n<p>Use the <strong>defer<\/strong> switch in the run bar to turn it off and on.<\/p>\n@@css\n@@js\nconst title = document.querySelector('#title');\nconsole.log('title is:', title);\ntitle.textContent = 'Chai Corner (script ran)';\n@@explain\n```\n\nTurn **defer** off and run: the script runs before the `<h1>` exists, `title` is `null`, and it crashes. This is the number one \"why does my code not work\" cause in the whole course.\n\n## Refactoring: tidy up without changing behaviour\n\nRefactoring means **improving how the code is written, not what it does**. After you refactor, the page should behave exactly the same.\n\n| Smell | Fix |\n| --- | --- |\n| A function does five things | Split into five small functions with one job each |\n| `x`, `data2`, `temp` | Descriptive names: `visibleItems`, `cartTotal` |\n| The same lines copied twice | Extract a function |\n| Magic numbers (`0.05`) | Name them: `const TAX_RATE = 0.05` |\n| Leftover `console.log('here')` | Remove debug logs before shipping |\n| Wide comments saying *what* | Better names; keep comments for *why* |\n\n> analogy: Refactoring is **reorganising the kitchen between services**. Same menu, same food, but the knives are where you reach for them, and the next cook can find everything.\n\n```lab\ntitle: Refactor the banner\nkind: exercise\nmode: dom\nheight: 380\n@@intro\nThis code works, but it is cramped. Tidy it **without changing what the page does**.\n@@steps\n- Run it first and note what it does.\n- Give variables meaningful names.\n- Extract the repeated \"set text of an element\" logic into a function `setText(selector, text)`.\n- Name the magic number `LOYALTY_THRESHOLD`.\n- Remove the leftover debug log. Run again: same result.\n@@html\n<header class=\"top\"><h1 id=\"t\">Chai Corner<\/h1><\/header>\n<p id=\"a\"><\/p>\n<p id=\"b\"><\/p>\n@@css\n@@js\nconst x = new Date().getHours();\nlet y;\nif (x < 12) { y = 'morning'; } else if (x < 18) { y = 'afternoon'; } else { y = 'evening'; }\nconsole.log('here', y);\ndocument.querySelector('#a').textContent = 'Good ' + y + '!';\nconst z = 7;\ndocument.querySelector('#b').textContent = z >= 10 ? 'You earned a free chai' : 'Visits until a free chai: ' + (10 - z);\n@@hint\nRename `x` to `hour`, `y` to `timeOfDay`, `z` to `visits`.\n@@solution\nconst LOYALTY_THRESHOLD = 10;\n\nfunction setText(selector, text) {\n  document.querySelector(selector).textContent = text;\n}\n\nfunction getTimeOfDay(hour) {\n  if (hour < 12) return 'morning';\n  if (hour < 18) return 'afternoon';\n  return 'evening';\n}\n\nconst timeOfDay = getTimeOfDay(new Date().getHours());\nconst visits = 7;\n\nsetText('#a', `Good ${timeOfDay}!`);\nsetText('#b', visits >= LOYALTY_THRESHOLD\n  ? 'You earned a free chai'\n  : `Visits until a free chai: ${LOYALTY_THRESHOLD - visits}`);\n@@explain\nSame page, but now the next change (a new threshold, a new greeting) is a one-line edit in an obvious place.\n```\n\n## Git: the history book\n\nGit records **snapshots** of your project with a message. It is a history you can read, rewind and share (GitHub is where it is stored online).\n\n> analogy: Each commit is a **dated page in a recipe notebook**: \"added ginger, reduced sugar\". You can flip back to any page, and the notebook shows the whole story of the dish.\n\n### The everyday loop\n\n| Step | Command | Meaning |\n| --- | --- | --- |\n| 1 | `git status` | What changed? |\n| 2 | `git add .` | Choose these changes for the next snapshot |\n| 3 | `git commit -m \"message\"` | Save the snapshot |\n| 4 | `git push` | Upload to GitHub |\n| ? | `git log --oneline` | Read the history |\n\n### Good vs bad messages\n\n| Weak | Strong |\n| --- | --- |\n| `update` | `Add mobile menu toggle` |\n| `fix stuff` | `Fix footer year showing NaN` |\n| `final final 2` | `Refactor greeting into getTimeOfDay()` |\n\nRead this history like a story. It tells you what Asha built, in what order:\n\n```raw\n<div class=\"git-log\" style=\"font-family:var(--mono);font-size:.85rem;line-height:1.8;padding:.8rem 1rem;border:1px solid var(--line);border-radius:10px;background:var(--panel)\">\n<div><span style=\"color:var(--accent)\">a91f3c2<\/span> Add contact form validation and saved messages<\/div>\n<div><span style=\"color:var(--accent)\">7be04d1<\/span> Render menu from data with category filters<\/div>\n<div><span style=\"color:var(--accent)\">c2d77a9<\/span> Add mobile menu toggle and persistent theme<\/div>\n<div><span style=\"color:var(--accent)\">3f8e120<\/span> Show footer year and time-of-day greeting<\/div>\n<div><span style=\"color:var(--accent)\">0b5a9e4<\/span> Link script.js with defer<\/div>\n<div><span style=\"color:var(--accent)\">e1c4b07<\/span> Initial commit: static Chai Corner page<\/div>\n<\/div>\n```\n\n> tip: Commit **small and often**. One idea per commit. If something breaks, you can step back one page, not rewrite the whole notebook.\n\n## Demo Day: the finished café\n\nEverything from ten modules in one page: footer year and greeting (5), mobile nav and theme switch (6), menu rendered from data with filters (7), a contact form with stored messages (8), and a specials panel loaded from an API (9). It is well-named and tidy (10). Read it, run it, break it, fix it.\n\n```lab\ntitle: Chai Corner: the full site\nkind: playground\nmode: dom\nstorage: true\nmood: true\nheight: 640\n@@html\n<header class=\"top\">\n  <h1>Chai Corner<\/h1>\n  <button id=\"menuToggle\">Menu<\/button>\n  <button id=\"themeToggle\">Theme<\/button>\n<\/header>\n<nav id=\"mainNav\"><a href=\"#menu\">Menu<\/a><a href=\"#specials\">Specials<\/a><a href=\"#contact\">Contact<\/a><\/nav>\n<p id=\"greeting\"><\/p>\n\n<h2 id=\"menu\">Menu<\/h2>\n<div class=\"filters\" id=\"filters\"><\/div>\n<section id=\"menuGrid\" class=\"grid\"><\/section>\n\n<h2 id=\"specials\">Today's Specials<\/h2>\n<section id=\"specialsPanel\" class=\"grid\"><\/section>\n\n<h2 id=\"contact\">Say hello<\/h2>\n<form id=\"contactForm\">\n  <p><input id=\"nameInput\" placeholder=\"Your name\"><\/p>\n  <p><textarea id=\"messageInput\" rows=\"2\" placeholder=\"Your message (10+ characters)\"><\/textarea><\/p>\n  <button type=\"submit\">Send<\/button>\n<\/form>\n<p id=\"formError\" class=\"error-message\"><\/p>\n<p id=\"formSuccess\" class=\"success-message\">Thanks! We'll reply soon.<\/p>\n<section id=\"saved\"><\/section>\n{{footer}}\n@@css\n#menuToggle { display: none; }\n@media (max-width: 520px) {\n  #menuToggle { display: inline-block; }\n  #mainNav { display: none; flex-direction: column; }\n  #mainNav.open { display: flex; }\n}\n.filters button.active { background: #2f6b68; color: #fff; }\n.soldout { opacity: .55; }\nbody.dark { background: #1d2224; color: #e8ecec; }\nbody.dark .card, body.dark .top { background: #2a3033; color: #e8ecec; }\n@@js\n{{menu}}\n\nconst SPECIALS_URL = 'https://api.chaicorner.test/specials';\nlet activeCategory = 'All';\n\n/* ---------- small helpers ---------- */\nconst $ = selector => document.querySelector(selector);\n\nfunction getTimeOfDay(hour) {\n  if (hour < 12) return 'morning';\n  if (hour < 18) return 'afternoon';\n  return 'evening';\n}\n\n/* ---------- Module 5: DOM ---------- */\n$('#year').textContent = new Date().getFullYear();\n$('#greeting').textContent = `Good ${getTimeOfDay(new Date().getHours())}! Welcome to Chai Corner.`;\n\n/* ---------- Module 6 + 8: nav toggle and persistent theme ---------- */\n$('#menuToggle').addEventListener('click', () => $('#mainNav').classList.toggle('open'));\n\nif (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');\n$('#themeToggle').addEventListener('click', () => {\n  document.body.classList.toggle('dark');\n  localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');\n});\n\n/* ---------- Module 7: render + filter ---------- */\nfunction renderFilters() {\n  const categories = ['All', ...new Set(menu.map(item => item.category))];\n  $('#filters').innerHTML = categories.map(c =>\n    `<button data-category=\"${c}\" class=\"${c === activeCategory ? 'active' : ''}\">${c}<\/button>`).join('');\n}\n\nfunction renderMenu() {\n  const visible = activeCategory === 'All' ? menu : menu.filter(item => item.category === activeCategory);\n  $('#menuGrid').innerHTML = visible.map(item => `\n    <article class=\"card ${item.inStock ? '' : 'soldout'}\">\n      <span class=\"tag\">${item.category}<\/span>\n      <h3>${item.name}<\/h3>\n      <p>${item.description}<\/p>\n      <strong>₹${item.price}<\/strong>${item.inStock ? '' : ' · sold out'}\n    <\/article>`).join('');\n}\n\n$('#filters').addEventListener('click', event => {\n  if (event.target.tagName !== 'BUTTON') return;\n  activeCategory = event.target.dataset.category;\n  renderFilters();\n  renderMenu();\n});\n\n/* ---------- Module 8: form + saved messages ---------- */\nfunction loadMessages() {\n  try {\n    return JSON.parse(localStorage.getItem('messages')) || [];\n  } catch {\n    return [];\n  }\n}\n\nfunction renderMessages() {\n  const nodes = loadMessages().map(m => {\n    const p = document.createElement('p');\n    p.className = 'msg';\n    p.textContent = `${m.name}: ${m.text}`;\n    return p;\n  });\n  $('#saved').replaceChildren(...nodes);\n}\n\nfunction showFormError(text) {\n  $('#formError').textContent = text;\n  $('#formError').classList.add('show');\n  $('#formSuccess').classList.remove('show');\n}\n\n$('#contactForm').addEventListener('submit', event => {\n  event.preventDefault();\n  const name = $('#nameInput').value.trim();\n  const text = $('#messageInput').value.trim();\n\n  if (!name) return showFormError('Please tell us your name.');\n  if (text.length < 10) return showFormError('Your message should be at least 10 characters.');\n\n  const messages = loadMessages();\n  messages.push({ name, text });\n  localStorage.setItem('messages', JSON.stringify(messages));\n\n  $('#formError').classList.remove('show');\n  $('#formSuccess').classList.add('show');\n  event.target.reset();\n  renderMessages();\n});\n\n/* ---------- Module 9: specials from the API ---------- */\nasync function loadSpecials() {\n  const panel = $('#specialsPanel');\n  panel.innerHTML = '<p class=\"loading\">Loading specials...<\/p>';\n  try {\n    const response = await fetch(SPECIALS_URL);\n    if (!response.ok) throw new Error(`Server said ${response.status}`);\n    const specials = await response.json();\n    panel.innerHTML = specials.map(s => `\n      <article class=\"card\"><h3>${s.name}<\/h3><p>${s.note}<\/p><strong>₹${s.price}<\/strong><\/article>`).join('');\n  } catch (error) {\n    console.error(error);\n    panel.innerHTML = '<p class=\"error-message show\">Specials are unavailable right now. Please check back soon.<\/p>';\n  }\n}\n\n/* ---------- start everything ---------- */\nrenderFilters();\nrenderMenu();\nrenderMessages();\nloadSpecials();\n@@explain\n```\n\nThings to try as a \"QA tester\": switch the network to **Offline** and see the specials fail gracefully. Send a too-short message. Switch themes and reload. Resize to **Phone width** and open the menu. Then pick one feature and **break it on purpose**, find the error in the console, and fix it, using the loop from earlier.\n\n## Your Demo Day rubric\n\nHere is what a reviewer will look for on the real portfolio. Treat it as a checklist, not a verdict.\n\n| Area | Strong |\n| --- | --- |\n| **Works** | Every feature behaves, even after a refresh; no console errors |\n| **Interactive** | Menu toggle, theme switch and at least one more event feature |\n| **Data-driven** | Content rendered from arrays/objects, filterable |\n| **Resilient** | Forms validated; API failures show friendly messages |\n| **Clean** | Clear names, small functions, no stray logs, helpful comments |\n| **History** | Small commits with meaningful messages on GitHub |\n| **Story** | You can explain what you built and one bug you fixed |\n\n> portfolio: Prepare a 2-minute walkthrough: what the site does, one feature you are proud of, one bug that taught you something, and what you would add next.\n\n```quiz\nq: A `TypeError: Cannot read properties of null (reading 'textContent')` most often means...\na: A missing semicolon\na*: `querySelector` found nothing (wrong selector, or script ran before the HTML existed)\na: A CSS problem\na: The browser is outdated\nwhy: A failed selector returns `null`; using it then throws.\nq: Which is the best first move when a number on the page looks wrong?\na: Rewrite the function\na*: Log the values (with labels and `typeof`) along the path to find where they go wrong\na: Reload ten times\na: Delete the feature\nwhy: Find the first wrong value before changing anything.\nq: What is refactoring?\na: Adding features\na*: Improving the structure and readability of code without changing what it does\na: Deleting comments\na: Making code shorter at any cost\nwhy: Behaviour stays the same; the code gets easier to change.\nq: Which commit message is strongest?\na: `update`\na: `stuff`\na*: `Fix footer year showing NaN`\na: `final`\nwhy: It tells a future reader what changed and why.\nq: Why use `defer` on a script tag?\na*: So it runs after the HTML is parsed and the elements exist\na: To make it download slower\na: To hide it from users\na: It is required for any script\nwhy: Without it, a head script can run before the elements it needs are created.\n```\n\n## What you can do now\n\n```raw\n<div class=\"flow\">\n  <div class=\"step\"><b>Read errors<\/b><span>type · message · location<\/span><\/div>\n  <div class=\"step\"><b>Debug<\/b><span>reproduce · log · one change<\/span><\/div>\n  <div class=\"step\"><b>Refactor<\/b><span>names · functions · no dupes<\/span><\/div>\n  <div class=\"step\"><b>Git<\/b><span>small commits, clear messages<\/span><\/div>\n  <div class=\"step\"><b>Present<\/b><span>explain what and why<\/span><\/div>\n<\/div>\n```\n\n> cafe: Ten modules ago, \"Hello, world\" in a console. Now: a café site that greets by the clock, reacts to taps, builds itself from data, remembers choices, talks to a server, and survives failure. Open the **Cheat Sheet** for a one-page reference.\n\n```check\ntitle: Demo Day readiness\n- The site has no console errors on load, and every feature works after a refresh\n- `script.js` is linked with `defer`, with clear names, small functions and no leftover debug logs\n- Forms validate; API calls handle loading, success and failure\n- The theme choice (and any saved data) persists\n- GitHub history shows small commits with meaningful messages\n- You can explain, in plain words, one feature and one bug you fixed\n```\n", "m2": "title: Control Flow and Function Basics\ntag: Module 2 · Day 1, afternoon\nshort: if/else, loops, functions\ntagline: This morning the café learned to remember things. This afternoon it learns to choose, to repeat, and to package its skills into reusable recipes.\nstory: Asha wants the till to think. Give a loyalty member the right tier, print a price list for ten cups without typing ten lines, and run a \"lucky customer\" game at the counter. We are still in `js-practice`, the quiet back office, with the same Console as this morning.\nobjectives:\n- Write `if` / `else if` / `else` so a program takes different paths\n- Know which values JavaScript treats as \"falsy\" and predict how conditions behave\n- Use the ternary operator (`condition ? a : b`) for simple one-line decisions\n- Write `for` and `while` loops, and choose correctly between them\n- Control loops with `break` and `continue`\n- Write function declarations and expressions, pass parameters, and use `return` correctly\n---\n## Making decisions: if, else if, else\n\nUntil now every line ran, one after the other. Real programs need to say: **\"if this is true, do that, otherwise do something else.\"**\n\n> analogy: A barista decides all day long. *If* the customer wants it cold, add ice. *Else if* they want it extra hot, steam longer. *Else* make it normal. Only **one** of the paths is taken.\n\n```js run | Loyalty tiers\nconst points = 80;\n\nif (points >= 150) {\n  console.log(\"Tier: Gold\");\n} else if (points >= 75) {\n  console.log(\"Tier: Silver\");      // 80 is not >= 150, but it is >= 75, so this one runs\n} else if (points >= 25) {\n  console.log(\"Tier: Bronze\");\n} else {\n  console.log(\"Tier: Member\");\n}\n```\n\nHow JavaScript reads it: it tests the conditions **from top to bottom** and runs the **first** one that is true. Once one branch runs, the rest are skipped. Change `points` to `200`, `30` and `5` and run again to see each path.\n\nThe curly braces `{ }` hold the lines that belong to each branch. The condition in `( )` is any expression that gives `true` or `false`, like the comparisons from Module 1.\n\n### Order matters when ranges overlap\n\n> predict: 300 points is also \"at least 150\". Which branch will run here? Say it aloud before pressing Run.\n\n```js run manual | The wrong order\nconst points = 300;\n\nif (points >= 150) {\n  console.log(\"Tier: Gold\");\n} else if (points >= 250) {\n  console.log(\"Tier: Platinum (free cake!)\");   // can this ever run?\n} else {\n  console.log(\"Tier: Member\");\n}\n```\n\nIt prints `Gold`. A score of 300 passes the first test, so JavaScript never even looks at the Platinum line. **Put the most specific check first.** The fixed version checks `>= 250` before `>= 150`. You will fix exactly this in the exercise below.\n\n```lab\ntitle: Loyalty Tier\nkind: exercise\nmode: console\n@@intro\nGrade checkers are the classic first `if` exercise. Here it is a loyalty-card checker.\n@@steps\n- Declare a `const points` set to any number from 0 to 300.\n- Write an `if / else if / else` chain that logs `Tier: Gold` (150+), `Tier: Silver` (75+), `Tier: Bronze` (25+) or `Tier: Member`.\n- Change `points` to at least three different values and re-run to confirm each branch works.\n- Add a check that logs `Platinum: free cake!` for 250 and above. It must be checked **before** the Gold case.\n- Then try putting the Platinum check **after** Gold and see what breaks.\n@@js\nconst points = 120;\n\n// write your if / else if / else chain here\n\n@@hint\nStart with the biggest threshold first: `if (points >= 250) { ... } else if (points >= 150) { ... }`.\n@@hint\nEach branch is a `console.log(\"Tier: ...\")` inside curly braces. The final `else` needs no condition.\n@@solution\nconst points = 120;\n\nif (points >= 250) {\n  console.log(\"Platinum: free cake!\");\n} else if (points >= 150) {\n  console.log(\"Tier: Gold\");\n} else if (points >= 75) {\n  console.log(\"Tier: Silver\");\n} else if (points >= 25) {\n  console.log(\"Tier: Bronze\");\n} else {\n  console.log(\"Tier: Member\");\n}\n@@explain\nThe most specific (highest) threshold goes first. If you flip Platinum below Gold, 300 points would print Gold and the free cake would never be given.\n```\n\n### Truthy and falsy: what counts as \"yes\"\n\nJavaScript lets you put **any value** in an `if`, not just `true` or `false`. It quietly decides whether the value counts as \"something\" (truthy) or \"nothing\" (falsy).\n\n> note: **Exactly six values are falsy:** `0`, `\"\"` (empty text), `null`, `undefined`, `NaN` (a failed calculation) and `false`. **Everything else is truthy.** That includes `\"0\"` (it is text with a character in it), `[]` (an empty list) and `{}` (an empty bundle).\n\n```js run | Boolean() shows how JavaScript decides\nconsole.log(Boolean(0));         // false\nconsole.log(Boolean(\"\"));        // false\nconsole.log(Boolean(null));      // false\nconsole.log(Boolean(undefined)); // false\nconsole.log(Boolean(NaN));       // false\n\nconsole.log(Boolean(1));         // true\nconsole.log(Boolean(\"hello\"));   // true\nconsole.log(Boolean(\"0\"));       // true   <- common surprise: it is text, and text with something in it counts\nconsole.log(Boolean([]));        // true   <- common surprise: an empty list is still a list\nconsole.log(Boolean({}));        // true\n```\n\nWhy this is useful: you can write `if (customerName)` to mean \"if we have a name\", without comparing it to `\"\"`.\n\n```js run | A greeting that survives a missing name\nlet customerName = \"\";       // try changing this to \"Asha\"\n\nif (customerName) {\n  console.log(`Welcome back, ${customerName}!`);\n} else {\n  console.log(\"Welcome! May I take your name?\");\n}\n```\n\n## The ternary: one line, one decision\n\nWhen the decision is small, a full `if / else` feels heavy. The **ternary operator** is a one-line version:\n\n```raw\n<pre class=\"code-static\" style=\"display:block\"><code>condition ? valueIfTrue : valueIfFalse<\/code><\/pre>\n```\n\nRead it out loud as: *\"Is the condition true? If yes, use this. If not, use that.\"*\n\n```js run | Same decision, two ways\nconst hour = 10;\n\n// the long way\nlet sign1;\nif (hour < 21) {\n  sign1 = \"Open\";\n} else {\n  sign1 = \"Closed\";\n}\n\n// the ternary way: one line, same result\nconst sign2 = hour < 21 ? \"Open\" : \"Closed\";\n\nconsole.log(sign1, sign2);\n\n// ternaries are great inside template literals\nconst cups = 1;\nconsole.log(`You ordered ${cups} ${cups === 1 ? \"cup\" : \"cups\"} of chai.`);\n```\n\n> warn: Do not **nest** ternaries (`a ? b : c ? d : e`). It is legal, but very hard to read. When you have more than two outcomes, go back to `if / else if / else`.\n\n```lab\ntitle: Even or Odd, and Kids' Price\nkind: exercise\nmode: console\n@@intro\nTwo small decisions, both written as a single ternary.\n@@steps\n- Declare a `let num`. Use a ternary to log `even` or `odd` based on `num % 2`.\n- Declare a `let visitorAge`. Use a ternary **inside a template literal** to log a price sentence: chai is ₹10 for kids under 12, otherwise ₹20.\n- Keep it to one condition, one ternary each. No nesting.\n- Test both with at least two different values each.\n@@js\nlet num = 7;\n\nlet visitorAge = 9;\n\n@@hint\n`console.log(num % 2 === 0 ? \"even\" : \"odd\");`\n@@hint\nInside the sentence: `` `Chai costs ₹${visitorAge < 12 ? 10 : 20}` ``\n@@solution\nlet num = 7;\nconsole.log(num % 2 === 0 ? \"even\" : \"odd\");\n\nlet visitorAge = 9;\nconsole.log(`Chai costs ₹${visitorAge < 12 ? 10 : 20} for a ${visitorAge}-year-old.`);\n\nnum = 10;\nvisitorAge = 30;\nconsole.log(num % 2 === 0 ? \"even\" : \"odd\");\nconsole.log(`Chai costs ₹${visitorAge < 12 ? 10 : 20} for a ${visitorAge}-year-old.`);\n```\n\n## Doing something again and again: for loops\n\nTyping ten nearly-identical lines is slow and error-prone. A **loop** repeats a block of code for you.\n\n> analogy: A for loop is a barista making a tray of cups while counting out loud. \"Start at cup 0. Keep going while it is less than 5. After each cup, add one to the count.\"\n\nA `for` loop has **three parts** inside the brackets, separated by semicolons:\n\n```raw\n<div class=\"flow\">\n  <div class=\"step\"><b>1 · Start<\/b><span><code>let i = 0<\/code><br>Runs once, before the loop begins<\/span><\/div>\n  <div class=\"step\"><b>2 · Keep going while<\/b><span><code>i &lt; 5<\/code><br>Checked before every round. When false, the loop ends<\/span><\/div>\n  <div class=\"step\"><b>3 · After each round<\/b><span><code>i++<\/code><br>Short for \"add one to i\"<\/span><\/div>\n<\/div>\n```\n\n> predict: `i < 5` starting from `0`. How many numbers will print, and which ones? Off-by-one mistakes are the number one loop bug, so always predict first.\n\n```js run manual | Counting with a for loop\nfor (let i = 0; i < 5; i++) {\n  console.log(`Making cup number ${i}`);\n}\nconsole.log(\"Tray finished\");\n```\n\nFive rounds: `0, 1, 2, 3, 4`. Not four, not six. Computers start counting at **0**, so \"five things\" means the numbers 0 to 4. If you wanted cups numbered 1 to 5, you would start at `1` and use `i <= 5`.\n\n```js run | A price list without typing ten lines\nconst chaiPrice = 20;\n\nfor (let cups = 1; cups <= 10; cups++) {\n  console.log(`${cups} x ₹${chaiPrice} = ₹${cups * chaiPrice}`);\n}\n```\n\n### The loop that never ends\n\nIf you forget the \"after each round\" part, the condition never becomes false, and the loop runs **forever**. In a real browser that freezes the tab. Here, the playground has a safety net that stops it and tells you what happened. Run it and read the message.\n\n
